l_japanese:
 # Twilight of Empires 主要国フレーバーテキスト
 PAI_FLAVOR_TEXT:0 "ティグラート帝の大北伐から1000年、パイドは幾多の戦乱を乗り越え今なお両山脈の平原に君臨している。大陸最大の人口と豊かな穀倉地帯を抱え、世界最大の穀物輸出国として繁栄を謳歌している。しかし北ではゴートンが勢力を伸ばし、海の向こうではテーガールの影が迫る。この古き帝国は新たな時代にも繁栄を保てるのだろうか？"
 TOE_MAJOR_COUNTRY_FLAVOR_PAI:0 "ティグラート帝の大北伐から1000年、パイドは幾多の戦乱を乗り越え今なお両山脈の平原に君臨している。大陸最大の人口と豊かな穀倉地帯を抱え、世界最大の穀物輸出国として繁栄を謳歌している。しかし北ではゴートンが勢力を伸ばし、海の向こうではテーガールの影が迫る。この古き帝国は新たな時代にも繁栄を保てるのだろうか？"
 XAI_FLAVOR_TEXT:0 "フーション大陸全土を征服したテーガールは、その莫大な資源と労働力を背景に世界最大の産業国家へと登り詰めた。世界中に広がる植民地と強大な海軍は、帝国にかつてない繁栄をもたらしている。しかし海上ではイルボネーとの対立が激しさを増していた。巨大な帝国はさらなる栄光を掴むことができるのだろうか？"
 TOE_MAJOR_COUNTRY_FLAVOR_XAI:0 "フーション大陸全土を征服したテーガールは、その莫大な資源と労働力を背景に世界最大の産業国家へと登り詰めた。世界中に広がる植民地と強大な海軍は、帝国にかつてない繁栄をもたらしている。しかし海上ではイルボネーとの対立が激しさを増していた。巨大な帝国はさらなる栄光を掴むことができるのだろうか？"
 GSU_FLAVOR_TEXT:0 "古くから海洋へ進出してきたイルボネーは、広大な交易網と海外領土によって世界有数の海洋国家となった。パイドとの古き同盟はその繁栄を支えているが、海の覇権を巡るテーガールとの対立は日に日に深まっている。イルボネーは宿敵を退け、海上の覇権を手にすることができるのだろうか？"
 TOE_MAJOR_COUNTRY_FLAVOR_GSU:0 "古くから海洋へ進出してきたイルボネーは、広大な交易網と海外領土によって世界有数の海洋国家となった。パイドとの古き同盟はその繁栄を支えているが、海の覇権を巡るテーガールとの対立は日に日に深まっている。イルボネーは宿敵を退け、海上の覇権を手にすることができるのだろうか？"
 XBB_FLAVOR_TEXT:0 "フーション大陸の征服とともに成長したフーション会社は、今やテーガールの支配を支える巨大企業となった。大陸からもたらされる莫大な資源と労働力は会社に巨万の富をもたらし、その影響力は一企業の域を超えつつある。会社と帝国の繁栄は、これからも続いていくのだろうか？"
 TOE_MAJOR_COUNTRY_FLAVOR_XBB:0 "フーション大陸の征服とともに成長したフーション会社は、今やテーガールの支配を支える巨大企業となった。大陸からもたらされる莫大な資源と労働力は会社に巨万の富をもたらし、その影響力は一企業の域を超えつつある。会社と帝国の繁栄は、これからも続いていくのだろうか？"
 XAT_FLAVOR_TEXT:0 "長い歴史と広大な領土を持つチードは、属国カリドを従え今なお大国としての地位を保っている。しかし西では古くからの宿敵サンドとの対立が続き、人口規模や経済規模で後れを取りつつある。変わりゆく時代の中で、チードはこれまでの秩序を守り続けることができるのだろうか？"
 TOE_MAJOR_COUNTRY_FLAVOR_XAT:0 "長い歴史と広大な領土を持つチードは、属国カリドを従え今なお大国としての地位を保っている。しかし西では古くからの宿敵サンドとの対立が続き、人口規模や経済規模で後れを取りつつある。変わりゆく時代の中で、チードはこれまでの秩序を守り続けることができるのだろうか？"
 XAS_FLAVOR_TEXT:0 "幾度もの戦乱と内紛に揺れたサンド帝国では、かつての繁栄を取り戻すため様々な改革が試みられている。しかしミスルでは帝国への反発が続き、東では宿敵チードとの対立も終わってはいない。この古き帝国の衰退を食い止めることができるのだろうか？"
 TOE_MAJOR_COUNTRY_FLAVOR_XAS:0 "幾度もの戦乱と内紛に揺れたサンド帝国では、かつての繁栄を取り戻すため様々な改革が試みられている。しかしミスルでは帝国への反発が続き、東では宿敵チードとの対立も終わってはいない。この古き帝国の衰退を食い止めることができるのだろうか？"
 GOT_FLAVOR_TEXT:0 "かつて北方の大国として勢力を広げたゴートンも、今やその繁栄に陰りが見え始めている。それでも南方への野心はいまだ失われておらず、テーガールとの協力を背景にパイドへの進出を目論んでいた。しかし北方では新たな勢力が台頭しつつある。衰えゆくゴートンは再び大国として蘇ることができるのだろうか？"
 TOE_MAJOR_COUNTRY_FLAVOR_GOT:0 "かつて北方の大国として勢力を広げたゴートンも、今やその繁栄に陰りが見え始めている。それでも南方への野心はいまだ失われておらず、テーガールとの協力を背景にパイドへの進出を目論んでいた。しかし北方では新たな勢力が台頭しつつある。衰えゆくゴートンは再び大国として蘇ることができるのだろうか？"
 XAJ_FLAVOR_TEXT:0 "コンバフと中央帝国は長きにわたり互いの領土へ侵攻を繰り返し、両国の争いはトリリアの歴史を形作ってきた。現在のコンバフはテーガールとの交易によって繁栄しているが、国境の向こうには今なお古き宿敵が存在している。次なる時代にコンバフを待つものは、勝利か、それとも敗北か？"
 TOE_MAJOR_COUNTRY_FLAVOR_XAJ:0 "コンバフと中央帝国は長きにわたり互いの領土へ侵攻を繰り返し、両国の争いはトリリアの歴史を形作ってきた。現在のコンバフはテーガールとの交易によって繁栄しているが、国境の向こうには今なお古き宿敵が存在している。次なる時代にコンバフを待つものは、勝利か、それとも敗北か？"
 XAL_FLAVOR_TEXT:0 "多くの帝国諸侯を束ねるネウストリアは、トリリアに築かれた巨大な帝国の中心である。トルン、ヴェレティエンとの同盟は大陸の秩序を支えているが、西には幾度となく争ってきた宿敵コンバフが存在している。帝国は新たな時代にも諸侯を束ね、その威信を守り抜けるのだろうか？"
 TOE_MAJOR_COUNTRY_FLAVOR_XAL:0 "多くの帝国諸侯を束ねるネウストリアは、トリリアに築かれた巨大な帝国の中心である。トルン、ヴェレティエンとの同盟は大陸の秩序を支えているが、西には幾度となく争ってきた宿敵コンバフが存在している。帝国は新たな時代にも諸侯を束ね、その威信を守り抜けるのだろうか？"
 XAU_FLAVOR_TEXT:0 "かつて周辺の大国と覇を競ったカリドも、今ではチードの支配下に置かれている。しかしかつての誇りはいまだ失われておらず、チードへの不満も静かに燻っていた。大国の狭間に置かれたカリドに、再び自らの運命を決める日は訪れるのだろうか？"
 TOE_MAJOR_COUNTRY_FLAVOR_XAU:0 "かつて周辺の大国と覇を競ったカリドも、今ではチードの支配下に置かれている。しかしかつての誇りはいまだ失われておらず、チードへの不満も静かに燻っていた。大国の狭間に置かれたカリドに、再び自らの運命を決める日は訪れるのだろうか？"
 XBO_FLAVOR_TEXT:0 "大戦と国家の崩壊によって疲弊したリャッサネは、イルボネーの保護のもとでようやく安定を取り戻しつつある。しかしその存続はイルボネーの力に大きく依存し、周囲にはいまだ多くの脅威が残されている。崩壊を生き延びたリャッサネに、新たな繁栄の時代は訪れるのだろうか？"
 TOE_MAJOR_COUNTRY_FLAVOR_XBO:0 "大戦と国家の崩壊によって疲弊したリャッサネは、イルボネーの保護のもとでようやく安定を取り戻しつつある。しかしその存続はイルボネーの力に大きく依存し、周囲にはいまだ多くの脅威が残されている。崩壊を生き延びたリャッサネに、新たな繁栄の時代は訪れるのだろうか？"
 XEP_FLAVOR_TEXT:0 "ヴェレティエンは、ネウストリア、トルンとともに新たな秩序を築き上げた。三国を結ぶ同盟は大陸に安定をもたらしているが、その平和がいつまで続くかは誰にもわからない。ヴェレティエンは来たる新時代にどのような道を選ぶのだろうか？"
 TOE_MAJOR_COUNTRY_FLAVOR_XEP:0 "ヴェレティエンは、ネウストリア、トルンとともに新たな秩序を築き上げた。三国を結ぶ同盟は大陸に安定をもたらしているが、その平和がいつまで続くかは誰にもわからない。ヴェレティエンは来たる新時代にどのような道を選ぶのだろうか？"
 XCC_FLAVOR_TEXT:0 "かつて新大陸に覇を唱え、大陸最強の国家として君臨したフーシャメウス。その軍勢は海を越えてテーガールを征服し、旧大陸の奥深くまで進撃したが、長き戦争の果てにその覇権は崩れ去った。かつて世界を震撼させた大国は再び立ち上がるのか、それとも過去の栄光とともに衰退していくのだろうか？"
 TOE_MAJOR_COUNTRY_FLAVOR_XCC:0 "かつて新大陸に覇を唱え、大陸最強の国家として君臨したフーシャメウス。その軍勢は海を越えてテーガールを征服し、旧大陸の奥深くまで進撃したが、長き戦争の果てにその覇権は崩れ去った。かつて世界を震撼させた大国は再び立ち上がるのか、それとも過去の栄光とともに衰退していくのだろうか？"
 SKR_FLAVOR_TEXT:0 "ヴェレティエンへの留学から帰国した指導者のもと、アルティは急速な近代化を進めている。軍需産業の育成と軍制改革によって、伝統的な騎馬戦術はライフルを備えた新たな騎兵戦術へと姿を変えた。辺境の一国家にすぎなかったアルティは、今や周辺諸国にとって無視できない脅威となりつつある。この新たな軍事国家は、草原を越えてどこまで勢力を広げることができるのだろうか？"
