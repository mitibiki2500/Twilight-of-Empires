l_japanese:
 objective_toe_recommended_idle_header:0 "おすすめ国家"
 objective_toe_recommended_idle_hint:0 "以下の主要国から選択して、Twilight of Empiresの世界を体験しましょう。"

 objective_toe_recommended_PAI:0 "パイド"
 objective_toe_recommended_name_PAI:0 "パイド"
 objective_toe_recommended_desc_PAI:0 "大陸最大級の人口と豊かな穀倉地帯を抱える古き帝国。北のゴートンと海の向こうのテーガールに対抗し、繁栄を守り抜こう。"

 objective_toe_recommended_GOT:0 "ゴートン"
 objective_toe_recommended_name_GOT:0 "ゴートン"
 objective_toe_recommended_desc_GOT:0 "かつて北方に覇を唱えた大国。テーガールとの協力を背景に南下を進め、衰えつつある国力を再び立て直そう。"

 objective_toe_recommended_GSU:0 "イルボネー"
 objective_toe_recommended_name_GSU:0 "イルボネー"
 objective_toe_recommended_desc_GSU:0 "広大な交易網と海外領土を持つ海洋国家。パイドとの同盟を支えに、宿敵テーガールとの海上覇権争いを制そう。"

 objective_toe_recommended_XAI:0 "テーガール"
 objective_toe_recommended_name_XAI:0 "テーガール"
 objective_toe_recommended_desc_XAI:0 "フーション大陸の征服によって世界最大級の産業帝国へ成長した列強。強大な海軍と植民地帝国をさらに拡大しよう。"
