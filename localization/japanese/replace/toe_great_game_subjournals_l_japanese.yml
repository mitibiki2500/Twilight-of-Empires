l_japanese:
 # グレートゲーム親JE
 je_great_game_control:0 "グレートゲーム"
 je_great_game_control_name:0 "グレートゲーム"
 je_great_game_control_reason:0 "テーガール・ゴートン陣営とイルボネー・パイド陣営による勢力圏競争。進捗は#bold 100#!から開始し、イルボネー／パイド側の成功で増加、テーガール／ゴートン側の成功で減少する。

#bold 勝利ライン#!
#p 130以上：イルボネー・パイド陣営の大勝利#!
#n 70以下：テーガール・ゴートン陣営の大勝利#!

#bold 目標と配点#!
・大ステップの確保：パイド #p +20#! ／ ゴートン #n -20#!
・ソシリアの保護：パイド #p +10#!
・平原の平定：パイド #p +10#!
・大陸間航路の確保：イルボネー／パイド #p +25#! ／ テーガール／ゴートン #n -25#!
・テーガールのリイアにおける影響力：テーガール #n -25#!
・リイア大陸からテーガールを排除：イルボネー #p +25#!
・東フーションにおける影響力：イルボネー #p +15#! ／ テーガール #n -15#!
・南レフリアにおける優位性：イルボネー #p +15#! ／ テーガール #n -15#!

各目標の現在条件は対応するサブジャーナルに表示され、達成済みの目標は全参加国で共有される。"

 # サブジャーナル1
 je_toe_gg_steppe:0 "大ステップの確保【±20点】"
 je_toe_gg_steppe_name:0 "大ステップの確保【±20点】"
 je_toe_gg_steppe_reason:0 "大ステップ地域の6州以上を先に領有する。"
 je_toe_gg_steppe_desc:0 "大ステップ地域の6州以上を先に領有する。パイドが達成すれば進捗#p +20#!、ゴートンが達成すれば#n -20#!。イワジルは分割州だが1州として数える。"

 # サブジャーナル2
 je_toe_gg_sosilia:0 "ソシリアの保護【+10点】"
 je_toe_gg_sosilia_name:0 "ソシリアの保護【+10点】"
 je_toe_gg_sosilia_reason:0 "ソシリアをパイドの保護下に置く。"
 je_toe_gg_sosilia_desc:0 "ソシリアをパイドの属国とし、関係値50以上・独立欲求25以下にする。達成時、進捗#p +10#!。"

 # サブジャーナル3
 je_toe_gg_plains:0 "平原の平定【+10点】"
 je_toe_gg_plains_name:0 "平原の平定【+10点】"
 je_toe_gg_plains_reason:0 "大ジュズを併合し、西亜22と西亜13を確保する。"
 je_toe_gg_plains_desc:0 "大ジュズを完全に併合し、西亜22と西亜13をパイドが確保する。達成時、進捗#p +10#!。"

 # サブジャーナル4
 je_toe_gg_route:0 "大陸間航路の確保【±25点】"
 je_toe_gg_route_name:0 "大陸間航路の確保【±25点】"
 je_toe_gg_route_reason:0 "東欧86を征服するか、自国の勢力圏に入れる。"
 je_toe_gg_route_desc:0 "東欧86を直接征服するか、自国の属国または自国主導の勢力圏に入れる。イルボネー／パイド側なら進捗#p +25#!、テーガール／ゴートン側なら#n -25#!。"

 # サブジャーナル5
 je_toe_gg_tegar_ria:0 "テーガールのリイアにおける影響力【-25点】"
 je_toe_gg_tegar_ria_name:0 "テーガールのリイアにおける影響力【-25点】"
 je_toe_gg_tegar_ria_reason:0 "セーロションを除くリイア大陸で5州以上を領有する。"
 je_toe_gg_tegar_ria_desc:0 "セーロションを除くリイア大陸でテーガールが5州以上を直接領有する。達成時、進捗#n -25#!。"

 # サブジャーナル6
 je_toe_gg_expel_tegar_ria:0 "リイア大陸からテーガールを排除【+25点】"
 je_toe_gg_expel_tegar_ria_name:0 "リイア大陸からテーガールを排除【+25点】"
 je_toe_gg_expel_tegar_ria_reason:0 "セーロションを含むリイア大陸からテーガールの勢力圏を排除する。"
 je_toe_gg_expel_tegar_ria_desc:0 "セーロションを含むリイア大陸から、テーガール本国・テーガールの属国・テーガール主導勢力圏による領有をすべて排除する。達成時、進捗#p +25#!。"

 # サブジャーナル7
 je_toe_gg_tortal:0 "東フーションにおける影響力【±15点】"
 je_toe_gg_tortal_name:0 "東フーションにおける影響力【±15点】"
 je_toe_gg_tortal_reason:0 "トルトルを自国の勢力圏に入れる。"
 je_toe_gg_tortal_desc:0 "トルトルを自国の属国または自国主導の勢力圏に入れる。イルボネーなら進捗#p +15#!、テーガールなら#n -15#!。"

 # サブジャーナル8
 je_toe_gg_south_lefria:0 "南レフリアにおける優位性【±15点】"
 je_toe_gg_south_lefria_name:0 "南レフリアにおける優位性【±15点】"
 je_toe_gg_south_lefria_reason:0 "南レフリア地域で先に5州以上を領有する。"
 je_toe_gg_south_lefria_desc:0 "南レフリア地域で先に5州以上を直接領有する。イルボネーなら進捗#p +15#!、テーガールなら#n -15#!。"
