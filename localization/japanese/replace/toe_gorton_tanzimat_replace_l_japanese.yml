 je_group_tanzimat:0 "ゴートン改革"
 je_sick_man_main:0 "ゴートン近代化改革"
 je_sick_man_main_name:0 "ゴートン近代化改革"
 je_sick_man_main_reason:0 "ゴートン帝国は広大な領土と旧来の統治制度を抱えている。25年以内に5つの改革項目を達成し、軍制・教育・官僚制・都市基盤・周辺地域への進出を通じて近代国家としての基盤を築かなければならない。"

 je_sick_man_syria:0 "ステップ征服"
 je_sick_man_syria_reason:0 "大ステップ地域へ進出し、対象州を5州以上領有する。"
 je_sick_man_egypt:0 "南下政策"
 je_sick_man_egypt_reason:0 "南方への出口を確保するため、天然港または世界的港湾を持つ州を2州以上領有する。"
 je_sick_man_economy:0 "都市化"
 je_sick_man_economy_reason:0 "帝国の都市基盤を近代化する。レベル25以上の市街地を1つ保有し、かつ領有州の90%以上に市街地を整備する。"
 je_sick_man_education:0 "教育改革"
 je_sick_man_education_reason:0 "近代国家を支える教育制度と高等教育を整備する。"
 je_sick_man_separatism:0 "国内統合"
 je_sick_man_separatism_reason:0 "帝国内の分離主義を抑え、中央政府による統合を維持する。"
 je_sick_man_army:0 "軍制改革"
 je_sick_man_army_reason:0 "旧式の軍制を改め、近代的な常備軍を整備する。"
 je_sick_man_bureaucracy:0 "官僚制改革"
 je_sick_man_bureaucracy_reason:0 "時代遅れの官僚体制を改め、国家運営に必要な行政力を確保する。"

 toe_gorton_reform_failure:0 "近代化改革の失敗"
 toe_gorton_reform_failure_desc:0 "近代化改革を期限内に完遂できなかったことで国際的威信が傷ついた。威信：#n -20%#!。この影響は20年間かけて減衰する。"
