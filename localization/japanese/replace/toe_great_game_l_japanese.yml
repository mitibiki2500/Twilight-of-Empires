l_japanese:
 je_great_game_control_name:0 "グレートゲーム"
 je_great_game_control_desc:0 "テーガール・ゴートン陣営とイルボネー・パイド陣営の世界規模の勢力圏競争。各国に表示される個別目標を達成し、グレートゲームの趨勢を自陣営へ引き寄せよ。"

 je_toe_gg_steppe_name:0 "大ステップの確保"
 je_toe_gg_steppe_desc:0 "大ステップ地域の6州以上を先に領有する。イワジル（STATE_NSM_407）は分割州だが1州として数える。"

 je_toe_gg_sosilia_name:0 "ソシリアの保護"
 je_toe_gg_sosilia_desc:0 "ソシリアをパイドの属国とし、関係値50以上・独立欲求25以下にする。"

 je_toe_gg_plains_name:0 "平原の平定"
 je_toe_gg_plains_desc:0 "大ジュズを完全に併合し、西亜22と西亜13をパイドが確保する。"

 je_toe_gg_route_name:0 "大陸間航路の確保"
 je_toe_gg_route_desc:0 "東欧86を直接征服するか、自国の属国または自国主導の勢力圏に入れる。"

 je_toe_gg_tegar_ria_name:0 "テーガールのリイアにおける影響力"
 je_toe_gg_tegar_ria_desc:0 "セーロションを除くリイア大陸でテーガールが5州以上を直接領有する。"

 je_toe_gg_expel_tegar_ria_name:0 "リイア大陸からテーガールを排除"
 je_toe_gg_expel_tegar_ria_desc:0 "セーロションを含むリイア大陸から、テーガール本国・テーガールの属国・テーガール主導勢力圏による領有をすべて排除する。"

 je_toe_gg_tortal_name:0 "東フーションにおける影響力"
 je_toe_gg_tortal_desc:0 "トルトルを自国の属国または自国主導の勢力圏に入れる。"

 je_toe_gg_south_lefria_name:0 "南レフリアにおける優位性"
 je_toe_gg_south_lefria_desc:0 "南レフリア地域で先に5州以上を直接領有する。"

 toe_great_game.1.t:0 "大勝利"
 toe_great_game.1.d:0 "長きにわたるグレートゲームは、我が陣営の決定的な勝利に終わった。"
 toe_great_game.1.a:0 "我らの時代だ"
 toe_great_game.2.t:0 "大敗北"
 toe_great_game.2.d:0 "グレートゲームは我が陣営の大敗北に終わった。失われた国際的威信を取り戻すには長い年月が必要だろう。"
 toe_great_game.2.a:0 "この屈辱を忘れない"
 toe_great_game_victory:0 "グレートゲームの勝者"
 toe_great_game_victory_desc:0 "グレートゲームで決定的な勝利を収めた。威信：#p +25%#!"
 toe_great_game_defeat:0 "グレートゲームの敗者"
 toe_great_game_defeat_desc:0 "グレートゲームで決定的な敗北を喫した。威信：#n -20%#!。この影響は50年間かけて減衰する。"

 je_great_game_control:0 "グレートゲーム"
 je_great_game_control_reason:0 "テーガール・ゴートン陣営とイルボネー・パイド陣営による世界規模の勢力圏競争。進捗は100から開始し、イルボネー／パイド側の成功で増加、テーガール／ゴートン側の成功で減少する。各国に表示される個別目標を達成して勝敗を決する。"
 great_game_core_progress_bar:0 "グレートゲームの趨勢"
 great_game_core_progress_bar_name:0 "グレートゲームの趨勢"
 great_game_core_progress_bar_desc:0 "中央の100を基準とする。イルボネー／パイド側が目標を達成すると一方へ、テーガール／ゴートン側が達成すると反対側へ傾く。130以上または70以下で決着する。"
