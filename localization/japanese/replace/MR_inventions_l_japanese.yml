smart_energy_grid_fusion_reactor_program_tt: "@warning! Unlocks a [concept_decision] to start a #gold_value Fusion Reactor Program#!."

elgar_classicism_tech: "古典主義"
elgar_classicism_tech_desc: "芸術における古典主義は、一般に、古典主義者が模倣しようと努める美の基準を設定するものとして、西洋の伝統における古典期、古典古代を高く評価することを指します。その最も純粋な形では、古典主義は、古代ギリシャとローマの文化、芸術、文学に基づく原則に依存する美的態度であり、形式、単純さ、プロポーション、構造の明快さ、完璧さ、抑制された感情、および知性への明確な訴えに重点が置かれます。"
elgar_irrationalism_tech: "非合理主義"
elgar_irrationalism_tech_desc: "非合理主義は、人間の経験における非合理的なもの、無意識的なもの、感情的なものの役割を強調する哲学的運動です。それは、現実を理解する上での理性と合理性の優位性に異議を唱え、直感、本能、主観的な経験を含む、より全体的なアプローチを提唱します。"
elgar_modern_art_tech: "現代芸術"
elgar_modern_art_tech_desc: "現代芸術は、19世紀後半から20世紀半ばにかけて出現した様々な芸術運動と様式を包含する広い用語です。それは、伝統的な形式と慣習からの脱却、実験、抽象化、新しい素材の採用を特徴としています。現代の芸術家たちは、確立された規範に異議を唱え、世界を見て表現する新しい方法を探求しようとしました。"
elgar_mass_culture_tech: "大衆文化"
elgar_mass_culture_tech_desc: "'文化を代表するすべての伝統に対する大衆の無理解な敵意、農民の知恵を混乱させる鋭く冷たい知性、性と社会のすべての事柄に関して非常に原始的な本能と条件にまで遡る新たに見出された自然主義、賃金紛争やスポーツ競技場の形で再び現れたパンとサーカス――これらすべてのことは、文化の明確な終焉と、人類の存在の全く新しい段階の始まりを予示しています。'- Oswald Spengler, Decline of the West"
panum_antitoxins_tech: "抗毒素"
panum_antitoxins_tech_desc: "抗毒素は、病原体によって生成された毒素を中和する抗体であり、免疫応答とワクチンの開発において重要な役割を果たします。"
curtiss_modern_aviation_tech: "現代の航空"
curtiss_modern_aviation_tech_desc: "民間航空は、飛行の2つの主要なカテゴリの1つであり、私的および商業的なすべての非軍事および非国家の航空を表します。航空の黄金時代には、それは広く普及しました。豪華な旅行者のための長距離飛行が初めて可能になりました。初期のサービスは飛行船を使用していましたが、ヒンデンブルク号の悲劇の後、飛行船は使用されなくなり、飛行艇が主流になりました。"
verrier_physics_tech: "古典物理学"
verrier_physics_tech_desc: "物理学は、初期の近代ヨーロッパ人が実験的かつ定量的な方法を使用して、現在物理学の法則と見なされているものを発見したときに、独立した科学になりました。この時期の主要な発展には、太陽系の地球中心モデルのコペルニクス的な太陽中心モデルへの置き換え、惑星体の運動を支配する法則（1609年から1619年の間にケプラーによって決定）、16世紀から17世紀におけるガリレオの望遠鏡と観測天文学に関する先駆的な研究、およびアイザック・ニュートンによる運動の法則と万有引力（後に彼の名が付けられる）の発見と統一が含まれます。"
verrier_astronomy_tech: "現代天文学"
verrier_astronomy_tech_desc: "18世紀から19世紀にかけて、レオンハルト・オイラー、アレクシス・クロード・クレロー、ジャン・ル・ロン・ダランベールによる三体問題の研究は、月と惑星の運動に関するより正確な予測につながりました。この研究は、ジョゼフ＝ルイ・ラグランジュとピエール＝シモン・ラプラスによってさらに洗練され、摂動から惑星と衛星の質量を推定できるようになりました。"
verrier_electromagnetism_tech: "電磁気学"
verrier_electromagnetism_tech_desc: "1864年にエディンバラのジェームズ・クラーク・マクスウェルは、おそらく電気に関する世界の知識における最大の単一の進歩である、光の電磁理論を発表しました。マクスウェルの光の電磁理論は、明らかに自由空間における電波の存在を含んでおり、彼の信奉者たちは、その理論の真実を実験的に実証する任務を自らに課しました。空間における電磁波の発見は、19世紀の終わりの年にラジオの開発につながりました。"
verrier_chemistry_tech: "化学"
verrier_chemistry_tech_desc: "化学結合の電気化学理論の発展は、特にヨンス・ヤコブ・ベルセリウスとハンフリー・デービーの2人の科学者の研究の結果として19世紀初頭に起こり、これはアレッサンドロ・ボルタによるボルタの電池の以前の発明によって可能になりました。英国のウィリアム・プラウトは、すべての原子が水素の原子量の正確な倍数である重さを持っていたため、すべての元素を原子量で順序付けることを最初に提案しました。J.A.R.ニューランズは元素の初期の表を考案し、それは後に現代の元素の周期表に発展しました。"
verrier_astro_physics_tech: "天体物理学"  #Please replace
verrier_astro_physics_tech_desc: "天体物理学は、物理学と化学の方法と原理を天文の対象と現象の研究に採用する科学です。この分野の創設者の1人であるジェームズ・キーラーが述べたように、天体物理学は「空間におけるそれらの位置や運動ではなく、天体の性質を確かめることを目指しています。つまり、それらがどこにあるかではなく、それらが何であるかを。」" #Please replace
verrier_modern_physics_tech: "現代物理学"
verrier_modern_physics_tech_desc: "現代物理学は、20世紀初頭に発展した物理学の分野です。現代物理学の注目すべき分野には、量子力学、特殊相対性理論、一般相対性理論が含まれます。それは、光速に匹敵するほどの高速、原子半径に匹敵するほどの小距離、および非常に高いエネルギーなど、極端な条件に関係しています。"
verrier_nuclear_physics_tech: "原子核物理学"
verrier_nuclear_physics_tech_desc: "原子核物理学は、原子核の構造と挙動を扱う物理学の分野です。原子核物理学は、原子核構造の解明、すなわち原子核の構造とその反応の詳細を扱います。この目的のために、例えば、原子核の自発的な変換（放射能）、原子核上での散乱プロセス、および原子核との反応が実験的および理論的に調査されます。核分裂と核融合に基づく技術は、原子核物理学の研究に基づいています。"
manzoni_rotary_press_tech: "輪転機"
manzoni_rotary_press_tech_desc: "円筒状に変形させた活字版を回転させ、そこに紙を送ることで、これまでよりもはるかに高速な印刷が可能になります。"
manzoni_linotype_tech: "ライノタイプ"
manzoni_linotype_tech_desc: "一度に1文字ずつ活字を選択して配置する代わりに、手元のキーボードを叩くことで活字が配置され、熟練労働者への依存を減らし、植字作業をスピードアップします。"
agassiz_geology_tech: "地質学"
agassiz_geology_tech_desc: "1815年に、運河建設業者であるウィリアム・スミスは、化石の内容と岩石学の両方を考慮に入れたイングランドとウェールズの地質図を出版しました。スミスは、特定の岩石層序が非常に特定の、間違いのない動物相の層序によって特徴づけられることも認識しました。1827年に、レオポルト・フォン・ブッフは、相対年代測定を可能にする化石に対して指標化石という用語を作りました。これ以降、地球の実際の年齢の問題を明らかにすることは科学的な問題となりました。"
dubois_theory_of_evolution_tech: "進化論"
dubois_theory_of_evolution_tech_desc: "生物学における不変の類型的なタイプという概念からの決定的な脱却は、自然選択による進化論とともに起こりました。ダーウィンは、個体群の増加が「生存競争」につながり、他のものが滅びる中で好ましい変異が優勢になるだろうと述べました。これは、共通の祖先からの動植物の多様性を説明できるものでした。人間が宇宙において特別な場所を持たないことを示唆していたため、これに悩まされる人もいました。"
dubois_genetics_tech: "遺伝学"
dubois_genetics_tech_desc: "現代の遺伝学は、アウグスティヌス修道士グレゴール・ヨハン・メンデルの研究から始まりました。1900年のメンデルの業績の再発見は、遺伝学の急速な進歩につながりました。1915年までに、メンデル遺伝学の基本原理は、非常に多様な生物、特にショウジョウバエで研究されていました。実験的研究と並行して、数学者は集団遺伝学の統計的枠組みを開発し、進化の研究に遺伝的説明をもたらしました。"
dubois_nature_protection_tech: "自然保護"
dubois_nature_protection_tech_desc: "自然保護は、森林を保護する必要性から始まりました。その後、絶滅危惧種の動物や土地全体も保護されました。19世紀と20世紀には、スイスアルプスにおけるアルプスアイベックスの再導入など、様々な成功した自然保護プロジェクトがありました。"
curtiss_montgolfier_balloon_tech: "モンゴルフィエ気球"
curtiss_montgolfier_balloon_tech_desc: "モンゴルフィエ気球は、フランスの発明家ジョセフ・ミシェルとジャック・エティエンヌ・モンゴルフィエにちなんで名付けられた、最初の熱気球の名前です。「空気静力学の機械」の知らせはすぐにヨーロッパ中に広まりました。航空機の最初の軍事的使用は、フランス革命戦争中に起こり、フランス軍はフルーリュスの戦い（1794年）でオーストリア軍の動きを観察するために、繋留された水素気球を使用しました。"
curtiss_messenger_pidgeons_tech: "伝書鳩"
curtiss_messenger_pidgeons_tech_desc: "伝書鳩郵便は1820年代までは稀でした。1860年に、ポール・ロイターは45羽以上の鳩を使用して、初期の電信線の終点であったブリュッセルとアーヘンの間でニュースと株価を配信しました。普仏戦争中には、敗北したパリとフランスの非占領地域との間で郵便を運ぶために鳩が使用されました。1870年12月、マイクロフィルムを運ぶ鳩がペルピニャンからブリュッセルまで飛ぶのに10時間かかりました。"
curtiss_reconnaissance_balloon_tech: "偵察気球"
curtiss_reconnaissance_balloon_tech_desc: "偵察気球は、軍事偵察技術を備えたガス混合物で満たされた気球です。この気球は、南北戦争と普仏戦争中に観測所として使用されました。有人の繋留気球は、敵の戦線を観察し、状況を下側の自軍チームに伝えるために、ロープで空中に上げられました。"
curtiss_early_aviation_tech: "初期の航空"
curtiss_early_aviation_tech_desc: "1867年から1896年の間に、ドイツの人間航空の先駆者であるオットー・リリエンタールは、空気より重い飛行を開発しました。彼は、十分に文書化された、繰り返しの、成功した滑空飛行を行った最初の人でした。リリエンタールの研究は、彼が現代の翼の概念を開発することにつながり、それはさらなる発展に強く影響を与えました。1903年のアメリカのライト兄弟の飛行は、「最初の持続的で制御された空気より重い動力飛行」として認識されています。"
curtiss_seaplanes_tech: "水上機"
curtiss_seaplanes_tech_desc: "1910年3月28日、フランス人のアンリ・ファーブルは、グノーム・オメガを搭載したハイドラヴィオン（三胴船型フロート水上機）で、最初の成功した動力付き水上機を飛行させました。ファーブルの動力付き水上機による最初の成功した離着陸は、他の飛行家にインスピレーションを与えました。最初の水上飛行機競技会は1912年3月にモナコで開催され、ファーブル、カーチス、テリエ、ファーマンのフロートを使用した航空機が参加しました。フランス海軍は同年、最初のフロート水上機を発注しました。"
curtiss_modern_aviation_tech: "現代の航空"
curtiss_modern_aviation_tech_desc: "民間航空は、飛行の2つの主要なカテゴリの1つであり、私的および商業的なすべての非軍事および非国家の航空を表します。航空の黄金時代には、それは広く普及しました。豪華な旅行者のための長距離飛行が初めて可能になりました。初期のサービスは飛行船を使用していましたが、ヒンデンブルク号の悲劇の後、飛行船は使用されなくなり、飛行艇が主流になりました。"
curtiss_tourism_tech: "観光"
curtiss_tourism_tech_desc: "観光とは、レクリエーション、レジャー、またはビジネス目的の旅行です。世界観光機関は、観光客を「レジャー、ビジネス、その他の目的で、通常とは異なる環境の場所に1年間を超えない期間旅行し滞在する」人々と定義しています。"
agassiz_sounding_tech: "音響測深"
agassiz_sounding_tech_desc: "測深機は、潜水艦戦への対応として最初に発明されました。しかし、その後、魚群の特定や深海研究など、多くの民間の分野でも使用されるようになりました。"
theiler_microbiology_tech: "微生物学"
theiler_microbiology_tech_desc: "微生物学的検査は17世紀から最初の顕微鏡で行われていましたが、19世紀の医学の進歩と顕微鏡技術の改良があって初めて、日常生活の多くの分野を根本的に変える新しい生物医学的研究の分野が出現しました。"
panum_vaccination_tech: "ワクチン接種"
panum_vaccination_tech_desc: "天然痘ワクチンは、伝染病に対して開発された最初のワクチンです。1796年に、英国の医師エドワード・ジェンナーは、比較的軽度な牛痘ウイルスへの感染が、致命的な天然痘ウイルスに対する免疫を与えることを実証しました。"
verrier_chemistry_tech_desc: "The development of the electrochemical theory of chemical combinations occurred in the early 19th century as the result of the work of two scientists in particular, Jöns Jacob Berzelius and Humphry Davy, made possible by the prior invention of the voltaic pile by Alessandro Volta. ritish William Prout first proposed ordering all the elements by their atomic weight as all atoms had a weight that was an exact multiple of the atomic weight of hydrogen. J.A.R. Newlands devised an early table of elements, which was then developed into the modern periodic table of elements."
mendelejew_synthetic_fuel_tech: "合成燃料"
mendelejew_synthetic_fuel_tech_desc: "ベルギウス・ピア法は、石炭の直接水素化によって石炭液化を行うための大規模なプロセスです。石炭の高分子は、高圧および高温で水素によってより小さな分子に分解されます。気体状および液体状の炭化水素が生成物として作成され、燃料および潤滑剤として使用されます。1910年から1925年の間に、ドイツの化学者フリードリヒ・ベルギウスがプロセスの基礎を開発しました。商業的なプロセスと触媒の開発は、1925年からマティアス・ピアのプロジェクト管理の下でBASFによって実施されました。"
mendelejew_synthetic_rubber_tech: "合成ゴム"
mendelejew_synthetic_rubber_tech_desc: "合成ゴムは人工エラストマーです。これらは石油副産物から合成されたポリマーです。合成ゴムは、熱安定性と油および関連化合物への耐性という2つの主要な点で天然ゴムよりも優れています。"
vikelas_international_sports_tech: "国際スポーツ"
vikelas_international_sports_tech_desc: "スポーツ競技の人気は、まず国内で広がり、その後国際的に広まった。国家間の競技をより適切に規制するために、国際委員会、連盟、そして規則が必要となった。オリンピックとIOCは、この発展において最も重要な存在である。"