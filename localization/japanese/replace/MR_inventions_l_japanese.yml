l_japanese:
urtiss_seaplanes_tech: "カーチス水上機"
urtiss_seaplanes_tech_desc: "カーチス水上機"

alloysworking: "合金加工"
alloysworking_desc: "ブロンズ、インバー、鋳鉄、真鍮？この素敵な『マインクラフト風』の技術の中身は、あなたが知っている全てが詰まっています。"

synthetic_fibres: "合成繊維"
synthetic_fibres_desc: "合成繊維は先進材料の力を活用することで画期的な進歩を遂げ、繊維産業をはじめとする幅広い用途において比類のない強度と適応性を提供します。"

cathode_tube: "ブラウン管"
cathode_tube_desc: "音声付き動画コンテンツを表示可能な画面を備えたデバイスは、コンテンツを人々に届ける上で多くの新たな可能性をもたらします。"

government_broadcasting: "国営テレビ"
government_broadcasting_desc: "政府が管理または運営する国営テレビ放送は、政府の政策を推進し国民に影響を与える強力な手段です。"

oil_distillation: "石油蒸留"
oil_distillation_desc: "石油精製施設により、原油からより高価値な成分を抽出することが可能となります。"

international_organizations: "国際機関"
international_organizations_desc: "外交と協力を促進する国際機関の設立と運営を通じて、国際協力を推進します。"

market_studies: "市場調査"
market_studies_desc: "国内および国際市場に関する包括的な調査に投資することで、経済的理解と戦略的意思決定を強化します。"

secure_market_transactions: "安全な市場取引"
secure_market_transactions_desc: "最先端のセキュリティ対策を実施し、金融取引を保護するとともに、国内外の市場における経済の安定を確保します。"

computability_theory: "計算可能性理論"
computability_theory_desc: "計算の限界と可能性を探るために、理論計算機科学の先駆的な進歩を遂げます。"

digital_computer: "デジタルコンピューティング"
digital_computer_desc: "最先端のデジタルコンピューティング技術の導入により、情報処理とデータ分析に革命をします。"

basic_home_appliances: "基本家電"
basic_home_appliances_desc: "この技術、冷蔵庫に入れておけるよ！\n\nThe electrification of households brought an unprecedented revolution in daily life, freeing up countless hours previously spent on domestic chores. Compared to first rudimental appliances, these ones, thanks to their efficiency and electrical coverage, flooded the market and became a staple in every home."

hydroponic_farming: "水耕栽培"
hydroponic_farming_desc: "土を使わずに植物を育てる革新的な方法で、養液を用いて農業生産性を向上させます。"

green_revolution: "緑の革命"
green_revolution_desc: "種子交配、肥料、化学農薬による農業生産性向上のための高度な技術です。"

vacuum_distillation: "真空蒸留"
vacuum_distillation_desc: "真空蒸留は、原油の成分を低温・低圧下で分離する精製プロセスで、熱分解を低減し製品品質を向上させます。"

thermal_cracking: "熱分解"
thermal_cracking_desc: "熱分解は、熱と圧力を利用して大きな炭化水素分子を分解し、ガソリンやディーゼル燃料などのより小さな高付加価値製品に変換する精製プロセスで、原油処理の効率を向上させます。"

enhanced_cracking_distillation: "強化型クラッキング蒸留"
enhanced_cracking_distillation_desc: "強化型クラッキング蒸留は、原油を有価製品へと分離・転換する工程を最適化するために、先進的な技術を組み合わせた精製プロセスで、収率および効率を向上させますことを目的としています。"

mechanical_arms: "ロボットアーム"
mechanical_arms_desc: "ロボットアームは、人間の腕の動きを模倣する機械装置で、製造、組立、外科手術など様々な用途で使用されます。"

fuel_cell_tech: "燃料電池"
fuel_cell_tech_desc: "燃料電池は、水素と酸化剤の化学エネルギーを、一対の酸化還元反応を通じて電気に変換する電気化学セルです。"

mechatronics: "産業用メカトロニクス"
mechatronics_desc: "メカトロニクスは、製造や組立ラインなどの産業環境におけるロボットやマイクロエレクトロニクスの設計、構築、運用、利用に焦点を当てた工学分野です。"

cnc_control: "CNC制御"
cnc_control_desc: "コンピュータ数値制御(CNC)は、コンピュータを用いて工作機械を制御する技術であり、精密かつ自動化された製造プロセスを実現します。"

supermarket: "スーパーマーケット"
supermarket_desc: "スーパーマーケットは、多種多様な食料品と家庭用品を提供するセルフサービス形式の店舗で、買い物がしやすいように通路や部門に整理されています。"

fast_food: "ファストフード"
fast_food_desc: "ファストフードは、商業再販のために大量生産される食品の一種で、サービスのスピードと利便性に焦点を当てています。"

home_delivery_networks: "宅配ネットワーク"
home_delivery_networks_desc: "宅配ネットワークは、商品を消費者の自宅に直接輸送することを容易にするシステムであり、利便性とアクセス性を向上させます。"

laser: "レーザー"
laser_desc: "レーザーは、電磁放射の誘導放出に基づく光増幅のプロセスを通じて光を放出する装置です。"

silent_cinema: "サイレント映画"
silent_cinema_desc: "アートアカデミーとエンターテイメントエリアでサイレント映画をアンロックします"

vikelas_streamliners_tech: "流線形鉄道"
vikelas_streamliners_tech_desc: "流線形鉄道は、空気抵抗を減らす形状に流線形化を取り入れた乗り物です。"

bullet_train_tech: "弾丸列車"
bullet_train_tech_desc: "別名、最初の高速列車"

high_speed_rail_tech: "高速鉄道"
high_speed_rail_tech_desc: "高速鉄道(HSR)は、従来の鉄道よりも大幅に高速で運行される列車を利用する一種の鉄道輸送ネットワークであり、特殊な車両と専用線路からなる統合システムを使用します。"

penicillin: "ペニシリン"
penicillin_desc: "広範な医療用途のためのペニシリンの大量生産"

vaccination_campaigns: "ワクチン接種キャンペーン"
vaccination_campaigns_desc: "ワクチン接種のための組織的な公衆衛生キャンペーン"

genetic_disease_screening: "遺伝性疾患スクリーニング"
genetic_disease_screening_desc: "遺伝性疾患の早期スクリーニング"

advanced_medical_imaging: "高度医療画像診断"
advanced_medical_imaging_desc: "高度医療画像診断技術(例：CTスキャン)の開発"

genetic_engineering: "遺伝子工学"
genetic_engineering_desc: "遺伝子組み換え技術の先駆的な開発"

mri_development: "MRIの開発"
mri_development_desc: "高度な診断のための磁気共鳴画像法(MRI)"

acquafarm_systems: "水耕栽培システム"
acquafarm_systems_desc: "70年代に開発された個人用および産業用の両方の水耕栽培システムで、水耕栽培の自動化において前進を遂げました。"

elastomers: "エラストマー"
elastomers_desc: "エラストマーは、伸縮して元の形状に戻る弾性特性を示すポリマーのクラスです。タイヤ、シール、柔軟な部品など、様々な用途で広く使用されています。"

direct_reduced_iron: "スポンジ鉄"
direct_reduced_iron_desc: "スポンジ鉄、または正式には直接還元鉄(DRI)は、天然ガスまたは石炭を使用して鉄鉱石から鉄を抽出する方法であり、より高い生産性と少ない汚染で製鋼に適した高純度の鉄が得られます。"

advanced_electric_arc_processes: "高度な電気アークプロセス"
advanced_electric_arc_processes_desc: "高度な電気アークプロセスは、電気アーク炉(EAF)を利用した製鋼の最新技術を指し、効率の向上、排出量の削減、柔軟性の向上を実現します。これらのプロセスは、スクラップメタルのリサイクルと直接還元鉄(DRI)の使用を可能にし、より持続可能でエネルギー効率の高い製鋼に貢献します。"
hdpe: "高密度ポリエチレン(HDPE)"
hdpe_desc: "高密度ポリエチレン(HDPE)は、その強度、耐薬品性、低吸湿性で知られる多用途で耐久性のある熱可塑性ポリマーです。包装、容器、建設資材に広く使用されています。"
polyethylene: "エチレン"
polyethylene_desc: "多用途で耐久性のあるポリマーであるポリエチレンは、包装、容器、そして数えきれないほどの日常製品への幅広い応用により、現代製造業に革命をもたらし、比類のない効率と適応性を提供します。"
nuclear_reactor: "第一世代原子炉"
nuclear_reactor_desc: "核分裂性物質を使用して水を加熱し、発電します。"
second_nuclear_reactor: "第二世代原子炉"
second_nuclear_reactor_desc: "より効率的で、異なる種類の核分裂性物質を追加して発電する、より高度な原子炉。"
geothermal_energy: "地熱エネルギー"
geothermal_energy_desc: "地熱エネルギーは、地球内部からの熱を利用して発電および直接加熱を行うもので、持続可能で再生可能なエネルギー源を提供します。"
natural_gas_extraction: "天然ガス採掘"
natural_gas_extraction_desc: "天然ガス採掘には、地下貯留層から天然ガスを探し出して抽出するプロセスが含まれ、エネルギー生産のためのよりクリーンに燃焼する化石燃料の代替手段を提供します。"
gas_turbine: "ガスタービン"
gas_turbine_desc: "ガスタービンは、天然ガスやその他の燃料を機械的エネルギーに変換する燃焼機関であり、一般に発電や航空機の推進に使用されます。"

national_power_grid: "全国送電網"
national_power_grid_desc: "地域発電所を相互接続して統一された全国送電網を構築することは、産業能力における転換点となった。高圧送電線は、許容範囲内の損失で長距離にわたって電力を送電できるため、工場や都市は地域ごとの発電機への依存から解放される。英国中央電力庁が1926年にこのモデルを先駆的に導入し、10年以内にほとんどの工業国がこれに倣った。"
gas_liquefaction: "ガス液化"
gas_liquefaction_desc: "ガス液化は、天然ガスを冷却および圧縮して液体状態に変換するプロセスであり、貯蔵と輸送を容易にします。"
user_interface: "ユーザーインターフェース"
user_interface_desc: "ユーザーインターフェースは、ユーザーがコンピューターまたはソフトウェアアプリケーションとやり取りするための手段を指し、ユーザビリティとユーザーエクスペリエンスを向上させる設計要素を包含します。"
personal_computer: "パーソナルコンピューター"
personal_computer_desc: "パーソナルコンピューター(PC)は、そのサイズ、機能、価格が個人での使用を可能にする多目的コンピューターです。"
tv_color: "カラーテレビ"
tv_color_desc: "カラーテレビは、カラー画像を送信および表示するテレビシステムであり、視聴体験を向上させ、エンターテイメント業界に革命をもたらします。"
computer: "コンピューター"
computer_desc: "コンピューターは、データを処理し計算を実行する電子デバイスであり、ビジネス、科学、エンターテイメントなど、さまざまな分野で幅広いアプリケーションを可能にします。"
synthetic_rubber: "合成ゴム"
synthetic_rubber_desc: "合成ゴムは、イソプレンなどのモノマーの重合によって製造される人工エラストマーであり、天然ゴムと比較して、耐久性、柔軟性、および摩耗や環境要因に対する耐性を向上させます。タイヤ、シール、工業製品などの用途に広く使用されています。"
keynesian_economics: "ケインズ経済学"
keynesian_economics_desc: "ケインズ経済学は、特に景気後退期に、需要を管理し完全雇用を促進するために政府が経済に介入することを提唱する経済理論です。"
math_finance: "数理ファイナンス"
math_finance_desc: "数理ファイナンスは、金融市場を分析し、リスクを評価し、ブラックショールズモデルなどの投資戦略を最適化するために、数学的手法とモデルを適用する分野です。"
modern_statistics: "現代統計学"
modern_statistics_desc: "現代統計学は、データの収集、分析、解釈、提示、および組織化を扱う数学の分野であり、経験的証拠に基づいた情報に基づいた意思決定を行うためのツールを提供します。"
multinational_corporations: "多国籍企業"
multinational_corporations_desc: "多国籍企業(MNC)は、複数の国で事業を展開する大企業であり、グローバルな資源と市場を活用して競争力と収益性を向上させています。"
networking_protocols: "ネットワーキングプロトコル"
networking_protocols_desc: "ネットワーキングプロトコルは、ネットワーク内のデバイス間の通信とデータ交換を管理する標準化されたルールと慣例であり、相互運用性と効率的なデータ伝送を保証します。プロトコルの例としては、インターネットの「前身」であるアーパネット(Arpanet)で使用されたTCP/IPやFTPがあります。"
telecommunications: "電気通信"
telecommunications_desc: "電気通信は、電子的な手段を使用して遠距離に情報を伝送することを指し、電話、ラジオ、テレビなどのさまざまなチャネルを通じて通信を可能にします。"
data_processing: "生データ処理"
data_processing_desc: "データ処理は、ビジネス、科学、技術などのさまざまな分野で意味のある情報を抽出し、意思決定をサポートするために、データの収集、ETL(抽出、変換、ロード)、および分析を行う行為です。"
interactive_media: "インタラクティブメディア"
interactive_media_desc: "インタラクティブメディアは、ユーザーがマテリアルに関与し、操作できるようにするデジタルコンテンツを指し、ビデオゲームなどのさまざまなプラットフォームを通じてユーザーエクスペリエンスと参加を強化します。"
transnational_activism: "国境を越えた活動主義"
transnational_activism_desc: "国境を越えた活動主義とは、個人や組織が、多くの場合、協力と連帯を通じて、国境を越えて地球規模の問題に取り組み、社会変革を促進するための取り組みです。"
global_music: "グローバルミュージック"
global_music_desc: "グローバルミュージックは、文化的交流、移住、および技術の進歩に影響された、世界中の多様で相互に接続された音楽の伝統とジャンルを指します。"
global_stock_market: "世界的な株式市場"
global_stock_market_desc: "世界的な株式市場は、上場企業の株式が売買される取引所と市場のネットワークであり、国境を越えた資本調達と投資機会を促進します。"
globalization: "グローバリゼーション"
globalization_desc: "テクノロジー、貿易、およびコミュニケーションの進歩によって推進される、国、経済、および文化間の相互接続性と相互依存性の高まりのプロセス。"

decolonization: "非植民地化"
decolonization_desc: "非植民地化のプロセスとは、植民地が植民地支配国から独立を獲得し、主権国家の設立と帝国支配の終焉につながった歴史的および政治的運動を指します。"
anti_discrimination: "反差別"
anti_discrimination_desc: "人種、性別、または民族性に基づく構造的な不平等を根絶するための運動であり、画期的な公民権法と文化的変化につながりました。"
counterculture: "対抗文化"
counterculture_desc: "世界中の植民地における広範な独立運動であり、自己決定への移行と帝国支配の終焉を示しています。"
jazz_blues: "ジャズとブルース"
jazz_blues_desc: "アフリカ系アメリカ人の文化的および社会的経験の深みから生まれた音楽ジャンルであり、感情的なメロディー、即興演奏、およびシンコペーションされたリズムが特徴です。新しい文化時代と伝統的な規範に対する増大する反乱の象徴です。"
rock_and_roll: "ロックンロール"
rock_and_roll_desc: "ブルース、ゴスペル、カントリーの要素を組み合わせた50年代/60年代の音楽文化の爆発です。その電撃的なビートと生のエネルギーにより、ロックンロールは若者文化を変革し、社会慣習に挑戦し、音楽における世界的な革命を鼓舞しました。"
neo_feminism: "ネオ・フェミニズム"
neo_feminism_desc: "古典的なフェミニズムの原則を拡張し、人種、階級、性的指向などのインターセクショナルな問題(交差する問題)を統合する現代の運動です。複雑で相互に接続された文脈でジェンダー平等を促進し、歴史的および現代の権力構造に対処します。"
internet: "インターネット"
internet_desc: "インターネットは、相互に接続されたコンピューターとサーバーのグローバルネットワークであり、さまざまなプロトコルを通じて情報交換と通信を可能にし、人々がデータにアクセスし共有する方法に革命をもたらしています。"
highway_systems: "高速道路網"
highway_systems_desc: "高速道路網は、高速の車両交通のために設計された広範な道路ネットワークであり、都市部と農村部の間で効率的な輸送と接続を容易にします。"
cloud_computing: "クラウドコンピューティング"
cloud_computing_desc: "クラウドコンピューティングは、ユーザーがインターネットを介してリモートサーバー上のデータとアプリケーションにアクセスおよび保存できるようにするテクノロジーであり、ITインフラストラクチャにおける柔軟性、スケーラビリティ、および費用対効果を提供します。"
mechanized_infantry: "現代機械化歩兵"
mechanized_infantry_desc: "現代機械化歩兵とは、装甲車両を装備した歩兵部隊を指し、戦場での機動性と防御力を高めます。"
blitzkrieg: "電撃戦"
blitzkrieg_desc: "電撃戦、または「稲妻の戦争」は、歩兵、機甲、航空支援を含む統合された兵力を使用して、迅速かつ協調的な攻撃を強調する軍事戦略であり、迅速な勝利を達成します。"
amphibious_warfare: "水陸両用作戦"
amphibious_warfare_desc: "水陸両用作戦は、敵の支配下にある領土に対する陸上部隊と海軍部隊の協調的な攻撃を伴う軍事作戦であり、ノルマンディー上陸作戦(D-Day landings)のように、特殊な艦船と戦術を利用して橋頭堡を確立します。"
#modern_warplanes: "現代の軍用機"
#modern_warplanes_desc: "現代の軍用機は、制空権、地上攻撃、偵察など、さまざまな戦闘任務のために設計された高度な軍用機です。最先端の技術、ステルス機能、精密兵器が組み込まれています。"
modern_warplanes: "現代軍用機"
modern_warplanes_desc: "最先端の技術、優れた速度、および高度な兵器を特徴とする最先端の現代軍用機で、軍事能力を向上させます。"
air_support: "航空支援"
air_support_desc: "空対地火力と戦略的協調を組み合わせた洗練された航空支援戦略を開発することにより、戦場での有効性を高めます。"
military_encryption: "軍事暗号"
military_encryption_desc: "軍事暗号は、機密性の高い軍事通信とデータを保護するために高度な暗号技術を使用することを指し、第二次世界大戦中のドイツのエニグマのように、防衛作戦における機密性と完全性を保証します。"
manhattan_project: "マンハッタン計画"
manhattan_project_desc: "マンハッタン計画は、第二次世界大戦中に最初の核兵器を製造した米国の秘密の政府研究開発プロジェクトであり、軍事史と世界の地政学における極めて重要な瞬間となりました。"
bombing: "爆撃"
bombing_desc: "爆撃は、敵の戦争遂行能力と士気を弱めるために、敵の産業および民間インフラを標的とする軍事戦略であり、多くの場合、空中爆撃を通じて行われます。"
paratroopers: "空挺部隊"
paratroopers_desc: "空挺部隊は、航空機からパラシュートで展開される特殊訓練を受けた軍人であり、戦闘区域への迅速な投入と、敵陣後方の重要な目標を奪取する能力を可能にします。"
atomic_bomb: "原子爆弾"
atomic_bomb_desc: "原子爆弾は、核反応、特に核分裂からその破壊力を引き出し、短時間で膨大な量のエネルギーを放出する強力な爆発兵器です。第二次世界大戦中に最初に開発され、それ以来、軍事戦略と国際関係に深刻な影響を与えてきました。"
main_battle_tank: "主力戦車"
main_battle_tank_desc: "主力戦車(MBT)は、最前線での作戦のために設計された重装甲で機動性の高い戦闘車両であり、火力、防御力、機動性を組み合わせて敵部隊と交戦し、戦場での優位性を確保します。"
helicopters: "ヘリコプター"
helicopters_desc: "ヘリコプターは、垂直離着陸が可能な多用途航空機であり、限られたスペースでの運用を可能にし、輸送、偵察、戦闘支援など、幅広い任務を実行できます。"
jet_aviation: "ジェット機"
jet_aviation_desc: "ジェット機とは、航空機にジェットエンジンを使用することを指し、速度、高度、航続距離の向上により、航空旅行と軍事航空に革命をもたらしました。"
composite_armor: "複合装甲"
composite_armor_desc: "複合装甲は、軍用車両や装備に使用される保護材料の一種であり、異なる材料を組み合わせて強度、重量、および貫通抵抗を向上させます。"
high_performance_apparel: "高性能軍用アパレル"
high_performance_apparel_desc: "高性能軍用アパレルは、さまざまな環境で軍人の能力と安全性を高めるように設計された特殊な衣料品です。耐久性、快適性、保護のために高度な材料と技術が組み込まれています。"
radar: "レーダー"
radar_desc: "レーダーは、電波を使用して、航空機や船舶などの物体を検出し特定する技術であり、波が標的に当たって跳ね返るのにかかる時間を測定します。監視、ナビゲーション、気象監視のための軍事および民間のアプリケーションで広く使用されています。"
guided_missiles: "誘導ミサイル"
guided_missiles_desc: "誘導ミサイルは、高度な誘導システムと推進技術を利用して、高い精度で特定の標的を攻撃するように設計された精密誘導兵器です。"
satellites: "衛星"
satellites_desc: "衛星は、通信、ナビゲーション、気象監視、および科学研究に使用される、天体の周りの軌道に配置された人工物体です。"
astronautics: "宇宙航行学"
astronautics_desc: "宇宙船の開発、軌道技術、星間知識の追求など、宇宙航行学の進歩により、宇宙探査に乗り出します。"
laser_guided_weapons: "レーザー誘導兵器"
laser_guided_weapons_desc: "レーザー誘導兵器は、レーザー誘導システムを使用して標的を正確に攻撃する精密弾薬であり、軍事効果を高め、巻き添え被害を減らします。"
supersonic_aviation: "超音速航空"
supersonic_aviation_desc: "超音速航空とは、音速よりも速く飛行できる航空機の技術と設計を指し、航空旅行と軍事作戦に革命をもたらします。"
awacs: "早期警戒管制機"
awacs_desc: "早期警戒管制システム(AWACS)は、高度なレーダーと監視システムを装備した軍用機であり、航空作戦のためのリアルタイムの状況認識と指揮統制機能を提供します。"
stealth_technology: "ステルス技術"
stealth_technology_desc: "ステルス技術とは、軍用機や車両に使用される高度な設計と材料を指し、レーダー断面積と赤外線シグネチャを減らし、検出を回避する能力を高めます。"
naval_logistic_automation: "海軍兵站自動化"
naval_logistic_automation_desc: "海軍兵站自動化とは、海軍における兵站業務を合理化および最適化するために高度な技術とシステムを使用することを指し、サプライチェーンの効率と作戦準備態勢を向上させます。"
integrated_naval_air_tactics: "統合海軍航空戦術"
integrated_naval_air_tactics_desc: "統合海軍航空戦術とは、海上作戦を支援するための海軍航空資産の協調と運用を管理する包括的な戦略と原則を指し、戦闘有効性と任務の成功を強化します。"
nuclear_submarine: "原子力潜水艦"
nuclear_submarine_desc: "原子力潜水艦は、原子炉を動力源とする軍事潜水艦の一種であり、頻繁な燃料補給を必要とせずに長時間の水中作戦を可能にします。弾道ミサイルを搭載し、ステルスミッションを実行することができます。"
advanced_harbor_facilities: "高度な港湾施設"
advanced_harbor_facilities: "高度なクレーンとデジタル管理システムを備えた最新の港湾インフラストラクチャをアンロックし、港レベルの容量、処理効率を向上させ、輸送船団の維持費を削減します。"

# NEW 1.0
selective_mineral_extraction: "現代精製" #CHANGE old selective_mineral_extraction
selective_mineral_extraction_desc: "現代精製技術は、資源回収の効率と持続可能性を高め、環境への影響を最小限に抑え、収量を最大化します。これらの方法では、湿式冶金、バイオリーチング、溶媒抽出などの高度な技術を利用して、鉱石から貴重な鉱物を分離し、生産性と二次鉱物抽出の向上に貢献します。" #CHANGE old selective_mineral_extraction_desc
modern_urban_planning: "現代都市計画"
modern_urban_planning_desc: "現代都市計画は、機能的で持続可能で住みやすい環境を作り出すために、交通、土地利用、コミュニティのニーズなどの要因を考慮して、都市空間を設計および組織化するプロセスです。"
sea_water_desalination: "海水の淡水化"
sea_water_desalination_desc: "海水の淡水化は、逆浸透や蒸留などのさまざまな技術を利用して、海水から塩分と不純物を除去して真水を生成するプロセスです。この方法は、乾燥地域や淡水資源が限られた地域で飲料水を提供するために不可欠です。"
fast_modular_furniture: "高速モジュラー家具"
fast_modular_furniture_desc: "高速モジュラー家具は、革新的なデザインで家具業界に革命をもたらし、迅速な組み立てとカスタマイズを可能にし、現代のライフスタイルと好みに応えます。Ikeaはこの分野のパイオニアであり、あらゆるスペースに簡単に適応できる、スタイリッシュで機能的な幅広い家具ソリューションを提供しています。"
photovoltaic_effect: "光電効果"
photovoltaic_effect_desc: "光電効果は、半導体材料を使用して太陽エネルギーを電気エネルギーに変換するプロセスであり、太陽電池および太陽光発電システムの基礎を形成します。この技術により、太陽光からの再生可能エネルギーの活用が可能になり、持続可能な発電に貢献します。"
wind_turbines: "風力タービン"
wind_turbines_desc: "風力タービンは、風の運動エネルギーを機械的エネルギーに変換し、それを電気に変換できる装置です。これらは再生可能エネルギー発電において重要な役割を果たし、より持続可能で環境に優しい電力供給に貢献します。"
lithium_battery: "リチウムイオン電池"
lithium_battery_desc: "リチウムイオン電池は、リチウムイオンを利用してアノードとカソードの間でエネルギーを伝達する充電式エネルギー貯蔵デバイスであり、高いエネルギー密度、長いサイクル寿命、軽量特性を提供します。これらは、携帯型電子機器、電気自動車、再生可能エネルギーシステムに広く使用されています。"
embedded_control_systems: "組み込み制御システム"
embedded_control_systems_desc: "組み込み制御システムは、より大きな機械システムまたは電気システム内で専用機能を実行するように設計された特殊なコンピューティングシステムであり、多くの場合、リアルタイムの制約があります。これらは、自動車、航空宇宙、家電、産業オートメーションなど、さまざまなアプリケーションで広く使用されています。"
smart_energy_grid: "スマートエネルギーグリッド"
smart_energy_grid_desc: "スマートエネルギーグリッドは、デジタル技術を使用して電力の生成、配電、消費をリアルタイムで監視および管理する高度な電力グリッドです。再生可能エネルギー源、スマートメーター、高度な通信技術を統合することにより、エネルギーシステムの効率、信頼性、持続可能性を高めます。"
advanced_solar_panels: "高度なソーラーパネル"
advanced_solar_panels_desc: "高度なソーラーパネルは、太陽光を電気に変換する高効率の太陽光発電システムであり、最先端の材料と技術を利用してエネルギー出力を最大化し、環境への影響を最小限に抑えます。これらは、再生可能エネルギー源と持続可能な発電への移行において重要な役割を果たします。"
electric_vehicles: "電気自動車"
electric_vehicles_desc: "電気自動車(EV)は、電気モーターとバッテリーで駆動される自動車であり、従来の内燃機関車に代わる、よりクリーンで持続可能な代替手段を提供します。これらは、温室効果ガスの排出削減と化石燃料への依存度低下に貢献します。"
rare_earths: "レアアース"
rare_earths_desc: "レアアースは、エレクトロニクス、再生可能エネルギー、高度な材料など、さまざまなハイテクアプリケーションに不可欠な17の化学的に類似した元素のグループです。それらのユニークな特性は、現代のテクノロジーにとって重要ですが、その抽出と処理は環境上の課題を引き起こす可能性があります。"
rare_earths_advanced_purification: "レアアース精製"
rare_earths_advanced_purification_desc: "レアアース精製技術は、湿式冶金、バイオリーチング、溶媒抽出などの高度な技術を利用して、鉱石から貴重な鉱物を分離し、生産性と二次鉱物抽出の向上に貢献します。"
optic_fibers: "光ファイバー"
optic_fibers_desc: "光ファイバーは、光信号を長距離にわたって伝送するガラスまたはプラスチックの細いストランドであり、高速データ通信とインターネット接続を可能にします。これらは、現代の電気通信およびネットワーキングインフラストラクチャに不可欠です。"
coal_gasification: "石炭ガス化"
coal_gasification_desc: "石炭ガス化は、石炭を酸素と蒸気と高温で反応させることにより、石炭を合成ガス(シンガス)に変換するプロセスです。このシンガスは、発電、化学製品の生産、および従来の化石燃料に代わるよりクリーンな代替手段として使用できます。"
horizontal_drilling: "水平掘削"
horizontal_drilling_desc: "水平掘削は、油田およびガス田に効率的にアクセスするために、井戸を斜めに掘削する技術であり、生産量の増加と地表への影響の低減を可能にします。この方法は、今日では、資源抽出を強化するために水圧破砕と組み合わせて一般的に使用されています。"
hydraulic_fracturing: "水圧破砕"
hydraulic_fracturing_desc: "水圧破砕、またはフラッキングは、高圧の流体を注入して亀裂を作成することにより、地下の岩石層から天然ガスと石油を抽出するために使用される技術であり、資源回収の増加を可能にします。この方法はエネルギー産業に革命をもたらしましたが、環境上の懸念を引き起こしています。"
hybrid_vehicles: "ハイブリッド車"
hybrid_vehicles_desc: "ハイブリッド車は、内燃機関を電気モーターと組み合わせることで、燃費を最適化し、排出ガスを削減します。これらは、完全に電気自動車への移行技術を表しており、ドライバーに両方の動力源の利点を提供します。"
smart_vehicles: "スマート車両"
smart_vehicles_desc: "スマート車両は、安全性、接続性、および自動化を強化する高度なテクノロジーとシステムを装備しており、アダプティブクルーズコントロール、レーンキープアシスト、車車間通信などの機能を可能にします。これらは、自動運転と輸送効率の向上に向けた重要な一歩を表しています。"
electric_vehicles: "電気自動車"
electric_vehicles_desc: "電気自動車(EV)は、電気モーターとバッテリーで駆動される自動車であり、従来の内燃機関車に代わる、よりクリーンで持続可能な代替手段を提供します。これらは、温室効果ガスの排出削減と化石燃料への依存度低下に貢献します。"
parallel_computing_architecture: "並列コンピューティングアーキテクチャ"
parallel_computing_architecture_desc: "並列コンピューティングアーキテクチャは、複数の計算を同時に実行できるコンピューターシステムの設計と組織を指し、科学シミュレーション、データ分析、機械学習などの複雑なタスクの処理能力と効率を向上させます。この例としては、現代のコンピューターで使用されているマルチコアプロセッサやグラフィックス処理ユニット(GPU)があります。"
high_definition_television: "高解像度モニター"
high_definition_television_desc: "高解像度モニターは、標準解像度モニターと比較して解像度と画質が向上したディスプレイ技術であり、テレビ、ゲーム、コンピューターディスプレイなど、さまざまなアプリケーションでより鮮明で詳細なビジュアルを可能にします。"
smartphones: "スマートフォン"
smartphones_desc: "スマートフォンは、電話の機能とコンピューティング機能を組み合わせた高度なモバイルデバイスであり、コンパクトな形式でインターネットアクセス、アプリケーション、マルチメディア機能を可能にします。"
advanced_personal_computer: "高度なパーソナルコンピューター"
advanced_personal_computer_desc: "高度なパーソナルコンピューターは、個人使用のために設計された高性能コンピューティングデバイスであり、ゲーム、コンテンツ作成、専門的なタスクなど、さまざまなアプリケーション向けに強化された処理能力、グラフィックス機能、およびストレージオプションを提供します。"
operating_systems: "オペレーティングシステム"
operating_systems_desc: "オペレーティングシステムは、コンピューターのハードウェアとソフトウェアリソースを管理し、ユーザーインターフェースを提供し、アプリケーションの実行を可能にするソフトウェアです。これらは、パーソナルコンピューターからサーバー、モバイルデバイスに至るまで、すべてのコンピューティングデバイスの基盤として機能します。"
software_development_paradigms: "ソフトウェア開発パラダイム"
software_development_paradigms_desc: "ソフトウェア開発パラダイムは、ソフトウェアアプリケーションの設計、開発、および保守に使用されるアプローチと方法論です。これらは、ソフトウェアエンジニアリングにおけるコラボレーション、効率、および品質を向上させるために、アジャイル、ウォーターフォール、DevOpsなど、さまざまなプラクティスを包含します。"
videogames: "ビデオゲーム"
videogames_desc: "ビデオゲームは、ゲームプレイ、ストーリーテリング、没入型グラフィックスを通じてプレイヤーを魅了する、インタラクティブなデジタルエンターテイメント体験です。これらは、コンソールゲーム、PCゲームからモバイルアプリケーションまで、さまざまなジャンルとプラットフォームを包含し、現代のエンターテイメント文化を形作っています。"
app_economy: "アプリエコノミー"
app_economy_desc: "アプリエコノミーとは、スマートフォンの普及によって推進される、モバイルアプリケーションの開発、流通、および消費を取り巻く経済エコシステムを指します。これは、産業を変革し、新しいビジネスモデルを生み出し、アプリの販売、アプリ内購入、および広告を通じて多大な収益を生み出してきました。"
social_media: "ソーシャルメディア"
social_media_desc: "ソーシャルメディアとは、ユーザーがコンテンツを作成、共有、操作し、互いに交流することを可能にするオンラインプラットフォームおよびアプリケーションを指し、コミュニケーション、コラボレーション、およびコミュニティへの参加を促進します。"
kraft_recovery_process: "クラフト回収プロセス"
kraft_recovery_process_desc: "クラフト回収プロセスは、パルプ・製紙産業で使用される化学プロセスであり、パルプ化プロセス中の木材チップから化学物質とエネルギーを回収します。これには、水酸化ナトリウムと硫化ナトリウムの混合物で木材チップを煮沸する工程が含まれ、その結果、パルプが製造され、蒸解薬品が再生されます。"
offset_printing: "オフセット印刷"
offset_printing_desc: "オフセット印刷は、インクを版からゴムブランケットに転写し、次いで印刷面に転写する、広く使用されている印刷技術であり、書籍、雑誌、パッケージなどの印刷物の高品質かつ効率的な大量生産を可能にします。"
advanced_mining: "高度な鉱業"
advanced_mining_desc: "高度な鉱業技術とは、鉱物や資源を地球から抽出するために使用される最新の方法と技術を指し、自動化、リモート制御、ロボット工学、データ分析などが含まれます。これらの進歩は、鉱業業務における効率、安全性、および持続可能性を向上させます。"

# NEW 1.1
funded_research_projects: "資金提供された研究プロジェクト"
funded_research_projects_desc: "資金提供された研究プロジェクトは、科学的調査、技術的進歩、または社会的研究を実施するために財源によって支援されるイニシアチブです。これらのプロジェクトには、複雑な課題に対処し、より大きな効率規模でイノベーションを推進するために、学術機関、政府機関、および民間組織間の協力がしばしば含まれます。"
cognitive_sciences: "認知科学"
cognitive_sciences_desc: "認知科学は、知覚、記憶、推論、言語など、心とそのプロセスを研究する学際的な分野です。心理学、神経科学、言語学、哲学、コンピューター科学からの洞察を組み合わせて、心がどのように機能し、どのようにモデル化またはシミュレートできるかを理解します。"
computerized_research_networking: "コンピューター化された研究ネットワーキング"
computerized_research_networking_desc: "コンピューター化された研究ネットワーキングとは、研究者や機関間のコラボレーション、データ共有、およびコミュニケーションを促進するために、デジタル技術とプラットフォームを使用することを指します。これにより、情報、リソース、専門知識の効率的な交換が可能になり、さまざまな分野でイノベーションが促進され、科学的発見が加速されます。"
neuroscience: "神経科学"
neuroscience_desc: "神経科学は、脳と脊髄の構造、機能、発達、病理を含む、神経系の科学的研究です。"

# NEW 1.2
modern_cosmetics: "現代の化粧品"
modern_cosmetics_desc: "現代の化粧品には、外観、衛生、全体的な幸福感を高める幅広い美容およびパーソナルケア製品が含まれます。これらの製品には、コスメシューティカル、スキンケア、メイクアップ、ヘアケア、フレグランスアイテムが含まれ、多くの場合、高度な成分と技術で処方されており、自己表現と自信を促進しながら効果的な結果を提供します。"
synthetic_cosmetics: "合成化粧品"
synthetic_cosmetics_desc: "外観と性能を向上させるために、化学的に設計された成分で処方された美容およびパーソナルケア製品。これらの製品には、従来の化粧品と比較して、長期的な効果、改善されたテクスチャ、および強化された有効性を提供する高度な処方がしばしば含まれます。"
alkaline_battery: "アルカリ電池"
alkaline_battery_desc: "アルカリ電池は、アルカリ電解質を使用する一次電池の一種であり、従来の亜鉛-炭素電池と比較して、より高いエネルギー密度とより長い貯蔵寿命を提供します。これらは、家庭用デバイスや携帯型電子機器に一般的に使用されています。"
quartz_glass: "石英ガラス"
quartz_glass_desc: "石英ガラスは、優れた光学特性、熱安定性、および耐薬品性で知られる高純度で非結晶質の二酸化ケイ素($\text{SiO}_2$)の形態です。紫外線(UV)を透過し、高温に耐える能力があるため、光学、エレクトロニクス、実験装置などのアプリケーションで広く使用されています。"
proto_digital_devices: "プロトデジタルデバイス"
proto_digital_devices_desc: "70年代に誕生した最初のデジタルデバイスであり、アナログ技術とデジタル技術を組み合わせて基本的なコンピューティングタスクを実行しました。これらのデバイスは、最新のデジタルエレクトロニクスの開発の基盤を築き、パーソナルコンピューター革命とデジタル時代への道を開きました。"
third_nuclear_reactor: "第3世代原子炉"
third_nuclear_reactor_desc: "チェルノブイリの後、原子力産業は安全性と効率性において大きな進歩を遂げ、第3世代原子炉の開発につながりました。これらの原子炉は、改善された安全機能、高度な燃料技術、および強化された運転効率を組み込んでおり、原子力発電のためのより信頼性が高く持続可能なオプションとなっています。"
nuclear_fusion_reactor: "Nuclear Fusion Reactor"
nuclear_fusion_reactor_desc: "Nuclear fusion , the process that powers the sun , has long been the ultimate goal of energy research. By fusing hydrogen isotopes (deuterium and tritium) at extreme temperatures, a fusion reactor produces a staggering amount of energy with minimal radioactive waste and no carbon emissions. This technology represents the pinnacle of nuclear science, promising virtually limitless clean energy."
iot_driven_manufacturing: "IoT駆動型製造"
iot_driven_manufacturing_desc: "IoT駆動型製造とは、モノのインターネット(IoT)技術を製造プロセスに統合することを指し、リアルタイムの監視、データ収集、および分析を可能にして、生産効率を最適化し、ダウンタイムを削減し、製品品質を向上させます。このアプローチは、接続されたデバイス、センサー、およびデータ分析を活用して、変化する需要に適応し、全体的な運用性能を向上させることができるスマート工場を作成します。"
cobots: "協働ロボット"
cobots_desc: "協働ロボット、またはコボットは、IoTとロボット工学の最高の機能を絞り込みながら、共有ワークスペースで人間と一緒に作業するように設計されています。これらは、反復的なタスクを自動化すると同時に、人間のオペレーターがより複雑で創造的な活動に集中できるようにすることで、生産性と安全性を向上させます。"
ambientalism: "環境保護主義"
ambientalism_desc: "環境保護主義は、自然環境の保護と持続可能な慣行の促進を提唱する社会的および政治的運動です。これは、保全活動、政策変更、および一般市民の意識向上キャンペーンを通じて、汚染、気候変動、生物多様性の喪失などの問題に対処しようとします。環境保護主義は、人間の活動と環境の相互関連性を強調し、生態学的管理と持続可能性への全体的なアプローチを促進します。"

# NEW 1.3
socialdemocracy: "社会民主主義"
socialdemocracy_desc: "社会民主主義は、社会主義と資本主義の要素を組み合わせた、統治へのバランスの取れたアプローチを提唱する政治イデオロギーです。民主主義の原則と市場経済へのコミットメントを維持しながら、社会正義、経済的平等、および福祉国家を強調します。社会民主主義は、累進課税、公共サービス、および労働者の権利を通じて、公正で包摂的な社会を創出することを目指しています。"
e_government: "電子政府"
e_government_desc: "電子政府とは、政府サービスの提供を強化し、市民の関与を改善し、管理プロセスを合理化するために、デジタル技術とオンラインプラットフォームを使用することを指します。これにより、政府機関と市民との間の効率的なコミュニケーションが可能になり、行政における透明性、アクセス性、および利便性が促進されます。"
urban_sustainability: "都市の持続可能性"
urban_sustainability_desc: "都市の持続可能性とは、将来の世代が自分たちのニーズを満たす能力を損なうことなく、現在のニーズを満たす方法で都市を開発および管理することを指します。これには、環境保護、社会公平性、経済的実行可能性、効率的な資源利用など、さまざまな側面が含まれます。都市の持続可能性は、環境への悪影響を最小限に抑えながら、すべての住民の幸福を促進する、回復力のある住みやすい都市環境を作り出すことを目指しています。"
big_data_analytics: "ビッグデータ分析"
big_data_analytics_desc: "インターネットとクラウドの発明後、膨大な量のデータを収集および分析する能力は、現代のビジネスとテクノロジーの基礎となりました。ビッグデータ分析には、高度なアルゴリズムと機械学習技術を使用して、大規模で複雑なデータセットから貴重な洞察を抽出し、組織がデータ駆動型の意思決定を行い、運用を最適化し、成長のための新しい機会を特定できるようにすることが含まれます。"
digital_governance: "デジタルガバナンス"
digital_governance_desc: "デジタルガバナンスとは、デジタル技術とデータ駆動型のアプローチを使用して、政府運営の効率性、透明性、および説明責任を強化することを指します。これには、公共サービスの提供、市民の関与、および政策決定プロセスを改善するための電子政府イニシアチブ、データ分析、およびデジタルプラットフォームの実装が含まれます。デジタルガバナンスは、テクノロジーを活用して社会の課題に対処し、市民の生活の質を向上させる、より応答性が高く包摂的な政府を創出することを目指しています。"
synthetic_pesticides: "合成農薬"
synthetic_pesticides_desc: "合成農薬は、農業における害虫、雑草、および病気を防除するために使用される化学的に設計された物質です。これらは、従来の農薬よりも効果的かつ標的を絞ったものになるように設計されており、過剰な散布の必要性を減らし、環境への影響を最小限に抑えます。合成農薬は、作物の収穫量を増やし、食料安全保障を保護し、農薬耐性のある害虫を管理することにより、現代農業において重要な役割を果たしています。しかし、その使用は、潜在的な健康リスク、環境汚染、および農薬耐性害虫の開発についても懸念を引き起こします。したがって、潜在的なリスクを軽減しながらその利益を確保するためには、合成農薬の責任ある使用と規制が不可欠です。"
automated_industrial_robots: "自動化された産業用ロボット"
automated_industrial_robots_desc: "70年代の間に、自動化された産業用ロボットの開発は、プログラマブルな機械を導入することにより、製造プロセスに革命をもたらしました。これらの機械は、反復的なタスクを精度と効率で実行できます。これらのロボットは、自動車、エレクトロニクス、消費財などのさまざまな産業で、生産性の向上、人件費の削減、および製品品質の改善を実現するように設計されています。これらは、組み立て、溶接、塗装、マテリアルハンドリングなどのタスクを実行するようにプログラムでき、生産ラインの柔軟性と適応性を高めます。"
space_rocketery: "宇宙ロケット工学"
space_rocketery_desc: "第二次世界大戦中にロケットが発明された後、宇宙探査にそれらを使用するという概念が出現し、宇宙ロケット工学の開発につながりました。この分野は、さまざまなミッションのためにロケットと宇宙船を設計、製造、および運用することに焦点を当てています。ドイツのエンジニアであるヴェルナー・フォン・ブラウンによって開発されたV-2ロケットは、宇宙に到達した最初の物体となり、宇宙から地球の最初の写真を提供しました。"
prefabricated_concrete_buildings: "プレハブコンクリート建物"
prefabricated_concrete_buildings_desc: "プレハブコンクリート建物は、オフサイトで製造され、オンサイトで組み立てられるプレキャストコンクリートコンポーネントから作られた構造物です。この建設方法は、建設時間の短縮、人件費の削減、品質管理の向上など、いくつかの利点を提供します。プレハブコンクリート建物は、国によって異なる方法で使用されました。米国では、手頃な価格の住宅や学校を建設するために使用されましたが、ソビエト連邦では、大規模なアパートブロックや産業施設を建設するために使用されました。この方法は、その効率性と持続可能性のために現代の建設でますます人気が高まっており、幸いなことに美学は大幅に改善されました！"
naval_oil_propulsion: "海軍石油推進"
naval_oil_propulsion_desc: "海軍石油推進とは、従来の石炭焚き蒸気機関に代わって、海軍艦艇の燃料源として石油を使用することを指します。この石油動力推進システムへの移行は、速度、航続距離、および運用上の柔軟性を高めることにより、海軍戦争に革命をもたらしました。石油焚き船は、より効率的に運用でき、燃料補給の頻度を減らし、より長い展開を可能にしました。"
rudimental_home_appliances: "基本的な家電" #UPDATED
rudimental_home_appliances_desc: "40年代の家族の家のための基本的な家電" #UPDATED
cabled_wire: "ケーブル線"
cabled_wire_desc: "ケーブル線技術は、家庭や産業における電気配線に革命をもたらし、より安全で効率的な配電を可能にしました。この革新により、照明、暖房、および電化製品への電力供給のための電気の広範な使用が可能になり、生活の質と生産性が大幅に向上しました。"
modular_shipbuilding: "モジュラー造船"
modular_shipbuilding_desc: "アーク溶接構造技術が開発された後、モジュラー造船は海軍建設への革新的なアプローチとして出現しました。この方法では、船のセクションを管理された環境でプレハブ化し、その後オンサイトで組み立てます。モジュラー造船は、建設時間の短縮、品質管理の向上、設計の柔軟性の向上など、いくつかの利点を提供します。これにより、複数のセクションの同時建設が可能になり、全体の造船プロセスが合理化され、海軍艦艇のより迅速な納入が可能になります。"
semi_automatic_rifle: "半自動小銃"
semi_automatic_rifle_desc: "半自動小銃は、発砲ごとに自動的に再装填されますが、各弾を発射するには個別の引き金を引く必要がある銃器です。この設計により、手動式小銃と比較してより速いフォローアップショットが可能になり、全自動火器よりも高い精度と制御を維持できます。この技術は、20年代以降、銃器産業に革命をもたらし、第二次世界大戦で広く使用されたAVS-36やM1ガーランドなどの例があります。半自動小銃は、軍事、法執行機関、および民間のアプリケーションで一般的に使用されています。"
assault_rifles: "アサルトライフル"
assault_rifles_desc: "アサルトライフルは、中間威力ライフルカートリッジ用に装填され、着脱式マガジンを使用するフルレングスのセレクティブファイアライフルです。アサルトライフルは現在、近現代の戦争における標準的な軍用ライフルであり、さまざまな戦闘シナリオでの速射と汎用性のために設計されています。最初の例はSturmgewehr 44で、その後、有名なAK-47とM16が続きました。"
precision_ammunition: "現代弾薬"
precision_ammunition_desc: "現代弾薬は、精度、殺傷力、および信頼性の面で大幅に改善されました。鉛の弾丸は、より高度な材料と設計、例えば、バレル摩耗を減らし、最終弾道特性を改善する鋼またはポリマーコーティングされた弾丸に置き換えられました。さらに、推進剤と薬莢の設計における進歩により、銃口速度が増加し、反動が減少しました。"
cannon_launched_guided_projectiles: "誘導砲弾"
cannon_launched_guided_projectiles_desc: "誘導砲弾は、榴弾砲から発射されたときに精度と有効性を向上させるために誘導システムを利用する高度な弾薬です。これらの発射体は、従来の砲兵システムから発射されるように設計されており、GPS、慣性ナビゲーション、またはレーザー誘導などの誘導技術を組み込んで、戦場での精度と殺傷力を高めています。このような発射体の例には、Excalibur GPS誘導砲弾やM982 Excaliburがあり、これらは長距離で高い精度で標的に命中できます。"
bauxite_processing: "ヴェーラー・ドゥヴィル法"
bauxite_processing_desc: "最初のボーキサイト処理は19世紀に始まりましたが、主要な産業プロセスになったのは20世紀になってからです。バイヤー法以前は、ボーキサイトは主にヴェーラー・ドゥヴィル法を使用して処理されていました。これには、高温炉でボーキサイトを炭素で還元する工程が含まれ、そこからアルミナが得られます。"
bayer_process: "バイヤー法" #UPDATED
bayer_process_desc: "バイヤー法を通じて、より良いアルミニウム生産を可能にします。ボーキサイトから高純度アルミナを抽出し、ホール・エルー法と軽量で耐食性のあるアルミニウムの作成のための重要な基盤を提供します。また、アルミニウム家庭用品は、軽量でありながら堅牢なアルミニウムの最先端の使用によりパラダイムシフトを導入し、日常生活の経験を再構築します。"
circular_economy: "サーキュラーエコノミー"
circular_economy_desc: "サーキュラーエコノミーは、材料の再利用、リサイクル、再生を促進することにより、廃棄物を最小限に抑え、資源を最大限に活用することを目的とした経済モデルです。「採取-製造-廃棄」のパターンに従う従来のリニアエコノミーとは対照的です。サーキュラーエコノミーでは、製品は長寿命、修理可能性、リサイクル性のために設計されており、環境への影響を減らし、資源を節約する閉ループシステムを作成し、採掘や精製などの汚染活動を生産チェーンから取り除くことを可能にします。"
paper_recycling: "紙のリサイクル"
paper_recycling_desc: "鉄やアルミニウムが簡単にリサイクルおよび再利用できるのに対し、紙のリサイクルは、使用済みの紙製品を収集、分別、処理して新しい紙を作成する、より複雑なプロセスです。このプロセスは、バージン木材パルプの需要を減らし、天然資源を節約し、埋め立て地の廃棄物を最小限に抑えるのに役立ちます。紙のリサイクルはまた、エネルギー節約に貢献し、紙の生産に関連する温室効果ガスの排出を削減します。"
plastic_recovery: "プラスチック回収"
plastic_recovery_desc: "プラスチックは、環境とリサイクルシステムの両方にとって悪夢です。その複雑な組成と広範な使用により、効果的にリサイクルすることが困難です。多くの種類のプラスチックはリサイクル施設で受け入れられておらず、大量のプラスチック廃棄物が埋め立て地や海に流れ着いています。プラスチックリサイクルを改善するための取り組みには、プラスチック廃棄物を分別および処理するための新しい技術の開発と、生分解性代替品の利用促進が含まれます。"
mass_entertainment: "マスエンターテイメント"
mass_entertainment_desc: "60年代の間、コミック、漫画、カートゥーン、大ヒット映画などの新しいマスコミュニケーション手段の台頭により、エンターテイメントにおける文化的変化が最も先進的な国で起こり始めました。マスエンターテイメント産業は、社会規範と価値観を形作りながら、世界中の何百万人もの人々に共有された体験を提供する重要な文化的勢力になりました。しかし、放送メディアが主役になったため、演劇やオペラなどの従来のエンターテイメント形式は人気が衰え始めました。"
software_tech: "ソフトウェア" #UPDATED (New information_systems_management)
software_tech_desc: "ソフトウェアとは、コンピューターやデバイスが特定のタスクを実行できるようにするプログラム、データ、および命令の集合を指します。これには、システムソフトウェア、アプリケーションソフトウェア、プログラミング言語など、さまざまなカテゴリが含まれ、現代のコンピューティングにおいて重要な役割を果たしています。" #UPDATED (New information_systems_management)

#NEW 1.4
rocket_artillery: "ロケット砲"
rocket_artillery_desc: "ロケット砲システムは、ロケット推進弾薬を利用して、高い精度で長距離にわたって爆発性のペイロードを運びます。最初の例の1つは、有名なロシアのカチューシャロケットランチャーです。"
rocketery: "ロケット工学" #UPDATED
rocketery_desc: "ロケット工学におけるブレークスルーで宇宙時代に火をつけ、軍事および民間の両方のアプリケーションのための強力で用途の広いロケットの開発を可能にします。"
international_travel: "国際旅行" #UPDATED
international_travel_desc: "50年代以降、航空旅行がよりアクセスしやすく手頃な価格になり、国際観光と文化交流のブームにつながりました。"
molecular_biology: "分子生物学"
molecular_biology_desc: "分子生物学は、分子レベルで生物を研究する生物学の分野であり、特に巨大分子、すなわちタンパク質と核酸(DNAとRNA)間の相互作用に焦点を当てています。分子生物学という用語は、X線結晶学などの分野での大きな進歩のおかげで、分子レベルでの生物学の発展を信じていたロックフェラー財団のディレクターであるウォーレン・ウィーバーによって1938年に遡ります。"
electronic_countermeasures: "ECM"
electronic_countermeasures_desc: "電子対抗策(ECM)は、敵のレーダーやその他の検出システムの有効性を防止または低減するために使用される技術です。これには、信号の妨害、レーダーシステムの欺瞞、検出を回避するためのステルス技術の使用が含まれます。"
icbms: "大陸間弾道ミサイル"
icbms_desc: "大陸間弾道ミサイル(ICBM)は、核弾頭を大陸を越えた標的に運ぶように設計された長距離ミサイルです。これらは、高い精度と速度で標的を攻撃できる、現代の戦略的抑止力の主要なコンポーネントです。"
anti_satellite_weapons: "対衛星兵器"
anti_satellite_weapons_desc: "対衛星兵器(ASAT)は、戦略的な軍事目的のために衛星を無力化または破壊するように設計されています。これらの兵器は、地上、空中、または宇宙を拠点とすることができ、その開発は宇宙の軍事化についての懸念を引き起こしています。"
network_centric_warfare: "ネットワーク中心の戦い"
network_centric_warfare_desc: "ネットワーク中心の戦い(NCW)は、ネットワーク中心の作戦またはネット中心の戦いとも呼ばれ、情報技術によって部分的に可能になった情報の優位性を、分散した部隊のコンピューターネットワーキングを通じて競争上の優位性に変換することを目的とした軍事ドクトリンまたは戦争理論です。これは1990年代に米国国防総省によって開拓されました。"
military_uav: "無人航空機"
military_uav_desc: "無人航空機(UAV)、別名ドローンは、偵察および監視目的で開発されました。これらの先駆的なシステムは、現代の軍事作戦で使用される高度なUAV技術の基礎を築きました。"
ai_warfare: "AI戦争"
ai_warfare_desc: "AI戦争は、軍事技術における大きな進歩を表しており、直接的な人間の制御なしに複数のドローンが連携して動作する協調攻撃と監視ミッションを可能にします。人工知能と機械学習の進歩により、これらのシステムは変化する戦場条件に適応し、複雑な協調戦略を自律的に実行できます。"
precision_strike_doctrine: "精密攻撃ドクトリン"
precision_strike_doctrine_desc: "精密攻撃ドクトリンは、高度なターゲティングおよび誘導システムを使用して、敵部隊およびインフラストラクチャに対する高精度の攻撃を実行することを強調しています。このアプローチは、巻き添え被害を最小限に抑え、軍事作戦の有効性を高めます。"
military_ugv: "無人地上車両"
military_ugv_desc: "無人地上車両(UGV)は、偵察、兵站、戦闘支援などの軍事アプリケーション向けに設計されたロボットシステムです。これらの車両は自律的に動作することも、遠隔操作することもでき、戦場で貴重な機能を提供します。"
electronic_warfare: "電子戦"
electronic_warfare_desc: "電子戦は、複数の対抗策が同時に使用される場合に実際に複雑になり、電子対抗策、電子支援策、および電子攻撃、さらには電子対対抗策のための新しい軍事システムを定義します。これらの技術は、レーダー、通信、ナビゲーションシステムなど、敵の電子システムを混乱させ、欺瞞し、または無力化するために使用されます。電子戦は、状況認識を高め、友軍を保護し、敵の能力を低下させることにより、現代の軍事作戦において重要な役割を果たします。"
directed_energy_weapons: "指向性エネルギー兵器"
directed_energy_weapons_desc: "指向性エネルギー兵器(DEW)は、レーザーやマイクロ波などの集束されたエネルギーを使用して標的に損傷を与えたり破壊したりします。これらの兵器は、精密なターゲティングと最小限の巻き添え被害の可能性を提供するため、現代における軍事作戦にとって魅力的なオプションとなっています。"
cyber_warfare: "サイバー戦争"
cyber_warfare_desc: "サイバー戦争には、国家または組織の活動を妨害するためにデジタル攻撃を使用することが含まれます。これには、情報システムの完全性、機密性、または可用性を侵害することを目的としたハッキング、データ漏洩、およびその他の形式のサイバー攻撃が含まれます。"

high_pressure_grinding_rolls: "高圧粉砕ロール"
high_pressure_grinding_rolls_desc: "高圧粉砕ロール(HPGR)は、鉱業および鉱物処理産業で鉱石を粉砕および研磨するために使用される装置の一種です。これらは、材料に高圧をかけることにより動作し、従来のプロセスと比較してより効率的な粉砕プロセスをもたらします。"
mine_precision_blasting: "精密爆破"
mine_precision_blasting_desc: "鉱山精密爆破技術は、高度な技術と方法論を利用して、採掘作業における爆破プロセスを最適化します。爆破の精度と有効性を改善することにより、これらの技術は資源抽出を強化すると同時に、環境への影響を最小限に抑えます。"
wireless_broadband_networks: "ブロードバンド＆ワイヤレスネットワーク"
wireless_broadband_networks_desc: "ブロードバンドとワイヤレスネットワークは、ともに現代のデジタル通信のバックボーンを形成しています。これらは、高速で信頼性の高いインターネットアクセスを提供するために、光ファイバーや高度なワイヤレスシステムなどの大容量伝送技術に依存しています。Wi-Fiルーターとモデムを備えた家庭内接続から、ワイヤレス標準の世代(1Gから5G)を通じて接続されたモバイルデバイスまで、この統合されたインフラストラクチャは、世界中でシームレスな通信、エンターテイメント、およびビジネス活動を可能にします。"
mobile_phone: "携帯電話"
mobile_phone_desc: "第1世代の携帯電話は、主に音声通信に使用される大きくてかさばるデバイスであり、しばしば「レンガ電話」と呼ばれていました。80年代には、モトローラがこの分野のパイオニアであり、DynaTAC 8000Xなどのモデルを導入しました。これらはアナログネットワークで動作し、今日のスマートフォンと比較して機能が限られていました。90年代には、デジタルネットワークとノキア 1011などのより「コンパクト」なデザインの導入により、携帯電話は急速に進化しました。"
mobile_devices: "モバイルデバイス"
mobile_devices_desc: "モバイルデバイスは、スマートフォン、タブレット、ラップトップなど、幅広いポータブルコンピューティングデバイスを包含します。これらのデバイスは、外出先で情報、通信、エンターテイメントへのアクセスをユーザーに提供し、現代の生活に不可欠なものとなっています。モバイルテクノロジーの急速な進歩により、処理能力が向上し、バッテリー寿命が改善され、アプリケーションのエコシステムが成長しています。"
advanced_water_filtration: "高度な水質浄化"
advanced_water_filtration_desc: "高度な水質浄化技術は、革新的な方法を利用して水を浄化および処理し、清潔で安全な飲料水へのアクセスを確保します。これらのシステムには、汚染物質を除去し、水質を改善するために、逆浸透、活性炭、UV消毒などの多段階ろ過プロセスがしばしば組み込まれています。"
controlled_environment_agriculture: "環境制御型農業"
controlled_environment_agriculture_desc: "環境制御型農業(CEA)とは、制御された環境で植物の成長条件を最適化するために技術を使用することを指します。これには、屋内農業や水耕栽培が含まれ、最小限の資源使用で通年の作物生産を可能にします。"
vertical_farming: "垂直農法"
vertical_farming_desc: "垂直農法は、作物を垂直に積み重ねられた層または構造で栽培する現代の農業慣行であり、しばしば環境制御型農業(CEA)技術を組み込んでいます。この方法は、スペース効率を最大化し、伝統的な農業に必要な土地と水を大幅に削減できます。"
civil_drones: "民間ドローン"
civil_drones_desc: "民間ドローン、別名無人航空機(UAV)は、人間にパイロットが搭乗せずに運用される航空機です。これらは、航空写真、農業、監視、配送サービスなど、さまざまなアプリケーションに使用されます。民間ドローンの使用は、テクノロジーの進歩と生産コストの低下により、2010年代に急速に成長しました。"
oxygen_steelmaking_process: "酸素製鋼法"
oxygen_steelmaking_process_desc: "基本酸素製鋼法(BOF)は、リンツ・ドナウヴィッツ製鋼法または酸素転炉プロセスとも呼ばれ、炭素が豊富な溶融鉄を鋼にする一次製鋼法です。溶融鉄に酸素を吹き込むと、合金の炭素含有量が低下し、低炭素鋼に変化します。このプロセスが「基本」と呼ばれるのは、化学的塩基である酸化カルシウムまたはドロマイトのフラックスが、不純物の除去を促進し、転炉の内張りを保護するために添加されるためです。"
modern_city_transport: "現代の都市交通"
modern_city_transport_desc: "現代の都市交通システムは、都市圏内での効率的な移動を容易にするために設計されたさまざまなモードを包含しています。これには、バス、トラム、地下鉄などの公共交通機関のオプション、および自転車と歩行者のためのインフラストラクチャが含まれます。"
continuous_casting: "連続鋳造"
continuous_casting_desc: "連続鋳造は、溶融鋼を連続鋳型で凝固させることにより、鋼のスラブ、ブルーム、またはビレットを製造するために製鉄業界で使用されるプロセスです。この方法は、従来のプロセスと比較して効率を向上させ、廃棄物を削減します。"
advanced_alloys: "高度な合金"
advanced_alloys_desc: "いいえ、これらのStellarisに触発された合金では、コルベットやサイエンスシップを急いで作り上げて太陽系を調査することはできません…少なくともまだ。それらが実現することは、それに匹敵するほど印象的なことです。チタン合金、リチウム-アルミニウム合金、ニッケル合金、およびそれらの高度な同族体は、軽量で丈夫であり、産業全体を変革しました。航空宇宙から自動車、医療機器に至るまで、これらの材料は、高い強度対重量比、耐食性、さらには生体適合性のおかげで輝きを放ち、耐久性と軽量性が最も重要となるあらゆる場所で不可欠なものとなっています。"
modern_transport: "現代車両" #UPDATED
modern_transport_desc: "第二次世界大戦後、自動車産業は大きな変化を遂げ、安全性、効率性、環境の持続可能性を優先する現代車両の開発につながりました。60年代以降、これらの車両には、燃料噴射、アンチロックブレーキシステム(ABS)、横滑り防止装置(ESC)などの高度な技術が組み込まれています。現代車両は、厳格な安全基準を満たすように設計されており、乗員の保護を強化し、事故を防止するためのエアバッグを備えています。"
synthetic_fraction: "合成精製" #UPDATED
synthetic_fraction_desc: "石炭のみから燃料を作り出す非常に厄介な方法。" #UPDATED
freight_village: "フレイトビレッジ"
freight_village_desc: "フレイトビレッジは、ドライポートまたはインターポートとも呼ばれ、鉄道と道路など、さまざまな輸送モード間の商品の移動を合理化する専門的なロジスティクスハブです。内陸部と港または空港を接続することにより、フレイトビレッジはサプライチェーンを最適化し、貨物輸送の効率を高める上で重要な役割を果たします。"

on_demand_delivery: "オンデマンド配送"
on_demand_delivery_desc: "オンデマンド配送とは、消費者が都合の良いときに、多くの場合短時間で商品やサービスを受け取ることができるロジスティクスモデルを指します。このモデルは、モバイルアプリやリアルタイム追跡システムなどのテクノロジーの進歩によって可能になり、都市部でますます人気が高まっています。"
e_commerce: "Eコマース"
e_commerce_desc: "Eコマースとは、インターネットを介した商品やサービスの売買を指します。これは小売業界を大きく変革し、企業がグローバルな視聴者に到達できるようにし、消費者が自宅にいながら買い物できるようにしました。Eコマースには、B2C、B2B、C2C取引など、さまざまなモデルが含まれ、シームレスな取引を容易にするためにデジタル決済システムとロジスティクスネットワークに依存しています。"
algorithmic_dispatch: "アルゴリズムによる配車"
algorithmic_dispatch_desc: "ソーシャルメディア、製造業、ロジスティクス、アルゴリズムは、あらゆる場所で業務を最適化し、効率を向上させる上でますます重要な役割を果たしています。膨大な量のデータを分析することにより、これらのアルゴリズムは、リアルタイムで意思決定を行い、リソースを割り当て、さまざまな産業にわたるプロセスを合理化できます。"

polyester_synthesis: "ポリエステル合成"
polyester_synthesis_desc: "ポリエステル(PET)は他の合成繊維よりも少し遅れて登場しましたが、その耐久性、しわになりにくさ、手入れのしやすさからすぐに人気を博しました。これは、衣料品、室内装飾品、産業用途、および飲料ボトルに一般的に使用されています。"
precision_agriculture: "精密農業"
precision_agriculture_desc: "精密農業は、技術を利用して農業慣行を監視および最適化する高度な農業管理コンセプトです。GPS、センサー、データ分析を使用することにより、農家は作物の植え付け、施肥、収穫について情報に基づいた意思決定を行うことができ、効率の向上、環境への影響の削減、および収穫量の改善につながります。"

heavy_machinery: "重機"
heavy_machinery_desc: "重機とは、建設、鉱業、農業など、さまざまな産業で使用される大型で強力な機械を指します。これらの機械は、掘削、吊り上げ、重い材料の輸送など、かなりの強度と精度を必要とするタスクを実行するように設計されています。重機を使用することで、効率が向上し、人件費が削減され、安全性が向上することにより、多くの産業に革命がもたらされました。"

neoimperialism: "新帝国主義"
neoimperialism_desc: "新帝国主義とは、直接的な領土征服ではなく、経済的、政治的、文化的な支配を通じて権力と影響力を拡大することを指します。この形態の帝国主義は、20世紀後半に特に顕著になり、旧植民地勢力が貿易、投資、外交を通じて新しく独立した国家に対する権威を維持したネオ植民地主義、および代理戦争、大陸間同盟、勢力圏の確立によって特徴づけられた超大国間の対立によって例示されました。"

smart_appliances: "スマート家電"
smart_appliances_desc: "スマート家電は、インターネットに接続されており、スマートフォンや音声アシスタントを介してリモートで制御できる家庭用デバイスです。最初の例には、スマートテレビ、冷蔵庫、サーモスタットが含まれ、強化された利便性、エネルギー効率、および他のスマートホームシステムとの統合を提供します。これらの家電は、ユーザーの好みから学習し、リアルタイムの更新を提供し、さらにはタスクを自律的に実行できるため、現代のスマートホームに不可欠なものとなっています。"

autonomous_and_remote_ops_mining: "自律・遠隔操作採掘"
autonomous_and_remote_ops_mining_desc: "鉱業における自律・遠隔操作とは、ロボット工学、自律走行運搬トラック、AI、遠隔制御システムなどの高度な技術を使用して、人間の直接的な介入なしに採掘タスクを実行することを指します。このアプローチは、オペレーターが遠隔から機器を制御できるようにすることで、安全性、効率性、および生産性を高め、事故のリスクを減らし、運用精度を向上させます。"

