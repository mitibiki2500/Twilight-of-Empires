l_japanese:
 je_group_tanzimat:0 "ゴートン改革"
 je_group_tanzimat_name:0 "ゴートン改革"
 je_group_tanzimat_desc:0 "ゴートン帝国を近代化し、東トリリアにおける大国としての地位を立て直すための改革群。"

 je_sick_man_main:0 "ゴートン近代化改革"
 je_sick_man_main_name:0 "ゴートン近代化改革"
 je_sick_man_main_reason:0 "ゴートン帝国は広大な領土と旧来の統治制度を抱えている。25年以内に5つの改革項目を達成し、軍制・教育・官僚制・都市化・周辺地域への進出を通じて近代国家としての基盤を築かなければならない。"
 je_sick_man_main_desc:0 "25年以内に5つのゴートン改革を達成する。"

 je_sick_man_syria:0 "ステップ征服"
 je_sick_man_syria_name:0 "ステップ征服"
 je_sick_man_syria_reason:0 "北方と東方に広がるステップを征服し、ゴートンの安全保障と勢力拡大を実現する。ステップ戦略地域の州を5州以上領有する。"
 je_sick_man_syria_desc:0 "ステップ戦略地域の州を5州以上領有し、北方と東方への進出基盤を確保する。"
 je_sick_man_syria_goal:0 "ステップ戦略地域の州を5州以上領有している"

 je_sick_man_egypt:0 "南下政策"
 je_sick_man_egypt_name:0 "南下政策"
 je_sick_man_egypt_reason:0 "南方への進出を進め、外洋への恒久的な足場を築く。天然港または世界的港湾を持つ州を2州以上領有する。"
 je_sick_man_egypt_desc:0 "天然港または世界的港湾を持つ州を2州以上領有し、南方の外洋への出口を確保する。"
 je_sick_man_egypt_goal:0 "天然港または世界的港湾を持つ州を2州以上領有している"

 je_sick_man_economy:0 "都市化"
 je_sick_man_economy_name:0 "都市化"
 je_sick_man_economy_reason:0 "帝国の都市基盤を近代化する。レベル25以上の市街地を1つ保有し、かつ領有州の70%以上に市街地を整備する。"
 je_sick_man_economy_desc:0 "レベル25以上の市街地を1つ保有し、領有州の70%以上に市街地を整備する。"

 je_sick_man_education:0 "教育改革"
 je_sick_man_education_name:0 "教育改革"
 je_sick_man_education_reason:0 "近代国家を支える教育制度と高等教育を整備する。"
 je_sick_man_education_desc:0 "識字率を高め、十分に稼働するレベル5以上の大学を整備する。"

 je_sick_man_separatism:0 "国内統合"
 je_sick_man_separatism_name:0 "国内統合"
 je_sick_man_separatism_reason:0 "帝国内の分離主義を抑え、中央政府による統合を維持する。"
 je_sick_man_separatism_desc:0 "分離運動を抑制し、長期間にわたり国内統合を維持する。"

 je_sick_man_army:0 "陸軍の近代化"
 je_sick_man_army_name:0 "陸軍の近代化"
 je_sick_man_army_reason:0 "200大隊以上の軍を整備し、旧式の軍制から近代的な常備軍へ移行する。"
 je_sick_man_army_desc:0 "200大隊以上を保有し、ナポレオン戦争術を研究し、兵舎の物資不足と旧式編制を解消する。"

 je_sick_man_bureaucracy:0 "官僚改革"
 je_sick_man_bureaucracy_name:0 "官僚改革"
 je_sick_man_bureaucracy_reason:0 "時代遅れの官僚体制を改め、国家運営に必要な行政力を確保する。"
 je_sick_man_bureaucracy_desc:0 "世襲官僚制と旧式の課税制度を改革し、官僚制不足を解消する。"

 je_sick_man_advance:0 "ゴートン近代化改革が1段階進展する"
 finished_sick_man_tt:0 "ゴートン近代化改革はすでに終了している"
 toe_gorton_steppe_conquest_tt:0 "ステップ戦略地域の州を5州以上領有している"
 toe_gorton_southward_policy_tt:0 "天然港または世界的港湾を持つ州を2州以上領有している"
 toe_gorton_urbanization_level_tt:0 "レベル25以上の市街地を保有している"
 toe_gorton_urbanization_coverage_tt:0 "領有州の70%以上に市街地が存在する"
 toe_gorton_complete_five_reforms_tt:0 "5つの「ゴートン改革」ジャーナル記事を完了する"
 sick_man_complete_tt:0 "5つの「ゴートン改革」ジャーナル記事を完了する"
 sick_man_four_tanzimat_tt:0 "5つの「ゴートン改革」ジャーナル記事を完了する"
 sick_man_complete_four_tanzimat_tt:0 "5つの「ゴートン改革」ジャーナル記事を完了する"
 sick_man_goal_tt:0 "5つの「ゴートン改革」ジャーナル記事を完了する"

 # ゴートン改革から呼ばれる旧タンジマートイベントの表示をToE向けに置換。
 tanzimat_events.5.t:0 "反乱の囁き"
 tanzimat_events.5.d:0 "[SCOPE.sState('paranoia_state_scope').GetCityHubName]では、少数派共同体が国外勢力と結託しているという噂が広まり、住民の間に疑心暗鬼が生じている。"
 tanzimat_events.5.f:0 "帝国の統合が揺らぐ時、根拠のない噂でさえ政治を動かす力を持つ。地方当局は秩序維持と住民の信頼の双方を求められている。"
 tanzimat_events.5.a:0 "ただの噂に過ぎない。"
 tanzimat_events.5.b:0 "疑わしい動きを厳しく取り締まれ。"
 tanzimat.5.tt1:0 "強硬な対応は国内の緊張をさらに高める可能性がある。"

 tanzimat_events.9.t:0 "土地登記への抵抗"
 tanzimat_events.9.d:0 "増税と兵役への不安から、[SCOPE.sState('peasant_state').GetName]の農民たちが土地登記を拒んでいる。近代的な行政制度の導入には、地方社会との摩擦が伴っている。"
 tanzimat_events.9.f:0 "代々受け継がれてきた土地を中央政府の帳簿に記すことは、地方の人々にとって単なる事務手続きではない。古い慣習と新しい国家制度が正面から衝突している。"
 tanzimat_events.9.a:0 "地方有力者を利用して登記を進める。"
 tanzimat_events.9.b:0 "[SCOPE.sCharacter('peasant_smashing_general').GetFullName]に秩序回復を任せる。"
 tanzimat_events.9.c:0 "今は介入しない。"

 tanzimat_events.10.t:0 "徴兵制度をめぐる議論"
 tanzimat_events.10.d:0 "軍制改革が進む中、政府は帝国各地の住民にどのように兵役を負担させるか決定しなければならない。"
 tanzimat_events.10.f:0 "近代的な常備軍を維持するには安定した兵員供給が必要だが、地域や身分によって異なる従来の兵役制度を一律に改めることには大きな反発も予想される。"
 tanzimat_events.10.a:0 "一定の負担金による兵役免除を認める。"
 tanzimat_events.10.b:0 "兵役義務をすべての臣民に適用する。"
 draft_exemption_tax:0 "兵役免除負担金"
