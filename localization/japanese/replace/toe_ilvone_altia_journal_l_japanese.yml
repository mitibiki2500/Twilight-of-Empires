l_japanese:
 toe_ilvone_interest_west_ria:0 "西リイアへの関心"
 toe_ilvone_interest_west_ria_desc:0 "イルボネーの海洋的野心は西リイアへ向けられている。この地域に対する権利を主張し、将来の拡張に備える。実行すると悪名が25増加し、西リイア全域への請求権を得る。"
 toe_ilvone_interest_east_ria:0 "東リイアへの関心"
 toe_ilvone_interest_east_ria_desc:0 "イルボネーの海洋的野心は東リイアへ向けられている。この地域に対する権利を主張し、将来の拡張に備える。実行すると悪名が25増加し、東リイア全域への請求権を得る。"

 je_nsm_altia_conquest_sparia:0 "大征服：スパリア"
 je_nsm_altia_conquest_sparia_reason:0 "近代化を遂げたアルティにとって、最初の目標は故郷スパリアの統一である。カナリアを除く周辺諸国を服属させ、アルティの覇権を確立しなければならない。 達成すると、この征服計画の対象州に恒久的な「大征服地の統合」（州編入速度+50%、徴税能力+10%）が付与される。"
 je_nsm_altia_conquest_altia:0 "大征服：アルティア"
 je_nsm_altia_conquest_altia_reason:0 "スパリアを制したアルティの軍勢は、次なる征服先としてアルティアへ向かう。 達成すると、この征服計画の対象州に恒久的な「大征服地の統合」（州編入速度+50%、徴税能力+10%）が付与される。"
 je_nsm_altia_conquest_gorton:0 "大征服：ゴートン"
 je_nsm_altia_conquest_gorton_reason:0 "スパリア統一の先にはゴートン勢力圏が広がっている。東方の大国を打ち破り、その勢力圏をアルティの支配下へ置く。 達成すると、この征服計画の対象州に恒久的な「大征服地の統合」（州編入速度+50%、徴税能力+10%）が付与される。"
 je_nsm_altia_conquest_paido:0 "大征服：パイド"
 je_nsm_altia_conquest_paido_reason:0 "アルティアとゴートンを制した今、次なる大敵はパイドである。パイドとその勢力圏を征服し、大陸の覇権を奪取する。 達成すると、この征服計画の対象州に恒久的な「大征服地の統合」（州編入速度+50%、徴税能力+10%）が付与される。"
 je_nsm_altia_conquest_trilia:0 "大征服：トリリア"
 je_nsm_altia_conquest_trilia_reason:0 "アルティの騎兵と近代軍はついにトリリアへ達した。北・西・中央・南・東トリリアの全土を征服し、旧世界の中心を支配する。 達成すると、この征服計画の対象州に恒久的な「大征服地の統合」（州編入速度+50%、徴税能力+10%）が付与される。"
 je_nsm_altia_conquest_ilvone:0 "大征服：イルボネー"
 je_nsm_altia_conquest_ilvone_reason:0 "大陸を越えた征服の最後には、海洋大国イルボネーが立ちはだかる。その本土を征服し、アルティの大征服を完成させる。 達成すると、この征服計画の対象州に恒久的な「大征服地の統合」（州編入速度+50%、徴税能力+10%）が付与される。"

 toe_altia_conquest_state_integration_bonus:0 "大征服地の統合"
 toe_altia_conquest_state_integration_bonus_desc:0 "アルティの征服計画に基づいて獲得した州。編入速度が50%上昇し、徴税能力が10%上昇する。"

 toe_alti_conquest_claim_cost_desc:0 "各征服計画の開始時に悪名20を受け、その征服対象州への請求権を獲得する。対象州をすべて征服すると、対象州に「大征服地の統合」が恒久的に付与される。"
 toe_alti_gorton_annexation_play:0 "アルティによるゴートン併合"
