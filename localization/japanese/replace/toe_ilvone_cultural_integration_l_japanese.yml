l_japanese:
 toe_ilvone_accept_latin_ria:0 "ラテンリイアとの統合"
 toe_ilvone_accept_latin_ria_desc:0 "人種隔離・文化排斥・多文化のいずれかの市民権法の下で西リイアへ関心を持ち、同地域の編入州を3州以上確保することで、ラテンリイア人をイルボネー国家の主要文化として認める。"
 toe_ilvone_accept_ilvone_lefria:0 "南レフリアとの統合"
 toe_ilvone_accept_ilvone_lefria_desc:0 "文化排斥または多文化の下で南レフリアの編入州を3州以上確保し、南レフリア人とイルボネー系レフリア人を主要文化として認める。"
