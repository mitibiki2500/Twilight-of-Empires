l_japanese:
 je_toe_paido_cultural_integration:0 "パイドの国民統合"
 je_toe_paido_cultural_integration_name:0 "パイドの国民統合"
 je_toe_paido_cultural_integration_reason:0 "広大なパイドでは地方独自の文化が根強く残っている。国家の近代化を進め、各地の母国州を発展させながら諸文化を一つのパイド国家へ統合しなければならない。条件を満たした文化は対応するボタンから統合・伝統付与を行える。"

 toe_paido_integrate_dale_effect_tt:0 "デール文化のPOPをパイド文化へ統合し、パイドの伝統を付与する。"
 toe_paido_integrate_shaftar_effect_tt:0 "シャフタパイド文化のPOPをパイド文化へ統合し、パイドの伝統を付与する。"
 toe_paido_integrate_eskan_effect_tt:0 "エスカン文化のPOPをパイド文化へ統合し、パイドの伝統を付与する。"
 toe_paido_integrate_old_effect_tt:0 "オールドパイド文化のPOPをパイド文化へ統合し、パイドの伝統を付与する。"
 toe_paido_integrate_northern_effect_tt:0 "ノーザンパイド文化のPOPをパイド文化へ統合し、パイドの伝統を付与する。"
 toe_paido_integrate_palun_effect_tt:0 "パルン文化のPOPをパイド文化へ統合し、パイドの伝統を付与する。"
 toe_paido_integrate_balin_effect_tt:0 "バリン文化のPOPをパイド文化へ統合し、パイドの伝統を付与する。"
 toe_paido_tradition_resind_effect_tt:0 "レシンド文化を維持したまま、パイドの伝統を付与する。"
 toe_paido_tradition_prune_effect_tt:0 "プルーン文化を維持したまま、パイドの伝統を付与する。"
 toe_paido_tradition_krikul_effect_tt:0 "クリクル文化を維持したまま、パイドの伝統を付与する。"
 toe_paido_tradition_sosilia_effect_tt:0 "ソシリア文化を維持したまま、パイドの伝統を付与する。"

 je_toe_paido_monarchist_rivalry:0 "対立する君主"
 je_toe_paido_monarchist_rivalry_name:0 "対立する君主"
 je_toe_paido_monarchist_rivalry_reason:0 "パイド王家は近代化を推進する革新派と、旧来の王権と秩序を守ろうとする保守派に分裂している。両派の支持を競わせ、どちらの王統が国家の主導権を握るかを決着させる。"

 divided_monarchists_orleanist_progress_bar:0 "革新派"
 divided_monarchists_orleanist_progress_bar_name:0 "革新派"
 divided_monarchists_orleanist_progress_bar_desc:0 "近代化を支持する君主派。政治的支持に加え、パイド国内の軍事施設の整備によって勢力を伸ばす。"
 divided_monarchists_legitimist_progress_bar:0 "保守派"
 divided_monarchists_legitimist_progress_bar_name:0 "保守派"
 divided_monarchists_legitimist_progress_bar_desc:0 "旧来の王権と秩序を支持する君主派。伝統的な君主主義勢力からの支持によって勢力を維持する。"

 toe_paido_rival_monarchs:0 "対立する君主"
 toe_paido_rival_monarchs_desc:0 "革新派と保守派の二つの王統が主導権を巡って対立している。"
