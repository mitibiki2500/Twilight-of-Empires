l_japanese:
# Military Units

combat_unit_type_modern_mechanized_infantry: "改良型機械化歩兵(MR)"
combat_unit_type_modern_mechanized_infantry_desc: "機動性に優れ、装備の整った部隊であり、迅速な展開と効果的な作戦行動が可能です。"
combat_unit_type_advanced_mechanized_infantry: "現代機械化歩兵(MR)"
combat_unit_type_advanced_mechanized_infantry_desc: "機動性に優れ、装備の整った部隊であり、迅速な展開と効果的な作戦行動が可能です。"

#海兵
combat_unit_type_modern_tier_marines: "改良型海兵隊(MR)"
combat_unit_type_modern_tier_marines_desc: "迅速な上陸と沿岸部での継続的な作戦行動が可能な装備を備えた、専門的な水陸両用部隊"
combat_unit_type_advanced_tier_marines: "現代型海兵隊(MR)"
combat_unit_type_advanced_tier_marines_desc: "高度な装備を駆使し、複雑な水陸両用作戦を展開する精鋭部隊"

#砲兵
combat_unit_type_self_propelled_artillery: "自走砲(MR)"
combat_unit_type_self_propelled_artillery_desc: "移動式プラットフォームに搭載された砲兵装備により、高い機動性と迅速な展開が可能となります。"
combat_unit_type_rocket_artillery: "ロケット砲(MR)"
combat_unit_type_rocket_artillery_desc: "射程と爆発力を高めるため、ロケットを主たる投射物として使用する砲兵兵器です。"
combat_unit_type_modern_heavy_tank: "現代重戦車(MR))"
combat_unit_type_modern_heavy_tank_desc: "戦場において優れた火力と防御力を提供する重装甲・重武装車両です。"

#騎兵
combat_unit_type_modern_light_tanks: "改良型軽戦車(MR)"
combat_unit_type_modern_light_tanks_desc: "偵察と迅速な攻撃を目的に設計された、高速で機動力に優れた装甲車両です。"
combat_unit_type_main_battle_tanks: "現代主力戦車(MR)"
combat_unit_type_main_battle_tanks_desc: "冷戦期を中心とした様々な現代戦闘シナリオにおいて活躍できる、火力・防護性・機動性を兼ね備えた多目的装甲車両です。"


#海軍
combat_unit_type_modern_destroyer: "現代駆逐艦(MR)"
combat_unit_type_modern_destroyer_desc: "対空・対潜・水上戦を目的に設計された、高速で機動性に優れた軍艦です。"
ship_type_modern_cruiser: "現代巡洋艦(MR)"
ship_type_modern_cruiser_desc: "ミサイル兵装、高度な指揮システム、そして外洋航行能力を兼ね備えた長距離水上戦闘艦です。"
ship_type_modern_battleship: "現代戦艦(MR)"
ship_type_modern_battleship_desc: "重装甲、大口径砲、誘導兵器、そして最新の指揮統制システムを搭載した、現代の海戦戦術に通用するよう極限まで改装を施した現代的な戦艦です。"
ship_type_nuclear_carrier: "原子力空母(MR)"
ship_type_nuclear_carrier_desc: "長期間にわたる展開を可能にし、大洋をまたいで空軍力を投射できる現代的な空母です。航続距離をより長くするために#i 原子力推進#!に対応しています。"
ship_type_nuclear_submarine: "原子力潜水艦(MR)"
ship_type_nuclear_submarine_desc: "長時間の水中作戦とステルス作戦を可能にする現代的な潜水艦です。航続距離をより長くするために#i 原子力推進#!に対応しています。"





#動員オプション
tactical_weapons: "戦術兵器(MR)"
mobilization_option_close_air_support: "近接航空支援(MR)"
mobilization_option_close_air_support_desc: "対地兵器を装備した特殊航空機で敵の地上部隊を直接攻撃する。"
mobilization_option_supersonic_close_air_support: "超音速近接航空支援(MR)"
mobilization_option_supersonic_close_air_support_desc: "対地兵器を装備した超音速航空機で敵の地上部隊を直接攻撃する。"
mobilization_option_indirect_air_support: "間接航空支援(MR)"
mobilization_option_indirect_air_support_desc: "様々な爆撃機で敵陣地後方の目標を攻撃し、敵の予備兵力と補給線を混乱させる。"
mobilization_option_supersonic_indirect_air_support: "超音速間接航空支援(MR)"
mobilization_option_supersonic_indirect_air_support_desc: "超音速爆撃機で敵陣後方の目標を攻撃し、敵の予備兵力と補給線を混乱させる。"
mobilization_option_paratroopers: "空挺兵(MR)"
mobilization_option_paratroopers_desc: "敵陣の奥深くにある重要目標を攻撃するためパラシュートを装備した精鋭部隊。"
mobilization_option_guided_missiles: "誘導ミサイル(MR)"
mobilization_option_guided_missiles_desc: "敵目標を精密に攻撃するために使用さる誘導ミサイル。"

extra: "追加支援(MR)"
mobilization_option_helicopters_support: "ヘリコプター(MR)"
mobilization_option_helicopters_support_desc: "ヘリコプターは地上部隊へのを提供し、空挺作戦にも使用できる。
mobilization_option_awacs_support: "AWACS(MR)"
mobilization_option_awacs_support_desc: "AWACS機は偵察に有用であり、作戦の調整に活用できる。"
mobilization_option_satellites_support: "衛星(MR)"
mobilization_option_satellites_support_desc: "衛星は宇宙からの偵察システムであり、作戦の調整に活用できる。"

mobilization_option_penicillin_medical_support: "ペニシリン医療(MR)"
mobilization_option_penicillin_medical_support_desc: "ペニシリンは強力な抗生物質であり、感染症の治療や戦場での人命救助に用いられる。"
 
electronic_support: "電子支援(MR)"
mobilization_option_electronic_countermeasures: "電子的対抗手段"
mobilization_option_electronic_countermeasures_desc: "電子戦は、敵のレーダーや目標捕捉システムから自軍を保護するのに役立つ。"
mobilization_option_electronic_attack: "電子攻撃"
mobilization_option_electronic_attack_desc: "電子攻撃能力により、敵の通信システムや目標捕捉システムを妨害することが可能となる。"
mobilization_option_electronic_support_measures: "電子戦支援"
mobilization_option_electronic_support_measures_desc: "電子戦は、通信と調整の改善を通じて自軍の能力を強化する。"
mobilization_option_electronic_counter_countermeasures: "電子防護"
mobilization_option_electronic_counter_countermeasures_desc: "電子防護は、敵の電子戦から自軍を保護するのに役立つ。"

