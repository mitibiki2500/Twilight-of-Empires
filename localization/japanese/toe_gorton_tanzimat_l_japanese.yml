l_japanese:
 je_sick_man_main:0 "ゴートンの改革"
 je_sick_man_main_reason:0 "ゴートン帝国は広大な領土と旧来の統治制度を抱えている。軍制・教育・官僚制・都市化・周辺地域への進出を進め、近代国家としての基盤を築かなければならない。30年以内に改革項目を4つ達成する。"
 je_sick_man_syria:0 "ステップの征服"
 je_sick_man_syria_reason:0 "北方と東方に広がるステップは、ゴートンの安全保障とさらなる拡張に不可欠である。ステップ戦略地域に属する州を5州以上領有する。"
 je_sick_man_egypt:0 "南下政策"
 je_sick_man_egypt_reason:0 "南方の海への出口を確保し、外洋への恒久的な足場を築く。天然港または世界的港湾の補正を持つ州を2州以上領有する。"
 je_sick_man_economy:0 "都市化"
 je_sick_man_economy_reason:0 "帝国の都市基盤を近代化する。レベル25以上の市街地を1つ保有するか、領有州の70%以上に市街地を持つ。"
 je_sick_man_education:0 "教育改革"
 je_sick_man_education_reason:0 "近代国家を支える教育制度と高等教育を整備する。"
 je_sick_man_separatism:0 "国内統合"
 je_sick_man_separatism_reason:0 "帝国内の分離主義を抑え、中央政府による統合を維持する。"
 je_sick_man_army:0 "軍制改革"
 je_sick_man_army_reason:0 "旧式の軍制を改め、近代的な常備軍を整備する。"
 je_sick_man_bureaucracy:0 "官僚制改革"
 je_sick_man_bureaucracy_reason:0 "時代遅れの官僚体制を改め、国家運営に必要な行政力を確保する。"
 toe_gorton_steppe_conquest_tt:0 "ステップ戦略地域の州を5州以上領有している"
 toe_gorton_southward_policy_tt:0 "天然港または世界的港湾を持つ州を2州以上領有している"
 toe_gorton_urbanization_level_tt:0 "レベル25以上の市街地を保有している"
 toe_gorton_urbanization_coverage_tt:0 "領有州の70%以上に市街地が存在する"
