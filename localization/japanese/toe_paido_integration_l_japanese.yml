 je_toe_paido_monarchist_rivalry:0 "対立する君主"
 je_toe_paido_monarchist_rivalry_reason:0 "パイド王家は近代化を推し進める§Y革新派§!と、旧来の秩序を守ろうとする§Y保守派§!に分裂している。革新派は従来の支持条件に加えて、国内の兵舎と海軍基地の施設レベルによって勢力を伸ばす。保守派は従来のレジティミスト系統の支持条件を維持する。ボナパルティスト派閥はこの対立には存在しない。"
 toe_paido_rival_monarchs:0 "対立君主"

 # パイドでは既存フランス用の2本のバーを二派閥として再利用する。
 divided_monarchists_orleanist_progress_bar:0 "革新派"
