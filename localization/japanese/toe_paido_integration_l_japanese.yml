 toe_paido_people:0 "パイドのパイド人"
 toe_paido_people_desc:0 "達成した文化1つにつき、同化+4%、社会研究+2.5%、社会研究普及+2.5%、威信+2%。10年間有効。"
 toe_paido_integration_failure:0 "国民統合の失敗"
 toe_paido_integration_failure_desc:0 "国民統合を期限内に成し遂げられなかった。10年間、同化-20%、威信-20%。"

 je_toe_paido_monarchist_rivalry:0 "対立する君主"
 je_toe_paido_monarchist_rivalry_reason:0 "パイド王家は近代化を推し進める革新派と、旧来の秩序を守ろうとする保守派に分裂している。革新派は従来の支持条件に加えて国内の軍事施設によって勢力を伸ばし、保守派は伝統的な王権と旧秩序を支持する。"
 toe_paido_rival_monarchs:0 "対立君主"
 toe_paido_rival_monarchs_desc:0 "革新派と保守派の君主が王権を巡って対立し、国内政治を不安定化させている。"

 # パイドでは既存フランス用の2本のバーを二派閥として再利用する。
 divided_monarchists_orleanist_progress_bar:0 "革新派"
 divided_monarchists_orleanist_progress_bar_name:0 "革新派"
 divided_monarchists_orleanist_progress_bar_desc:0 "近代化を支持する君主派。既存のオルレアン派の支持要因に加え、パイド国内の兵舎・海軍基地レベルが毎月進捗へ加算される。"
 divided_monarchists_legitimist_progress_bar:0 "保守派"
 divided_monarchists_legitimist_progress_bar_name:0 "保守派"
 divided_monarchists_legitimist_progress_bar_desc:0 "旧来の王権と秩序を支持する君主派。既存のレジティミスト派の支持要因を維持する。"

