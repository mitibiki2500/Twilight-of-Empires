 je_toe_paido_cultural_integration:0 "パイドの国民統合"
 je_toe_paido_cultural_integration_reason:0 "広大なパイドでは地方独自の文化が根強く残っている。国家の近代化を推し進め、各地の母国州を開発しながら、諸文化を一つのパイド国家へ統合しなければならない。各文化の条件を満たした後、対応するボタンから統合を進める。必須文化をすべて統合した後も、任意文化の達成を狙うため完了時期は自由に選べる。"

