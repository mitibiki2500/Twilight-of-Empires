 je_toe_paido_cultural_integration:0 "パイドの国民統合"
 je_toe_paido_cultural_integration_reason:0 "広大なパイドでは地方独自の文化が根強く残っている。国家の近代化を推し進め、各地の母国州を開発しながら、諸文化を一つのパイド国家へ統合しなければならない。\n\n§Y必須文化§!\n・§Yデール§!：母国の農業施設合計50以上、食品産業10以上\n・§Yシャフタパイド§!：母国の鉱山施設合計20以上、工具工房5以上\n・§Yエスカン§!：母国の農園合計20以上、工業施設合計5以上\n・§Yオールドパイド§!：母国の工業施設合計10以上、鉱業施設合計5以上\n・§Yノーザンパイド§!：母国の農業施設合計15以上\n・§Yパルン§!：母国の金鉱山3以上、鉱業施設合計5以上\n\n§Y任意文化§!\n・§Yレシンド§!：母国の造船所5以上、平均受容50以上\n・§Yプルーン§!：母国の農園10以上、平均受容50以上\n・§Yクリクル§!：母国の牧場15以上、平均受容50以上\n・§Yソシリア§!：ソシリアGDP600万以上、ソシリアとの関係50以上\n・§Yバリン§!：母国の武器産業5以上、工業施設合計5以上\n\n必須文化の条件をすべて達成し、§Y民族主義§!を研究、パイド文化の熱意60以上、教育制度Lv2以上になると、好きなタイミングで国民統合を完了できる。任意文化を待つほど最終報酬は強化される。"

 toe_paido_finish_integration_button:0 "国民統合を完了する"
 toe_paido_finish_integration_button_desc:0 "必須文化の統合、民族主義、パイド文化の熱意60以上、教育制度Lv2以上を満たした後、任意のタイミングで国民統合を完了する。未達成の任意文化は以後達成できなくなるため、報酬を最大化したい場合は先に統合を進めること。"

