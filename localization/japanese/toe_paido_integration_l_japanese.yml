 divided_monarchists_orleanist_progress_bar_desc:0 "近代化を支持する君主派。既存のオルレアン派の支持要因に加え、パイド国内の兵舎・海軍基地レベルが毎月進捗へ加算される。"
 divided_monarchists_legitimist_progress_bar:0 "保守派"
 divided_monarchists_legitimist_progress_bar_name:0 "保守派"
 divided_monarchists_legitimist_progress_bar_desc:0 "旧来の王権と秩序を支持する君主派。既存のレジティミスト派の支持要因を維持する。"

