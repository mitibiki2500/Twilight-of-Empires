l_japanese:
 law_toe_nomadism:0 "遊牧"
 law_toe_nomadism_desc:0 "定住農地の私有よりも草原・家畜・騎馬共同体を重視する土地制度。自給農では自作農制型の製法を用い、百姓農民と貴族は軍部に強く引き寄せられる。"
 toe_nomadism_aristocrats_af_tt:0 "百姓農民と貴族POPの軍部への魅力度：#p +50#!"
 TOE_NOMADISM_ARMED_FORCES_ATTRACTION:0 "遊牧社会の軍事的伝統"
 toe_nomadism:0 "遊牧"
 toe_nomadism_desc:0 "草原での放牧、季節移動、騎馬社会を体系化した第I段階の社会技術。通常研究はできず、クリクル文化国家・大ジュズ・グルーグのみ開始時から保有する。牧場の生産性を高め、遊牧法を解禁する。"
 toe_gun_mangudai:0 "銃騎マングダイ"
 toe_gun_mangudai_desc:0 "騎射の伝統に小火器運用を融合した第I段階の軍事技術。通常研究はできず、アルティのみ開始時から保有する。銃騎マングダイを解禁し、その攻撃力を高める。"
 combat_unit_type_toe_gun_mangudai:0 "銃騎マングダイ"
 combat_unit_type_toe_gun_mangudai_desc:0 "騎射の機動力と小火器火力を組み合わせたアルティの精鋭騎兵。高速な占領と高い殺傷力・士気打撃力を持つ。"
 amendment_toe_alti_station_system:0 "駅伝制の改善"
 amendment_toe_alti_station_system_desc:0 "任命制官僚のもとで駅伝網を制度化し、行政命令・徴税情報・公文書の伝達を高速化するアルティ固有の法修正。"
 toe_great_game_victory:0 "グレートゲームの勝者"
 toe_great_game_victory_desc:0 "長期にわたる勢力圏競争で優位を確立した。"
