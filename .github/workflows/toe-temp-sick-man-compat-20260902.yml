name: ToE ゴートン病人JE互換修正（一時）

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix-sick-man:
    if: github.event.head_commit.message == 'ゴートン病人JEの史実オスマン参照を除去する一時ワークフローを追加'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 分離主義失敗時のオスマン史実危機フックだけ除去
        shell: python
        run: |
          from pathlib import Path
          p = Path('common/journal_entries/00_sick_man.txt')
          text = p.read_text(encoding='utf-8-sig')
          old = '''\ton_fail = {\n\t\tset_variable = failed_sick_man_separatism\n\t\tif = { #failure immediately triggers eastern_crisis\n\t\t\tlimit = {\n\t\t\t\tc:TUR ?= this\n\t\t\t\thas_dlc_feature = ip3_content\n\t\t\t\tNOT = {\n\t\t\t\t\thas_global_variable = eastern_crisis_happened\n\t\t\t\t}\n\t\t\t}\n\t\t\tadd_contextless_journal_entry = je_great_eastern_crisis\n\t\t}\n\t}\n'''
          new = '''\ton_fail = {\n\t\t# ToEではオスマン帝国/TURと史実Great Eastern Crisisを使用しない。\n\t\t# ゴートン固有の失敗状態だけを保持する。\n\t\tset_variable = failed_sick_man_separatism\n\t}\n'''
          if text.count(old) != 1:
              raise RuntimeError(f'対象ブロック数が想定外: {text.count(old)}')
          text = text.replace(old, new)
          # ToE固有JEを保持し、史実オスマン参照だけ消えたことを確認。
          assert 'je_sick_man_main' in text
          assert 'STATE_NSM_041' in text
          assert 'toe_gorton_sick_man_of_europe' in text
          assert 'c:TUR' not in text
          assert 'je_great_eastern_crisis' not in text
          p.write_text('\ufeff' + text, encoding='utf-8')
      - name: 差分検証
        run: |
          git diff --check
          git diff -- common/journal_entries/00_sick_man.txt
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common/journal_entries/00_sick_man.txt
          git commit -m "ゴートン病人JEから史実オスマン危機参照を除去"
          git push
