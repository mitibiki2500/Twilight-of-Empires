name: ToE グレートゲーム・イルボネー・残バグ監査（一時）

on:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  audit:
    if: github.event.head_commit.message == 'グレートゲーム・イルボネー・残バグ監査用の一時ワークフローを追加'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 文化・グレートゲーム・アルティ・威信財を監査
        run: |
          echo '=== 南レフリア culture/localization ==='
          grep -RIn --exclude-dir=.git -E '南レフリア|south_lefria|South Lefria' common localization | head -200 || true
          echo '=== Great Game localization/JE keys ==='
          grep -RIn --exclude-dir=.git -E 'toe_gg_|great_game|大ステップ|ソシリアの保護|平原の平定|大陸間航路|リイアから|東フーション' localization common/journal_entries | head -400 || true
          echo '=== Altia initiator ==='
          nl -ba common/on_actions/99_toe_alti_conquest_ai.txt | sed -n '1,120p'
          nl -ba common/scripted_buttons/99_toe_alti_conquest_buttons.txt | sed -n '1,120p'
          echo '=== prestige silk ==='
          grep -RIn -B5 -A8 'base_good = silk' common/prestige_goods || true
          echo '=== on_actions files ==='
          ls -la common/on_actions || true
