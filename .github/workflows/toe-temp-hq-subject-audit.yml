name: ToE HQ and subject audit
on:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  audit:
    if: github.event.head_commit.message == 'Audit XBC XBH HQ and subjects current main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def bend(t,b):
              d=0
              for i in range(b,len(t)):
                  if t[i]=='{': d+=1
                  elif t[i]=='}':
                      d-=1
                      if d==0:return i+1
              raise RuntimeError('unclosed')

          # Map every state to strategic region.
          state_to_sr={}
          for p in Path('common/strategic_regions').rglob('*.txt'):
              tx=p.read_text(encoding='utf-8-sig')
              for sm in re.finditer(r'(?m)^\s*(region_nsm_[A-Za-z0-9_]+)\s*=\s*\{',tx):
                  b=tx.find('{',sm.start()); e=bend(tx,b); blk=tx[sm.start():e]
                  for sid in re.findall(r'STATE_NSM_\d+',blk): state_to_sr[sid]=sm.group(1)

          for tag in ['XBC','XBH']:
              print('===',tag,'NAVAL BUILDINGS / OWNED BUILDING BLOCKS ===')
              for p in Path('common/history/buildings').glob('*.txt'):
                  tx=p.read_text(encoding='utf-8-sig')
                  for sm in re.finditer(r'(?m)^\s*s:(STATE_NSM_\d+)\s*=\s*\{',tx):
                      b=tx.find('{',sm.start()); e=bend(tx,b); blk=tx[sm.start():e]; sid=sm.group(1)
                      if (f'region_state:{tag}' in blk or f'country="c:{tag}"' in blk or f'country = "c:{tag}"' in blk) and ('building_naval_administration' in blk or 'building_port' in blk):
                          print(p,sid,'SR=',state_to_sr.get(sid),'naval_admin=',blk.count('building_naval_administration'),'port=',blk.count('building_port'))
                          print('  ', ' | '.join(x.strip() for x in blk.splitlines()[:12]))

          print('=== FORMATIONS XBC/XBH ===')
          for p in Path('common/history/military_formations').glob('*.txt'):
              tx=p.read_text(encoding='utf-8-sig')
              for tag in ['XBC','XBH']:
                  for m in re.finditer(r'(?m)^\s*c:'+tag+r'\s*\?=\s*\{',tx):
                      b=tx.find('{',m.start()); e=bend(tx,b); print(p,tag,tx[m.start():e])

          print('=== SUBJECT / DIPLOMATIC REFERENCES ===')
          keys=['XAZ','XBW','MVA','KSO','KTO','PPT','PTK']
          for p in Path('common/history').rglob('*.txt'):
              if 'buildings' in p.parts or 'military_formations' in p.parts: continue
              tx=p.read_text(encoding='utf-8-sig')
              if any(k in tx for k in keys) and any(w in tx for w in ['vassal','puppet','subject','create_diplomatic_pact','create_diplomatic_relation']):
                  print('FILE',p)
                  for i,l in enumerate(tx.splitlines(),1):
                      if any(k in l for k in keys) or 'vassal' in l or 'puppet' in l or 'subject' in l:
                          print(i,l.strip())
          PY
