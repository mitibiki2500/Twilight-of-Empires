name: ToE duplicate gold potential audit
on:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  audit:
    if: github.event.head_commit.message == 'Audit duplicate gold potentials'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan state regions for repeated gold potential declarations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          names=['北米51','北米2','バイゼル','コーサル','パルン','東欧78','東欧76','北阿4','南レフリア東島','西亜3','西亜24','西亜68','東亜7','東亜2','東亜5','豪31','豪34','豪40','豪36']
          def bend(t,b):
              d=0
              for i in range(b,len(t)):
                  if t[i]=='{': d+=1
                  elif t[i]=='}':
                      d-=1
                      if d==0:return i+1
              return len(t)
          hits=[]
          for p in Path('map_data/state_regions').glob('*.txt'):
              tx=p.read_text(encoding='utf-8-sig')
              # top-level STATE_NSM blocks
              for m in re.finditer(r'(?m)^\s*(STATE_NSM_[A-Za-z0-9_]+)\s*=\s*\{',tx):
                  b=tx.find('{',m.start()); e=bend(tx,b); block=tx[m.start():e]
                  # comments/names
                  first=' '.join(x.strip() for x in block.splitlines()[:4])
                  gold=len(re.findall(r'building_gold_mine',block))
                  goldf=len(re.findall(r'building_gold_fields',block))
                  if gold>1 or goldf>1:
                      hits.append((str(p),m.group(1),gold,goldf,first))
                  if any(n in block for n in names):
                      print('TARGET',p,m.group(1),'gold_mine=',gold,'gold_fields=',goldf,first)
                      for line in block.splitlines():
                          if 'gold' in line.lower() or any(n in line for n in names): print('  ',line.strip())
          print('=== ALL DUPLICATE GOLD REFS ===')
          for x in hits: print(x)
          print('COUNT',len(hits))
          PY
