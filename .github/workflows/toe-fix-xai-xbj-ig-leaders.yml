name: ToE fix XAI XBJ IG leaders

on:
  push:
    paths:
      - '.github/workflows/toe-fix-xai-xbj-ig-leaders.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Convert only XAI/XBJ starting IG leaders to templates and restore vanilla IG leader events
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, urllib.request

          hist = Path('common/history/characters/00_nsm_characters.txt')
          s = hist.read_text(encoding='utf-8-sig')
          original = s
          template_chunks = []

          def convert_country(text, tag):
              marker = f'\tc:{tag} ?= {{'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'{tag} block not found')
              # blocks in this file are simple one-level country blocks; find the next country marker
              next_m = re.search(r'\n\tc:[A-Z0-9]+ \?= \{', text[start+len(marker):])
              end = start + len(marker) + (next_m.start() if next_m else len(text[start+len(marker):]))
              block = text[start:end]
              lines = block.splitlines()
              out = []
              n = 0
              for line in lines:
                  if 'create_character = {' in line and 'ig_leader = yes' in line:
                      n += 1
                      m = re.search(r'create_character\s*=\s*\{\s*(.*?)\s*\}\s*$', line)
                      if not m:
                          raise SystemExit(f'cannot parse {tag} leader line: {line}')
                      body = m.group(1)
                      # Strip create_character-only explicit ruler=no; preserve ruler=yes when present.
                      body = re.sub(r'\s+ruler\s*=\s*no\b', '', body)
                      # The template itself owns IG leadership in current vanilla style.
                      body = re.sub(r'\s+ig_leader\s*=\s*yes\b', '', body)
                      name = f'TOE_{tag}_START_IG_{n:02d}'
                      fields = re.findall(r'(first_name|last_name|culture|interest_group|ideology|ruler)\s*=\s*("[^"]*"|[^\s]+)', body)
                      if not fields:
                          raise SystemExit(f'no fields parsed for {name}')
                      d = {k:v for k,v in fields}
                      for req in ('first_name','last_name','culture','interest_group','ideology'):
                          if req not in d:
                              raise SystemExit(f'{name} missing {req}: {body}')
                      chunk = [f'{name} = {{',
                               f'    first_name = {d["first_name"]}',
                               f'    last_name = {d["last_name"]}',
                               '    historical = yes',
                               f'    culture = {d["culture"]}',
                               f'    interest_group = {d["interest_group"]}',
                               f'    ideology = {d["ideology"]}',
                               '    ig_leader = yes']
                      if d.get('ruler') == 'yes':
                          chunk.append('    ruler = yes')
                      chunk.append('}')
                      template_chunks.append('\n'.join(chunk))
                      indent = line[:len(line)-len(line.lstrip())]
                      out.append(f'{indent}create_character = {{ template = {name} }}')
                  else:
                      out.append(line)
              if n != 8:
                  raise SystemExit(f'{tag}: expected 8 IG leaders, found {n}')
              new_block = '\n'.join(out)
              return text[:start] + new_block + text[end:]

          s = convert_country(s, 'XAI')
          s = convert_country(s, 'XBJ')
          if s.count('TOE_XAI_START_IG_') != 8 or s.count('TOE_XBJ_START_IG_') != 8:
              raise SystemExit('template call count mismatch')
          if s.count('{') != s.count('}'):
              raise SystemExit('history braces unbalanced')
          hist.write_text('\ufeff' + s, encoding='utf-8')

          tpl = Path('common/character_templates/99_toe_xai_xbj_starting_ig_leaders.txt')
          tpl_text = '# ToE 1.13 compatibility: XAI/XBJ starting IG leaders use character templates, matching current vanilla history style.\n\n' + '\n\n'.join(template_chunks) + '\n'
          if len(template_chunks) != 16:
              raise SystemExit(f'expected 16 templates, got {len(template_chunks)}')
          if tpl_text.count('ig_leader = yes') != 16:
              raise SystemExit('template leader flag count mismatch')
          tpl.write_text('\ufeff' + tpl_text, encoding='utf-8')

          # events is a replace_path in ToE; restore the vanilla IG leader event namespace that current on_actions reference.
          url = 'https://raw.githubusercontent.com/settintotrieste/V3-Vanilla-Extract/fa9678c4f570385ccb91bcdf1e25f82f93499b2f/game/events/ig_leaders.txt'
          data = urllib.request.urlopen(url, timeout=30).read()
          ev = Path('events/ig_leaders.txt')
          ev.write_bytes(data)
          ev_text = data.decode('utf-8-sig')
          for event_id in ('ig_leaders.3','ig_leaders.4','ig_leaders.5','ig_leaders.6','ig_leaders.20'):
              if event_id not in ev_text:
                  raise SystemExit(f'missing {event_id} in restored events')

          print('XAI/XBJ leader history converted:', 16)
          print('templates generated:', len(template_chunks))
          print('ig_leaders namespace restored:', 'namespace = ig_leaders' in ev_text)
          PY

          git config user.name 'mitibiki2500'
          git config user.email '100456694+mitibiki2500@users.noreply.github.com'
          git add common/history/characters/00_nsm_characters.txt common/character_templates/99_toe_xai_xbj_starting_ig_leaders.txt events/ig_leaders.txt
          git diff --cached --stat
          git diff --cached --numstat
          # Guard against another broad rewrite: history should only have 16 changed lines.
          python3 - <<'PY'
          import subprocess
          out=subprocess.check_output(['git','diff','--cached','--numstat'],text=True)
          print(out)
          for line in out.splitlines():
              a,d,p=line.split('\t')
              if p=='common/history/characters/00_nsm_characters.txt' and (int(a)>20 or int(d)>20):
                  raise SystemExit(f'history diff too broad: +{a}/-{d}')
          PY
          git commit -m 'XAIとXBJの開始IG指導者生成を1.13方式へ修正'
          git push origin main
