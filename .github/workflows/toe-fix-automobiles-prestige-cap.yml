name: ToE fix automobiles prestige cap

on:
  push:
    paths:
      - '.github/workflows/toe-fix-automobiles-prestige-cap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Move disabled Ford automobiles out of automobiles cap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('common/prestige_goods/00_prestige_goods.txt')
          s=p.read_text(encoding='utf-8-sig')
          pat=r'(prestige_good_ford_automobiles\s*=\s*\{.*?base_good\s*=\s*)automobiles'
          s2,n=re.subn(pat,r'\1opium # ToE: 無効化済み定義をautomobiles上限から退避',s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'ford replacement count={n}')
          p.write_text('\ufeff'+s2,encoding='utf-8')
          count=0
          for q in Path('common/prestige_goods').glob('*.txt'):
              count += len(re.findall(r'base_good\s*=\s*automobiles\b',q.read_text(encoding='utf-8-sig',errors='ignore')))
          if count!=3: raise SystemExit(f'automobiles count={count}')
          print('automobiles prestige definitions:',count)
          PY
          git config user.name 'mitibiki2500'
          git config user.email '100456694+mitibiki2500@users.noreply.github.com'
          git add common/prestige_goods/00_prestige_goods.txt
          git diff --cached --numstat
          git commit -m 'automobiles威信財の上限超過を解消'
          git push origin main
