name: ToE Latest Crash Audit Commit
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '_audit/latest_crash_audit.txt'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit latest crash
        run: |
          mkdir -p _audit
          python scripts/toe_latest_crash_audit.py > _audit/latest_crash_audit.txt
      - name: Commit audit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _audit/latest_crash_audit.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '一時最新クラッシュ監査結果'
          git push
