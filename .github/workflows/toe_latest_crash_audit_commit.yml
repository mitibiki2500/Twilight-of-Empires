name: ToE Latest Crash Audit Commit
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '_audit/**'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit latest crash
        run: |
          mkdir -p _audit
          python scripts/toe_latest_crash_audit.py > _audit/latest_crash_audit.txt
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('gpt送信用/crashes')
          latest=sorted([p for p in root.iterdir() if p.is_dir()])[-1]
          lines=(latest/'logs/error.log').read_text(encoding='utf-8-sig',errors='replace').splitlines()
          Path('_audit/latest_crash_top.txt').write_text('\n'.join(f'{i+1}: {x}' for i,x in enumerate(lines[:1000]))+'\n',encoding='utf-8')
          Path('_audit/latest_crash_tail.txt').write_text('\n'.join(f'{i+1+max(0,len(lines)-1000)}: {x}' for i,x in enumerate(lines[-1000:]))+'\n',encoding='utf-8')
          pats=['Assertion failed','Failed to find country','Failed to scope to journal entry type','Harbor travel node','Cannot connect state adjacency','Invalid database object','Event not found','Modifier type definition','Script system error','Could not get leader','unset scope','Unknown trigger','Unexpected token','non-land','fortification','land reform']
          hits=[]
          for i,x in enumerate(lines,1):
              if any(p.lower() in x.lower() for p in pats): hits.append(f'{i}: {x}')
          Path('_audit/latest_crash_matches.txt').write_text('\n'.join(hits)+'\n',encoding='utf-8')
          PY
      - name: Commit audit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _audit/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '一時最新クラッシュ監査結果分割'
          git push
