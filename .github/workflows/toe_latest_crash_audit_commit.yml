name: ToE Latest Crash Audit Commit
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '_audit/**'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit latest crash
        run: |
          mkdir -p _audit
          python scripts/toe_latest_crash_audit.py > _audit/latest_crash_audit.txt
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re
          root=Path('gpt送信用/crashes')
          latest=sorted([p for p in root.iterdir() if p.is_dir()])[-1]
          lines=(latest/'logs/error.log').read_text(encoding='utf-8-sig',errors='replace').splitlines()
          pats=['Assertion failed','Failed to find country','Failed to scope to journal entry type','Harbor travel node','Cannot connect state adjacency','Invalid database object','Event not found','Modifier type definition','Script system error','Could not get leader','unset scope','Unknown trigger','Unexpected token','non-land','fortification','land reform']
          out=[f'LATEST={latest.name}',f'LINES={len(lines)}','']
          for pat in pats:
              hits=[(i+1,x) for i,x in enumerate(lines) if pat.lower() in x.lower()]
              out.append(f'[{pat}] COUNT={len(hits)}')
              for i,x in hits[-20:]: out.append(f'{i}: {x}')
              out.append('')
          out.append('[TAIL100]')
          out.extend(f'{i+1+max(0,len(lines)-100)}: {x}' for i,x in enumerate(lines[-100:]))
          Path('_audit/latest_crash_summary.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          blocks=[]
          countries=Counter(); jes=Counter()
          i=0
          while i < len(lines):
              if 'Script system error!' in lines[i]:
                  block=[lines[i]]; i+=1
                  while i < len(lines) and len(block)<8:
                      block.append(lines[i])
                      if 'Script location:' in lines[i]: break
                      i+=1
                  blocks.append(block); continue
              m=re.search(r'Failed to find country! Country: (\\S+)',lines[i])
              if m: countries[m.group(1)]+=1
              m=re.search(r"Failed to scope to journal entry type '([^']+)'",lines[i])
              if m: jes[m.group(1)]+=1
              i+=1
          focus=[f'LATEST={latest.name}',f'SCRIPT_ERROR_BLOCKS={len(blocks)}','']
          for n,b in enumerate(blocks,1): focus.append(f'--- SCRIPT ERROR {n} ---'); focus.extend(b); focus.append('')
          focus.append('--- MISSING COUNTRIES ---'); focus.extend(f'{k} x{v}' for k,v in sorted(countries.items()))
          focus.append('--- MISSING JOURNAL ENTRIES ---'); focus.extend(f'{k} x{v}' for k,v in sorted(jes.items()))
          Path('_audit/latest_crash_focus.txt').write_text('\n'.join(focus)+'\n',encoding='utf-8')
          # Extract source context for every log-proven missing-country/JEs and the two script errors.
          targets=set(countries); je_targets=set(jes)
          context=[]
          roots=[Path('common'),Path('events')]
          for base in roots:
              for p in base.rglob('*.txt'):
                  try: src=p.read_text(encoding='utf-8-sig',errors='strict').splitlines()
                  except Exception: continue
                  for n,line in enumerate(src):
                      if any(re.search(rf'\\bc:{re.escape(t)}\\b',line) for t in targets) or any(t in line for t in je_targets):
                          context.append(f'### {p.as_posix()}:{n+1}')
                          for j in range(max(0,n-3),min(len(src),n+4)): context.append(f'{j+1}: {src[j]}')
                          context.append('')
          p=Path('common/journal_entries/05_montenegro_je.txt')
          if p.exists():
              src=p.read_text(encoding='utf-8-sig',errors='strict').splitlines()
              for n in [183,198]:
                  context.append(f'### {p.as_posix()}:{n+1}')
                  for j in range(max(0,n-5),min(len(src),n+8)): context.append(f'{j+1}: {src[j]}')
                  context.append('')
          Path('_audit/latest_crash_context.txt').write_text('\n'.join(context)+'\n',encoding='utf-8')
          PY
      - name: Commit audit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _audit/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '一時クラッシュ参照コンテキスト更新'
          git push
