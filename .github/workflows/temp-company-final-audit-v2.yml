name: Temporary final company audit fixes v2

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/temp-company-final-audit-v2.yml' ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Apply corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def block(text,name):
              s=text.find(name+' = {')
              if s<0: raise RuntimeError(name)
              o=text.find('{',s); d=0
              for i in range(o,len(text)):
                  d += (text[i]=='{')-(text[i]=='}')
                  if d==0: return s,i+1,text[s:i+1]
              raise RuntimeError('unbalanced '+name)

          def mutate(path,name,fn):
              p=Path(path); t=p.read_text(encoding='utf-8-sig').replace('\r\n','\n').replace('\r','\n')
              a,b,x=block(t,name); y=fn(x)
              if x==y: raise RuntimeError('no change '+name)
              p.write_text(t[:a]+y+t[b:],encoding='utf-8-sig',newline='\n')

          west='common/company_types/00_nsm_WestEurope_companies.txt'
          east='common/company_types/00_nsm_EastEurope_companies.txt'
          north='common/company_types/00_nsm_NorthAmerica_companies.txt'

          mutate(west,'company_nsm_tg_corp',lambda x: x.replace('building_textile_mill\n\t}', 'building_textile_mill\n\t\tbuilding_dye_plantation\n\t}',1))
          mutate(west,'company_nsm_falantier',lambda x: x.replace('building_glassworks_throughput_add = 0.1','goods_output_glass_mult = 0.1',1))
          mutate(west,'company_nsm_weller',lambda x: x.replace('building_coal_mine_throughput_add = 0.15','goods_output_coal_mult = 0.15',1))
          mutate(east,'company_nsm_west_paido',lambda x: x.replace('building_iron_mine_throughput_add = 0.1\n\t\tbuilding_coal_mine_throughput_add = 0.1','building_group_bg_mining_throughput_add = 0.1',1))
          mutate(north,'company_nsm_corn_major',lambda x: re.sub(r'(?m)^([ \t]*)building_chemical_plant\s*\n','',x,count=1))

          # Restore readable indentation around only the company ownership blocks added in the prior commit.
          for path in ['common/history/buildings/00_NorthRia.txt','common/history/buildings/02_WestEurope.txt','common/history/buildings/06_WestAsia.txt']:
              p=Path(path); t=p.read_text(encoding='utf-8-sig').replace('\r\n','\n').replace('\r','\n')
              t=re.sub(r'(?m)^\tcompany=\{\n\t\ttype=(company_nsm_(?:riimeus|corn_major|machida|ilbone_fisheries))\n\t\tcountry="c:([A-Z]+)"\n\t\tlevels=5\n\t\}\n^\}',
                       '\t\t\t\t\tcompany={\n\t\t\t\t\t\ttype=\\1\n\t\t\t\t\t\tcountry="c:\\3"\n\t\t\t\t\t\tlevels=5\n\t\t\t\t\t}\n\t\t\t\t}',t)
              t=t.replace('\t\t\t\tadd_ownership={\n\tcountry={ country="c:XAI" levels=5 }\n\tcompany={ type=company_nsm_footwater_line country="c:XAI" levels=5 }\n}',
                          '\t\t\t\tadd_ownership={\n\t\t\t\t\tcountry={ country="c:XAI" levels=5 }\n\t\t\t\t\tcompany={ type=company_nsm_footwater_line country="c:XAI" levels=5 }\n\t\t\t\t}')
              p.write_text(t,encoding='utf-8-sig',newline='\n')
          PY
          git diff --check
          grep -q 'building_dye_plantation' common/company_types/00_nsm_WestEurope_companies.txt
          grep -q 'goods_output_glass_mult = 0.1' common/company_types/00_nsm_WestEurope_companies.txt
          grep -q 'goods_output_coal_mult = 0.15' common/company_types/00_nsm_WestEurope_companies.txt
          grep -q 'building_group_bg_mining_throughput_add = 0.1' common/company_types/00_nsm_EastEurope_companies.txt
          git diff --stat
          git diff
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common/company_types/00_nsm_WestEurope_companies.txt common/company_types/00_nsm_EastEurope_companies.txt common/company_types/00_nsm_NorthAmerica_companies.txt common/history/buildings/00_NorthRia.txt common/history/buildings/02_WestEurope.txt common/history/buildings/06_WestAsia.txt
          git commit -m "Finish company table audit corrections"
          git push origin HEAD:main
