name: Temporary company ownership restore

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/temp-company-ownership-fix.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore intended company ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def find_block(text, start):
              op = text.find('{', start)
              if op < 0:
                  raise RuntimeError('opening brace not found')
              depth = 0
              for i in range(op, len(text)):
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return start, i + 1
              raise RuntimeError('unbalanced braces')

          def get_state(text, state):
              m = re.search(rf'(?m)^\s*s:{re.escape(state)}\s*=\s*\{{', text)
              if not m:
                  raise RuntimeError(f'{state}: state block not found')
              a, b = find_block(text, m.start())
              return a, b, text[a:b]

          def get_building(state_block, building):
              for m in re.finditer(r'(?m)^\s*create_building\s*=\s*\{', state_block):
                  a, b = find_block(state_block, m.start())
                  block = state_block[a:b]
                  if re.search(rf'building\s*=\s*"{re.escape(building)}"', block):
                      return a, b, block
              raise RuntimeError(f'{building}: building block not found')

          def replace_add_ownership(building_block, new_text):
              m = re.search(r'add_ownership\s*=\s*\{', building_block)
              if not m:
                  raise RuntimeError('add_ownership not found')
              a, b = find_block(building_block, m.start())
              indent = re.search(r'(?m)^(\s*)add_ownership', building_block[a:]).group(1)
              replacement = indent + new_text.replace('\n', '\n' + indent)
              return building_block[:a] + replacement + building_block[b:]

          def set_company_only(path, state, building, company, country, levels=5):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig').replace('\r\n', '\n').replace('\r', '\n')
              sa, sb, sblock = get_state(text, state)
              ba, bb, bblock = get_building(sblock, building)
              owner = (
                  'add_ownership={\n'
                  '\tcompany={\n'
                  f'\t\ttype={company}\n'
                  f'\t\tcountry="c:{country}"\n'
                  f'\t\tlevels={levels}\n'
                  '\t}\n'
                  '}'
              )
              nb = replace_add_ownership(bblock, owner)
              ns = sblock[:ba] + nb + sblock[bb:]
              p.write_text(text[:sa] + ns + text[sb:], encoding='utf-8-sig', newline='\n')

          # リーメウス：南フーシャメウスの綿花5
          set_company_only('common/history/buildings/00_NorthRia.txt', 'STATE_NSM_047', 'building_cotton_plantation', 'company_nsm_riimeus', 'XCC', 5)

          # コーン・メジャー：グレプレ4州のトウモロコシ各5
          for state in ['STATE_NSM_094', 'STATE_NSM_104', 'STATE_NSM_246', 'STATE_NSM_352']:
              set_company_only('common/history/buildings/00_NorthRia.txt', state, 'building_maize_farm', 'company_nsm_corn_major', 'XBK', 5)

          # 町田製作所：イルボネー首都の工具5
          set_company_only('common/history/buildings/06_WestAsia.txt', 'STATE_NSM_331', 'building_tooling_workshop', 'company_nsm_machida', 'GSU', 5)

          # イルボネー漁業：イルボネー首都の魚5
          set_company_only('common/history/buildings/06_WestAsia.txt', 'STATE_NSM_331', 'building_fishing_wharf', 'company_nsm_ilbone_fisheries', 'GSU', 5)

          # フランコ・フークネート：既存25Lvのうち5Lvを会社所有に差し替え
          p = Path('common/history/buildings/03_EastEurope.txt')
          text = p.read_text(encoding='utf-8-sig').replace('\r\n', '\n').replace('\r', '\n')
          sa, sb, sblock = get_state(text, 'STATE_NSM_028')
          ba, bb, bblock = get_building(sblock, 'building_sulfur_mine')
          old = 'building={ type="building_financial_district" country="c:XAQ" levels=5 region="STATE_NSM_028" }'
          new = 'company={ type=company_nsm_franco_huuknet country="c:XAQ" levels=5 }'
          if old not in bblock:
              raise RuntimeError('STATE_NSM_028 sulfur 5-level ownership slot not found')
          bblock = bblock.replace(old, new, 1)
          sblock = sblock[:ba] + bblock + sblock[bb:]
          p.write_text(text[:sa] + sblock + text[sb:], encoding='utf-8-sig', newline='\n')

          # フートウォーターライン：首都造船所10Lvのうち5Lvを会社所有
          p = Path('common/history/buildings/02_WestEurope.txt')
          text = p.read_text(encoding='utf-8-sig').replace('\r\n', '\n').replace('\r', '\n')
          sa, sb, sblock = get_state(text, 'STATE_NSM_192')
          ba, bb, bblock = get_building(sblock, 'building_shipyard')
          owner = (
              'add_ownership={\n'
              '\tcountry={ country="c:XAI" levels=5 }\n'
              '\tcompany={ type=company_nsm_footwater_line country="c:XAI" levels=5 }\n'
              '}'
          )
          bblock = replace_add_ownership(bblock, owner)
          sblock = sblock[:ba] + bblock + sblock[bb:]
          p.write_text(text[:sa] + sblock + text[sb:], encoding='utf-8-sig', newline='\n')
          PY

      - name: Verify only intended company ownership entries changed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          checks = {
            'common/history/buildings/00_NorthRia.txt': [
              'type=company_nsm_riimeus',
              'type=company_nsm_corn_major',
            ],
            'common/history/buildings/06_WestAsia.txt': [
              'type=company_nsm_machida',
              'type=company_nsm_ilbone_fisheries',
            ],
            'common/history/buildings/03_EastEurope.txt': ['type=company_nsm_franco_huuknet'],
            'common/history/buildings/02_WestEurope.txt': ['type=company_nsm_footwater_line'],
          }
          for path, needles in checks.items():
              text = Path(path).read_text(encoding='utf-8-sig')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'missing {needle} in {path}')
          PY
          git diff --check
          git diff -- common/history/buildings/00_NorthRia.txt common/history/buildings/06_WestAsia.txt common/history/buildings/03_EastEurope.txt common/history/buildings/02_WestEurope.txt

      - name: Commit restored ownership
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common/history/buildings/00_NorthRia.txt common/history/buildings/06_WestAsia.txt common/history/buildings/03_EastEurope.txt common/history/buildings/02_WestEurope.txt
          if ! git diff --cached --quiet; then
            git commit -m "Restore intended company building ownership"
            git push origin HEAD:main
          fi
