name: Temporary ToE BRI HQ patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run temporary ToE BRI HQ patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch BRI HQ only
        shell: python
        run: |
          from pathlib import Path
          p = Path('common/history/military_formations/99_NSM_population_x4_armies.txt')
          raw = p.read_bytes()
          bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')

          def match_brace(s, pos):
              d = 0
              for i in range(pos, len(s)):
                  if s[i] == '{': d += 1
                  elif s[i] == '}':
                      d -= 1
                      if d == 0: return i
              raise SystemExit('unmatched brace')

          marker = 'c:BRI ?= {'
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one BRI block, got {text.count(marker)}')
          a = text.index(marker)
          op = text.index('{', a)
          z = match_brace(text, op)
          block = text[a:z+1]
          old = 'hq_region = sr:region_nsm_east_fushion'
          new = 'hq_region = sr:region_nsm_newfoot'
          if block.count(old) != 1 or block.count('name = NSM_BRI_Scaled_Army') != 1:
              raise SystemExit('Unexpected BRI block contents')
          block = block.replace(old, new, 1)
          text = text[:a] + block + text[z+1:]
          out = text.encode('utf-8')
          if bom: out = b'\xef\xbb\xbf' + out
          p.write_bytes(out)

      - name: Verify and commit
        run: |
          git diff --check
          git diff -- common/history/military_formations/99_NSM_population_x4_armies.txt
          git config user.name "ToE audit bot"
          git config user.email "actions@users.noreply.github.com"
          git add common/history/military_formations/99_NSM_population_x4_armies.txt
          git diff --cached --quiet && exit 1
          git commit -m "Fix BRI army HQ strategic region"
          git push
