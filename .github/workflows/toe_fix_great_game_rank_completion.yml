name: ToE Fix Great Game Rank Completion
on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/toe_fix_great_game_rank_completion.py'
      - '.github/workflows/toe_fix_great_game_rank_completion.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove rank-based Great Game instant completion
        run: python scripts/toe_fix_great_game_rank_completion.py
      - name: Commit Great Game completion fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common/journal_entries/00_player_objectives_great_game.txt
          if git diff --cached --quiet; then
            echo "No gameplay changes needed"
            exit 0
          fi
          git commit -m "Great Game勝敗を点数判定に統一"
          git push
