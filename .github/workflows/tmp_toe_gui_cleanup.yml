name: Temporary ToE GUI cleanup

on:
  push:
    paths:
      - '.github/workflows/tmp_toe_gui_cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch verified obsolete GUI callbacks
        shell: python
        run: |
          from pathlib import Path

          # 1) companies_panel.gui: change only the four verified obsolete callbacks.
          p = Path('gui/companies_panel.gui')
          s = p.read_text(encoding='utf-8-sig')
          replacements = {
              'onclick = "[AccessPlayer.SortCompanies(\'name\')]"': 'onclick = "[CompaniesPanel.Sort(\'name\')]"',
              'onclick = "[AccessPlayer.SortCompanies(\'building_database_order\')]"': '# obsolete 1.13 callback disabled: building_database_order sort',
              'onclick = "[AccessPlayer.SortCompanies(\'productivity\')]"': '# obsolete 1.13 callback disabled: productivity sort',
              'onclick = "[AccessPlayer.SortCompanies(\'levels\')]"': '# obsolete 1.13 callback disabled: levels sort',
          }
          for old, new in replacements.items():
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'Expected exactly 1 occurrence of {old!r}, found {n}')
              s = s.replace(old, new, 1)
          p.write_text('\ufeff' + s, encoding='utf-8')

          # 2) custom_tooltip.gui: engine explicitly requests raw_text for this dynamic formatted string.
          p = Path('gui/custom_tooltip.gui')
          s = p.read_text(encoding='utf-8-sig')
          old = 'text = "#v [State.GetName]#!"'
          new = 'raw_text = "#v [State.GetName]#!"'
          n = s.count(old)
          if n != 1:
              raise SystemExit(f'Expected exactly 1 State.GetName text occurrence, found {n}')
          s = s.replace(old, new, 1)
          p.write_text('\ufeff' + s, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gui/companies_panel.gui gui/custom_tooltip.gui
          git diff --cached --check
          git commit -m "Fix obsolete company GUI callbacks"
          git push
