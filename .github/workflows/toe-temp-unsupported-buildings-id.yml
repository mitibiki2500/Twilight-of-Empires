name: ToE confirmed unsupported initial buildings
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Run confirmed unsupported building cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove exact confirmed logged building blocks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets = [
            ('common/history/buildings/06_WestAsia.txt','STATE_NSM_044','building_wheat_farm'),
            ('common/history/buildings/06_WestAsia.txt','STATE_NSM_383','building_silk_plantation'),
            ('common/history/buildings/06_WestAsia.txt','STATE_NSM_275','building_wheat_farm'),
            ('common/history/buildings/06_WestAsia.txt','STATE_NSM_191','building_silk_plantation'),
            ('common/history/buildings/06_WestAsia.txt','STATE_NSM_132','building_wheat_farm'),
            ('common/history/buildings/06_WestAsia.txt','STATE_NSM_022','building_coal_mine'),
            ('common/history/buildings/06_WestAsia.txt','STATE_NSM_016','building_wheat_farm'),
            ('common/history/buildings/09_Oceania.txt','STATE_NSM_117','building_wheat_farm'),
          ]
          def endblock(text,brace):
            d=0
            for i in range(brace,len(text)):
              if text[i]=='{': d+=1
              elif text[i]=='}':
                d-=1
                if d==0:return i+1
            raise RuntimeError('unclosed')
          byfile={}
          for p,sid,bt in targets: byfile.setdefault(p,[]).append((sid,bt))
          done=[]
          for fn,ts in byfile.items():
            p=Path(fn); raw=p.read_bytes(); bom=raw.startswith(b'\xef\xbb\xbf'); text=raw.decode('utf-8-sig')
            edits=[]
            for sid,bt in ts:
              ms=list(re.finditer(r'(?m)^\s*s:'+re.escape(sid)+r'\s*=\s*\{',text))
              if len(ms)!=1: raise SystemExit(f'{fn} {sid}: state definitions={len(ms)}')
              sm=ms[0]; sb=text.find('{',sm.start()); se=endblock(text,sb); block=text[sm.start():se]
              hits=[]; pos=0
              while True:
                m=re.search(r'create_building\s*=\s*\{',block[pos:])
                if not m:break
                a=pos+m.start(); br=block.find('{',a); b=endblock(block,br); cb=block[a:b]
                if re.search(r'building\s*=\s*"?'+re.escape(bt)+r'"?',cb): hits.append((a,b))
                pos=b
              if len(hits)!=1: raise SystemExit(f'{fn} {sid} {bt}: create blocks={len(hits)}')
              a,b=hits[0]; edits.append((sm.start()+a,sm.start()+b,sid,bt))
            for a,b,sid,bt in sorted(edits,reverse=True):
              bb=b
              if text[bb:bb+2]=='\r\n':bb+=2
              elif text[bb:bb+1]=='\n':bb+=1
              text=text[:a]+text[bb:]
              done.append((fn,sid,bt))
            data=text.encode('utf-8'); p.write_bytes((b'\xef\xbb\xbf' if bom else b'')+data)
          if len(done)!=len(targets): raise SystemExit((len(done),len(targets)))
          print('REMOVED',done)
          PY
          git diff -- common/history/buildings
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add common/history/buildings
          git commit -m 'Remove confirmed unsupported initial buildings'
          git push
