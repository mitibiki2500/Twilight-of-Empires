name: ToE AI史実州参照互換修正（一時）

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch-ai-state-refs:
    if: github.event.head_commit.message == 'AI史実州参照互換修正用の一時ワークフローを追加'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 1.13.10 AIを基準にToE未定義州トリガーだけ無効化
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import re

          # 1.13.11ではこのファイルに変更がないため、1.13.10確定版を使用。
          url = 'https://raw.githubusercontent.com/settintotrieste/V3-Vanilla-Extract/eba06b7e4c47741732d6eaa7698ba5a5c25716a1/game/common/ai_strategies/00_default_strategy.txt'
          text = urlopen(url).read().decode('utf-8-sig')

          removed_states = {
            'STATE_ACRE','STATE_ADANA','STATE_ALEPPO','STATE_ALGIERS','STATE_ARIZONA','STATE_BOSNIA','STATE_CALIFORNIA','STATE_CENTRAL_HIGHLANDS','STATE_COLORADO','STATE_CONSTANTINE','STATE_CORRIENTES','STATE_DAGESTAN','STATE_EAST_SAHARA','STATE_HERAT','STATE_KABUL','STATE_KANDAHAR','STATE_KANSAS','STATE_KHIVA','STATE_KIRGHIZIA','STATE_KUBAN','STATE_LEBANON','STATE_LOURENCO_MARQUES','STATE_LOWER_EGYPT','STATE_MIDDLE_EGYPT','STATE_MOCAMBIQUE','STATE_NEVADA','STATE_NEW_MEXICO','STATE_NORTH_CAUCASUS','STATE_OKLAHOMA','STATE_ORAN','STATE_PALESTINE','STATE_PARANA','STATE_RIO_GRANDE_DO_SUL','STATE_SAHARA','STATE_SANTA_FE','STATE_SINAI','STATE_SYRIA','STATE_TAJIKISTAN','STATE_TEXAS','STATE_TRANSJORDAN','STATE_TURKMENIA','STATE_UPPER_EGYPT','STATE_UTAH','STATE_UZBEKIA','STATE_ZAMBEZIA'
          }

          pat = re.compile(r'^(\s*)(has_state_in_state_region|owns_entire_state_region)\s*=\s*(STATE_[A-Za-z0-9_]+)(\s*(?:#.*)?)$', re.M)
          changed=[]
          def repl(m):
              state=m.group(3)
              if state not in removed_states:
                  return m.group(0)
              changed.append((m.group(2), state))
              return f'{m.group(1)}always = no # ToE: removed vanilla state {state}'
          out=pat.sub(repl,text)

          if len(changed) < 40:
              raise RuntimeError(f'想定より置換が少ない: {len(changed)}')
          missing = removed_states - {s for _,s in changed}
          if missing:
              print('現行AIで参照されなくなった州:', sorted(missing))

          p=Path('common/ai_strategies/00_default_strategy.txt')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text('\ufeff'+out,encoding='utf-8')
          print('disabled vanilla state trigger lines:', len(changed))
      - name: 構造チェック
        shell: python
        run: |
          from pathlib import Path
          t=Path('common/ai_strategies/00_default_strategy.txt').read_text(encoding='utf-8-sig')
          depth=0; in_str=False; esc=False
          for c in t:
              if in_str:
                  if esc: esc=False
                  elif c=='\\': esc=True
                  elif c=='"': in_str=False
              else:
                  if c=='"': in_str=True
                  elif c=='{': depth+=1
                  elif c=='}': depth-=1
                  if depth<0: raise RuntimeError('brace underflow')
          if depth!=0: raise RuntimeError(f'brace imbalance: {depth}')
      - name: 差分検証
        run: |
          git diff --check
          git diff --stat
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common/ai_strategies/00_default_strategy.txt
          git commit -m "AIの削除済み史実州参照を無効化"
          git push
