name: ToE 外交触媒互換修正（一時）

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch-catalyst:
    if: github.event.head_commit.message == '外交触媒の史実中国参照修正用の一時ワークフローを追加'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 1.13外交触媒のCHI国家形成参照だけ無効化
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          url='https://raw.githubusercontent.com/settintotrieste/V3-Vanilla-Extract/b19d4e135a2775962be7797e8d9d9d4f036f5e8e/game/common/diplomatic_catalysts/00_diplomatic_catalysts.txt'
          text=urlopen(url).read().decode('utf-8-sig')
          old='scope:target_country = { can_form_nation = CHI }'
          count=text.count(old)
          if count != 1:
              raise RuntimeError(f'CHI参照数が想定外: {count}')
          text=text.replace(old,'scope:target_country = { always = no # ToE: CHI formation removed\n\t\t\t\t\t\t}')
          p=Path('common/diplomatic_catalysts/00_diplomatic_catalysts.txt')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text('\ufeff'+text,encoding='utf-8')
      - name: 構造チェック
        shell: python
        run: |
          from pathlib import Path
          t=Path('common/diplomatic_catalysts/00_diplomatic_catalysts.txt').read_text(encoding='utf-8-sig')
          depth=0; instr=False; esc=False
          for c in t:
              if instr:
                  if esc: esc=False
                  elif c=='\\': esc=True
                  elif c=='"': instr=False
              else:
                  if c=='"': instr=True
                  elif c=='{': depth+=1
                  elif c=='}': depth-=1
                  if depth<0: raise RuntimeError('brace underflow')
          if depth: raise RuntimeError(f'brace imbalance {depth}')
      - name: 差分検証
        run: git diff --check
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common/diplomatic_catalysts/00_diplomatic_catalysts.txt
          git commit -m "外交触媒の削除済み中国国家形成参照を無効化"
          git push
