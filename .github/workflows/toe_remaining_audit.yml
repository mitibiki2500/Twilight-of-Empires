name: ToE Remaining Error Audit
on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/toe_remaining_audit.py'
      - '.github/workflows/toe_remaining_audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit remaining error classes
        run: python scripts/toe_remaining_audit.py | tee toe_remaining_audit_report.txt
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: toe-remaining-audit-report
          path: toe_remaining_audit_report.txt
