name: ToE fix current HQ mismatches
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Patch current HQ mismatches and stale XBC state block'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact current mismatches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def bend(t,b):
              d=0
              for i in range(b,len(t)):
                  if t[i]=='{': d+=1
                  elif t[i]=='}':
                      d-=1
                      if d==0:return i+1
              raise RuntimeError('unclosed')

          # Army HQs: scope changes to exact country blocks only.
          p=Path('common/history/military_formations/99_NSM_population_x4_armies.txt')
          raw=p.read_bytes(); bom=raw.startswith(b'\xef\xbb\xbf'); t=raw.decode('utf-8-sig')
          army_changes=[('RWA','region_nsm_central_islands','region_nsm_central_fushion'),('BRI','region_nsm_newfoot','region_nsm_south_fushion')]
          for tag,old,new in army_changes:
              ms=list(re.finditer(r'(?m)^\s*c:'+tag+r'\s*\?=\s*\{',t))
              if len(ms)!=1: raise SystemExit(f'{tag}: country block count {len(ms)}')
              m=ms[0]; b=t.find('{',m.start()); e=bend(t,b); blk=t[m.start():e]
              needle='hq_region = sr:'+old
              if blk.count(needle)!=1: raise SystemExit(f'{tag}: expected old HQ once, got {blk.count(needle)}')
              blk2=blk.replace(needle,'hq_region = sr:'+new,1)
              t=t[:m.start()]+blk2+t[e:]
          p.write_bytes((b'\xef\xbb\xbf' if bom else b'')+t.encode('utf-8'))

          # Fleet HQs XBC/XBH -> actual strategic region of their owned states.
          p=Path('common/history/military_formations/99_NSM_starting_navies_16_5.txt')
          raw=p.read_bytes(); bom=raw.startswith(b'\xef\xbb\xbf'); t=raw.decode('utf-8-sig')
          fleet_changes=[('XBC','region_nsm_central_fushion','region_nsm_east_fushion'),('XBH','region_nsm_south_fushion','region_nsm_east_fushion')]
          for tag,old,new in fleet_changes:
              ms=list(re.finditer(r'(?m)^\s*c:'+tag+r'\s*\?=\s*\{',t))
              if len(ms)!=1: raise SystemExit(f'{tag}: fleet country block count {len(ms)}')
              m=ms[0]; b=t.find('{',m.start()); e=bend(t,b); blk=t[m.start():e]
              needle='hq_region = sr:'+old
              if blk.count(needle)!=1: raise SystemExit(f'{tag}: expected old fleet HQ once, got {blk.count(needle)}')
              blk2=blk.replace(needle,'hq_region = sr:'+new,1)
              t=t[:m.start()]+blk2+t[e:]
          p.write_bytes((b'\xef\xbb\xbf' if bom else b'')+t.encode('utf-8'))

          # STATE_NSM_524 is RWA-owned; remove the stale XBC region_state block only.
          p=Path('common/history/buildings/08_CentralIslands.txt')
          raw=p.read_bytes(); bom=raw.startswith(b'\xef\xbb\xbf'); t=raw.decode('utf-8-sig')
          ms=list(re.finditer(r'(?m)^\s*s:STATE_NSM_524\s*=\s*\{',t))
          if len(ms)!=1: raise SystemExit(f'STATE_NSM_524 block count {len(ms)}')
          sm=ms[0]; sb=t.find('{',sm.start()); se=bend(t,sb); sblk=t[sm.start():se]
          rms=list(re.finditer(r'(?m)^\s*region_state:XBC\s*=\s*\{',sblk))
          if len(rms)!=1: raise SystemExit(f'STATE_NSM_524 XBC region_state count {len(rms)}')
          rm=rms[0]; rb=sblk.find('{',rm.start()); re_=bend(sblk,rb)
          # include directly preceding XBC comment and surrounding whitespace if present
          start=rm.start()
          prefix=sblk[:start]
          cm=re.search(r'(?m)^\s*#\s*フーテライト\s*\(XBC\)\s*\n\s*$',prefix)
          if cm and cm.end()==len(prefix): start=cm.start()
          sblk2=sblk[:start]+sblk[re_:]
          if 'region_state:XBC' in sblk2: raise SystemExit('XBC region_state remains in STATE_NSM_524')
          t=t[:sm.start()]+sblk2+t[se:]
          p.write_bytes((b'\xef\xbb\xbf' if bom else b'')+t.encode('utf-8'))
          PY
          git diff --check
          git diff -- common/history/military_formations common/history/buildings/08_CentralIslands.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add common/history/military_formations/99_NSM_population_x4_armies.txt common/history/military_formations/99_NSM_starting_navies_16_5.txt common/history/buildings/08_CentralIslands.txt
          git commit -m 'Fix current HQ regions and stale XBC building block'
          git push origin HEAD:main
