name: ToE naval administration audit
on:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  audit:
    if: github.event.head_commit.message == 'Audit XBH coastal state candidates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print XBH state region definitions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets=['STATE_NSM_008','STATE_NSM_070','STATE_NSM_076']
          def bend(t,b):
            d=0
            for i in range(b,len(t)):
              if t[i]=='{': d+=1
              elif t[i]=='}':
                d-=1
                if d==0:return i+1
            raise RuntimeError('unclosed')
          for p in Path('map_data/state_regions').glob('*.txt'):
            t=p.read_text(encoding='utf-8-sig')
            for sid in targets:
              for m in re.finditer(r'(?m)^\s*'+sid+r'\s*=\s*\{',t):
                b=t.find('{',m.start()); e=bend(t,b); blk=t[m.start():e]
                print('===',sid,p,'===')
                print(blk)
          PY
