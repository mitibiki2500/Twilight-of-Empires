name: ToE central islands arable fix
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Run ToE central17 arable fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reduce Central Islands 17 sugar by one
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('common/history/buildings/08_CentralIslands.txt')
          raw=p.read_bytes(); bom=raw.startswith(b'\xef\xbb\xbf'); t=raw.decode('utf-8-sig')
          m=re.search(r'(?m)^\s*s:STATE_NSM_372\s*=\s*\{',t)
          if not m: raise SystemExit('STATE_NSM_372 missing')
          b=t.find('{',m.start()); d=0; e=None
          for i in range(b,len(t)):
              if t[i]=='{': d+=1
              elif t[i]=='}':
                  d-=1
                  if d==0: e=i+1; break
          if e is None: raise SystemExit('STATE_NSM_372 unclosed')
          block=t[m.start():e]
          sugar='building = "building_sugar_plantation"'
          needle='country={ country="c:GSU" levels=5 }'
          if block.count(sugar) != 1: raise SystemExit('Expected exactly one sugar plantation')
          idx=block.index(sugar)
          before, after=block[:idx],block[idx:]
          if after.count(needle) != 1: raise SystemExit('Expected exactly one GSU sugar level 5')
          after=after.replace(needle,'country={ country="c:GSU" levels=4 }',1)
          t2=t[:m.start()]+before+after+t[e:]
          data=t2.encode('utf-8'); p.write_bytes((b'\xef\xbb\xbf' if bom else b'')+data)
          print('STATE_NSM_372 sugar plantation ownership: 5 -> 4')
          PY
          git diff -- common/history/buildings/08_CentralIslands.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add common/history/buildings/08_CentralIslands.txt
          git commit -m 'Fix Central Islands 17 arable land overuse'
          git push
