name: ToE resource history audit
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Run ToE resource history audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unsupported initial resource buildings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Errors confirmed in the latest 15:05 log. These buildings are removed by the game
          # because their state region does not support that resource. Remove only the erroneous
          # initial create_building block; do not change state-region resource potential here.
          bad = {
              '南米23': 'building_silk_plantation',
              '東欧3': 'building_wheat_farm',
              '西亜2': 'building_wheat_farm',
              '西亜60': 'building_silk_plantation',
              '西亜1': 'building_wheat_farm',
              '西亜37': 'building_silk_plantation',
              '西亜12': 'building_wheat_farm',
              '西亜70': 'building_coal_mine',
              '西亜11': 'building_wheat_farm',
              '豪14': 'building_wheat_farm',
          }

          # Map displayed state-name comments to state ids.
          name_to_id = {}
          for p in Path('map_data/state_regions').glob('*.txt'):
              txt = p.read_text(encoding='utf-8-sig')
              # state blocks contain STATE_NSM_xxx then a short comment like #西亜11
              for m in re.finditer(r'(STATE_NSM_\d+)\s*=\s*\{(?P<body>.*?)(?=\nSTATE_NSM_\d+\s*=\s*\{|\Z)', txt, re.S):
                  body=m.group('body')
                  cm=re.search(r'^\s*#\s*([^\r\n]+)', body, re.M)
                  if cm:
                      name_to_id[cm.group(1).strip()] = m.group(1)

          missing_names=[n for n in bad if n not in name_to_id]
          if missing_names:
              raise SystemExit(f'Could not resolve state display comments: {missing_names}')
          print('RESOLVED:', {n:name_to_id[n] for n in bad})

          # Find each state block in building history and remove only create_building blocks of the bad type.
          found={n:0 for n in bad}
          changed=[]
          for p in Path('common/history/buildings').glob('*.txt'):
              raw=p.read_bytes(); bom=raw.startswith(b'\xef\xbb\xbf'); text=raw.decode('utf-8-sig')
              orig=text
              for disp,btype in bad.items():
                  sid=name_to_id[disp]
                  sm=re.search(rf'(?m)^\s*s:{re.escape(sid)}\s*=\s*\{{', text)
                  if not sm: continue
                  brace=text.find('{', sm.start()); depth=0; send=None
                  for i in range(brace,len(text)):
                      if text[i]=='{': depth+=1
                      elif text[i]=='}':
                          depth-=1
                          if depth==0: send=i+1; break
                  if send is None: raise SystemExit(f'Unclosed state block {sid} in {p}')
                  state=text[sm.start():send]
                  spans=[]; pos=0
                  while True:
                      cb=re.search(r'create_building\s*=\s*\{', state[pos:])
                      if not cb: break
                      cs=pos+cb.start(); cbrace=state.find('{',cs); d=0; ce=None
                      for j in range(cbrace,len(state)):
                          if state[j]=='{': d+=1
                          elif state[j]=='}':
                              d-=1
                              if d==0: ce=j+1; break
                      if ce is None: raise SystemExit(f'Unclosed create_building in {sid}')
                      block=state[cs:ce]
                      if re.search(rf'building\s*=\s*"?{re.escape(btype)}"?', block): spans.append((cs,ce))
                      pos=ce
                  if spans:
                      # latest log says the game removes/reduces these unsupported initial buildings;
                      # delete all exact bad-type create blocks in that state.
                      for cs,ce in reversed(spans):
                          ee=ce
                          if state[ee:ee+2]=='\r\n': ee+=2
                          elif state[ee:ee+1]=='\n': ee+=1
                          state=state[:cs]+state[ee:]
                      text=text[:sm.start()]+state+text[send:]
                      found[disp]+=len(spans)
              if text!=orig:
                  data=text.encode('utf-8'); p.write_bytes((b'\xef\xbb\xbf' if bom else b'')+data); changed.append(str(p))

          missing=[n for n,c in found.items() if c==0]
          print('REMOVED:',found)
          print('CHANGED:',changed)
          if missing:
              raise SystemExit(f'Expected unsupported history building not found: {missing}')

          # Audit central-islands 17 arable use; report exact state id and current arable building levels.
          disp='中央諸島部17'
          sid=name_to_id.get(disp)
          print('CENTRAL17_STATE_ID:',sid)
          if sid:
              for p in Path('common/history/buildings').glob('*.txt'):
                  tx=p.read_text(encoding='utf-8-sig')
                  sm=re.search(rf'(?m)^\s*s:{re.escape(sid)}\s*=\s*\{{',tx)
                  if sm:
                      brace=tx.find('{',sm.start()); d=0; end=None
                      for i in range(brace,len(tx)):
                          if tx[i]=='{': d+=1
                          elif tx[i]=='}':
                              d-=1
                              if d==0: end=i+1; break
                      print('CENTRAL17_HISTORY_FILE:',p)
                      print(tx[sm.start():end])
                      break
          PY
          git diff -- common/history/buildings
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add common/history/buildings
          git commit -m 'Remove unsupported initial resource buildings'
          git push
