name: Temporary ToE armed forces patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run temporary ToE armed forces patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete 1.12 leader chance blocks
        shell: python
        run: |
          from pathlib import Path
          p = Path('common/interest_groups/00_armed_forces.txt')
          raw = p.read_bytes()
          bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')

          def remove_block(text, key):
              marker = '\t' + key + ' = {'
              if text.count(marker) != 1:
                  raise SystemExit(f'Expected one {key} block, got {text.count(marker)}')
              start = text.index(marker)
              comment_start = text.rfind('\n\t#', 0, start)
              if comment_start != -1 and start - comment_start < 220:
                  start = comment_start + 1
              open_pos = text.index('{', text.index(marker))
              depth = 0
              end = None
              for i in range(open_pos, len(text)):
                  if text[i] == '{': depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit(f'Unmatched braces in {key}')
              while end < len(text) and text[end] in ' \t\r\n':
                  if text[end] == '\n' and end + 1 < len(text) and text[end+1] == '}':
                      break
                  end += 1
              return text[:start] + text[end:]

          text = remove_block(text, 'commander_leader_chance')
          text = remove_block(text, 'executive_leader_chance')
          data = text.encode('utf-8')
          if bom: data = b'\xef\xbb\xbf' + data
          p.write_bytes(data)

      - name: Verify and commit
        run: |
          git diff --check
          git diff -- common/interest_groups/00_armed_forces.txt
          git config user.name "ToE audit bot"
          git config user.email "actions@users.noreply.github.com"
          git add common/interest_groups/00_armed_forces.txt
          git diff --cached --quiet && exit 1
          git commit -m "Remove obsolete armed forces leader chance fields"
          git push
