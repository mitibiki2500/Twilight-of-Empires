name: ToE Full Audit
on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/toe_full_audit.py'
      - '.github/workflows/toe_full_audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run full audit
        run: python scripts/toe_full_audit.py
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: toe-full-audit
          path: _audit/toe_full_audit.*
