name: ToE Full Audit
# Temporary rerun marker after known-error repair (2026-09-06)
# Full repository audit rerun after duplicate-definition fixes (2026-09-23)
on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/toe_full_audit.py'
      - 'scripts/toe_audit_focus.py'
      - '.github/workflows/toe_full_audit.yml'
      - '.metadata/metadata.json'
      - 'common/**'
      - 'events/**'
      - 'map_data/**'
      - 'gfx/**'
      - 'gpt送信用/common/**'
      - 'gpt送信用/logs/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run full audit
        run: python scripts/toe_full_audit.py
      - name: Print focused audit
        run: python scripts/toe_audit_focus.py
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: toe-full-audit
          path: _audit/toe_full_audit.*
