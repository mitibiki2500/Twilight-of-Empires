name: ToE グレートゲーム・イルボネー・残バグ修正（一時）

on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'グレートゲーム・イルボネー・残バグ修正用の一時ワークフローを追加'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 修正
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) Great Game parent: unsupported name/desc, broken relation syntax, and missing sub-JE activation.
          p = Path('common/journal_entries/00_player_objectives_great_game.txt')
          t = p.read_text(encoding='utf-8-sig')
          t, n1 = re.subn(r'^\s*name\s*=\s*je_great_game_control_name\s*\n', '', t, count=1, flags=re.M)
          t, n2 = re.subn(r'^\s*desc\s*=\s*je_great_game_control_desc\s*\n', '', t, count=1, flags=re.M)
          t, n3 = re.subn(r'c:SOS\.relations:c:PAI\s*>=\s*50', 'relations:c:PAI >= 50', t, count=1)
          marker = '        # Add only the objective journals relevant to this country.\n'
          activation = '''        # Add only the objective journals relevant to this country.\n        if = {\n            limit = { this = c:PAI }\n            if = { limit = { NOT = { has_journal_entry = je_toe_gg_steppe } } add_journal_entry = { type = je_toe_gg_steppe } }\n            if = { limit = { NOT = { has_journal_entry = je_toe_gg_sosilia } } add_journal_entry = { type = je_toe_gg_sosilia } }\n            if = { limit = { NOT = { has_journal_entry = je_toe_gg_plains } } add_journal_entry = { type = je_toe_gg_plains } }\n            if = { limit = { NOT = { has_journal_entry = je_toe_gg_route } } add_journal_entry = { type = je_toe_gg_route } }\n        }\n        else_if = {\n            limit = { this = c:GOT }\n            if = { limit = { NOT = { has_journal_entry = je_toe_gg_steppe } } add_journal_entry = { type = je_toe_gg_steppe } }\n            if = { limit = { NOT = { has_journal_entry = je_toe_gg_route } } add_journal_entry = { type = je_toe_gg_route } }\n        }\n        else_if = {\n            limit = { this = c:XAI }\n            if = { limit = { NOT = { has_journal_entry = je_toe_gg_route } } add_journal_entry = { type = je_toe_gg_route } }\n            if = { limit = { NOT = { has_journal_entry = je_toe_gg_tegar_ria } } add_journal_entry = { type = je_toe_gg_tegar_ria } }\n            if = { limit = { NOT = { has_journal_entry = je_toe_gg_tortal } } add_journal_entry = { type = je_toe_gg_tortal } }\n            if = { limit = { NOT = { has_journal_entry = je_toe_gg_south_lefria } } add_journal_entry = { type = je_toe_gg_south_lefria } }\n        }\n        else_if = {\n            limit = { this = c:GSU }\n            if = { limit = { NOT = { has_journal_entry = je_toe_gg_route } } add_journal_entry = { type = je_toe_gg_route } }\n            if = { limit = { NOT = { has_journal_entry = je_toe_gg_expel_tegar_ria } } add_journal_entry = { type = je_toe_gg_expel_tegar_ria } }\n            if = { limit = { NOT = { has_journal_entry = je_toe_gg_tortal } } add_journal_entry = { type = je_toe_gg_tortal } }\n            if = { limit = { NOT = { has_journal_entry = je_toe_gg_south_lefria } } add_journal_entry = { type = je_toe_gg_south_lefria } }\n        }\n'''
          if marker not in t:
              raise RuntimeError('Great Game activation marker not found')
          t = t.replace(marker, activation, 1)
          if (n1,n2,n3) != (1,1,1):
              raise RuntimeError(f'Great Game replacements failed: {(n1,n2,n3)}')
          p.write_text('\ufeff' + t, encoding='utf-8')

          # 2) Sub-journals: JE names/descriptions are supplied by localization keys, not direct JE tokens.
          p = Path('common/journal_entries/99_toe_great_game_subjournals.txt')
          t = p.read_text(encoding='utf-8-sig')
          t, names = re.subn(r'^\s*name\s*=\s*je_toe_gg_[A-Za-z0-9_]+\s*\n', '', t, flags=re.M)
          t, descs = re.subn(r'^\s*desc\s*=\s*je_toe_gg_[A-Za-z0-9_]+\s*\n', '', t, flags=re.M)
          if names != 8 or descs != 8:
              raise RuntimeError(f'sub-JE name/desc removal mismatch: names={names}, descs={descs}')
          p.write_text('\ufeff' + t, encoding='utf-8')

          # 3) Ilvone primary-culture integration decisions.
          p = Path('common/decisions/99_toe_ilvone_cultural_integration.txt')
          p.write_text('''\ufeff# ToE: Ilvone cultural integration decisions.\n\ntoe_ilvone_accept_latin_ria = {\n    is_shown = {\n        this = c:GSU\n        NOT = { country_has_primary_culture = cu:nsm_map_xbo }\n    }\n\n    possible = {\n        OR = {\n            has_law_or_variant = law_type:law_racial_segregation\n            has_law_or_variant = law_type:law_cultural_exclusion\n            has_law_or_variant = law_type:law_multicultural\n        }\n        has_interest_marker_in_region = region_nsm_west_ria\n        any_scope_state = {\n            region = sr:region_nsm_west_ria\n            is_incorporated = yes\n            count >= 3\n        }\n    }\n\n    when_taken = {\n        add_primary_culture = cu:nsm_map_xbo\n    }\n\n    ai_chance = { value = 100 }\n}\n\ntoe_ilvone_accept_ilvone_lefria = {\n    is_shown = {\n        this = c:GSU\n        OR = {\n            NOT = { country_has_primary_culture = cu:nsm_map_xdf }\n            NOT = { country_has_primary_culture = cu:toe_ilvone_lefria }\n        }\n    }\n\n    possible = {\n        OR = {\n            has_law_or_variant = law_type:law_cultural_exclusion\n            has_law_or_variant = law_type:law_multicultural\n        }\n        any_scope_state = {\n            region = sr:region_nsm_south_lefria\n            is_incorporated = yes\n            count >= 3\n        }\n    }\n\n    when_taken = {\n        if = {\n            limit = { NOT = { country_has_primary_culture = cu:nsm_map_xdf } }\n            add_primary_culture = cu:nsm_map_xdf\n        }\n        if = {\n            limit = { NOT = { country_has_primary_culture = cu:toe_ilvone_lefria } }\n            add_primary_culture = cu:toe_ilvone_lefria\n        }\n    }\n\n    ai_chance = { value = 100 }\n}\n''', encoding='utf-8')

          # 4) Matching Japanese localization.
          p = Path('localization/japanese/replace/toe_ilvone_cultural_integration_l_japanese.yml')
          p.write_text('''\ufeffl_japanese:\n toe_ilvone_accept_latin_ria:0 "ラテンリイアとの統合"\n toe_ilvone_accept_latin_ria_desc:0 "人種隔離・文化排斥・多文化のいずれかの市民権法の下で西リイアへ関心を持ち、同地域の編入州を3州以上確保することで、ラテンリイア人をイルボネー国家の主要文化として認める。"\n toe_ilvone_accept_ilvone_lefria:0 "南レフリアとの統合"\n toe_ilvone_accept_ilvone_lefria_desc:0 "文化排斥または多文化の下で南レフリアの編入州を3州以上確保し、南レフリア人とイルボネー系レフリア人を主要文化として認める。"\n''', encoding='utf-8')

          # 5) create_diplomatic_play uses current country scope as initiator in 1.13.
          for fn in [
              'common/on_actions/99_toe_alti_conquest_ai.txt',
              'common/scripted_buttons/99_toe_alti_conquest_buttons.txt',
          ]:
              p = Path(fn)
              t = p.read_text(encoding='utf-8-sig')
              t, n = re.subn(r'^\s*initiator\s*=\s*c:SKR\s*\n', '', t, count=1, flags=re.M)
              if n != 1:
                  raise RuntimeError(f'initiator removal failed: {fn}, {n}')
              p.write_text('\ufeff' + t, encoding='utf-8')

          # 6) Keep the disabled vanilla prestige-good key but move one disabled silk off the capped silk bucket.
          p = Path('common/prestige_goods/00_prestige_goods.txt')
          t = p.read_text(encoding='utf-8-sig')
          pat = re.compile(r'(prestige_good_suzhou_silk\s*=\s*\{.*?\bbase_good\s*=\s*)silk(.*?^\})', re.S | re.M)
          t, n = pat.subn(r'\1dye\2', t, count=1)
          if n != 1:
              raise RuntimeError(f'Suzhou silk parking replacement count={n}')
          p.write_text('\ufeff' + t, encoding='utf-8')

      - name: 検証
        shell: python
        run: |
          from pathlib import Path
          import re
          files = [
              'common/journal_entries/00_player_objectives_great_game.txt',
              'common/journal_entries/99_toe_great_game_subjournals.txt',
              'common/decisions/99_toe_ilvone_cultural_integration.txt',
              'common/on_actions/99_toe_alti_conquest_ai.txt',
              'common/scripted_buttons/99_toe_alti_conquest_buttons.txt',
              'common/prestige_goods/00_prestige_goods.txt',
          ]
          for fn in files:
              t=Path(fn).read_text(encoding='utf-8-sig')
              if t.count('{') != t.count('}'):
                  raise RuntimeError(f'brace mismatch: {fn}: {t.count("{")} / {t.count("}")}')
          parent=Path(files[0]).read_text(encoding='utf-8-sig')
          subs=Path(files[1]).read_text(encoding='utf-8-sig')
          dec=Path(files[2]).read_text(encoding='utf-8-sig')
          if 'c:SOS.relations:c:PAI' in parent: raise RuntimeError('bad SOS relation syntax remains')
          if re.search(r'^\s*(name|desc)\s*=\s*je_', parent, re.M): raise RuntimeError('parent direct name/desc remains')
          if re.search(r'^\s*(name|desc)\s*=\s*je_toe_gg_', subs, re.M): raise RuntimeError('sub-JE direct name/desc remains')
          for key in ['je_toe_gg_steppe','je_toe_gg_sosilia','je_toe_gg_plains','je_toe_gg_route','je_toe_gg_tegar_ria','je_toe_gg_expel_tegar_ria','je_toe_gg_tortal','je_toe_gg_south_lefria']:
              if f'add_journal_entry = {{ type = {key} }}' not in parent: raise RuntimeError(f'missing activation {key}')
          for law in ['law_racial_segregation','law_cultural_exclusion','law_multicultural']:
              if law not in dec: raise RuntimeError(f'missing law {law}')
          for culture in ['cu:nsm_map_xdf','cu:toe_ilvone_lefria']:
              if dec.count(f'add_primary_culture = {culture}') != 1: raise RuntimeError(f'bad culture add {culture}')
          for fn in files[3:5]:
              if 'initiator = c:SKR' in Path(fn).read_text(encoding='utf-8-sig'): raise RuntimeError(f'initiator remains: {fn}')
          silk_count=0
          for p in Path('common/prestige_goods').glob('*.txt'):
              silk_count += len(re.findall(r'^\s*base_good\s*=\s*silk\s*$', p.read_text(encoding='utf-8-sig'), re.M))
          print('silk base_good count:', silk_count)
          if silk_count > 3: raise RuntimeError(f'silk prestige count still over cap: {silk_count}')
          print('validation OK')
      - name: 差分確認
        run: git diff --check
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common/journal_entries/00_player_objectives_great_game.txt \
                  common/journal_entries/99_toe_great_game_subjournals.txt \
                  common/decisions/99_toe_ilvone_cultural_integration.txt \
                  localization/japanese/replace/toe_ilvone_cultural_integration_l_japanese.yml \
                  common/on_actions/99_toe_alti_conquest_ai.txt \
                  common/scripted_buttons/99_toe_alti_conquest_buttons.txt \
                  common/prestige_goods/00_prestige_goods.txt
          git commit -m "グレートゲームサブJEとイルボネー文化統合を修正"
          git push
