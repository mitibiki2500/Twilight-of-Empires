name: ToE Fix Great Game Duplicate SubJEs
on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/toe_fix_great_game_duplicate_subjes.py'
      - '.github/workflows/toe_fix_great_game_duplicate_subjes.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact Great Game guard fix
        run: python scripts/toe_fix_great_game_duplicate_subjes.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add common/journal_entries/00_player_objectives_great_game.txt
          git commit -m 'Great Gameの重複subJE追加を防止'
          git push origin HEAD:main
