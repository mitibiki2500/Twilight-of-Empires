name: ToE remove Great Game double add

on:
  push:
    paths:
      - '.github/workflows/toe-remove-gg-double-add.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove manual sub-JE additions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('common/journal_entries/00_player_objectives_great_game.txt')
          s = p.read_text(encoding='utf-8-sig')
          start = s.index('        # Add only the objective journals relevant to this country.\n')
          end = s.index('    on_weekly_pulse = {', start)
          block = s[start:end]
          expected = [
              'je_toe_gg_steppe','je_toe_gg_sosilia','je_toe_gg_plains','je_toe_gg_route',
              'je_toe_gg_tegar_ria','je_toe_gg_expel_tegar_ria','je_toe_gg_tortal','je_toe_gg_south_lefria'
          ]
          missing = [x for x in expected if x not in block]
          if missing:
              raise SystemExit(f'expected JE refs missing from manual block: {missing}')
          # Keep the immediate block itself; remove only the manual add_journal_entry section.
          replacement = '    }\n\n'
          s2 = s[:start] + replacement + s[end:]
          if s2.count('add_journal_entry = { type = je_toe_gg_') != 0:
              raise SystemExit('Great Game manual add_journal_entry references remain')
          p.write_text('\ufeff' + s2, encoding='utf-8')
          print('removed manual Great Game sub-JE add block')
          PY
          git config user.name 'mitibiki2500'
          git config user.email '100456694+mitibiki2500@users.noreply.github.com'
          git add common/journal_entries/00_player_objectives_great_game.txt
          git diff --cached --stat
          git diff --cached -- common/journal_entries/00_player_objectives_great_game.txt
          git commit -m 'グレートゲームサブJEの二重追加を解消'
          git push origin main
