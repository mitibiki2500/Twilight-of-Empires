name: ToE on action structural audit
on:
  push:
    branches: [ main ]
jobs:
  audit:
    if: github.event.head_commit.message == 'Run ToE on action structural audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit on_action files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in sorted(Path('common/on_actions').glob('*.txt')):
              t=p.read_text(encoding='utf-8-sig')
              d=0; min_d=0
              for ch in t:
                  if ch=='{': d+=1
                  elif ch=='}': d-=1; min_d=min(min_d,d)
              print(f'{p}: brace_balance={d} min={min_d}')
              for n,line in enumerate(t.splitlines(),1):
                  if re.search(r'(^|REPLACE_OR_CREATE:)on_game_start(ed)?\s*=',line) or 'on_monthly_pulse_country' in line or 'on_yearly_pulse_country' in line:
                      print('  HOOK',n,line.strip())
          matches=[]
          for p in Path('.').rglob('00_code_on_actions.txt'):
              if '.git' not in p.parts: matches.append(str(p))
          print('MOD 00_code_on_actions COPIES:',matches)
          PY
