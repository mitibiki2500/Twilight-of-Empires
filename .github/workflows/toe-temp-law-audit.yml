name: ToE starting law audit
on:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  audit:
    if: github.event.head_commit.message == 'Audit invalid starting laws'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate logged country law histories
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          tags=['GOT','GSU','XAX','XBC','XAL','XBA','XBD','XBH','XBI','XDF','XER','XEZ','XFA','GLT']
          for tag in tags:
              print('===',tag,'===')
              for p in Path('common/history/countries').rglob('*.txt'):
                  try: lines=p.read_text(encoding='utf-8-sig').splitlines()
                  except: continue
                  for i,l in enumerate(lines,1):
                      if re.search(r'\bc:'+re.escape(tag)+r'\b',l) or re.search(r'^\s*'+re.escape(tag)+r'\s*=\s*\{',l):
                          print('FILE',p,'LINE',i,l.strip())
                          for j in range(i-1,min(len(lines),i+120)):
                              if 'law_' in lines[j] or 'activate_law' in lines[j] or 'set_law' in lines[j]:
                                  print(f'  {j+1}:{lines[j].strip()}')
          PY
