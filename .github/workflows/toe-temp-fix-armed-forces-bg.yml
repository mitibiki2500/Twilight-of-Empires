name: ToE fix armed forces military industry group
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Patch armed forces military industry group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace obsolete building groups only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('common/interest_groups/00_armed_forces.txt')
          raw=p.read_bytes(); bom=raw.startswith(b'\xef\xbb\xbf'); t=raw.decode('utf-8-sig')
          old='''\t\t\t\tlimit = {\n\t\t\t\t\tOR = {\n\t\t\t\t\t\tpop_employment_building_group = bg_munition_plants\n\t\t\t\t\t\tpop_employment_building_group = bg_arms_industries\n\t\t\t\t\t\tpop_employment_building_group = bg_artillery_foundaries\n\t\t\t\t\t\tpop_employment_building_group = bg_military_shipyards\n\t\t\t\t\t}\n\t\t\t\t}'''
          new='''\t\t\t\tlimit = {\n\t\t\t\t\tpop_employment_building_group = bg_military_industry\n\t\t\t\t}'''
          if t.count(old)!=1: raise SystemExit(f'expected old military industry block once, got {t.count(old)}')
          t=t.replace(old,new,1)
          for bad in ['bg_munition_plants','bg_arms_industries','bg_artillery_foundaries','bg_military_shipyards']:
              if bad in t: raise SystemExit(f'obsolete group remains: {bad}')
          if t.count('pop_employment_building_group = bg_military_industry')!=1:
              raise SystemExit('new military group count is not 1')
          p.write_bytes((b'\xef\xbb\xbf' if bom else b'')+t.encode('utf-8'))
          PY
          git diff --check
          git diff -- common/interest_groups/00_armed_forces.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add common/interest_groups/00_armed_forces.txt
          git commit -m 'Update armed forces military industry building group'
          git push origin HEAD:main
