name: ToE unsupported starting buildings audit
on:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  audit:
    if: github.event.head_commit.message == 'Audit unsupported starting buildings current main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cross-check starting buildings against state resources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          history_files = [
              Path('common/history/buildings/07_SouthAmerica.txt'),
              Path('common/history/buildings/03_EastEurope.txt'),
              Path('common/history/buildings/06_WestAsia.txt'),
              Path('common/history/buildings/09_Oceania.txt'),
          ]
          targets = {'building_silk_plantation','building_wheat_farm','building_coal_mine'}

          def end_block(t, brace):
              d=0
              for i in range(brace,len(t)):
                  if t[i]=='{': d+=1
                  elif t[i]=='}':
                      d-=1
                      if d==0: return i+1
              raise RuntimeError('unclosed')

          # Build support map from current state_regions.
          support={}
          for p in Path('map_data/state_regions').glob('*.txt'):
              tx=p.read_text(encoding='utf-8-sig')
              for m in re.finditer(r'(?m)^\s*(STATE_NSM_\d+)\s*=\s*\{',tx):
                  b=tx.find('{',m.start()); e=end_block(tx,b); blk=tx[m.start():e]
                  sid=m.group(1)
                  allowed=set()
                  am=re.search(r'arable_resources\s*=\s*\{([^}]*)\}',blk,re.S)
                  if am: allowed.update(re.findall(r'"([A-Za-z0-9_]+)"',am.group(1)))
                  cm=re.search(r'capped_resources\s*=\s*\{([^}]*)\}',blk,re.S)
                  if cm: allowed.update(re.findall(r'(?m)^\s*([A-Za-z0-9_]+)\s*=\s*\d+',cm.group(1)))
                  for rm in re.finditer(r'(?m)^\s*resource\s*=\s*\{',blk):
                      rb=blk.find('{',rm.start()); re_=end_block(blk,rb); rblk=blk[rm.start():re_]
                      tm=re.search(r'(?m)^\s*type\s*=\s*"([A-Za-z0-9_]+)"',rblk)
                      dm=re.search(r'(?m)^\s*depleted_type\s*=\s*"([A-Za-z0-9_]+)"',rblk)
                      if tm: allowed.add(tm.group(1))
                      if dm: allowed.add(dm.group(1))
                  support[sid]=allowed

          hits=[]
          for p in history_files:
              tx=p.read_text(encoding='utf-8-sig')
              states=list(re.finditer(r'(?m)^\s*s:(STATE_NSM_\d+)\s*=\s*\{',tx))
              for sm in states:
                  sb=tx.find('{',sm.start()); se=end_block(tx,sb); sblk=tx[sm.start():se]; sid=sm.group(1)
                  for cm in re.finditer(r'(?m)^\s*create_building\s*=\s*\{',sblk):
                      cb=sblk.find('{',cm.start()); ce=end_block(sblk,cb); cblk=sblk[cm.start():ce]
                      bm=re.search(r'(?m)^\s*building\s*=\s*"?([A-Za-z0-9_]+)"?',cblk)
                      if not bm or bm.group(1) not in targets: continue
                      bld=bm.group(1)
                      if bld not in support.get(sid,set()):
                          absolute_line=tx[:sm.start()+cm.start()].count('\n')+1
                          levels=[]
                          for lm in re.finditer(r'levels\s*=\s*(\d+)',cblk): levels.append(lm.group(1))
                          name=''
                          for line in sblk.splitlines()[:8]:
                              if '州名:' in line or line.strip().startswith('#'): name += ' '+line.strip()
                          hits.append((str(p),absolute_line,sid,bld,levels,name.strip()))
          print('UNSUPPORTED_COUNT',len(hits))
          for h in hits: print('UNSUPPORTED',h)
          PY
