name: ToE building cleanup and audit

on:
  push:
    branches: [ gpt-building-admin-audit ]
    paths:
      - 'tools/audit_buildings.py'
      - 'tools/cleanup_buildings.py'
      - 'tools/audit_rollbacks.py'
      - 'common/history/buildings/**'
      - 'common/history/diplomacy/**'
      - 'common/history/countries/**'
      - 'common/character_templates/**'
      - 'common/amendments/**'
      - 'common/static_modifiers/**'
      - 'common/prestige_goods/**'
      - 'gfx/interface/icons/goods_icons/prestige_goods/**'
      - 'map_data/adjacencies.csv'
      - '.github/workflows/toe_building_audit.yml'

permissions:
  contents: write

jobs:
  cleanup-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt-building-admin-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize building history and XBB administration
        run: python tools/cleanup_buildings.py
      - name: Re-audit normalized files
        run: python tools/audit_buildings.py
      - name: Verify no structural duplicates remain
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('tools/building_audit_report.json').read_text(encoding='utf-8'))
          s=r['summary']
          assert s['brace_errors'] == 0, s
          assert s['duplicate_state_ids'] == 0, s
          assert s['duplicate_region_state_groups'] == 0, s
          assert s['duplicate_building_groups'] == 0, s
          assert r['XBB_government_administration']['total_levels'] == 105, r['XBB_government_administration']
          print('Verified:', s)
          print('XBB administration:', r['XBB_government_administration'])
          PY
      - name: Audit established fixes for rollback
        run: python tools/audit_rollbacks.py
      - name: Commit normalized files and reports
        run: |
          if [ -z "$(git status --porcelain -- common/history/buildings tools/building_audit_report.json tools/rollback_audit_report.json)" ]; then
            echo 'No cleanup/audit changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add common/history/buildings tools/building_audit_report.json tools/rollback_audit_report.json
          git commit -m 'Audit established ToE fixes after building cleanup'
          git push origin HEAD:gpt-building-admin-audit
