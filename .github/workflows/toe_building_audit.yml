name: ToE building audit

on:
  push:
    branches: [ gpt-building-admin-audit ]
    paths:
      - 'tools/audit_buildings.py'
      - 'common/history/buildings/**'
      - '.github/workflows/toe_building_audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt-building-admin-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit building history
        run: python tools/audit_buildings.py
      - name: Commit audit report
        run: |
          if [ -z "$(git status --porcelain -- tools/building_audit_report.json)" ]; then
            echo 'No report changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/building_audit_report.json
          git commit -m 'Audit ToE building history duplicates and administration levels'
          git push origin HEAD:gpt-building-admin-audit
