name: ToE MR法律史実JE参照除去（一時）

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  remove-hooks:
    if: github.event.head_commit.message == 'MR法律に残る史実JE参照だけを安全に除去する一時ワークフローを追加'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 史実JEを含むAI用ifブロックだけ除去
        shell: python
        run: |
          from pathlib import Path
          import re

          configs = {
              Path('common/laws/01_economic_system.txt'): [
                  'je_meiji_main', 'je_great_reforms_serfdom', 'je_hawaii'
              ],
              Path('common/laws/01_trade_policy.txt'): [
                  'je_meiji_diplomacy', 'je_meiji_imperial_marriage'
              ],
          }

          def matching_close(s, op):
              depth = 0
              for i in range(op, len(s)):
                  if s[i] == '{': depth += 1
                  elif s[i] == '}':
                      depth -= 1
                      if depth == 0: return i
              raise RuntimeError('閉じ括弧が見つかりません')

          def enclosing_if(s, pos):
              candidates = []
              for m in re.finditer(r'\bif\s*=\s*\{', s[:pos+1]):
                  op = s.find('{', m.start())
                  cl = matching_close(s, op)
                  if op < pos < cl:
                      candidates.append((m.start(), cl + 1))
              if not candidates:
                  raise RuntimeError(f'対象JEを含むifブロックが見つかりません: {pos}')
              return max(candidates, key=lambda x: x[0])

          for path, tokens in configs.items():
              text = path.read_text(encoding='utf-8-sig')
              original = text
              spans = []
              counts = {}
              for token in tokens:
                  poss = [m.start() for m in re.finditer(re.escape(token), text)]
                  counts[token] = len(poss)
                  for pos in poss:
                      spans.append(enclosing_if(text, pos))
              if not any(counts.values()):
                  raise RuntimeError(f'{path}: 対象の史実JE参照がありません。想定外です。')
              # 同一if内に複数tokenがあっても一度だけ削除。
              spans = sorted(set(spans), reverse=True)
              for st, en in spans:
                  # 行頭インデントと直後の改行も含めて整形。
                  line_st = text.rfind('\n', 0, st) + 1
                  line_en = text.find('\n', en)
                  if line_en == -1: line_en = en
                  else: line_en += 1
                  text = text[:line_st] + text[line_en:]
              # 指定tokenが完全に消えたことを保証。
              for token in tokens:
                  if token in text:
                      raise RuntimeError(f'{path}: {token} が残っています')
              # MR固有調整の代表値が残っていることを保証。
              if path.name == '01_economic_system.txt':
                  assert 'country_free_charters_add = 3' in text
                  assert 'country_private_construction_allocation_mult = 0.5' in text
              if path.name == '01_trade_policy.txt':
                  assert 'state_trade_advantage_mult = 0.33' in text
                  assert '#重商ナーフ' in text
              path.write_text('\ufeff' + text, encoding='utf-8')
              print(path, counts, '削除if数', len(spans))
      - name: 差分検証
        run: |
          git diff --check
          git diff -- common/laws/01_economic_system.txt common/laws/01_trade_policy.txt
      - name: 修正をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common/laws/01_economic_system.txt common/laws/01_trade_policy.txt
          git commit -m "MR法律からToEに存在しない史実JE参照を除去"
          git push
