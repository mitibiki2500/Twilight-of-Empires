name: ToE sanitize missing historical character template references

on:
  push:
    paths:
      - '.github/workflows/toe-sanitize-missing-character-templates.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch current 1.13.10 vanilla files
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/settintotrieste/V3-Vanilla-Extract/fa9678c4f570385ccb91bcdf1e25f82f93499b2f/game'
          files=(
            'gfx/portraits/portrait_modifiers/01_clothes.txt'
            'gfx/portraits/portrait_modifiers/01_headgear.txt'
            'gfx/portraits/portrait_modifiers/01_accessories.txt'
            'common/scripted_effects/00_victoria_royal_successions.txt'
            'common/scripted_effects/00_victoria_ip4_scripted_effects.txt'
            'common/scripted_effects/00_victoria_heir_generation.txt'
            'common/scripted_effects/00_victoria_scripted_effects.txt'
          )
          for f in "${files[@]}"; do
            mkdir -p "$(dirname "$f")"
            curl -fL "$base/$f" -o "$f"
          done

      - name: Disable only references to templates absent from ToE database
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,sys

          defs=set()
          for p in Path('common/character_templates').rglob('*.txt'):
              s=p.read_text(encoding='utf-8-sig',errors='replace')
              defs.update(re.findall(r'(?m)^\s*([A-Za-z0-9_#\-]+)\s*=\s*\{',s))

          targets=[
              Path('gfx/portraits/portrait_modifiers/01_clothes.txt'),
              Path('gfx/portraits/portrait_modifiers/01_headgear.txt'),
              Path('gfx/portraits/portrait_modifiers/01_accessories.txt'),
              Path('common/scripted_effects/00_victoria_royal_successions.txt'),
              Path('common/scripted_effects/00_victoria_ip4_scripted_effects.txt'),
              Path('common/scripted_effects/00_victoria_heir_generation.txt'),
              Path('common/scripted_effects/00_victoria_scripted_effects.txt'),
          ]
          rx=re.compile(r'\b(has_template|is_template_used)\s*=\s*([A-Za-z0-9_#\-]+)')
          total=0
          byfile={}
          missing_names=set()
          for p in targets:
              s=p.read_text(encoding='utf-8-sig',errors='replace')
              count=0
              def repl(m):
                  nonlocal_count=None
                  key=m.group(2)
                  if key in defs:
                      return m.group(0)
                  missing_names.add(key)
                  return 'always = no # ToE: missing vanilla historical character template'
              ns,n=rx.subn(repl,s)
              # subn includes valid refs too because repl may return unchanged; count actual markers instead
              count=ns.count('# ToE: missing vanilla historical character template')
              p.write_text(ns,encoding='utf-8-sig')
              byfile[str(p)]=count
              total += count
          print('ToE character templates defined:',len(defs))
          print('missing historical template names sanitized:',len(missing_names))
          print('reference occurrences sanitized:',total)
          for p,c in byfile.items(): print(c,p)
          if total < 200:
              print('unexpectedly low replacement count; refusing to commit')
              sys.exit(1)
          PY

      - name: Validate and commit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          targets=[
            Path('gfx/portraits/portrait_modifiers/01_clothes.txt'),
            Path('gfx/portraits/portrait_modifiers/01_headgear.txt'),
            Path('gfx/portraits/portrait_modifiers/01_accessories.txt'),
            Path('common/scripted_effects/00_victoria_royal_successions.txt'),
            Path('common/scripted_effects/00_victoria_ip4_scripted_effects.txt'),
            Path('common/scripted_effects/00_victoria_heir_generation.txt'),
            Path('common/scripted_effects/00_victoria_scripted_effects.txt'),
          ]
          for p in targets:
              s=p.read_text(encoding='utf-8-sig',errors='replace')
              if s.count('{')!=s.count('}'):
                  raise SystemExit(f'brace mismatch: {p}')
          PY
          git diff --check
          if [ -z "$(git status --porcelain gfx/portraits/portrait_modifiers common/scripted_effects)" ]; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gfx/portraits/portrait_modifiers/01_clothes.txt gfx/portraits/portrait_modifiers/01_headgear.txt gfx/portraits/portrait_modifiers/01_accessories.txt common/scripted_effects/00_victoria_royal_successions.txt common/scripted_effects/00_victoria_ip4_scripted_effects.txt common/scripted_effects/00_victoria_heir_generation.txt common/scripted_effects/00_victoria_scripted_effects.txt
          git commit -m '欠落史実人物テンプレート参照を安全に無効化'
          git push origin HEAD:main
