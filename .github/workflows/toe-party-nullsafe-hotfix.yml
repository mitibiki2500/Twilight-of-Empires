name: ToE party null-safe hotfix

on:
  push:
    paths:
      - '.github/workflows/toe-party-nullsafe-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply 1.13 party leader null-safety fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen

          base = 'https://raw.githubusercontent.com/settintotrieste/V3-Vanilla-Extract/fa9678c4f570385ccb91bcdf1e25f82f93499b2f/game/common/parties/'
          patches = {
              'agrarian_party.txt': [592],
              'military_party.txt': [393],
              'religious_party.txt': [357, 467],
              'conservative_party.txt': [936, 947, 988],
          }
          outdir = Path('common/parties')
          outdir.mkdir(parents=True, exist_ok=True)

          for name, line_numbers in patches.items():
              data = urlopen(base + name).read().decode('utf-8-sig')
              lines = data.splitlines(keepends=True)
              for n in line_numbers:
                  idx = n - 1
                  old = lines[idx]
                  if 'leader = {' not in old:
                      raise SystemExit(f'{name}:{n} expected leader = {{, got: {old!r}')
                  lines[idx] = old.replace('leader = {', 'leader ?= {', 1)
                  print(f'patched {name}:{n}: {old.strip()} -> {lines[idx].strip()}')
              (outdir / name).write_text('\ufeff' + ''.join(lines), encoding='utf-8')
          PY
          git config user.name 'mitibiki2500'
          git config user.email '100456694+mitibiki2500@users.noreply.github.com'
          git add common/parties
          git diff --cached --stat
          git diff --cached -- common/parties | grep -E '^[-+]\s*leader \??= \{' || true
          git commit -m '政党のIG指導者未設定参照を安全化'
          git push origin main
