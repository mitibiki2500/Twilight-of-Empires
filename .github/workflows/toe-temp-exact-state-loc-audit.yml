name: ToE exact state localization audit
on:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  audit:
    if: github.event.head_commit.message == 'Run exact state localization audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find exact localized state names
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          names=['南米23','東欧3','西亜2','西亜60','西亜1','西亜37','西亜12','西亜70','西亜11','豪14','中央諸島部17']
          for name in names:
              print('====',name,'====')
              hits=[]
              pat=re.compile(r'^\s*(STATE_NSM_\d+)\s*:\s*\d*\s*"'+re.escape(name)+r'"\s*$')
              for p in Path('localization').rglob('*.yml'):
                  try: lines=p.read_text(encoding='utf-8-sig').splitlines()
                  except: continue
                  for n,line in enumerate(lines,1):
                      m=pat.match(line)
                      if m: hits.append((str(p),n,m.group(1),line.strip()))
              print(hits if hits else 'NO_EXACT_MATCH')
          PY
