name: ToE repair known building corruption

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/toe_repair_known_building_corruption.yml'

permissions:
  contents: write

jobs:
  repair-and-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair known building-history corruption
        run: python tools/fix_known_building_corruption.py
      - name: Audit repaired building history
        run: |
          python tools/audit_building_structure.py
          python tools/audit_buildings.py
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('tools/building_structure_report.json').read_text(encoding='utf-8'))
          b=json.loads(Path('tools/building_audit_report.json').read_text(encoding='utf-8'))
          assert a['ok'], a
          assert a['totals']['nested_create_buildings'] == 0
          assert a['totals']['split_token_fragments'] == 0
          assert b['summary']['brace_errors'] == 0
          assert b['summary']['duplicate_state_ids'] == 0
          assert b['summary']['duplicate_region_state_groups'] == 0
          print('Known corruption repaired; structural audits clean')
          PY
      - name: Commit repairs and diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add common/history/buildings tools/building_structure_report.json tools/building_audit_report.json
          git diff --cached --quiet && exit 0
          git commit -m 'Repair known building history corruption'
          git push origin HEAD:main
