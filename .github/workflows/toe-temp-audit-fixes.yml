name: ToE targeted error fixes
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Run ToE targeted error fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch confirmed errors and inspect remaining groups
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = {
              'company_nsm_riimeus',
              'company_nsm_corn_major',
              'company_nsm_footwater_line',
              'company_nsm_franco_huuknet',
              'company_nsm_machida',
          }

          def remove_target_create_buildings(path):
              raw = path.read_bytes()
              bom = raw.startswith(b'\xef\xbb\xbf')
              text = raw.decode('utf-8-sig')
              spans=[]
              pos=0
              while True:
                  m=re.search(r'create_building\s*=\s*\{', text[pos:])
                  if not m: break
                  start=pos+m.start()
                  brace=text.find('{', start)
                  depth=0; end=None
                  for i in range(brace, len(text)):
                      if text[i]=='{': depth+=1
                      elif text[i]=='}':
                          depth-=1
                          if depth==0:
                              end=i+1; break
                  if end is None: raise SystemExit(f'Unclosed create_building in {path}:{start}')
                  block=text[start:end]
                  if any(t in block for t in targets):
                      spans.append((start,end,[t for t in targets if t in block]))
                  pos=end
              if not spans: return []
              for s,e,_ in reversed(spans):
                  # eat one following newline only; preserve surrounding formatting otherwise
                  ee=e
                  if text[ee:ee+2]=='\r\n': ee+=2
                  elif text[ee:ee+1]=='\n': ee+=1
                  text=text[:s]+text[ee:]
              data=text.encode('utf-8')
              if bom: data=b'\xef\xbb\xbf'+data
              path.write_bytes(data)
              return spans

          removed=[]
          for p in Path('common/history/buildings').glob('*.txt'):
              spans=remove_target_create_buildings(p)
              for s,e,ts in spans:
                  removed.append((str(p),ts))
          found={t:0 for t in targets}
          for _,ts in removed:
              for t in ts: found[t]+=1
          print('REMOVED COMPANY BUILDING BLOCKS:', removed)
          print('COUNTS:', found)
          missing=[t for t,c in found.items() if c==0]
          if missing:
              raise SystemExit(f'Expected erroneous company building definitions not found: {missing}')

          xax=Path('common/history/countries/XAX-Lefuria_#U30ec#U30d5#U30ea#U30a2.txt')
          raw=xax.read_bytes(); bom=raw.startswith(b'\xef\xbb\xbf'); text=raw.decode('utf-8-sig')
          if 'add_technology_researched = admiralty' not in text:
              anchor='\t\tadd_technology_researched = centralization\n'
              if text.count(anchor)!=1: raise SystemExit('Unexpected XAX technology anchor')
              text=text.replace(anchor, anchor+'\t\tadd_technology_researched = admiralty\n', 1)
              data=text.encode('utf-8'); xax.write_bytes((b'\xef\xbb\xbf' if bom else b'')+data)
          print('XAX admiralty granted')

          # Inspection output for next fixes
          needles=['je_nsm_altia_conquest_sparia','create_diplomatic_pact','subject_type','gold_mine','arable_land']
          for needle in needles:
              print(f'--- GREP {needle} ---')
              for p in Path('.').rglob('*.txt'):
                  if '.git' in p.parts: continue
                  try: tx=p.read_text(encoding='utf-8-sig')
                  except: continue
                  for n,line in enumerate(tx.splitlines(),1):
                      if needle in line:
                          print(f'{p}:{n}:{line}')
          PY
          git diff -- common/history/buildings common/history/countries
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add common/history/buildings common/history/countries
          git commit -m 'Fix erroneous company buildings and Lefuria admiralty'
          git push
