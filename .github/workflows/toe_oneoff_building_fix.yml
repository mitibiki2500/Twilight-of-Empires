name: ToE one-off building corruption audit

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/audit_building_structure.py'
      - '.github/workflows/toe_oneoff_building_fix.yml'

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit current main building history
        run: python tools/audit_building_structure.py
      - name: Commit diagnostics only
        run: |
          if [ -z "$(git status --porcelain -- tools/building_structure_report.json)" ]; then
            echo 'No report change'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/building_structure_report.json
          git commit -m 'Record current building corruption diagnostics'
          git push origin HEAD:main
