name: ToE one-off confirmed building fix

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/fix_known_building_corruption.py'
      - '.github/workflows/toe_oneoff_building_fix.yml'

permissions:
  contents: write

jobs:
  fix-and-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct one known pre-fix inventory blind spot
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/fix_known_building_corruption.py')
          s=p.read_text(encoding='utf-8')
          old='''    after_buildings = counts_by_building(files)\n    if before_buildings != after_buildings:\n        raise RuntimeError(\n            f"building-type inventory changed unexpectedly: before={before_buildings} after={after_buildings}"\n        )\n'''
          new='''    after_buildings = counts_by_building(files)\n    expected_after = before_buildings.copy()\n    # The source glassworks at NorthRia:5094 has its `building` token physically\n    # split by the pasted silk block, so it is absent from the parsable pre-fix inventory.\n    expected_after["building_glassworks"] += 1\n    if expected_after != after_buildings:\n        raise RuntimeError(\n            f"building-type inventory changed unexpectedly: expected={expected_after} after={after_buildings}"\n        )\n'''
          if s.count(old) != 1:
              raise SystemExit('target inventory validation block not found exactly once')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply only confirmed building-history fixes
        run: python tools/fix_known_building_corruption.py
      - name: Audit repaired structure
        run: |
          python tools/audit_building_structure.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('tools/building_structure_report.json').read_text(encoding='utf-8'))
          assert r['ok'], r
          assert r['totals']['state_tokens'] == r['totals']['nested_states'], r['totals']
          assert r['totals']['nested_create_buildings'] == 0, r['nested_create_buildings']
          assert r['totals']['split_token_fragments'] == 0, r['split_token_fragments']
          print('Verified structure:', r['totals'])
          PY
      - name: Run existing building semantic audit
        run: python tools/audit_buildings.py
      - name: Commit repaired history and diagnostics
        run: |
          if [ -z "$(git status --porcelain -- common/history/buildings tools/building_structure_report.json tools/building_audit_report.json)" ]; then
            echo 'No building changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add common/history/buildings tools/building_structure_report.json tools/building_audit_report.json
          git commit -m 'Fix confirmed corrupted building history blocks'
          git push origin HEAD:main
