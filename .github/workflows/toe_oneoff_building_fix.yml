name: ToE one-off duplicate building merge

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/toe_oneoff_building_fix.yml'

permissions:
  contents: write

jobs:
  merge-and-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge confirmed duplicate sugar plantation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('common/history/buildings/04_NorthAfrica.txt')
          s=p.read_text(encoding='utf-8-sig')
          start=s.index('\ts:STATE_NSM_068={')
          end=s.index('\ts:STATE_NSM_101={', start)
          section=s[start:end]
          assert section.count('building="building_sugar_plantation"') == 2
          small='''\t\t\tcreate_building={\n\t\t\t\tbuilding="building_sugar_plantation"\n\t\t\t\tadd_ownership={\n\t\t\t\t\tcountry={ country="c:XCW" levels=1 }\n\t\t\t\t}\n\t\t\t\treserves=1\n\t\t\t\tactivate_production_methods={ "default_building_sugar_plantation" "pm_road_carts" }\n\t\t\t}\n'''
          large='''\t\t\tcreate_building={\n\t\t\t\tbuilding="building_sugar_plantation"\n\t\t\t\tadd_ownership={\n\t\t\t\t\tcountry={\n\t\t\t\t\t\tcountry="c:XCW"\n\t\t\t\t\t\tlevels=3\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\treserves=1\n\t\t\t\tactivate_production_methods={ "default_building_sugar_plantation" "pm_road_carts" }\n\t\t\t}\n'''
          merged=large.replace('levels=3','levels=4')
          assert section.count(small) == 1
          assert section.count(large) == 1
          section=section.replace(small,'',1).replace(large,merged,1)
          assert section.count('building="building_sugar_plantation"') == 1
          s=s[:start]+section+s[end:]
          p.write_text(s,encoding='utf-8-sig',newline='\n')
          PY
      - name: Audit repaired building history
        run: |
          python tools/audit_building_structure.py
          python tools/audit_buildings.py
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('tools/building_structure_report.json').read_text(encoding='utf-8'))
          b=json.loads(Path('tools/building_audit_report.json').read_text(encoding='utf-8'))
          assert a['ok'], a
          assert a['totals']['state_tokens'] == a['totals']['nested_states'] == 534
          assert a['totals']['nested_create_buildings'] == 0
          assert a['totals']['split_token_fragments'] == 0
          assert b['summary']['brace_errors'] == 0
          assert b['summary']['duplicate_state_ids'] == 0
          assert b['summary']['duplicate_region_state_groups'] == 0
          assert b['summary']['duplicate_building_groups'] == 0, b['duplicate_buildings']
          print('All building audits clean')
          PY
      - name: Commit duplicate merge and diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add common/history/buildings/04_NorthAfrica.txt tools/building_structure_report.json tools/building_audit_report.json
          git diff --cached --quiet && exit 0
          git commit -m 'Merge duplicate North Africa sugar plantation block'
          git push origin HEAD:main
