name: ToE fix engines prestige limit

on:
  push:
    paths:
      - '.github/workflows/toe-fix-engines-prestige.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix engines prestige-good static count
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('common/prestige_goods/00_prestige_goods.txt')
          s=p.read_text(encoding='utf-8-sig')
          old='''prestige_good_schichau_engines = {\n\tpossible = {\n\t\talways = no # ToE: バニラ専用威信財を無効化\n\t}\n\tbase_good = engines'''
          new='''prestige_good_schichau_engines = {\n\tpossible = {\n\t\talways = no # ToE: バニラ専用威信財を無効化\n\t}\n\tbase_good = ammunition # ToE: 無効化済み定義をengines上限から退避'''
          if old not in s:
              raise SystemExit('target block not found')
          if s.count(old) != 1:
              raise SystemExit('target block count is not exactly 1')
          p.write_text(s.replace(old,new,1), encoding='utf-8-sig')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re, collections
          files=[Path('common/prestige_goods/00_prestige_goods.txt'),Path('common/prestige_goods/MSN00_prestige_goods.txt')]
          c=collections.Counter()
          for p in files:
              for m in re.finditer(r'^\s*base_good\s*=\s*([A-Za-z0-9_]+)\s*(?:#.*)?$',p.read_text(encoding='utf-8-sig'),re.M):
                  c[m.group(1)]+=1
          print('engines=',c['engines'],'ammunition=',c['ammunition'])
          if c['engines'] > 3:
              raise SystemExit('engines still exceeds limit')
          if c['ammunition'] > 3:
              raise SystemExit('ammunition exceeds limit after relocation')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add common/prestige_goods/00_prestige_goods.txt
          git commit -m '威信財のengines上限超過を解消'
          git push origin HEAD:main
