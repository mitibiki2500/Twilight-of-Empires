name: ToE Spline Candidate Package

on:
  push:
    branches:
      - toe-spline-regeneration-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Compare and package
        shell: bash
        run: |
          set -euo pipefail
          p='gfx/map/spline_network/spline_network.splnet'
          mkdir -p report out/gfx/map/spline_network
          : > report/candidates.txt
          for ref in main gpt-hub-spine-fix gpt-market-fix gpt-market-newfoot-fix gpt-working; do
            if git show "origin/${ref}:${p}" > "/tmp/${ref}.splnet" 2>/dev/null; then
              printf '%s  ' "$ref" >> report/candidates.txt
              wc -c < "/tmp/${ref}.splnet" | tr '\n' ' ' >> report/candidates.txt
              sha256sum "/tmp/${ref}.splnet" | awk '{print $1}' >> report/candidates.txt
            fi
          done
          cat report/candidates.txt
          # Use the dedicated historical hub/spine repair branch as the test candidate.
          cp /tmp/gpt-hub-spine-fix.splnet out/gfx/map/spline_network/spline_network.splnet
          cat > out/ToE_スパインネットワーク_テスト説明.txt <<'EOF'
          ToE スパインネットワーク テスト版

          対象:
          gfx/map/spline_network/spline_network.splnet

          基準:
          GitHub の過去の専用修正ブランチ gpt-hub-spine-fix に残っていた spline_network.splnet。
          現行 main の locator / map_data は変更しません。

          目的:
          過去に生成・修正したスパインネットワークを、現行ToEへ単独で戻してゲーム内表示と切断状況を確認するためのテストです。

          注意:
          このファイルは道路・ルート表示側のテストです。
          市場接続そのものは state/province adjacency、港、state_region 等の別データにも依存するため、このテストだけで市場接続修正済みとは判定しません。

          確認してほしい点:
          1. 道路が表示されるか
          2. 都市が消えないか
          3. 道路が途中で大量に途切れていないか
          4. 農村部にも道路が出るか
          5. 海上に不自然な陸路が出ないか
          6. 起動時・ロード時にクラッシュしないか

          GitHub main には未反映です。
          EOF
          (cd out && zip -r ../ToE_スパインネットワーク_再生成テスト.zip .)
      - name: Upload test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: toe-spline-regeneration-test
          path: |
            ToE_スパインネットワーク_再生成テスト.zip
            report/candidates.txt
          if-no-files-found: error
