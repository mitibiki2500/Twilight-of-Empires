name: ToE Central Islands 17 arable audit
on:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  audit:
    if: github.event.head_commit.message == 'Audit Central Islands 17 arable land'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate state and agricultural history
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          needle='中央諸島部17'
          print('=== literal matches ===')
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts: continue
              try: tx=p.read_text(encoding='utf-8-sig')
              except: continue
              for i,l in enumerate(tx.splitlines(),1):
                  if needle in l: print(f'{p}:{i}:{l}')
          print('=== CentralIslands state blocks and agriculture ===')
          p=Path('common/history/buildings/08_CentralIslands.txt')
          tx=p.read_text(encoding='utf-8-sig'); lines=tx.splitlines()
          sid=None; name=''; depth=0
          agri={'building_wheat_farm','building_rice_farm','building_maize_farm','building_millet_farm','building_rye_farm','building_livestock_ranch','building_banana_plantation','building_coffee_plantation','building_cotton_plantation','building_dye_plantation','building_opium_plantation','building_sugar_plantation','building_tobacco_plantation','building_tea_plantation','building_silk_plantation','building_vineyard_plantation'}
          for i,l in enumerate(lines,1):
              m=re.match(r'\s*s:(STATE_NSM_\d+)\s*=\s*\{',l)
              if m: sid=m.group(1); name=''
              if '# 州名:' in l: name=l.strip()
              bm=re.search(r'building\s*=\s*"?([A-Za-z0-9_]+)"?',l)
              if sid and bm and bm.group(1) in agri:
                  # print nearby ownership levels too
                  ctx=' | '.join(x.strip() for x in lines[max(0,i-2):min(len(lines),i+8)])
                  print(f'{sid} {name} line {i} {bm.group(1)} :: {ctx}')
          print('=== state region arable entries near value 8 ===')
          for p in Path('map_data/state_regions').glob('*.txt'):
              try: ls=p.read_text(encoding='utf-8-sig').splitlines()
              except: continue
              for i,l in enumerate(ls,1):
                  if re.search(r'arable_land\s*=\s*8\b',l):
                      print(f'{p}:{i}: ' + ' | '.join(x.strip() for x in ls[max(0,i-12):min(len(ls),i+13)]))
          PY
