name: ToE 開始軍州別上限補正（一時）

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  cap-army-state-counts:
    if: github.event.head_commit.message == '開始軍の州別25大隊上限を安全に補正する一時ワークフローを追加'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 国・州ごとの開始大隊数を25以下へ補正
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('common/history/military_formations/99_NSM_population_x4_armies.txt')
          text = path.read_text(encoding='utf-8-sig')

          def find_matching_brace(s, open_pos):
              depth = 0
              for i in range(open_pos, len(s)):
                  if s[i] == '{':
                      depth += 1
                  elif s[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return i
              raise RuntimeError(f'対応する閉じ括弧がありません: {open_pos}')

          countries = []
          for m in re.finditer(r'(?m)^\s*c:([A-Z0-9_]+)\s*\?=\s*\{', text):
              tag = m.group(1)
              open_pos = text.find('{', m.start())
              close_pos = find_matching_brace(text, open_pos)
              countries.append((tag, open_pos, close_pos))

          edits = []
          summaries = []
          for tag, c_open, c_close in countries:
              body = text[c_open + 1:c_close]
              units = []
              for um in re.finditer(r'combat_unit\s*=\s*\{', body):
                  u_open_rel = body.find('{', um.start())
                  u_close_rel = find_matching_brace(body, u_open_rel)
                  block = body[u_open_rel + 1:u_close_rel]
                  sm = re.search(r'state_region\s*=\s*s:(STATE_[A-Z0-9_]+)', block)
                  cm = re.search(r'count\s*=\s*(\d+)', block)
                  if not sm or not cm:
                      continue
                  state = sm.group(1)
                  count = int(cm.group(1))
                  count_abs_start = c_open + 1 + u_open_rel + 1 + cm.start(1)
                  count_abs_end = c_open + 1 + u_open_rel + 1 + cm.end(1)
                  units.append({'state': state, 'count': count, 'start': count_abs_start, 'end': count_abs_end})

              by_state = {}
              for u in units:
                  by_state.setdefault(u['state'], []).append(u)

              for state, group in by_state.items():
                  total = sum(u['count'] for u in group)
                  if total <= 25:
                      continue
                  original = [u['count'] for u in group]
                  # 比率をできるだけ維持しつつ、各兵種を最低1大隊残す。
                  raw = [u['count'] * 25 / total for u in group]
                  new = [max(1, int(x)) for x in raw]
                  while sum(new) < 25:
                      candidates = sorted(range(len(group)), key=lambda i: (raw[i] - int(raw[i]), original[i]), reverse=True)
                      for i in candidates:
                          if sum(new) >= 25:
                              break
                          new[i] += 1
                  while sum(new) > 25:
                      candidates = sorted(range(len(group)), key=lambda i: (new[i], original[i]), reverse=True)
                      changed = False
                      for i in candidates:
                          if new[i] > 1 and sum(new) > 25:
                              new[i] -= 1
                              changed = True
                      if not changed:
                          raise RuntimeError(f'{tag}/{state}: 25以下へ補正できません')
                  for u, n in zip(group, new):
                      if n != u['count']:
                          edits.append((u['start'], u['end'], str(n)))
                  summaries.append(f'{tag} {state}: {original} 合計{total} -> {new} 合計{sum(new)}')

          if not edits:
              raise RuntimeError('25大隊上限を超える開始軍が見つかりませんでした。想定外のため停止します。')

          for start, end, repl in sorted(edits, reverse=True):
              text = text[:start] + repl + text[end:]

          path.write_text('\ufeff' + text, encoding='utf-8')
          print('\n'.join(summaries))
          print(f'変更した count: {len(edits)} 箇所')
      - name: 差分検証
        run: |
          git diff --check
          git diff -- common/history/military_formations/99_NSM_population_x4_armies.txt
      - name: 修正をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common/history/military_formations/99_NSM_population_x4_armies.txt
          git commit -m "開始軍の州別大隊数を上限25へ補正"
          git push
