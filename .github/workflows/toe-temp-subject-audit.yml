name: ToE subject hierarchy audit
on:
  push:
    branches: [ main ]
jobs:
  audit:
    if: github.event.head_commit.message == 'Run ToE full puppet type audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List puppet subjects and country types
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          types={}
          for p in Path('common/history/countries').glob('*.txt'):
              try:t=p.read_text(encoding='utf-8-sig')
              except:continue
              for m in re.finditer(r'c:([A-Z0-9]+)\s*\?=\s*\{',t):
                  tag=m.group(1); b=t.find('{',m.start()); d=0;e=None
                  for i in range(b,len(t)):
                      if t[i]=='{':d+=1
                      elif t[i]=='}':
                          d-=1
                          if d==0:e=i+1;break
                  block=t[m.start():e]
                  tm=re.search(r'set_country_type\s*=\s*(\w+)',block)
                  if tm:types[tag]=tm.group(1)
          p=Path('common/history/diplomacy/00_subject_relationships.txt')
          t=p.read_text(encoding='utf-8-sig')
          for om in re.finditer(r'c:([A-Z0-9]+)\s*\?=\s*\{',t):
              overlord=om.group(1); b=t.find('{',om.start());d=0;e=None
              for i in range(b,len(t)):
                  if t[i]=='{':d+=1
                  elif t[i]=='}':
                      d-=1
                      if d==0:e=i+1;break
              block=t[om.start():e]
              for pm in re.finditer(r'create_diplomatic_pact\s*=\s*\{([^{}]*)\}',block,re.S):
                  body=pm.group(1)
                  cm=re.search(r'country\s*=\s*c:([A-Z0-9]+)',body)
                  tm=re.search(r'type\s*=\s*(\w+)',body)
                  if cm and tm and tm.group(1) in ('puppet','vassal'):
                      child=cm.group(1)
                      print(f'{overlord}({types.get(overlord,"?")}) -> {child}({types.get(child,"?")}) : {tm.group(1)}')
          PY
