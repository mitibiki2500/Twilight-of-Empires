name: ToE Fix Latest Logged Bugs
on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/toe_fix_latest_logged_bugs.py'
      - '.github/workflows/toe_fix_latest_logged_bugs.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply exact log-proven fixes
        run: python scripts/toe_fix_latest_logged_bugs.py
      - name: Commit gameplay fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add common
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 1
          fi
          git commit -m '最新クラッシュログの既知バグを一括修正'
          git push origin HEAD:main
