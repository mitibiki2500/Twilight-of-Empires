name: Temporary final company audit fixes

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/temp-company-final-audit.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source-table corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def find_block(text, name):
              start = text.find(name + ' = {')
              if start < 0:
                  raise RuntimeError(f'block not found: {name}')
              op = text.find('{', start)
              depth = 0
              for i in range(op, len(text)):
                  if text[i] == '{': depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0: return start, i + 1, text[start:i+1]
              raise RuntimeError(f'unbalanced: {name}')

          def edit_block(path, name, edits):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig').replace('\r\n','\n').replace('\r','\n')
              a,b,block = find_block(text,name)
              for old,new in edits:
                  n = block.count(old)
                  if n != 1:
                      raise RuntimeError(f'{name}: expected exactly 1 occurrence, got {n}: {old!r}')
                  block = block.replace(old,new,1)
              p.write_text(text[:a]+block+text[b:], encoding='utf-8-sig', newline='\n')

          west = 'common/company_types/00_nsm_WestEurope_companies.txt'
          east = 'common/company_types/00_nsm_EastEurope_companies.txt'
          north = 'common/company_types/00_nsm_NorthAmerica_companies.txt'

          # TGコープ: 服+染料 (+絹、合繊)
          edit_block(west, 'company_nsm_tg_corp', [
              ('\tbuilding_types = {\n\t\tbuilding_textile_mill\n\t}',
               '\tbuilding_types = {\n\t\tbuilding_textile_mill\n\t\tbuilding_dye_plantation\n\t}')
          ])

          # ファランティエ: 「ガラス直接10%」は処理量ではなく直接出力
          edit_block(west, 'company_nsm_falantier', [
              ('\t\tbuilding_glassworks_throughput_add = 0.1',
               '\t\tgoods_output_glass_mult = 0.1')
          ])

          # ウェラル: 「石炭直接15%」
          edit_block(west, 'company_nsm_weller', [
              ('\t\tbuilding_coal_mine_throughput_add = 0.15',
               '\t\tgoods_output_coal_mult = 0.15')
          ])

          # ウェストパイド: 鉱山全体10%（鉄・石炭だけに限定しない）
          edit_block(east, 'company_nsm_west_paido', [
              ('\t\tbuilding_iron_mine_throughput_add = 0.1\n\t\tbuilding_coal_mine_throughput_add = 0.1',
               '\t\tbuilding_group_bg_mining_throughput_add = 0.1')
          ])

          # コーン・メジャー: 肥料工場は対象産業ではなくBO側だけ
          edit_block(north, 'company_nsm_corn_major', [
              ('\t\tbuilding_wheat_farm\n\t\tbuilding_port\n\t\tbuilding_chemical_plant',
               '\t\tbuilding_wheat_farm\n\t\tbuilding_port')
          ])

          # 先の所有権復旧で崩れたインデントのみ整形（意味は変えない）
          files = [
              'common/history/buildings/00_NorthRia.txt',
              'common/history/buildings/02_WestEurope.txt',
              'common/history/buildings/06_WestAsia.txt',
          ]
          for path in files:
              p=Path(path)
              t=p.read_text(encoding='utf-8-sig').replace('\r\n','\n').replace('\r','\n')
              t=t.replace(
                  '\t\t\t\tadd_ownership={\n\tcompany={\n\t\ttype=company_nsm_riimeus\n\t\tcountry="c:XCC"\n\t\tlevels=5\n\t}\n}',
                  '\t\t\t\tadd_ownership={\n\t\t\t\t\tcompany={\n\t\t\t\t\t\ttype=company_nsm_riimeus\n\t\t\t\t\t\tcountry="c:XCC"\n\t\t\t\t\t\tlevels=5\n\t\t\t\t\t}\n\t\t\t\t}')
              for company in ['company_nsm_corn_major']:
                  t=t.replace(
                      f'\t\t\t\tadd_ownership={{\n\tcompany={{\n\t\ttype={company}\n\t\tcountry="c:XBK"\n\t\tlevels=5\n\t}}\n}}',
                      f'\t\t\t\tadd_ownership={{\n\t\t\t\t\tcompany={{\n\t\t\t\t\t\ttype={company}\n\t\t\t\t\t\tcountry="c:XBK"\n\t\t\t\t\t\tlevels=5\n\t\t\t\t\t}}\n\t\t\t\t}}')
              t=t.replace(
                  '\t\t\t\tadd_ownership={\n\tcountry={ country="c:XAI" levels=5 }\n\tcompany={ type=company_nsm_footwater_line country="c:XAI" levels=5 }\n}',
                  '\t\t\t\tadd_ownership={\n\t\t\t\t\tcountry={ country="c:XAI" levels=5 }\n\t\t\t\t\tcompany={ type=company_nsm_footwater_line country="c:XAI" levels=5 }\n\t\t\t\t}')
              for company in ['company_nsm_machida','company_nsm_ilbone_fisheries']:
                  t=t.replace(
                      f'\t\t\t\tadd_ownership={{\n\tcompany={{\n\t\ttype={company}\n\t\tcountry="c:GSU"\n\t\tlevels=5\n\t}}\n}}',
                      f'\t\t\t\tadd_ownership={{\n\t\t\t\t\tcompany={{\n\t\t\t\t\t\ttype={company}\n\t\t\t\t\t\tcountry="c:GSU"\n\t\t\t\t\t\tlevels=5\n\t\t\t\t\t}}\n\t\t\t\t}}')
              p.write_text(t, encoding='utf-8-sig', newline='\n')
          PY

      - name: Verify fixes
        shell: bash
        run: |
          grep -q 'building_dye_plantation' common/company_types/00_nsm_WestEurope_companies.txt
          grep -q 'goods_output_glass_mult = 0.1' common/company_types/00_nsm_WestEurope_companies.txt
          grep -q 'goods_output_coal_mult = 0.15' common/company_types/00_nsm_WestEurope_companies.txt
          grep -q 'building_group_bg_mining_throughput_add = 0.1' common/company_types/00_nsm_EastEurope_companies.txt
          git diff --check
          git diff --stat
          git diff

      - name: Commit final company audit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common/company_types/00_nsm_WestEurope_companies.txt common/company_types/00_nsm_EastEurope_companies.txt common/company_types/00_nsm_NorthAmerica_companies.txt common/history/buildings/00_NorthRia.txt common/history/buildings/02_WestEurope.txt common/history/buildings/06_WestAsia.txt
          if ! git diff --cached --quiet; then
            git commit -m "Finish company table audit corrections"
            git push origin HEAD:main
          fi
