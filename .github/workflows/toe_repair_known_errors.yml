name: ToE Repair Known Errors
on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/toe_repair_known_errors.py'
      - '.github/workflows/toe_repair_known_errors.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Repair log-proven dangling references
        run: python scripts/toe_repair_known_errors.py
      - name: Commit repaired gameplay files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common
          if git diff --cached --quiet; then
            echo "No gameplay changes to commit"
            exit 1
          fi
          git commit -m "未定義イベントと削除済み機能への参照を一括整理"
          git push origin HEAD:main
