name: ToE Fix Crash and Great Game
on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/toe_fix_crash_great_game.py'
      - '.github/workflows/toe_fix_crash_great_game.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply crash and Great Game fixes
        run: python scripts/toe_fix_crash_great_game.py
      - name: Commit gameplay fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common/scripted_triggers/00_geography_triggers.txt \
                  common/journal_entries/00_player_objectives_great_game.txt \
                  common/journal_entries/99_toe_great_game_subjournals.txt \
                  localization/japanese/replace/toe_great_game_l_japanese.yml \
                  localization/japanese/replace/toe_great_game_status_l_japanese.yml
          if git diff --cached --quiet; then
            echo "No gameplay changes needed"
            exit 0
          fi
          git commit -m "クラッシュ原因とGreat Game進行を修正"
          git push
