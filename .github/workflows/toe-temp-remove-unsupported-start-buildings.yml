name: ToE remove unsupported start buildings
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Patch unsupported starting buildings v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove logged unsupported starting buildings still present
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets=[('南米23','building_silk_plantation'),('東欧3','building_wheat_farm'),('西亜2','building_wheat_farm'),('西亜1','building_wheat_farm'),('西亜12','building_wheat_farm'),('西亜11','building_wheat_farm'),('西亜60','building_silk_plantation'),('西亜37','building_silk_plantation'),('西亜70','building_coal_mine'),('豪14','building_wheat_farm')]
          def bend(t,b):
              d=0
              for i in range(b,len(t)):
                  if t[i]=='{': d+=1
                  elif t[i]=='}':
                      d-=1
                      if d==0:return i+1
              raise RuntimeError('unclosed block')
          changed=[]; skipped=[]
          for name,building in targets:
              hits=[]
              for p in Path('common/history/buildings').glob('*.txt'):
                  raw=p.read_bytes(); text=raw.decode('utf-8-sig')
                  for cm in re.finditer(r'(?m)^\s*#\s*州名:\s*'+re.escape(name)+r'\s*\(STATE_NSM_\d+\)',text):
                      sms=list(re.finditer(r'(?m)^\s*s:(STATE_NSM_\d+)\s*=\s*\{',text[:cm.start()]))
                      if not sms: continue
                      sm=sms[-1]; sb=text.find('{',sm.start()); se=bend(text,sb)
                      if not(sm.start()<cm.start()<se): continue
                      block=text[sm.start():se]; pos=0
                      while True:
                          m=re.search(r'(?m)^\s*create_building\s*=\s*\{',block[pos:])
                          if not m: break
                          a=pos+m.start(); br=block.find('{',a); b=bend(block,br); cb=block[a:b]
                          if re.search(r'building\s*=\s*"?'+re.escape(building)+r'"?',cb): hits.append((p,sm.start()+a,sm.start()+b,sm.group(1),raw.startswith(b'\xef\xbb\xbf')))
                          pos=b
              if len(hits)>1: raise SystemExit(f'{name} {building}: ambiguous hits {len(hits)}')
              if not hits:
                  skipped.append((name,building)); continue
              p,a,b,sid,bom=hits[0]; raw=p.read_bytes(); text=raw.decode('utf-8-sig'); text=text[:a]+text[b:]
              p.write_bytes((b'\xef\xbb\xbf' if bom else b'')+text.encode('utf-8')); changed.append((str(p),sid,name,building))
          print('CHANGED',changed); print('ALREADY_ABSENT',skipped)
          PY
          git diff --check
          git diff -- common/history/buildings
          if git diff --quiet -- common/history/buildings; then echo 'No remaining unsupported targets in current main'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add common/history/buildings
          git commit -m 'Remove remaining unsupported starting buildings'
          git push origin HEAD:main
