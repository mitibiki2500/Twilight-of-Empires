name: ToE sanitize obsolete historical government refs

on:
  push:
    paths:
      - '.github/workflows/toe-sanitize-obsolete-government-refs.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch exact vanilla files and false-gate missing governments
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/settintotrieste/V3-Vanilla-Extract/fa9678c4f570385ccb91bcdf1e25f82f93499b2f/game'
          for f in common/scripted_triggers/00_scripted_triggers.txt common/scripted_triggers/00_clothes_triggers.txt common/script_values/00_diplomacy_values.txt; do
            mkdir -p "$(dirname "$f")"
            curl -fL "$base/$f" -o "$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          bad=set('''gov_zhuz gov_domain_alliance gov_domain_frontier gov_princely_state_rawalate gov_princely_state_maharaja gov_princely_state_diwanate gov_princely_state_khanate gov_princely_state_nizamate gov_princely_state_nawabate gov_princely_state_maratha_raja gov_princely_state_raja gov_princely_state_sultan gov_peru_bolivia_confederal_state_bolivia_dictatorship gov_peru_bolivia_confederal_state_dictatorship gov_peru_bolivia_confederal_autonomy_dictatorship'''.split())
          files=[Path('common/scripted_triggers/00_scripted_triggers.txt'),Path('common/scripted_triggers/00_clothes_triggers.txt'),Path('common/script_values/00_diplomacy_values.txt')]
          rx=re.compile(r'\bhas_government_type\s*=\s*([A-Za-z0-9_]+)')
          total=0; names=set()
          for p in files:
              s=p.read_text(encoding='utf-8-sig',errors='replace')
              def repl(m):
                  if m.group(1) not in bad: return m.group(0)
                  names.add(m.group(1))
                  return 'always = no # ToE: unavailable vanilla historical government type'
              ns=rx.sub(repl,s)
              c=ns.count('# ToE: unavailable vanilla historical government type')
              p.write_text(ns,encoding='utf-8-sig')
              total+=c; print(c,p)
          print('references sanitized:',total)
          print('government types:',len(names))
          print('\n'.join(sorted(names)))
          if total < 15: raise SystemExit('unexpectedly low replacement count')
          for p in files:
              s=p.read_text(encoding='utf-8-sig',errors='replace')
              if s.count('{')!=s.count('}'): raise SystemExit(f'brace mismatch {p}')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add common/scripted_triggers/00_scripted_triggers.txt common/scripted_triggers/00_clothes_triggers.txt common/script_values/00_diplomacy_values.txt
          git commit -m '旧史実政府タイプ参照をToE向けに無効化'
          git push origin HEAD:main
