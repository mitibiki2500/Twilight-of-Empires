name: ToE Fix Remaining Assertions
on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/toe_fix_remaining_assertions.py'
      - '.github/workflows/toe_fix_remaining_assertions.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix remaining assertion sources
        run: python scripts/toe_fix_remaining_assertions.py
      - name: Commit repaired gameplay files
        run: |
          if git diff --quiet -- common/prestige_goods/00_prestige_goods.txt common/character_templates/00_default_template.txt; then
            echo "No gameplay changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common/prestige_goods/00_prestige_goods.txt common/character_templates/00_default_template.txt
          git commit -m "Prestige Goods上限と必須character default templateを修正"
          git push
