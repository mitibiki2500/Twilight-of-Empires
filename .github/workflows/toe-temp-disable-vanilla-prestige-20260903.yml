name: ToE バニラ専用威信財無効化（一時）

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  disable-vanilla-prestige:
    if: github.event.head_commit.message == 'バニラ専用威信財無効化用の一時ワークフローを追加'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 1.13.9威信財定義を基準に専用品だけ無効化
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import json

          # 1.13.10/1.13.11では00_prestige_goods.txtに変更がないため、
          # 公開Vanilla Extractの1.13.9確定版を基準にする。
          url = 'https://raw.githubusercontent.com/settintotrieste/V3-Vanilla-Extract/425903911502aaaae050f682108093a0131eb7b5/game/common/prestige_goods/00_prestige_goods.txt'
          text = urlopen(url).read().decode('utf-8-sig')
          marker = '# GENERIC PRESTIGE GOODS'
          if marker not in text:
              raise RuntimeError('汎用威信財セクションを検出できません')
          before, after = text.split(marker, 1)
          old = 'possible = {\n\t\thas_dlc_feature = mp1_content\n\t}'
          count = before.count(old)
          if count < 40:
              raise RuntimeError(f'専用威信財のpossibleブロック数が想定より少ない: {count}')
          before = before.replace(old, 'possible = {\n\t\talways = no # ToE: バニラ専用威信財を無効化\n\t}')
          # 汎用品はバニラ通りDLC条件を維持。
          out = '\ufeff' + before + marker + after
          p = Path('common/prestige_goods/00_prestige_goods.txt')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(out, encoding='utf-8')

          # Total ConversionとしてこのDBだけはToE側定義を完全採用する。
          meta = Path('.metadata/metadata.json')
          data = json.loads(meta.read_text(encoding='utf-8-sig'))
          paths = data['game_custom_data']['replace_paths']
          if 'common/prestige_goods' not in paths:
              # custom ToE prestige goods fileも同ディレクトリなので残る。
              paths.append('common/prestige_goods')
          meta.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 要求確認
          generated = p.read_text(encoding='utf-8-sig')
          dedicated, generic = generated.split(marker, 1)
          assert 'prestige_good_sea_island_cotton' in dedicated
          assert 'prestige_good_kikkoman_soy_sauce' in dedicated
          assert 'always = no # ToE: バニラ専用威信財を無効化' in dedicated
          assert 'prestige_good_generic_grain' in generic
          assert 'prestige_good_generic_small_arms' in generic
          assert 'prestige_good_generic_merchant_marine' in generic
          assert 'always = no # ToE: バニラ専用威信財を無効化' not in generic
          print('disabled dedicated prestige goods:', count)
      - name: パイド綿と企業参照を検証
        shell: python
        run: |
          from pathlib import Path
          pg = Path('common/prestige_goods/MSN00_prestige_goods.txt').read_text(encoding='utf-8-sig')
          co = Path('common/company_types/00_nsm_EastEurope_companies.txt').read_text(encoding='utf-8-sig')
          assert 'prestige_good_MSN_escano_cotton = {' in pg
          assert 'base_good = fabric' in pg
          assert 'company_nsm_eskandel = {' in co
          assert 'prestige_good_MSN_escano_cotton' in co
      - name: 差分検証
        run: |
          git diff --check
          git diff --stat
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common/prestige_goods/00_prestige_goods.txt .metadata/metadata.json
          git commit -m "バニラ専用威信財を無効化して汎用品のみ維持"
          git push
