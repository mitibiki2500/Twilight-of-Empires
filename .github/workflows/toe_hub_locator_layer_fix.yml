name: ToE Hub Locator Layer Fix

on:
  push:
    branches:
      - gpt-hub-spine-fix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-hub-layers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: gpt-hub-spine-fix
          fetch-depth: 0

      - name: Patch generated hub locator layers
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path('gfx/map/map_object_data/generated_map_object_locators_city.txt'),
              Path('gfx/map/map_object_data/generated_map_object_locators_farm.txt'),
              Path('gfx/map/map_object_data/generated_map_object_locators_mine.txt'),
              Path('gfx/map/map_object_data/generated_map_object_locators_wood.txt'),
              Path('gfx/map/map_object_data/generated_map_object_locators_port.txt'),
          ]

          for path in files:
              raw = path.read_text(encoding='utf-8-sig')
              old = 'layer=""'
              new = 'layer="locators"'
              count = raw.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one {old!r}, found {count}')
              raw = raw.replace(old, new, 1)
              path.write_text('\ufeff' + raw, encoding='utf-8')
              print(f'patched {path}')

      - name: Verify only locator layer headers changed
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            gfx/map/map_object_data/generated_map_object_locators_city.txt \
            gfx/map/map_object_data/generated_map_object_locators_farm.txt \
            gfx/map/map_object_data/generated_map_object_locators_mine.txt \
            gfx/map/map_object_data/generated_map_object_locators_wood.txt \
            gfx/map/map_object_data/generated_map_object_locators_port.txt
          do
            grep -q 'layer="locators"' "$f"
            if grep -q 'layer=""' "$f"; then
              echo "empty layer remains in $f" >&2
              exit 1
            fi
          done
          git diff --check
          git diff --stat

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No locator layer changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gfx/map/map_object_data/generated_map_object_locators_city.txt \
                  gfx/map/map_object_data/generated_map_object_locators_farm.txt \
                  gfx/map/map_object_data/generated_map_object_locators_mine.txt \
                  gfx/map/map_object_data/generated_map_object_locators_wood.txt \
                  gfx/map/map_object_data/generated_map_object_locators_port.txt
          git commit -m 'Fix hub locator map layer assignment'
          git push origin HEAD:gpt-hub-spine-fix
