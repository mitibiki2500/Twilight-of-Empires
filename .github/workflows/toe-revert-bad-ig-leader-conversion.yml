name: ToE revert invalid IG leader conversion

on:
  push:
    paths:
      - '.github/workflows/toe-revert-bad-ig-leader-conversion.yml'

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore pre-conversion character history
        shell: bash
        run: |
          set -euo pipefail
          git checkout 9ef3e3a6a908ce6140d1a9908c07f92b0d7f961d -- common/history/characters/00_nsm_characters.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('common/history/characters/00_nsm_characters.txt')
          s=p.read_text(encoding='utf-8-sig')
          assert 'set_as_interest_group_leader = yes' not in s
          assert s.count('ig_leader = yes') == 839, s.count('ig_leader = yes')
          assert s.count('{') == s.count('}')
          print('restored 839 original inline IG leader flags; braces balanced')
          PY
          git config user.name 'mitibiki2500'
          git config user.email '100456694+mitibiki2500@users.noreply.github.com'
          git add common/history/characters/00_nsm_characters.txt
          git commit -m '無効だったIG指導者一括置換を撤回'
          git push origin main
