l_english:
  anb_formation.1.t: "Anbennarian Reunification"
  anb_formation.1.d: "congrats lad, you remade anbennar"
  anb_formation.1.f: "eyo cool quote"
  anb_formation.1.a: "All under the Dove"
  anb_formation.2.t: "The End of Weakness"
  anb_formation.2.d: "The  [SCOPE.GetRootScope.GetCountry.GetName] again stands tall, its banners unfurled over lands once torn by strife. Our people, scattered and defiant, now bend to a single will—ours."
  anb_formation.2.f: "The air reeks of iron and ash and rotting flesh. Six banners once flew defiant—remnants of the old Great Command, fierce and fractious. For their effort, Ghilakhad’s cliffs echo with the screams of the fallen, the Shamakhad Plains lie trampled under our boots, and the rivers of Nadiraji run red with the toll of our ambition. \n\nYet from this carnage, a singular truth emerges: the Great Command, reforged in the crucible of war, rises unbroken forevermore. \n\nOur kin are humbled, their Marshals kneel or rot, and the dream of our ancestors rises anew. Will we seize it?"
  anb_formation.2.a: "Let all who oppose us tremble, for we have claimed our destiny."
  notification_unification_notification_anbennar_name: "[SCOPE.sCountry('formation_country').GetAdjective] Unification"
  notification_unification_notification_anbennar_desc: "[SCOPE.sCountry('formation_country').GetName] has achieved national unification, bringing together the [SCOPE.sCulture('unification_culture').GetName] people under one banner."
  notification_unification_notification_anbennar_tooltip: "#header $notification_unification_notification_anbennar_name$#!\n$TOOLTIP_DELIMITER$\n$notification_unification_notification_one_culture_desc$"
  anb_formation.4.t: "A new future for Aelantir"
  anb_formation.4.d: "After centuries of conflicts, the newly formed [ROOT.GetCountry.GetAdjective] state seeks to be an equal union bridging the rifts between its [SCOPE.sCulture('unification_culture_3').GetName], [SCOPE.sCulture('unification_culture_2').GetName], [SCOPE.sCulture('unification_culture_4').GetName], and [SCOPE.sCulture('unification_culture').GetName] citizens."
  anb_formation.4.f: "The days of fighting among the children of Cannor and the sons of the Ynn are gone. Our great peoples share the same destiny, bound to Aelantir as our home and not the whims of the powers of Cannor.\n\nWhere some in the past tried to unite central Aelantir by force, like the tyrant Jahanon, it is the brilliant mind of [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('ruler_scope').GetFullNameNoFormatting] that will be remembered by history as having united ruinborn and cannorian as equals. We always knew that our greatness could be greater shared, and perhaps one day it will be be even greater and shared with the rest of Aelantir as well."
  anb_formation.4.a: "The people of Noruin and the Ynn share the same inherent destiny."
  