  ideology_father_nimrith_more_capitalist: "Father Nimrith"
  ideology_father_nimrith_more_capitalist_desc: "Nimrith’s body may have fallen, but His faith lives on. It is the duty of every true believer not only to spread the worship of the Great Dragon Nimrith but to participate in the rituals of the Nimrithain. These are a yearly gathering in which every believer is required to contribute wealth, where wealth and relics, items of value and faith are brought together to be scrutinized and assessed for their value, and if found sufficient added to the Hoard. These Hoards are located in many Nimrithian temples, and a major hoard resides in every major metropolitan area, but every eight years there is a grand Ritual of the Nimrithian, in which all the major regional hoards are gathered together and moved to the capital to be added to the Great Hoard of Nimrith. Every item of wealth donated will bring us closer to the return of Nimrith, and surely those who contribute the most will be proportionally rewarded upon that fateful day!" 
