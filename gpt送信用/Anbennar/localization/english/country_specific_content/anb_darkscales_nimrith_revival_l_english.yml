  darkscale_nimrith_revival_events.1.t: "The Resurrection of Nimrith is Nigh"
  darkscale_nimrith_revival_events.1.d: "The possibility to create a host for the spirit of Nimrith is here; our reborn Nimrith will lead our nation to new heights of glory!"
  darkscale_nimrith_revival_events.1.f: "With new technological revelations spreading to our nation, we believe that the time of Nimrith’s revival is near. Our offerings to the hoard have been amassing for centuries now and our priests claim that the time of awakening is drawing close. With the resources available to us and the latest advancements we have discovered, we shall build our Lord and God a new body so He may once more live among us."
  darkscale_nimrith_revival_events.1.a: "Nimrith shall return"
  darkscale_nimrith_revival_events.2.t: "To Build a Dragon"
  darkscale_nimrith_revival_events.2.d: "To build a suitable vessel at such a scale will require monumental efforts. While the Priest-Smiths could provide such, it would take much time, and it may thus be beneficial to request the aid of another influential group in our nation."
  darkscale_nimrith_revival_events.2.f: "A grand debate has started amongst the members of our court as to who should provide the parts to construct the shell that will house Nimrith Reborn. Three main factions have pushed themselves to prominence: the Priest-Smiths themselves, the Industrialists supported by [SCOPE.gsInterestGroup('industrialists_ig').GetLeader.GetFullName], and the groups backing [SCOPE.gsInterestGroup('petty_bourgeoisie_ig').GetLeader.GetFullName], representing our traditional guilds of artisans. They look to [ROOT.GetCountry.GetRuler.GetFullName] to make the call as to which to focus on. While both the industrialists and the artisans will accede to the primacy of the priest-smiths in this task, choosing either of them over the other is likely to alienate the other and potentially cause problems going forward."
  darkscale_nimrith_revival_events.2.c: "The Priest-smiths will be Sufficient"
  darkscale_nimrith_revival_events.2.b: "[SCOPE.gsInterestGroup('industrialists_ig').GetLeader.GetFullName]’s assistance would be useful."
  darkscale_nimrith_revival_events.2.a: "Our artisans under [SCOPE.gsInterestGroup('petty_bourgeoisie_ig').GetLeader.GetFullName] will be who we need."
  darkscale_nimrith_revival_events.3.t: "To Train a Dragon"
  darkscale_nimrith_revival_events.3.d: "As a constructed being, we have the opportunity to influence what aspect of rulership Nimrith will be most drawn towards."
  darkscale_nimrith_revival_events.3.f: "As a tool’s form defines its function, so too shall the shaping of Nimrith Reborn optimise the focus of the future leader of our nation. Should Nimrith be a military leader, an all-seeing administrator, or a spiritual guide beyond compare? The [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName] under [SCOPE.gsInterestGroup('armed_forces_ig').GetLeader.GetFullName] push for a fiercely intelligent general for our nation, to defend our borders and draw to us our compatriots throughout the Dwarovar; the [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] are pushing for a Philosopher-King who exemplifies enlightened ideas of justice and progress; the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] are eager that he prove a masterful and wise a theologian and an unceasing source of wisdom,  as any true God-king should."
  darkscale_nimrith_revival_events.3.b: "We support the [SCOPE.gsInterestGroup('armed_forces_ig').GetLeader.GetFullName] and the [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName] in this matter"
  darkscale_nimrith_revival_events.3.c: "We find ourselves agreeing with [SCOPE.gsInterestGroup('intelligentsia_ig').GetLeader.GetFullName] and the [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] "
  darkscale_nimrith_revival_events.3.a: "We concur with the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] in the matter of our God and King"
  darkscale_nimrith_revival_events.4.t: "The Resurrection Complete"
  darkscale_nimrith_revival_events.4.d: "Our efforts have paid off, Nimrith is reborn."
  darkscale_nimrith_revival_events.4.f: "We have successfully completed the body and mounted the rulership matrix. The Priest-Smiths have spent the last three days in a series of complex rituals, inscribing runes onto the scales of the massive metallic dragon’s frame and burning large volumes of sacred incenses., On the dawn of the fourth day, the frame shakes, then roars as surges of energy rock the entire ritual. Then, Nimrith Reborn opens its eyes for the first time. \n\n All the expenses and hardships seen by our people over the centuries have not been for naught. Our true God and King Nimrith has returned to us at last. All throughout Kuxheztë we are announcing this wondrous news, and the coronation (while only a formality) will conclude shortly."
  darkscale_nimrith_revival_events.4.a: "All hail Nimrith reborn, true ruler of [ROOT.GetCountry.GetName]"
  darkscale_nimrith_revival_events.5.t: "A More Traditional Path"
  darkscale_nimrith_revival_events.5.d: "Recent discoveries in the depths have unearthed a foundation-shaking alternative: A Red Dragon egg has been uncovered, and we have verified that it is close to hatching."
  darkscale_nimrith_revival_events.5.f: "The nation is abuzz with the news from our most prominent university; a recent excavation has uncovered a red dragon’s egg which is showing clear signs of being close to hatching. After a hastily assembled conclave of the highest ranking members of the ruling priesthood, they have published their interpretation: this discovery is a sign from Nimrith that we should not attempt to create life ourselves, but instead nurture what many believe to be Nimrith’s reincarnation."
  darkscale_nimrith_revival_events.5.a: "We shall raise this God and in time they will lead us."
  darkscale_nimrith_revival_events.6.t: "God is dead, and we killed it."
  darkscale_nimrith_revival_events.6.d: "Our people are slowly turning away from the belief that Nimrith will or should return to watch over us in the physical world, and slowly the dominance of the clergy is finally fading in a wave of modernization. Thus, we no longer see fit to waste precious resources on returning a fallen God."
  darkscale_nimrith_revival_events.6.f: "Our past rulers were weak, and took the single path that is open to the impotent ruler - that of false worship of material deities. Such a path that was leading us to enervation and death. There is no hope in stubbornly clinging to the past. It is our duty to face the future and march onward, not retreat inward. Now we look towards the truths of science and Artifice, and embrace the future of our people, whatever it may be."
  darkscale_nimrith_revival_events.6.a: "Our existence has rendered restoring Nimrith’s worthless"
  spiritual_ruler_darkscales_nimrith_revival: "Nimrith will be a spiritual ruler"
  darkscale_have_partenered_with_artisans_darkscales_nimrith_revival: "Our artisans will help construct the body for our god"
  darkscale_have_partenered_with_factories_darkscales_nimrith_revival: "The factories will churn out parts to help construct the body for our god"
  stuck_to_smith_priests_darkscales_nimrith_revival: "Our smith priests will construct the body for our god"
  military_ruler_darkscales_nimrith_revival: "Nimrith will lead our troops"
  intelligentsia_ruler_darkscales_nimrith_revival: "Nimrith will be an enlightened monarch"
  je_darkscale_nimrith_revival_reason: "Every member of the Nimrithan faith knows the tale: how an army of cutthroats and adventurers slaughtered their way into the hold of Khugdihr and brutally butchered both the faithful and our god, before driving us out of our homes and plundering Nimrith’s hoard. Since then our people have regularly performed the rituals of Nimrith, contributing to the hoards of the Priesthood in the hope that these acts of devotion would return our god to us.\n\n Following recent technological developments in our nation, we have started the process of constructing a new body that our priesthood believes can call back the soul of Nimrith from the Great Beyond. It will require much sacrifice from our people and the dedication of a large amount of materials, but the faithful believe it will be worth it in the end. The hope of having our God and King return to lead our people forevermore is a powerful symbol in this uncertain age. "
  je_darkscale_nimrith_revival: "Building a God"
