l_english:
  unlock_rubyhold_process: "Negotiate with Rubyhold"
  unlock_rubyhold_process_desc: "We have long coveted the secrets of rosemetal manufacture. To this end, we have maintained cordial relations with Rubyhold and spared no effort in currying favor with the Ruby Dwarves. Now, as our control over Rubyhold deepens, the time has come for this friendship to yield more tangible results—after all, friendship is a two-way bond, and the Ruby Dwarves should also contribute to this friendship."
  rosemetal_technoloy_payment: "Rosemetal Technology Transfer Fee"
  rosemetal_technoloy_received: "Rosemetal Technology Transfer Fee"
  anb_rosemetal_events.1.t: "The Rosemetal Technology Negotiations"
  anb_rosemetal_events.1.d: "As our influence over the affairs of Rubyhold continues to deepen, negotiations between our two realms regarding rosemetal technology have been formally placed on the agenda. These discussions concern the methods, scope, and cost of replicating the rosemetal smelting process and its complete industrial system. The Ruby Dwarves continue to emphasize the uniqueness and confidentiality of their craft traditions, yet our representatives have noted that, in order to maximize the mutual interests of both nations, a long-standing friendship ought to be reflected in more substantive forms of cooperation. Should the relevant technology remain strictly guarded without provision for sharing, the existing foundation of cooperation and the future direction of relations between our realms would inevitably require reassessment."
  anb_rosemetal_events.1.f:0 "Key treaty points circa [TimeKeeper.GetCurrentDate.Format('y')], written by unknown [ROOT.GetCountry.GetAdjectiveNoFormatting] diplomat\n\n1. Full respect for the autonomy of Rubyhold to be guaranteed.\n\n2. A technology transfer fee is to be provided, to be settled in full within three months.\n\n3. Rosemetal smelting must be strictly confined to the Lencenor region, assuaging the insistent demands of various local rosemetal master artisan forgers, who wish to ensure "ye's imitations aren't embarrassing our ancestors"."
  anb_rosemetal_events.1.a: "A Win-Win Deal!"
  