 A30_FLAVOR_TEXT:0 "The Royal Wizards – Floodborn mages, trained from childhood and augmented through ritual – were once the embodiments of Núrcestiran magocratic absolutism. And yet, as the Royal Demense was neglected and exploited by Camir’s descendants, the Royal Wizards of the east could only watch in horror as their hard-won order fell apart.\n\nThe Blackpowder Rebellion gave them an opportunity to right the course – as the Magocratic Demense, Castonath stands as a bastion of the old order against a shifting tide. Will they restore order to a shattered Escann? Or will they merely herald a new Age of Witch-Kings?"
