 B74_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B75_FLAVOR_TEXT:0 "In the wake of a devastating slave revolt, a new governor was selected by the King of Busilar himself. The island of Tropaicóst has the potential to become a real paradise and the pearl of the Ruined Sea, if it wasnt shackled to the past. Will the new governor rise to the occasion and save Tropaicóst, no matter the cost?" #temporary loc
 B76_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B77_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B78_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B79_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B80_FLAVOR_TEXT:0 "Eordand is known as the land of relics, home to the most well preserved precursor ruins of all Aelantir. This has naturally brought the attention of the Gnomish Hierarchy, which launched an invasion of the region in 1782. Defeating the forces of Darran Eaglesthorn and the Autumnal League, they seized the Randrunnese to exploit its resources in the name of progress.\n\nWhile the rest of Eordand has formed a loose front to halt its expansion, the Administration still aims to bring the entire region under itself by force if needed."
 B81_FLAVOR_TEXT:0 "$EORDAND_FLAVOR_TEXT$"
 B82_FLAVOR_TEXT:0 "$EORDAND_FLAVOR_TEXT$"
