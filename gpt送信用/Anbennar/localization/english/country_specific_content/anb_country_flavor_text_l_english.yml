 C36_FLAVOR_TEXT:0 "$NEKHEIS_FLAVOR_TEXT$"
 C37_FLAVOR_TEXT:0 "$NEKHEIS_FLAVOR_TEXT$"
 C38_FLAVOR_TEXT:0 "The Grand Confederation of Mteibhara prospered for centuries as an autonomous Cynheia of Ameion. But the Empire, only truly interested in the Mteibhar's mineral wealth, did nothing when their brother-cities Deyeion and Amgremós attempted to seize it.\n\nBesieged by the Nekheis, and with rising unrest at home, the Confederation’s unpopular military rulers now turn to the Cannorians for aid. But with new ideas spreading to the valley, and the people hungry to reclaim what was taken from them, will the Confederation survive the coming storm?"
 C39_FLAVOR_TEXT:0 "Once the [concept_ambhen_empire] was the most powerful in Aelantir, but the 1700s saw it reduced to a shadow of its former self. In Devand the Echaté League falters, while native revolts and Klereyen rebellions reduced Ameion’s Taychendi holdings to their eastern capital, Sotereion.\n\nTorn between their ambition to reclaim Laskaris the Conqueror’s empire, and the opportunity to lead amongst the Nékheis against encroaching Cannorians and a galvanized Kheios, will Ameion reclaim their rightful place, or will their hubris finally cast them into irrelevance?" # Ameion
