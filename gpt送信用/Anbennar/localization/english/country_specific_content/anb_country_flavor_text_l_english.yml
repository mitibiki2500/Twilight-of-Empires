 Y38_FLAVOR_TEXT:0 "Far from their home, from their rivals, and even their Triunic brethren, Zhongbeikgang was the final stop of the last Treasure Fleet, carrying not valuables, but the refugees of Beikdugang away from the chaos of the Rending. \n\nDecades have now passed, and with help from Zurkanrek, those refugees have built a new home in this remote wilderness. Yet the wind of change is arriving from both sides of their coast. Rumour abound, carrying claims of the end of isolation in Yarikhoi and resumption of war in Yanshen. A leaf of a ship in a storming sea, the future of Zhongbeikgang and its vast hinterland waits undecided."
