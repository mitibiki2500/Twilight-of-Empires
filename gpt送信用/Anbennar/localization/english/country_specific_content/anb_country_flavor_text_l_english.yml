 C30_FLAVOR_TEXT:0 "After the loss of their Nékheis colonies, the ancient Kheions were forced to face an uncomfortable truth: being the cradle of Kheionai civilisation meant little in the face of bad politics, and superior firepower.\n\nAfter uniting into a single federal league in 1787, and a twenty year campaign against the Eltibar, the Kheions now fully dominate Alecand. As Cannorians encroach on the Cleaved Sea, can Kheiós reclaim their rightful status? Or will the winds of change prove even greater than those of the Kaydhano?" # Kheios
 C31_FLAVOR_TEXT:0 "$NEKHEIS_FLAVOR_TEXT$"
 C32_FLAVOR_TEXT:0 "The former Nékheis of Empkeios was the first to fall to Cannorian invaders. Taking advantage of the Devandic War of Independence, the Vanbury Guild sent an invasion force, intent on sweeping aside the weakened Kheionai.\n\nWhile successful, a prolonged siege left the city-state in ruins and stalled the planned invasion in its infancy. While the governor maintains a tenuous hold over Empkeios, tensions in the Cleaved Sea are at an all time high. Can the VG fulfil their dreams of economic hegemony?" # VG Devand
 C33_FLAVOR_TEXT:0 "$NEKHEIS_FLAVOR_TEXT$"
 C34_FLAVOR_TEXT:0 "$NEKHEIS_FLAVOR_TEXT$"
