l_english:
 GENERIC_COUNTRY_FLAVOR_TEXT:0 "The time of sword and sorcercy has come to a close. In its place, a new era dawns upon all of [concept_halann] - one of steam and [concept_artificery_lowercase]. Will this new tomorrow bring promise... or ruin?"

 #Cannor
 A01_FLAVOR_TEXT:0 "Anbennar means unity – and Camir Silmuna thought he had finally secured it. Consolidation and centralisation, renewed religious toleration, and a tight leash on novel artificery and political dissent alike: a new Mages’ Peace. It didn’t last long.\n\nThe eruption of the Blackpowder Rebellion, fueled by the Second Unravelling’s ideals and the old regime’s magocratic excesses, has given Anbennar another chance to fulfil its name. And yet, as nationalists question Anbennar’s very foundations, the revolution’s enemies gleefully await another chance to crush it. Will the Dove rise ascendant, or finally come crashing down?"
 A02_FLAVOR_TEXT:0 "The Empire of the síl Vivins is a mess hidden by a masquerade, a patchwork domain of feudal states stitched together by blood ties and convention. It is a rural, stagnant realm, an elected monarchy in name only, carefully kept in considered balance.\n\nBut that balance teeters on the edge. As the aristocracy cling to their undying privileges, and the síl Vivins to power, the healing of the Folly and the rise of industrialisation threaten to undermine the position of both. Will the Vivin Empire prove an immortal realm, or will the mask finally fall?"
 A03_FLAVOR_TEXT:0 "When the Kingdom of Lorent’s new queen looks upon her domains, she does so with pride. An unparalleled navy, ruling the waves; an absolute monarchy, still upholding Adean’s cause; the greatest colonial empire in the world, cradling the Ruin Sea and dominating the Bay of Rahen.\n\nBut pride is no longer enough. While the crucibles of the Northern League outpace Lencenor’s economy, the ideals of the Blackpowder Revolt threaten the very foundations of traditional rule. Will the rose wither, or will the Ruby Crown’s guidance ensure it glistens forevermore?"
 A04_FLAVOR_TEXT:0 "Gawed was once the giant of the north – a land of oaths, of Great Lords and greater hosts, of industrious magnates. Yet, as time went on, it became the latter group who upheld the Gerwick dynasty’s reign. Eventually, the magnates bought power with blood – the Northern League was born.\n\nForty years on, the north lies under the control of a capitalist oligarchy, and stands as the crucible of an industrial revolution. The Northern League is poised to rise as the leader of a new age of capital – but will the Alen’s children rise with them?"
 A05_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 A06_FLAVOR_TEXT:0 "Numbers were always a gnomish strong suit. As the Nimscodd Hierarchy reclaimed the Dragon Coast, they exploited the grim calculus of colonialism to rise to the forefront of artifice and innovation. Kobolds were shipped overseas to secure gnomish supremacy, while calculated interventions advanced Oddansbay’s interests.\n\nBut the numbers are turning against them. As the gregarious kobolds confound gnomish prejudice, new powers with larger workforces and bigger militaries begin to catch up to gnomish industry. And yet, from beyond the Kiamoa, a new disruptive factor emerges: the mechanim. Can innovation save the Hierarchy once more?"
 A07_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 A08_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 A09_FLAVOR_TEXT:0 "Across Halann, the Silnaras have spread Ravelianism at rifle-point, professing a mission of imperial protection and assimilation under the lion-banner – now, the Stone Lions guide thousands of ships through the straits of Tef each year, as the riches of Busilar’s colonial empire flood into the metropole.\n\nNow, with their new allies in the Northern League, the embers of industry are gathering across Businor’s arid hills. Yet old threats and new challenges arise, as Hapiande’s subjects question the mission of their overlord. Will Busilar's golden age continue?"
 A10_FLAVOR_TEXT:0 "Grombar has long loomed over the north, orc and human united under a staunchly Corinite militaristic monarchy – but with the Northern League recently inflicting a shocking defeat on Grombar’s vaunted army, that fearsome image has been shaken.\n\nBut just as Grombar transformed from Graytide to Gray Kingdom, King Bakram believes that it must once more evolve, even as he clings to absolutism. Nascent industrialisation stokes the fires of the north, and new opportunities arise in the east – will the Gray Kingdom be able to harness these advantages, or will they finally fall? "
 A11_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 A12_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 A13_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 A14_FLAVOR_TEXT:0 "Through pluck, blood, and a little gnomish aid, the Small Country – breadbasket of Cannor – won their independence. However, while the Hierarchy’s subsequent assistance gained them Beepeck and Eaglecrest, it has also rendered the agrarian idealists of the halfling state a mere cog in the Market Apparatus.\n\nIn the cities of the Middanroy, however, gnomish surveyors and halfling nationalists alike look to a new path to economic growth – industrialisation. Can the Small Country forge an industry of their own? Or will the riches beneath their feet continue to feed the bellies of foreign powers?"
 A15_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 A16_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 A17_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 A18_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 A19_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 A20_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 A21_FLAVOR_TEXT:0 "The home of ancient Castanor; the beacon of medieval chivalry; the frontier of adventure, heirs to Corin; the battleground of Floodborn witch-kings, a maelstrom of magedeath. Escann has worn many faces – and it does not suit it to wear one for long.\n\nThe absolutist Núrcestir, transformed into the Royal Demense by the Silmunas, sought to tame the region – but neglected by its masters, Castonath’s rule has shattered. As fractious adventurer-kingdoms clash with magocratic remnants, Blackpowder stratocracies and foreign invaders, who will emerge as the master of Escann?"
