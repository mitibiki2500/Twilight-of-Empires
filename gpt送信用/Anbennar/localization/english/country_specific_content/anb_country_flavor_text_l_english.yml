 C54_FLAVOR_TEXT:0 "For centuries, the jaguar-riders of Caergaraen struggled against their mortal enemies, the Bloodcloaks of Rakkabuttai. Eventually forced to flee to Assakadail, they survived only through piracy, and the political concerns of the Bloodcloaks’ Ambhen masters.\n\nBut the green-flamed sword of Munazhlan cannot be extinguished so easily. As Ameion receded, Caergaraen advanced. With Cannorian assistance, they razed Rakkabuttai, and then turned south to finish off their weakened overlord. Though they were beaten back, the Chendhyans stir once more – can they finally win freedom for their people?"
