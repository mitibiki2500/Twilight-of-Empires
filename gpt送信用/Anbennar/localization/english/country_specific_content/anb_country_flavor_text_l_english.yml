 #North Aelantir
 EORDAND_FLAVOR_TEXT:0 "The war between the seasons proved inconclusive in the end. While Eordand has known a period of great progress and societal progress during the 16th and 17th century, inventing its own firearms before Cannorians even brought their own in the region, this prosperity also became a focus for the greed of colonial powers.\n\nAt the height of Eordan might, while Darran Eaglesthorn had ensured the Dragon Dominion's surrender and was campaigning in the Ynn, also came an unexpected Cannorian invasion at home. In the wake of this existential threat was formed the Four Seasons Alliance, the first widescale cooperation between the servants of all the different fey Courts."
 YNN_FLAVOR_TEXT:0 "The world works in cycles, like how the Ynn River brings both flood and bountiful harvest.\n\nHalf a century ago, the Empire of Arverynn came to the brink of proclaiming the Ynnic Empire reborn, but now the feudal order of the Ynn has been forever upset with its destruction at the hands of the New Havoric Jahanon sil Lethir, bandit king of the mountain, the Cannorian Usurper, self-proclaimed sovereign of the Ynn.\n\nYet the world works in cycles, and the Decades of the Mountain ended when his line was slayed by Morvel Vyrekynn and a grand coalition of Dominion and Cannorian forces. Yet the world works in cycles, and dust stirs in the Expanse, heralding a new era of smoke and iron..."
 B01_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B02_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B03_FLAVOR_TEXT:0 "Once the greatest trading company of history, the CLSTC has seen better times. Where it once dominated worldwide trade, it is now being overshadowed by other Cannorian ventures like the LHC or BHC. Nonetheless, the company has navigated the tumultuous times of Blackpowder with Silcalas finesse, and where some may believe the era of colonial trade companies over, they simply lack Silcalas ambition -for the company knows that everything can be sold and bought. The stars and planes themselves will be monetized, in time."
 B04_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B05_FLAVOR_TEXT:0 "Two things rule the world: firepower and money, and the Vanbury Guild is in no shortage of both. Those powerful forces secured the guild many holdings all over Aelantir's western coast along the years. However, the guild structure is rapidly proving outdated in this modern age, and the island of Vanburia is so very, very far from the company's homeland of Telgeir... Will the company face the modern age at the point of a gun? Will Vanburia seize its own destiny and crown the first king of the House of Vanbury since 1170?"
 B06_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B07_FLAVOR_TEXT:0 "For the rest of the world, this is the age of artificers. For the smallfolk of Haraf, this is the age of the Triarchy, of perfect symbiosis in the name of progress. Ever seen the union of the three city-states, the country has experienced a scientific and economic boom that seemingly sees no end.\n\nYet this seemingly perfect surface hides a growing malaise, as some are questioning what kind of future the country is rushing towards as it starts to grow colonial ambitions of its own. Will the Triarchy remember its idealistic roots, or rush ever forward in the quest for progress?"
 B08_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B09_FLAVOR_TEXT:0 "Land of the carefree, Minaria ironically used to be a penal colony under Lorentish rule and a prime destination for dissenters. However, it proved to mostly be a drain on the crown's finances, and Lorentainé decided to sell its Haraf holdings during the Blackpowder Wars to Neratica for a hefty sum to cut its losses. This came to be after a series of skirmishes over the disputed Tameter region which convinced the Lorentish that the land was more trouble than it was worth, which are remembered with sourness in Minaria.\n\n While Emil sil Onyx may style himself as ruler of Neratica-Minaria, Minaria could very well decide otherwise..."
 B10_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B11_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B12_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B13_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B14_FLAVOR_TEXT:0 "The Azure Rose is the most prized jewel of the Lorentish crown. Those lands were the first ones sighted by Endral the Explorer back when Aelantir was rediscovered, and here settlers built a true nation despite the odd fog that sometimes engulfs the island. But all infancy must come to an end, and nations too grow up. Endralliande is coming out of age, ready to face its own challenges; will it prove to be up to the task?"
 B15_FLAVOR_TEXT:0 "In the aftermath of the Blackpowder Wars, many smaller Imperial colonies were seized by Lorent who consolidated them under other existing administrations. This is how the minor island of Torrisheah found itself growing tenfold overnight, suddenly having to administer most of the Ravenous Isle and its giant man-eating flora. What was supposed to be a simple transfer of authority has gradually worsened, and most of Ravenous Isle is bordering on anarchy. Will the Torrisheah administration avoid this seemingly inevitable collapse ?"
 B16_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B17_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B18_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B19_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B20_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B21_FLAVOR_TEXT:0 "The native kingdom of Ynnsmouth stands between two worlds, both a member of the Trollsbay Concord and a nominal vassal of the Sarda Empire; a Boek king crowned by the Sarda ruling with a Cannorian-style administration. The time to break this paradox fast approaches, its strategic location too important to leave it the luxury of autonomy for much longer. What will Ynnsmouth choose, and will it truly choose for itself?"
 B22_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B23_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B24_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B25_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B26_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B27_FLAVOR_TEXT:0 "A grim kingdom of death, Neratica rules over a large Cheshoshi ruinborn population converted to the worship of Nerat. While the Neratic priesthood used to lead its people, this status quo recently changed as Emil sil Onyx went from an ambitious general in charge of a borderland garrison to the hero of the Tameter, marching on Arca Onyx with implicit Lorentish support.\n\nHe has made his ambition to unite Neratica and Minaria clear, as he believes that only standing together could they face the Concord and Triarchy surrounding them. Will Emil successfully change the balance of power in North Aelantir?"
 B28_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B29_FLAVOR_TEXT:0 "It has been almost ten years since Morvel, the Tiger Empress, slew the son of the Bandit King Jahanon and freed Sarda. Yet, decades of Havoric rule forever changed Ynnic society. Morvel's gentle yet firm hand keeps together Ynnic nobles and Cannorian subjects alike, but how will Ynnic feudalism endure in the modern era?"
 B30_FLAVOR_TEXT:0 "$YNN_FLAVOR_TEXT$"
 B31_FLAVOR_TEXT:0 "$YNN_FLAVOR_TEXT$"
 B32_FLAVOR_TEXT:0 "$YNN_FLAVOR_TEXT$"
 B33_FLAVOR_TEXT:0 "$YNN_FLAVOR_TEXT$"
 B34_FLAVOR_TEXT:0 "$YNN_FLAVOR_TEXT$"
 B35_FLAVOR_TEXT:0 "New Havoral lives in the shadow of mountains, literally and figuratively. Not only is it a pariah as Jahanon's conquests and the Era of the Mountain are still recent, but the republican faction that seceded when the kingdom dissolved was pushed to the Dalairey Range by the Sarda. Will New Havoral stay in the shadow of the past?"
 B36_FLAVOR_TEXT:0 "$YNN_FLAVOR_TEXT$"
 B37_FLAVOR_TEXT:0 "$YNN_FLAVOR_TEXT$"
 B38_FLAVOR_TEXT:0 "$YNN_FLAVOR_TEXT$"
 B39_FLAVOR_TEXT:0 "The Patriarch and his patrician supporters control a trade network spanning all of the Ynn thanks to a monopoly on river trade, but both the Sarda and the Rzentur have their eyes set on the floating city's wealth. Will Bosancovac manage to play them off against each other, or become a pawn in their game?"
 B40_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B41_FLAVOR_TEXT:0 "$YNN_FLAVOR_TEXT$"
 B42_FLAVOR_TEXT:0 "$YNN_FLAVOR_TEXT$"
 B43_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B44_FLAVOR_TEXT:0 "$YNN_FLAVOR_TEXT$"
 B45_FLAVOR_TEXT:0 "$YNN_FLAVOR_TEXT$"
 B46_FLAVOR_TEXT:0 "$YNN_FLAVOR_TEXT$"
 B47_FLAVOR_TEXT:0 "$YNN_FLAVOR_TEXT$"
 B48_FLAVOR_TEXT:0 "$YNN_FLAVOR_TEXT$"
 B49_FLAVOR_TEXT:0 "Over twenty years have passed since the Peace of New Havorton, when the Bandit King was made to surrender to Gospodh Aranthiv and bow before the Dragon God Varlengeilt for mercy. Uncharacteristically the Dominion has not moved to war since, focusing on home by taking steps toward military industrialisation and integrating their recent territorial gains. As the saviour of the Ynn from High Havoric dominance the Dominion is now in a place of diplomatic approachability and goodwill, which may be important as they seek to cast off coloniser hands grasping at the nations of their Ruinborn Elven kin."
 B50_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B51_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B52_FLAVOR_TEXT:0 "$YNN_FLAVOR_TEXT$"
 B53_FLAVOR_TEXT:0 "$YNN_FLAVOR_TEXT$"
 B54_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B55_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B56_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B57_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B58_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B59_FLAVOR_TEXT:0 "Land of frozen lakes and big hearts, Themaria has forged its own destiny untied to any colonial overlord for most of its history. Increased Hierarchy presence in northern Aelantir has recently brought them into their sphere of influence, for good and bad."
 B60_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B61_FLAVOR_TEXT:0 "The prosperous Dalairey coastline was given its own administration in hopes to increase gnomish control in the region. However, the colony has failed to rise in importance compared to the other Dalairey colonies as initially expected."
 B62_FLAVOR_TEXT:0 "As kobolds were sent away to distant lands by the Hierarchy, some realized that could also mean potential freedom for their people. While many migrated west to follow the rumors of a dragon, Noo Coddoran was founded by kobolds simply wanting to live free, without any oppressor ruling over them. Will their people thrive in the frozen north?"
 B63_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B64_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B65_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B66_FLAVOR_TEXT:0 "$YNN_FLAVOR_TEXT$"
 B67_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B68_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B69_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 B70_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
