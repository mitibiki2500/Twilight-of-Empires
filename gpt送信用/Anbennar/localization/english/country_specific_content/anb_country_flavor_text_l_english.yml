 #SOUTH AELANTIR
 TAYCHEND_FLAVOR_TEXT:0 "Taychend suffers no interloper. Ameion fallen, Rezankand retreated, the Oren Nayiru shattered; clearly, the day of the traditionalist warlords has come again. With the concurrent fall of the vampiric Kingdom of Rakulacimai, however, it is clear that day will be a bloody one.\n\nBut what the Rakulacans introduced to Taychend – how to exploit artificery, and how to wield the Cannorians to your advantage – has not been forgotten. The question remains: will the Taychendi successfully wield these new weapons, or fall victim to them?" 
 KLEREYEN_FLAVOR_TEXT:0 "Ameion sought to “uplift” the Taychendi through Kheionisation, and through that effort rose the Klereyen. But as they rose, the so-called “Pureblooded” Ambhen grew afraid, and tried to reverse what could not be stopped. The state of their empire attests to their “success”.\n\nBut so too does the state of the divided and fractious Klereyen successor states. As the Taychendi warlords grow in strength, and Cannorians encroach ever further, can the Klereyen truly reclaim the legacy of Laskaris the Conqueror?"
 NEKHEIS_FLAVOR_TEXT:0 "The Nékheis were once obedient colonies, focused on feeding the Kheions and fending off the Basobhar. But as new technologies allowed them to push far into Devand, the Nékheis began to realise they had outgrown their mother cities – so, they cast them off.\n\nBut even as they enjoy independence, the Vanbury Guild advances, while a galvanised, united Kheiós stirs. In the face of this, the Devabhen dream of a new course: unification – Theinós. But what will be the cost of Devand’s ascent?"

