 A25_FLAVOR_TEXT:0 "Lady Luck may be Araionn’s patron goddess, but fate has not been kind to the Ionnic as of late. The only Adeanic nation in the heart of Corinite Escann, some would say its continued existence is proof the gods must smile on them.\n\nOthers say that the odds are turning against them. Having lost half their territory to Ancardia, the ever shifting borders of Escann threaten to condemn Ara’s faithful to the dustbin of history. Will they survive the rising tide? Or has Araionn’s luck finally run out?"
