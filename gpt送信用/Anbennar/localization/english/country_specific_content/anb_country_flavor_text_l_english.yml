 B96_FLAVOR_TEXT:0 "$EORDAND_FLAVOR_TEXT$"
 B97_FLAVOR_TEXT:0 "$YNN_FLAVOR_TEXT$"
 B98_FLAVOR_TEXT:0 "Some claim that the Old Concord voting its own end and the dissolution of the constituent republics into a united nation was an inevitability, an inherent destiny that history couldn't have deviated from. Other believe that it was under the fire of the Bloodgroves War during the Blackpowder Wars that the country was forged.\n\nBut as the old institutions are being integrated in the new federal structure, one question permeates all debates: what kind of nation will the Concord be? Should the Trollsbay keep the fruits of its labor to itself? Should it lead Noruin into a prosperous commonwealth? Or should it turn towards its often forgotten Ynnsmen cousins, and bring the light of democracy to the continent?"
 B99_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
 G05_FLAVOR_TEXT:0 "Kobolds were resettled en masse to Dalaire by the Hierarchy after taking control of the region. Can they forge a new homeland in those foreign lands?"
 G06_FLAVOR_TEXT:0 "Inner Dalaire was initially settled by Derannics until the duchy was conquered by Lorent. The now leaderless colony was brought under the Hierarchy's protection, and has been ever since. Dreams of a unified Dalaire have not been forgotten here; will they come to pass?"
 G07_FLAVOR_TEXT:0 "Gerudians sailed west in hopes of wealth and freedom, like other cannorians. The invasion of Bjarnrik by the Gawedi saw the colony take a different path from its homeland as the Hierarchy intervened to secure its interests in Dalaire. Will Nyr Revrhavn lead the way for their Dalairey brothers?"
 G08_FLAVOR_TEXT:0 "The lands between Dalaire and the Ynn are inhabited by the telepathic Cursed Ones, and were thought impossible to cross by land. That is, until the Reachman explorer Ollor Frosthair recently managed to secure a path with the Hierarchy's newly invented Bondbreakers..."
 G09_FLAVOR_TEXT:0 "$GENERIC_COUNTRY_FLAVOR_TEXT$"
