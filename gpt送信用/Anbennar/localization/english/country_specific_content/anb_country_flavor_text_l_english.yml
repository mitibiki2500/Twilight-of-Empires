 Y09_FLAVOR_TEXT:0 "What fools these mortals be! While the [concept_great_command] conquered the earth, it left the Oni to tend the Heavens. Led by a consortium of four [concept_shirgrii], the Oni of Azjakuma quietly corrupted the High Temples, feeding on the spirits within the Spirit Plane and performing the Inu Ekuesnambi, contributing to the arrival of the [concept_rending]. In exchange for just a bit of Korashi, the [concept_great_command] bargained away its life. \n\nAnd so the Oni survived, and plotted, and succeeded. Finally batting away the petty human invasions, it turned inwards, harnessing the Chi of the Rending into a final, grand ritual: the creation of the Tamonger Eternal, an immortal ruler that would unite the Chi of all spirits and Oni. Now Azjakuma stands on the precipice of total victory, though it appears to all the world in complete stagnation. Soon, all of Haless will bow before the spirit-empowered Oni, a total subjugation of all spirits and mankind.\n\nAnd yet, questions remain. Can the old Oni magic withstand the force of properly industrialized artificery? How does one account for the unanticipated presence of the Great Spirits? And just HOW eternal is this Tamonger, anyway..?"  #TODO: nested tooltip for: High Temples | Spirit Plane | Inu Ekuesnambi| Chi | Tamongor | Oni
