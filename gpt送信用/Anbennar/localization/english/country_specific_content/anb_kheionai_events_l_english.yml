kheionai_events.1.t:0 "Reflection and Reclamation" 
kheionai_events.1.d:0 "Aldan and Arethon, Ameion and Empire - 8000 years apart, they cradle a corpse, and face a momentous decision: will they cast the die, or step away from the table?"
kheionai_events.1.f:0 "“The Echate League fractures – the Klereyen laugh at us! We are on the edge of annihilation!” Jeers, catcalls, as #Yellow Aranthis Soúdras#! half-rouses his dying faction. “And yet, the Kylakas struts– ‘situation normal!’ When will he wake up, and admit that things have changed?!”\n\nThen #blue Révothoros Machíproianes#! rises, snarls, jabs a finger. “When you wake up, and admit the Keintagogists' TREASON!” The Móloists roar – their opponents deflate, ashen-faced.\n\n“BUT–” The Kylakas’ voice carves through the clamour. “One thing you said was true– things HAVE changed!”\n\nThe roar settles. Silence. Révothoros has their attention, now. Good - the histories would like this moment to be quiet.\n\n“Ameion… the Age of Laskaris is DEAD…!”"
kheionai_events.1.a:0 "“...the #r Age of Reclamation#! has begun!”"
kheionai_events.1.b:0 "“...the #blue Age of Reflection#! has begun!”"

