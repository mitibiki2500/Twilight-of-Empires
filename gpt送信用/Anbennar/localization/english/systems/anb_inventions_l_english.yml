l_english:
### PRODUCTION 
 damestear_meteorology: "Damestear Meteorology"
 damestear_meteorology_desc: "By understanding the skies and stars we can learn to predict where damestear showers are more likely to occur, but most importantly, assess historical data to identify and uncover sites of ancient showers that hold vast quanities of untapped damestear just beneath the Halann's surface."
 punch_card_artificery: "Punch Card Artificery"
 punch_card_artificery_desc: "Gone are the days of Artisan Artificery, where we still relied on handwritten spell scrolls to imbue upon our nascent inventions. Now even the most complex instructions can be spelled out with a symbol holes and shapes, done not by hand or by wizard, but by machine. Truly, artificery and thus magic will now reach the industrial scale!"
 elemental_elicitation: "Elemental Elicitation"
 elemental_elicitation_desc: "The foundations of magic have always been about harnessing the elements. Before, a mage was required to channel to the elemental planes, but now we've cracked it and can cut out the middle-man. The answer? Mathematics. The Planes of Existence follow their own laws, where left is up and down is green - but there is one universal constant it seems, and that is mathematics."
 damestear_faceting: "Damestear Faceting"
 damestear_faceting_desc: "Damestear has long been used to store magical energy, crafted bespokely for the specific magical object, curio or invention - but with new techniques applying the same principles of mundane faceting to damestear, it has been discovered that certain cuts could actually amplify magic just as it reflects light. This has allowed for the mass-production of damestear crystals, now cut into standardized gemstone shapes."
 runescript_integration: "Runescript Integration"
 runescript_integration_desc: "Runes have been the hallmark of magic for many civilizations such as the giants and dwarves, utilizing symbols and letters to engrave instructions into objects. Even traditional abjuration and its wards are seen as a form of runic writing. But with the advent of punch-card artificery, it was only a matter of time before the two were combined. Now, a new programmatic language based off runes are written into punch-cards as if a line of command, allowing for more complex and varied instructions to be given to inventions."
 damestear_cores: "Damestear Cores"
 damestear_cores_desc: "The ability to generate power in a mobile fashion has long been a challenge of industry. By placing a large and brilliantly cut, yet dangerously unstable gemstone within an encased core, it allows the residual magic to radiate heat, and thus energy, to be harnessed and transferred to whatever you can plug the core into. While still in its infancy, this has allowed for the creation of a powerful yet portable source of energy, without needing to integrate large and cumbersome engines into artifice."
 industrial_mechs: "Industrial Mechs"
 industrial_mechs_desc: "No longer does a labourer be limited by their own physical strength. With the advent of mechs, a single worker can lift buildings, move boulders, and perform tasks that would normally require stationary cranes or scores of workers."
 thinking_machinery: "Thinking Machinery"
 thinking_machinery_desc: "With new advancements in the field, automata servants can now handle more complex tasks as if they were truly alive, and better, other inventions can now be made to think for itself or follow the whims of its masters: servo arms, thinking cranes, self-moving furniture, harvesting machines and more! So attentive. So obedient. It's as if they really are alive!"
 thaumic_rail: "Thaumic Rail"
 thaumic_rail_desc: "By inducing a thaumic field along a track, trains can be made to levitate, reducing the impact of terrain, friction and other obstacles. Some Thaumic Trains can even move as fast as a bullet!"
 insyaan_analytical_engine: "Insyaan Analytical Engine"
 insyaan_analytical_engine_desc: "Long has mathematics and logic been constrained by the mind - but what if we could create a calculating machine with such computational power that we could simply put punch card spells into, and let the machine do the work? An interface in which we could speak to our inventions! Realists have balked at the idea, but we have found the missing link: the mechanim of Insyaa. Reverse-engineering their components has resulted in a working analytical engine - opening up the gates to a new world of automata and, shall we call it, computing science?"
 chem_bound_magic: "Chem-Bound Magic"
 chem_bound_magic_desc: "Soon after the advent of industrial chemical plants, artificers discover how to use their products in artificery. By experimenting with chemicals and finding which bind best with magic, innovations can be made in all sorts of enchantment processes."
 industrial_exosuits: "Industrial Exosuits"
 industrial_exosuits_desc: "Why have an extra strong arm when you can have an extra strong body, with all the utility and doodads you need? Crafted from the finest metals in existence, exosuits will pave the way allowing a single worker to have the power of a dozen, all whilst keeping say in these ever-dangerous times."
 thaumic_field_stabilization: "Thaumic Field Stabilization"
 thaumic_field_stabilization_desc: "The phenomena known as the Thaumic Field has been known for centuries, with its prominent case being the wild magic zones of Amadia. Within it, magic was once unpredictable, spells acting erratically or modified to work in different ways - but now we have learned to stabilize a very specific function of this phenomena: that of amplifying a spell, not just any, but the exact same spell cast within the field! This has allowed for the amplification of any magical spell a hundredfold, pushing the limits of artifice and magic itself."
 enchanting_for_efficiency: "Enchanting For Efficiency"
 enchanting_for_efficiency_desc: "As sparkdrives lose out to cheap and effective steam engines, artificers turn their trade towards trying to make those engines more powerful. They enchant engines for speed, fuel efficiency, and more, while also finding ways to store large amounts of material in traincars through Train Cars of Holding."
 magical_wiring: "Magical Wiring"
 magical_wiring_desc: "Through developments in thaumic fields and precision engineering, "wiring" can be developed that links various types of magics together. These are still basic in comparison to electrical wiring, but they provide a basis for latter innovation."
 thinking_servos: "Thinking Servos"
 thinking_servos_desc: "Why stop at replacing your own body parts? Why not add more? An extra arm to hold an extra tool, or legs to help stabilize and lift heavy objects. With the Analytical Engine interfacing with Insyaan components, it allows the mechanical implements we create to do more and more advanced actions and instructions - it really feels like the servos are listening! Mind and brass body as one!"  #kauga moment
 brass_prosthesis: "Brass Prosthesis"
 brass_prosthesis_desc: "The artificery of the Blackpowder Wars killed many and maimed many more, but it is said that war breeds innovation. Through the power of artificery a limb lost is but a temporary setback, allowing many veterans and more to walk, hold, fight and rebuild even better than before."
 magic_wave_stabilization: "Magic Wave Stabilization"
 magic_wave_stabilization_desc: "Magical Wave Theory was one of the first universal theories of magical metaphysics. First invented in the Triarchy, it posits that magic exists as waves within a vacuum with no physical interactions, and it isn't ntil enough arcane energy is concentrated that it can affect the physical world or take the form of damestear. This theory ended up being wrong, but its application spawned incredible innovations anyways (particularly in the form of porcelain 'wave-stabilization.')"
 early_mechanim: "Early Mechanim"
 early_mechanim_desc: "As time goes on, mechanim tech develops further. (OOC NOTE: Tech is a placeholder until Insyaan lore is better-established.)"
 pathway_transmutation: "Pathway Transmutation"
 pathway_transmutation_desc: "Transmuting large quantities of anything is hard: but it turns out that there's a way to make it easier. By sprinkling in the desired end product with the raw material, artificers can manipulate the magochemical "pathways" between the objects. The closer the origin material is to the desired material, and the more of the desired material is mixed in with the origin material, the easier it gets to transmutate en masse."
 chronoculture: "Chronoculture"
 chronoculture_desc: "Through accessing the life-force of plants through spirit energy, and manipulating that life-force with artificery, we can now accelerate time from the perspective of plants! This allows growing things at far greater rates."
 gene_transmutation: "Gene Transmutation"
 gene_transmutation_desc: "The power of biomancy has always been a dream for many wizards following the steps of the precursor elves of Insyaa, but now we have been able to harness Spirit Energy, life-force, even, to begin to manipulate and modify the qualities of living things, where it be plant or animal."
 essence_extraction: "Essence Extraction"
 essence_extraction_desc: "Magic and the Magical Reagents that enable it, for much of history, has been a thing unquantifiable. Eye of newt, wyvern's blood, having to actually capture an elemental to extract its powers... but no longer: artificery has finally broken down the properties of what makes reagent do what they do into simple and quantifiable essences - now we can mix-and-match galore!"
 electroarcanism: "Electro-Arcanism"
 electroarcanism_desc: "Another failed theory, like Magical Wave Theory, which believes there to be a fundamental relationship between magic and electricity. It is later proven wrong-- they may aid each other, but there's no inherent connection between the two-- yet this theory still provided the basis for some interesting technological advancements, especially in damesoil."
 catalytic_imbuement: "Catalytic Imbuement"
 catalytic_imbuement_desc: "As material sciences improve in both mundane and magical ways, they can be combined together to great effect. The very foundations, molecules, some are calling them, can be imbued and altered by magic, allowing for the creation of entirely new materials with properties never before seen! The createst of which is the advancements in porcelain, itself a naturally resistant material against magic, but with these new processes, it allows us to scale against the advancements of the Thaumic Field."
 terraformestry: "Terraformestry"
 terraformestry_desc: "The peak of magical terraforming comes with "terraformestry," the full regrowth and transformations of forests at the whims of their foresters. After centuries of logging, old-growth forests can be brought back to life; no matter their original form, trees can be made to be bigger, better, harder, and of entirely different species. With pathway transmutation and nitrogen_fixation, almost nothing is impossible."
 anti_friction_magnemancy: "Anti-Friction Magnemancy"
 anti_friction_magnemancy_desc: "With electricity being conquered, magic meets with electricity's twin: magnetism. By creating magnemancers and magnetic artificery, trains can be made to levitate (aka creating maglevs) and damesoil extraction becomes even better than it already was."
 artificial_life: "Artificial Life"
 artificial_life_desc: "The creation of synthetic life has long been an ambition, but all that have come before have paid a dear price or ended up, eventually, with abominations. But those were mages' folly: through science and modern arcanochemical processes we can see how simple it really is as life is synthesized from proteins, cells, and magic itself. What could go wrong?"
#  advanced_mechanim: "Advanced Mechanim"
#  advanced_mechanim_desc: "As time goes on, mechanim tech develops further. (OOC NOTE: Tech is a placeholder until Insyaan lore is better-established.)"
 programming_reality: "Programming Reality"
 programming_reality_desc: "After discovering how to make fully-sentient and programmable creatures, what else is there left to program except reality itself? As a nigh-apotheosis of artificery, this represents artificers discovering how to truly domesticate magic and make it do whatever they want it to do."
 morphic_transmutation: "Morphic Transmutation"
 morphic_transmutation_desc: "TODO"
 the_fifth_fundamental_force: "The Fifth Fundamental Force"
 the_fifth_fundamental_force_desc: "For so long, artificers have struggled to comprehend the fundamental makeup of magic: but now, finally, they have done it. Magic is a fundamental force of the world, just like gravity, the weak force, the strong force, and the electromagnetic force. It can be manipulated, it can be understood, it can be turned into equations, and it can be conquered. With this conquering, damestear can exploited as to create the most-efficient sources of electricity possible."
 alchemical_alloys: "Alchemical Alloys"
 alchemical_alloys_desc: "Metal. In some ways, that was the true mark of mankind. Man tamed the stones, the bones of the earth below. Man tamed the fire, that ephemeral, consuming soul of life. And combining the two, he drew forth the marrow of the rocks themselves, then made molten tools." #this is a mistborn quote ;^) -Jay
 subterrenes: "Subterrenes"
 subterrenes_desc: "You've heard of submarines, but what's harder than the sea? Bedrock, the center of the earth! The new age of exploration aside, subterrenes can drill and melt through rock and earth, behind empty tunnels that allow for the excavation and extraction of minerals with more ease and precision than explosives - of course, there is a bit of risk to personnel with such endeavours."
 apparitional_communicators: "Apparitional Communicators"
 apparitional_communicators_desc: "TODO: its holograms"
 magically_miniaturized_machinery: "Magically Miniaturized Machinery"
 magically_miniaturized_machinery_desc: "With the power of reduction spells, doodads and compartments can be crafted, then shrunken to a fraction of their original size. This allows for far more complex parts, and even the storage of fuels on a greatly-enhanced scale. From magical miniaturization comes not only portable vehicles (which are capable of holding far greater amounts of fuel in their tanks), but also advancements in all sorts of complicated enchantments!"
#  mechanical_spell_inscription: "Mechanical Spell Inscription"
#  mechanical_spell_inscription_desc: "Where the artificed punch card allows for spells to be easily contained and copied, the mechanical spell inscriber allows for these spells to be easily applied to manufactured objects. Inscribers may now be calibrated to apply all sorts of stored spells, quickly and easily, to anything an industrialist might desire!"
#  alchemical_enrichment: "Alchemical Enrichment"
#  alchemical_enrichment_desc: "The alchemist has long dreamed of turning lead into gold: and now, finally, this is possible. While powerful mages have long been able to accomplish this feat, it was never at scale: but through careful application of sulfuric compounds, transmutation may now take place on an industrial scale. In the pursuit of this ability, alchemists have also discovered chemical reactions that have become useful in fields ranging from baking to damestear extraction."
 damesteam_engines: "Damesteam Engines"
 damesteam_engines_desc: "For a time, the Sparkdrive and the steam engine seemed at odds. The former was powered by mana itself; the latter simply used coal to boil water. Recent discoveries, though, have combined these two sources of power into one glorious field of science. Damestear may be used to enchant coal, making it burn hotter and easier; then, that magically-enhanced coal can actually be used to extract mana from damestear. This positive reinforcement cycle has allowed for far more efficient engineering, especially when it comes to replicating the strange 'Mechanim' from Insyaa!"
 rubyhold_process: "Rubyhold Process"
 rubyhold_process_desc: "The Rubyhold Process is a specialized steelmaking workflow typically mastered by Rubyhold, enabling steel mills to produce rosemetal(limited to the Lencenor region only)."

 ### SOCIETY
 tradition_of_equality:0 "Tradition of Equality"
 tradition_of_equality_desc:0 "This society has a long tradition of equality with both genders enjoying equal political right being seen as the natural state of affairs."
 interest_groups_like_women_tt:0 "Landowners will support more egalitarian gender laws."
 psionic_theory: "Psionic Theory"
 psionic_theory_desc: "real XCOM shit"
 planar_portals: "Planar Portals"
 planar_portals_desc: "enables you to use and make em"
 interplanetary_portals: "Interplanetary Portals"
 interplanetary_portals_desc: "enables you to use and make em. space edition"
 automated_translators: "Automated Translators"
 automated_translators_desc: "its a universal translator. well you still need to teach it, but still"
 department_stores: "Department Stores"
 department_stores_desc: "No longer do you have to visit arcades to go to individual stores, instead, what if its all in the same place? Imagine this: a building, filled with different departments of all things and types. No longer do you need to visit a dozen tailors to find your finest dress, what if they were all in the same place?! Better more, apparitional illusions and the latest in viewcatcher technology will bring you suggestions on what to buy next - we call it... advertising!"
 planar_philosophy: "Planar Philosophy"
 planar_philosophy_desc: "some stuff about planes innit"
 magocracy: "Magocracy"
 magocracy_desc: "A government ruled by mages, for mages. For if the world runs on the idea that might makes right, it is surely the wand that is stronger than the sword."
 commercial_airships: "Commercial Airships"
 commercial_airships_desc: "We thought once that the seas were the glue between nations, but no, it is the very air we breathe! The skies soar with opportunity, and airships are its heralds. Forget the borders of nations, or the boundaries of terrain: the skies are now open for business."
 demonsterization_diplomacy: "Demonsterization Diplomacy"
 demonsterization_diplomacy_desc: "As the philosopher Maurice síl Salcertaut once said: 'That hate you carry for another's unchanging nature is not a weapon against them, but a poison you drink hoping they will perish. To truly be free, you must put down the cup.'"
 relic_reverse_engineering: "Relic Reverse-Engineering"
 relic_reverse_engineering_desc: "Across the Empyreal, relics of the past are found, and with them, the secrets of the ancients. It is believed that once a civilization learns not only to reflect and respect its past, but also break it down and create something new from its pieces, can it truly move forward. By studying relics, societies across the cosmos have learned to first replicate, then improve - and as such artifice was born."
 mages_in_the_workforce: "Mages in the Workforce"
 mages_in_the_workforce_desc: "Once the Blackpowder Rebellion tore down the old order of mages (or was it the anti-magic black damestear, really?), mages were forced to adapt to the new world. No longer could they live in ivory towers, no longer could they be patrons to be petitioned for their services. Now, mages had to work for a living, and as such, they found their way into the workforce, just like everyone else."
 mechanim_rights: "Mechanim Rights"
 mechanim_rights_desc: "The creation of artificial mechanim has been a double-edged sword. On one hand, it has allowed for the creation of incredible inventions that have made life easier for everyone - to think, a servant at your beck and call! On the other hand, were they really simply machines in the first place? All Insyaan Mechanim have a Kauga - its mind and soul in one, and the artificial ones have their own, whether it be twisted or deformed or remade or otherwise. Even that of thinking machinery: your favourite chair that knew just where to move, or your additional servo arm that catches falling objects just in time. Are the Insyaan Mechanim simply programmed imitations of their creators, or did the precursor truly create life itself? And if so, what rights do these mechanim have, if any at all? Does than unit have a soul?"
 gestalt_consciousness: "Gestalt Consciousness"
 gestalt_consciousness_desc: "A Gestalt consciousness is a single, unified mind or intelligence formed by linking multiple individual consciousnesses, functioning as a "hive mind" or collective entity."
 
 ### MILITARY
#  camiran_doctrine: "Camiran Doctrine" - TODO - Renable if cooler stuff is made for it.
#  camiran_doctrine_desc: "Named after Emperor Camir, the unifier of Escann and conqueror of Anbennar. Through him, gone were the age of war wizards duelling to settle the fate of nations. Instead, he re-envisioned mages as inherent support units first and foremost. A bastion. It advocated for the use of last-minute magical barriers to maximize defensive strength and troop survival. Its most radical tenet was the Covenant of Command, mind-magic that could range from boosting troop morale to exerting total, unified control over an entire army, transforming a chaotic battlefield into a synchronized instrument of war."
 elemental_armaments: "Elemental Armaments"
 elemental_armaments_desc: "For a long time the Sparkdrive has been the poster-child of artifice weaponry. But with the advances of the planar sciences it has allowed the harnessing of the creation of improved, deadlier, more ambitious weapons that channel the raw power of the elements themselves. Fire, ice, lightning, wind, earth, life, death - all subscribe to the mathematics of warfare now."
 glyphships: "Glyphships"
 glyphships_desc: "The sea has always been a tumultous place for magical warfare. Too unsteady for ritual work, distances too far your usual brand of war magic. But with the advancements magical in storage, and the proto-cannon designs to channel magic from the precursor ship Diranhriá, it has allowed the creation of glyphships - versatile and specialized ships that can utilize the ship as both the source, and radically, the literal spellcasting foci for all manners of magicin not only warfare, but exploration and travel.
 thinking_turrets: "Thinking Turrets"
 thinking_turrets_desc: "Holding ground is hard, especially when you're getting shot by bullets and cannon from afar. But what if you could create mobile defenses that could track and shoot targets on their own? With the discoveries of thinking machinery, it has allowed for war-artificers to deploy defenses without the need of a crew, allowing for more flexible and mobile tactics. Of course it won't stand in a pitched battle, but warfare is evolving to beyond such archaic methods."
 military_airships: "Military Airships"
 military_airships_desc: "The first airships weren't the ones bringing death from above, no, but the ones who secured the skies. Reconassiance and power projection were the first steps in aerial warfare, and because anti-air was still in its infancy: the only way to beat an airship was with an airship of your own."
 airship_bombardiers: "Airship Bombardiers"
 airship_bombardiers_desc: "Who would have thought that cannons were heavy? Once the artificers figured out how to make airships bigger and carry more weight, it was only a matter of time before the hierarchy of power changed. Indeed, across the cosmos the airship became the symbol of Halanni imperialism: for how do you counter a foe that can strike from the skies, obliterate entire armies and cities and disappear before you can even react?"
 military_skyships: "Military Skyships"
 military_skyships_desc: "The air balloon part of an airship had always been its weak point. Vulnerable to weather, to enemy fire, and of course sharp objects, it was only a matter of time before someone thought: what if we just got rid of it? Now these new ships, skyships as they are imaginatively called, can fly higher, faster and longer than airships, whilst still carrying the same size and weight of payload. The skies are truly open for conquest now."
 steel_leviathans: "Steel Leviathans"
 steel_leviathans_desc: "Hulking beasts of steel and magic roam the sky. Deadly and gluttonous and terrifying, for if you wake one of these flying fortresses, you may never sleep again."
 bulletproof_exosuits: "Bulletproof Exosuits"
 bulletproof_exosuits_desc: "Discoveries in machinery and flawless metals across the Empyreal created a strange, brief but wonderful age of war in the middle of the 19th century. An age where warriors of old fought on the field again, under distant stars, wearing suits of armour that could allow them to leap distances, bear the weight of giants and shrug off bullets - to the point that they even fought with swords. Eventually, guns would catch up, but for a brief moment, the knight was reborn."
 amaglamated_attachments: "Amaglamated Attachments"
 amaglamated_attachments_desc: "Inventions gets smaller and smaller, and the minds of inventors get bigger and bigger. With the advent of miniaturization, it has allowed for the creation of all sorts of attachments and doodads that can be added to weapons, armour, and more. From scopes to bayonets, from extra ammo magazines to even small shields, the possibilities are endless!"
 alchemical_capsules: "Alchemical Capsules"
 alchemical_capsules_desc: "The image of a knight enchanced by the mage or potion seller has long been a staple of fantasy. But always the hero, never the soldier. With the standardization of magical potions and others concotions into easy-to-swallow capsules (AlCaps, the marketers call it), it has allowed soldiers to take these supplements easily in the field, allowing for greater endurance, strength, and even pain resistance. Alchemy is no longer a luxury, but a necessity on the battlefield."
 mageshields: "Mageshields"
 mageshields_desc: "Before the age of black damestear, mages lived in safety behind their wards and shields. But with the advent of black damestear, mages adapted to be faster, more mobile, and more aggressive, abandoning abjurations entirely. But such wards were still useful against the elements, against stray spells, and pretty much everything else but those black equalizers. With recent discoveries, a common man can now deploy a mageshield as if the days of yore, allowing for greater survivability. It is said that some have even taken to using bayonets, swords, even to counter such protections!"
 military_mechs: "Military Mechs"
 military_mechs_desc: "Flesh is weak, but metal is strong. The rise of portable energy sources, amongst other advancements, has allowed for the creation of mechs: walking, rolling, even flying cages of death that can carry heavy weaponry, armour and more. Such machines vary in size, shape and function, but their greatest function was that of scouts or shock troops, able to punch through enemy lines and wreak havoc whilst the infantry fought for control of the field."
 hexframes: "Hexframes"
 hexframes_desc: "The pinnacle of mechanized warfare, hexframes are one-of-a-kind mobile suits costing fortunes to make, utilizing the best armour, the best weapons, and the best artificery money and genius can provide. Hexframes are the ultimate expression of warfare, dancing and flying across the battlefield as if an acrobat, but it is not just about the suit... but those who wear it: for all is possible with mech aces, who are all but war wizards of the modern age. As a wise family man once said: 'It's not about the mech you pilot, it's the ace piloting the mech that does the piloting.'" #Yes this is a Fast and Furious quote -Jay mi familia
 gene_warriors: "Gene Warriors"
 gene_warriors_desc: "Making the ultimate soldier is not just about training, or equipment, but about the very body itself. Enchanced strength, endurance, reflexes, even changing the craft of flesh or organs itself. Whether it is to be the perfect supersoldier, or to the next monstrous abomination, the art of biomancy has found its way business of death."
 scrying_distruptors: "Scrying Distruptors"
 scrying_distruptors_desc: "Either through artifice or from the view of an airship, the command of the battlefield evolved into that of a top-down strategic game of sorts, allowing commanders to order troops with precision and accuracy. However, with the advent of scrying distruptors, commanders can now hide their forces from prying eyes, restoring the old days of ambushes, feints, and more complex maneuvers."

 cannorian_magical_tradition:0 "Magisterial"
 cannorian_magical_tradition_desc:0 "Though the Magisterium may be dead, its legacy is still with us. Mages from this tradition use the eight "Schools" of magic– Abjuration, Enchantment, Evocation, Divination, Illusion, Transmutation, Conjuration, and Necromancy– which were spread across the world by Cannorian wizards."
 runecarving_magical_tradition:0 "Runecarving"
 runecarving_magical_tradition_desc:0 "For dwarves, Runecarving is a science gifted by Urisazirn Mithrilhand, who channeled the magic of the earth into a form usable by mortals. For trolls and ogres, Runecrafting is boon taught to the giantkin by their titanic creators. For Veykodans, it is the art of sculpting the self as to imbue their own skins with magic. For all of them, runes allow the carving of magic into the material world. It has long acted as a form of artificery, and often combines with industrial production to create incredible effects."
 fourknowing_magical_tradition:0 "Ereštic"
 fourknowing_magical_tradition_desc:0 "The four Ereš, or "knowings," are the classifications of magic most-practiced in Bulwar. Formal and legalistic, these Knowings have been developing for thousands of years ever since the Age of God-Kings. They compromise of Ereš-dirkešir ("Binding," controlling the wills of other beings); Ereš-sašur ("Order," controlling the elements); Ereš-sar ("Light," protection and divinity); and Ereš-malthar ("Inscription," magics inspired by Runecarving and Wishes). "
 essence_magical_tradition:0 "Essence Binding"
 essence_magical_tradition_desc:0 "According to Raheni and Mengi mages, their magic is the art of co-opting the existing forces of nature. This includes "Beast Bonding," the act of forming a permanent magical companionship with powerful animals; the "Oracular" tradition, divining the lines of present and future; "Shadowmancy," turning the illusory into the real and walking between shadows; and "weather magic," the control of rain, wind, lightning, and storms. "
 chi_cultivation_magical_tradition:0 "Chi-Cultivation"
 chi_cultivation_magical_tradition_desc:0 "The Cultivators of Haless have long-since mastered "chi," the animating property of life-energy inherent to all things. By understanding and utilizing chi, Cultivators can follow the flow of energy through animals, plants, water, stone, and everything else. This allows them to live longer, channel life-force where it needs to be, and, in some cases (like the Oni), even drain the chi of other people. On a societal scale, Chi Cultivators are the masters of life and its workings. "
 druidic_magical_tradition:0 "Druidic"
 druidic_magical_tradition_desc:0 "Whether by pact, feyrealm influence, or simply devotion, there are many are able to wield the magics of nature. Centered around raw unbridled life magics, these mages are uniquely tailored in influencing flora and fauna in methods only befiting of druids. Be it incredible plant growth or tricksy illusionary magics, those who tap into life itself are certain to channel results unlike any other!"
 shamanism_magical_tradition:0 "Shamanistic"
 shamanism_magical_tradition_desc:0 "Shamanistic mages across Halann create magic through collective rituals, attunement to the elements, and (sometimes, depending on the region) the invocation of spirits. In previous eras, this shamanism was usually confined to small communities and effects: but in the age of the nation-state, shamanism has scaled with incredible success. Networks of shamans now aid entire countries in growing crops, warding off enemies, and shaping the elements."
 bardic_magical_tradition:0 "Bardic"
 bardic_magical_tradition_desc:0 "For nations engaging in bardic magic, power does not derive from studying or ritual: it comes from pathos, inspiration, and intimidation. Emotional-magical reactions are provoked through song, performance, oratory, and dance, and these reactions can shape the world around the bard. "
 precursor_magical_tradition:0 "Precursor"
 precursor_magical_tradition_desc:0 "This country's magical tradition is influenced by the Elven Precursor's traditions or similar."
 elemental_magical_tradition:0 "Elemental"
 elemental_magical_tradition_desc:0 "Other [Concept('concept_magical_tradition','$concept_magical_traditions$')] may use the elements in passing, but the Channelers make their lives out of them. Whether fire, ice, water, air, earth, metal, or even the stars, the Channelers invoke the elements for their power."
 necromantic_magical_tradition:0 "Necromantic"
