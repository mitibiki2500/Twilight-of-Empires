l_english:
 halannas_breath: "Halanna's Breath Surge"
 halannas_breath_desc: "A magical energy flow emerging from deep chasms, fissures and gorges responsible for enabling life, even plants, in the subterranean environments of the Serpentspine Mountains."
 veladklufar_swarm: "Veladklufar Swarm"
 veladklufar_swarm_desc: "A unique subspecies of the common roach. It's iridescent scales scatter the low light of the Serpentspine, rendering the roach virtually invisible to the naked eye. Their scissor-like jaws have evolved to cut through stone and metal with relative ease, an adaptation due to their diet comprised of resilient, fibrous Serpentbloom and Cave Coral found abundantly within the Serpentspine."
 state_harvest_condition_veladklufar_swarm_impact_mult: "[GetHarvestConditionType('veladklufar_swarm').GetName] [concept_harvest_condition] Impact"
 state_harvest_condition_veladklufar_swarm_mult_impact_desc: "An increase or decrease to the impact of Veladklufar Swarms."
 dwarovar_railway_disrepair: "Dwarovod Damaged"
 dwarovar_railway_disrepair_desc: "The ancient Dwarovrod railway has seen better days. Fallen into disrepair, the massive mobile foundries of old, capable of crafting new rail on the move, have left the job of maintaining its crumbling infrastructure to manual laborers."
 state_harvest_condition_dwarovar_railway_disrepair_impact_mult: "[GetHarvestConditionType('dwarovar_railway_disrepair').GetName] [concept_harvest_condition] Impact"
 state_harvest_condition_dwarovar_railway_disrepair_impact_mult_desc: "An increase or decrease to the impact of Damaged Dwarovrods"
 rich_mining_vein: "Rich Mining Vein"
 rich_mining_vein_desc: "In the unpredictable world of mining, every swing of the pick carries the thrill of possibility. Striking a particularly rich vein—an unexpected bounty of resources—ignites a wave of exhilaration, reminding us that fortune can change with a single lucky break."