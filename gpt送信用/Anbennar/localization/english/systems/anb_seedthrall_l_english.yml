l_english:
 seedthrall.1.t: "Incorporating the Outsiders"
 seedthrall.1.d: "The humanoids in [SCOPE.sState('seedthrall_spread').GetName] find themselves in territory now controlled by [ROOT.GetCountry.GetNameNoFlag]. "
 seedthrall.1.f: "As I turned around I realized I could no longer find my companions, and the only thing audible to me was the swaying motions of the jungle around me."
 seedthrall.1.a: "Those who burned the jungle shall regrow it."
 c14_seedthrall_tt: "This event will re-fire every year, further assimilating the outsiders until they are Seedthralls."
 seedthrall.3.t: "Purging the Seedthralls"
 seedthrall.3.d: "The Seedthralls in [SCOPE.sState('seedthrall_cleanse').GetName]"
 seedthrall.3.f: "The mass burning of their bodies isn't what haunts us; our ancestors told us how such things were a regular occurance during the Blooming. What they didn't tell us was the look of desperation in the eyes of the thralls, as if they, or whatever controls them, just wants to be left alone."
 seedthrall.3.a: "At least the plant matter burns cleanly."
 not_c14_seedthrall_tt: "This event will re-fire every year, further culling the Seedthrall population until it is gone from our lands."