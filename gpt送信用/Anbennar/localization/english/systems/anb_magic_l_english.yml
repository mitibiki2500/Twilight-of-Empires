 spell_aakhet_flames_calamity_tooltip: "\n\n$TOOLTIP_DELIMITER$\nInvoking the Power of Aakhet to instill the army with the power of the Dragonfire, this spell is known throughout Halann for virtually guaranteeing victory in a battle. Last invoked in the war of the gunpowder Xhaz the dragon’s and demon’s fire scorched the sorrow to a crisp, and though Konolkhatep was saved from a far worse fate, the fire may have to be invoked once more to fight the rising Sparkdrives."
