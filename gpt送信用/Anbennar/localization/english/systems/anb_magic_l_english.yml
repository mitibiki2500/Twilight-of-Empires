l_english: 
 ##### CONCEPTS #####
 concept_spell_level: "Spell Level"
 concept_spell_levels: "Spell Levels"
 concept_spell_level_desc: "The current level of a [concept_spell]. Each level costs an amount of [concept_magical_expertise] depending on the [Concept('concept_pop','$concept_population$')] size of your [Concept('concept_incorporated_state','$concept_incorporated_states$')], and its effects scale with the level.[AddLocalizationIf(GetPlayer.IsValid,'concept_spell_level_ingame_added')]"
 concept_spell_level_ingame_added: "\n\nYou currently pay @mages! #v [Multiply_CFixedPoint(AccessPlayer.MakeScope.ScriptValue('country_magical_expertise_cost'),'(CFixedPoint)-1')|=+D]#! [concept_magical_expertise] for [AccessPlayer.MakeScope.ScriptValue('country_num_spells')|v0] $concept_spell_levels$, or @mages! #v [Multiply_CFixedPoint(AccessPlayer.MakeScope.ScriptValue('country_magical_expertise_cost_per_institution'),'(CFixedPoint)-1')|0+]#! [concept_magical_expertise] per level."
 
 concept_magical_expertise: "Magical Expertise"
 concept_magical_expertise_desc: "@mages! Magical Expertise is a [concept_capacity] used to maintain your [Concept('concept_country','$concept_country_possessive$')] spells and traditional magic activities. The cost increases with the population across your [Concept('concept_incorporated_state', '$concept_incorporated_states$')] and with every [concept_spell] level. You gain @mages! from every Mage working in your country, but those working in [SelectLocalization(GetPlayer.IsValid,'concept_magical_expertise_desc_added','Mage Tower')] [Concept('concept_building','$concept_buildings$')] are especially potent at developing your magical infrastructure."
 concept_magical_expertise_desc_added: "[GetBuildingType('building_mage_tower').GetName]"
 #state_magical_expertise_decree_cost_add

 country_magical_expertise_add_desc: "How much @mages! [Concept('concept_magical_expertise', '$concept_magical_expertise$')] the country has" 
 country_magical_expertise_mult_desc: "The amount of @mages! [Concept('concept_magical_expertise', '$concept_magical_expertise$')] is modified up or down" 

 concept_spell: "Spell"
 concept_spells: "Spells"
 concept_spell_possessive: "Spell\\'s"
 concept_spell_desc: "$concept_spells$ provide benefits to [Concept('concept_incorporated_state', '$concept_incorporated_states$')] across your [concept_country]. They cost [concept_magical_expertise] to maintain in proportion to the number of [Concept('concept_pop', '$concept_pops$')] living in your $concept_incorporated_states$ and the $concept_spell$'s investment level. Higher levels increase both the cost and the effect. Adjusting investment levels take a set amount of time."

 concept_magical_tradition: "Magical Tradition"
 concept_magical_traditions: "Magical Traditions"
 concept_magical_tradition_desc: "Magical Traditions are the spells, rites, incantations, bathing rituals, and techniques practiced by your [GetPopType('mages').GetName] on the national level. Each Magical Tradition has its own [concept_interest_group] attractions and [Concept('concept_spell','$concept_spells$')]. Spells are shared between Magical Traditions, though their quanitity makes each Magical Tradition unique.\n\n[Concept('concept_magical_tradition','$concept_magical_traditions$')]#white :#!\n[GetTechnology('cannorian_magical_tradition').GetName]\n[GetTechnology('runecarving_magical_tradition').GetName]\n[GetTechnology('fourknowing_magical_tradition').GetName]\n[GetTechnology('essence_magical_tradition').GetName]\n[GetTechnology('chi_cultivation_magical_tradition').GetName]\n[GetTechnology('druidic_magical_tradition').GetName]\n[GetTechnology('shamanism_magical_tradition').GetName]\n[GetTechnology('bardic_magical_tradition').GetName]\n[GetTechnology('precursor_magical_tradition').GetName]\n[GetTechnology('elemental_magical_tradition').GetName]\n[GetTechnology('necromantic_magical_tradition').GetName]\n[GetTechnology('kheterata_magical_tradition').GetName]"
 
 concept_magical_decree: "Magical Decree"
 concept_magical_decrees: "Magical Decrees"
 concept_magical_decree_desc: "Identical in function to non-magical [Concept('concept_decree','$concept_decrees$')], $concept_magical_decrees$ provide benefits to [Concept('concept_state','$concept_states$')]. Where the magical decrees differ is their cost. Instead of [concept_authority] they consume [concept_magical_expertise] while active."

 ##### SPELLS #####
 # Production Spells
 no_production_spell_name: "No Production Magic"
 no_production_spell_tooltip: "No active production spell."
 no_production_spell_stats: "[GetPlayer.GetCustom('no_production_spell_custom_stats')]"
 no_production_spell_stats1: "[GetPlayer.GetCustom('no_production_spell_custom_stats')]"
 no_production_spell_custom_loc: "#green #bold Gain:#!#!\n[AccessPlayer.MakeScope.ScriptValue('production_magic_weekly_cost')|0+=] @mages! [concept_magical_expertise]\n#R Remove:#!\n#tooltippable_name [Localize(Concatenate(GetPlayer.MakeScope.Var('production_magic_spell').GetFlagName,'_name'))]: Spell Level ([GetPlayer.MakeScope.Var('production_magic_spell_level').GetValue])#!\n[Localize(Concatenate(GetPlayer.MakeScope.Var('production_magic_spell').GetFlagName,'_stats'))]"
 

