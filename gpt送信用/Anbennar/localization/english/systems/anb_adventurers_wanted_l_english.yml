##### MECHANICS ##### 
 STATE_QUEST_PROGRESS_RATE: "Quest Progress Rate: [State.MakeScope.ScriptValue('state_quest_progress_rate_value')]"
 STATE_NUM_ADVENTURERS: "State Num Adventurers: [Country.MakeScope.Var('num_adventurers_wanted').GetValue]"
 STATE_QUEST_PROGRESS_RATE_DESC: "The rate at which your adventurers will clear local threats and complete local quests. Can be improved through improved production methods."
 modifier_state_quest_progress_rate_add: "[Concept('concept_quest_progress_rate','@adventurers!Quest Progress Rate')]"
 modifier_state_quest_progress_rate_add_desc: "A bonus or penalty to [Concept('concept_quest_progress_rate','@adventurers!Quest Progress Rate')]"
 modifier_state_quest_progress_rate_mult: "[Concept('concept_quest_progress_rate','@adventurers!Quest Progress Rate Multiplier')]"
 modifier_state_quest_progress_rate_mult_desc: "$modifier_state_quest_progress_rate_add_desc$"
 remove_all_adventurers_wanted_buildings_tt:0 "Quest Complete: [concept_adventurers_wanted] building will be removed from [SCOPE.GetName]"
 QUEST_PROGRESS_TOOLTIP_COMPLETE: "#BOLD #V [Building.GetName] [Concept('concept_total_quest_progress', 'Total Quest Progress')] #!#!\nValue: #BOLD #V [Building.GetState.MakeScope.GetVariable('current_quest_progress').GetValue] #!#! / [Building.GetState.MakeScope.GetVariable('target_quest_progress').GetValue]\n\nEach [Concept('concept_quest','@adventurers!Quest')] has a set Quest Progress requirement, which determines how long it will take for [Concept('concept_adventurers','@adventurers!Adventurers')] in a state to clear the local threat. Each week, a building's [Concept('concept_quest_progress_rate', '@adventurers!Quest Progress Rate')] is added to the Quest Progress. When the Total Quest Progress reaches the Quest Progress requirement, the adventurers will win, and the building will be destroyed!\n\nYour [Concept('concept_adventurers','@adventurers!Adventurers')] have completed this [Concept('concept_quest','@adventurers!Quest')]. This building will soon be destroyed. Congrats!"
 QUEST_PROGRESS_TOOLTIP_DECREASING: "#BOLD #V [Building.GetName] [Concept('concept_total_quest_progress', 'Total Quest Progress')] #!#!\nValue: #BOLD #V [Building.GetState.MakeScope.GetVariable('current_quest_progress').GetValue] #!#! / [Building.GetState.MakeScope.GetVariable('target_quest_progress').GetValue]\n\nEach [Concept('concept_quest','@adventurers!Quest')] has a set Quest Progress target, which determines how long it will take for [Concept('concept_adventurers','@adventurers!Adventurers')] in a state to clear the local threat. Each week, a building's [Concept('concept_quest_progress_rate', '@adventurers!Quest Progress Rate')] is added to the Quest Progress. When the Total Quest Progress reaches the Quest Progress target, the adventurers will win, and the building will be destroyed!\n\nYour Quest Progress is going down by [Building.GetState.MakeScope.ScriptValue('state_quest_progress_rate_value')|=+D] each week! This is due to:$QUEST_PROGRESS_BASE$[AddLocalizationIf(NotEqualTo_CFixedPoint(Building.GetState.GetModifier.GetValueFor('state_quest_progress_rate_mult'),'(CFixedPoint)0'),'QUEST_PROGRESS_VALUE_MULT')]"
 QUEST_PROGRESS_TOOLTIP_INCREASING: "#BOLD #V [Building.GetName] [Concept('concept_total_quest_progress', 'Total Quest Progress')] #!#!\nValue: #BOLD #V [Building.GetState.MakeScope.GetVariable('current_quest_progress').GetValue] #!#! / [Building.GetState.MakeScope.GetVariable('target_quest_progress').GetValue]\n\nEach [Concept('concept_quest','@adventurers!Quest')] has a set Quest Progress requirement, which determines how long it will take for [Concept('concept_adventurers','@adventurers!Adventurers')] in a state to clear the local threat. Each week, a building's [Concept('concept_quest_progress_rate', '@adventurers!Quest Progress Rate')] is added to the Quest Progress. When the Total Quest Progress reaches the Quest Progress requirement, the adventurers will win, and the building will be destroyed!\n\nYour Quest Progress is going up by [Building.GetState.MakeScope.ScriptValue('state_quest_progress_rate_value')|=+D] each week! This is due to:$QUEST_PROGRESS_BASE$[AddLocalizationIf(NotEqualTo_CFixedPoint(Building.GetState.GetModifier.GetValueFor('state_quest_progress_rate_mult'),'(CFixedPoint)0'),'QUEST_PROGRESS_VALUE_MULT')]"
 QUEST_PROGRESS_BASE: "\n[Building.GetState.GetModifier.GetValueFor('state_quest_progress_rate_add')|=+D] from base [Concept('concept_quest_progress_rate','@adventurers!Quest Progress Rate')] generation"
 QUEST_PROGRESS_VALUE_MULT: "\n[Multiply_CFixedPoint(Building.GetState.GetModifier.GetValueFor('state_quest_progress_rate_mult'),'(CFixedPoint)100')|=+D]% from your local [Concept('concept_quest_progress_rate','@adventurers!Quest Progress Rate')] multiplier"

##### CONCEPTS ##### 
 concept_adventurers_wanted: "Adventurers Wanted"
 concept_adventurers_wanted_desc: "Adventurers Wanted is a system that spawns [Concept('concept_quest','@adventurers!Quests:')] buildings that represent adventures, dungeons and activities happening in your [concept_state]. These buildings can be worked on by [Concept('concept_adventurers','@adventurers!Adventurer')] pops, representing them looting and trying to resolve that Quest. While active, the Quest building will provide maluses to your state, but in return may yield useful $concept_goods$ and other rewards.\n\nOnce a Quest has been worked on for some time it will be removed, which will leave you with unemployed adventurers and murder hobos - enjoy!"
 concept_adventurers: "Adventurers"
 concept_adventurers_desc: "Do-gooders, glory-seekers, sellswords and those struck with wanderlust.\n\nAs part of the [Concept('concept_adventurers_wanted','@adventurers!Adventurers Wanted')] system, these pops engage in [Concept('concept_quest','@adventurers!Quests')] to gain vast amounts of [concept_wealth]. Due to this, they can quickly gain [concept_pop_qualifications] and enter different [Concept('concept_profession','$concept_professions$')]: that is, if they are able to survive the high [Concept('concept_pop_growth','$concept_pop_growth_mortality$')] adventuring entails.\n\nThe higher their [concept_sol] the more [Concept('concept_politically_unaligned_aligned', '$concept_politically_involved$')] and powerful they become, inversely they are incredibly prone to becoming [Concept('concept_radical','$concept_radicals$')] if this is not met.\n\nAdventurers can join any Interest Group, though trend towards the Intelligentsia, Trade Unions, Rural Folk, Petite Bourgeoisie and the Armed Forces."
 concept_quest: "Quests"
 concept_quest_desc: "This building is part of the [Concept('concept_adventurers_wanted','@adventurers!Adventurers Wanted')] system, representing a quest or adventure that [Concept('concept_adventurers','@adventurers!Adventurer')] pops can take part in."
 concept_quest_progress_rate: "Quest Progress Rate"
 concept_quest_progress_rate_desc: "The rate at which [Concept('concept_adventurers','@adventurers!Adventurers')] in a state will clear [Concept('concept_quest','@adventurers!Quests')]. Each week, it is added (after modifiers are applied) to a building's [Concept('concept_total_quest_progress','@adventurers!Total Quest Progress')]."
 concept_total_quest_progress: "Total Quest Progress"
 concept_total_quest_progress_desc: "Each [Concept('concept_quest','@adventurers!Quest')] has a set Quest Progress requirement, which determines how long it will take for [Concept('concept_adventurers','@adventurers!Adventurers')] in a state to clear the local threat. Each week, a building's [Concept('concept_quest_progress_rate', '@adventurers!Quest Progress Rate')] is added to the Total Quest Progress. When the Total Quest Progress reaches the Quest Progress requirement, the adventurers will win, and the building will be destroyed!"

