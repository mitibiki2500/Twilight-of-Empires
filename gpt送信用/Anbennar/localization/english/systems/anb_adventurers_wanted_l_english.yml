 anb_adventurers_wanted.1.t: ""
 anb_adventurers_wanted.1.d: ""
 anb_adventurers_wanted.1.f: ""
 anb_adventurers_wanted.2.t: ""
 anb_adventurers_wanted.2.d: ""
 anb_adventurers_wanted.2.f: ""
 anb_adventurers_wanted.3.t:0 "Quest Complete!"
 anb_adventurers_wanted.3.d:0 "The [SCOPE.sBuilding('anb_adventurers_wanted_building').GetName] troubling [ROOT.GetState.GetName] has been dealt with at last."
 anb_adventurers_wanted.3.f:0 "All in a hard day's work.\nThe town is saved, the people are happy and we have a lot of treasure to show for it!\nNow... where to next?"
 anb_adventurers_wanted.3.a:0 "The adventurers want more..."

 anb_adventurers_wanted.101.t:0 "Adventurers Wanted: Brigand Army Base"
 anb_adventurers_wanted.101.d:0 "$building_adventurers_wanted_dungeon_brigand_army_base$ has appeared in [ROOT.GetState.GetName]."
 anb_adventurers_wanted.101.f:0 "[concept_adventurers_wanted]\nFor too long, we have tolerated ne'er-do-wells, bandits, thieves, and radicals: and now, look what has happened! An entire army of discontents has established itself in one of our states, robbing settlements, destroying communities, and taking the fruits hard-earned by other peoples' labor. We must bring in the adventurers, so that they might steal back what was unrightfully stolen!"
 anb_adventurers_wanted.101.a:0 "A call to adventure, if you will."

 anb_adventurers_wanted.102.t:0 "Adventurers Wanted: Lich Lair"
 anb_adventurers_wanted.102.d:0 "$building_adventurers_wanted_dungeon_lich_lair$ has appeared in [ROOT.GetState.GetName]."
 anb_adventurers_wanted.102.f:0 "[concept_adventurers_wanted]\nAn undead mastermind has been discovered right under our feet! Their hordes seem to never end: but their mana cannot last forever. We must destroy this menace to society and loot their priceless relics in the process!"
 anb_adventurers_wanted.102.a:0 "A call to adventure, if you will."

 anb_adventurers_wanted.103.t:0 "Adventurers Wanted: Precursor Base"
 anb_adventurers_wanted.103.d:0 "$building_adventurers_wanted_dungeon_precursor_base$ has appeared in [ROOT.GetState.GetName]."
 anb_adventurers_wanted.103.f:0 "[concept_adventurers_wanted]\nCalling all explorers, spelunkers and dungeon delvers! Seek riches in the vestiges of civilizations long gone, find hidden treasure that has laid untouched for millennia!\nBut beware! Many traps lie waiting, ready to swallow the unwary."
 anb_adventurers_wanted.103.a:0 "A call to adventure, if you will."

 anb_adventurers_wanted.104.t:0 "Adventurers Wanted: Sea Monster Nest"
 anb_adventurers_wanted.104.d:0 "$building_adventurers_wanted_dungeon_sea_monster_nest$ has appeared in [ROOT.GetState.GetName]."
 anb_adventurers_wanted.104.f:0 "[concept_adventurers_wanted]\nThe home of krakens, leviathans, and megalodons has been discovered. Its waters are full of destructive power: and so, too, is it full of potential reward. To slay a sea-monster is to feed a city for a year..."
 anb_adventurers_wanted.104.a:0 "A call to adventure, if you will."

 anb_adventurers_wanted.105.t:0 "Adventurers Wanted: Den of Beasts"
 anb_adventurers_wanted.105.d:0 "$building_adventurers_wanted_sudden_threat_den_of_beasts$ has appeared in [ROOT.GetState.GetName]."
 anb_adventurers_wanted.105.f:0 "[concept_adventurers_wanted]\nWyverns, owlbears, basilisks, and more... each of them are dangerous, powerful, threatening, and delicious. Something has caused them to migrate en masse to one of our states: and they been rampaging through our local communities ever since. They must be destroyed: and they must be eaten!"
 anb_adventurers_wanted.105.a:0 "A call to adventure, if you will."

 anb_adventurers_wanted.106.t:0 "Adventurers Wanted: Undead Mob"
 anb_adventurers_wanted.106.d:0 "$building_adventurers_wanted_sudden_threat_undead_mob$ has appeared in [ROOT.GetState.GetName]."
 anb_adventurers_wanted.106.f:0 "[concept_adventurers_wanted]\nSkeletons, zombies, ghouls, and ghosts! The dead come to life to destroy the living! Who is behind them? Who could have done this?"
 anb_adventurers_wanted.106.a:0 "A call to adventure, if you will."

 anb_adventurers_wanted.107.t:0 "Adventurers Wanted: Planar Breach"
 anb_adventurers_wanted.107.d:0 "$building_adventurers_wanted_sudden_threat_planar_breach$ has appeared in [ROOT.GetState.GetName]."
 anb_adventurers_wanted.107.f:0 "[concept_adventurers_wanted]\nElementals, demons, and beasts unknown! Eyes and flesh and flaming skin! How can we fight them when we don't even understand what they are?"
 anb_adventurers_wanted.107.a:0 "A call to adventure, if you will."

 anb_adventurers_wanted.108.t:0 "Adventurers Wanted: Kraken Attack"
 anb_adventurers_wanted.108.d:0 "$building_adventurers_wanted_sudden_threat_kraken_attack$ has appeared in [ROOT.GetState.GetName]."
 anb_adventurers_wanted.108.f:0 "[concept_adventurers_wanted]\nA beast like we've never seen emerges from the depths! It hungers for our ships, and treats sailors like krill! Man the cannons, get the harpoons, and show it who rules the seas!"
 anb_adventurers_wanted.108.a:0 "A call to adventure, if you will."

 anb_adventurers_wanted.109.t:0 "Adventurers Wanted: Fey Incursion"
 anb_adventurers_wanted.109.d:0 "$building_adventurers_wanted_infestation_fey_incursion$ has appeared in [ROOT.GetState.GetName]."
 anb_adventurers_wanted.109.f:0 "[concept_adventurers_wanted]\nFey monsters and assailants have occupied the local woods, taking them over for their own use! They attack our loggers, our sawmills, and any attempts at disrupting the forest. We must take back what is ours!"
 anb_adventurers_wanted.109.a:0 "A call to adventure, if you will."

 anb_adventurers_wanted.110.t:0 "Adventurers Wanted: Awakened Treants"
 anb_adventurers_wanted.110.d:0 "$building_adventurers_wanted_infestation_awakened_treants$ has appeared in [ROOT.GetState.GetName]."
 anb_adventurers_wanted.110.f:0 "[concept_adventurers_wanted]\nThe trees have awoken! Ancient magics have activated in our forests, animating the very woods themselves. They now push against us and must be crushed!"
 anb_adventurers_wanted.110.a:0 "A call to adventure, if you will."

 anb_adventurers_wanted.111.t:0 "Adventurers Wanted: Ancient Golems"
 anb_adventurers_wanted.111.d:0 "$building_adventurers_wanted_infestation_ancient_golems$ has appeared in [ROOT.GetState.GetName]."
 anb_adventurers_wanted.111.f:0 "[concept_adventurers_wanted]\nIn the depths of the earth, ancient automata have awoken. Born of unknown creators, we know not their origin: but we know they attempt to destroy us whenever we come near. They must be defeated before they defeat us!"
 anb_adventurers_wanted.111.a:0 "A call to adventure, if you will."

 anb_adventurers_wanted.112.t:0 "Adventurers Wanted: Ancient Golems"
 anb_adventurers_wanted.112.d:0 "$building_adventurers_wanted_infestation_elemental_forge$ has appeared in [ROOT.GetState.GetName]."
 anb_adventurers_wanted.112.f:0 "[concept_adventurers_wanted]\nWe have discovered a forge which has operated for unknown centuries, far underground in places no one could ever reach. This forge had been manned by elementals of fire, earth, and steel: and they react with nothing but violence now that they have been discovered. We shall destroy them and take their forge!"
 anb_adventurers_wanted.112.a:0 "A call to adventure, if you will."

 anb_adventurers_wanted.113.t:0 "Adventurers Wanted: Thieves Guild"
 anb_adventurers_wanted.113.d:0 "$building_adventurers_wanted_investigation_thieves_guild$ has appeared in [ROOT.GetState.GetName]."
 anb_adventurers_wanted.113.f:0 "[concept_adventurers_wanted]\nFor too long, our cities have operated without close oversight... and now, look what has happened! Our own settlements, dominated and monopolized by a thieves' guild which operates right under our noses. We know they exist, so we will find them... and then they will regret ever working against us!"
 anb_adventurers_wanted.113.a:0 "A call to adventure, if you will."

 anb_adventurers_wanted.114.t:0 "Adventurers Wanted: Hag Dens"
 anb_adventurers_wanted.114.d:0 "$building_adventurers_wanted_investigation_hag_dens$ has appeared in [ROOT.GetState.GetName]."
 anb_adventurers_wanted.114.f:0 "[concept_adventurers_wanted]\nWhispers speak of hags, taking root in one of our settlements. They take our children and use them to create potions and elixirs... but it is unclear where they are, or how to strike at them. We must send adventurers to investigate and destroy the hags!"
 anb_adventurers_wanted.114.a:0 "A call to adventure, if you will."

 anb_adventurers_wanted.115.t:0 "Adventurers Wanted: Eldritch Cult"
 anb_adventurers_wanted.115.d:0 "$building_adventurers_wanted_investigation_eldritch_cult$ has appeared in [ROOT.GetState.GetName]."
 anb_adventurers_wanted.115.f:0 "[concept_adventurers_wanted]\nThey speak of beings from other planes: they claim to be heralds of a new world and age. They recruit our citizens, they spread lies and torments, and they prepare to summon something new... they must be found, and they must be eradicated, before they can accomplish something truly terrible!"
 anb_adventurers_wanted.115.a:0 "A call to adventure, if you will."

 anb_adventurers_wanted.116.t:0 "Adventurers Wanted: Vampire Family"
 anb_adventurers_wanted.116.d:0 "$building_adventurers_wanted_investigation_eldritch_cult$ has appeared in [ROOT.GetState.GetName]."
 anb_adventurers_wanted.116.f:0 "[concept_adventurers_wanted]\nThere are vampires living in one of our settlements, disguised as normal nobles who do not pose a threat. For centuries, they have existed without notice: but we have found them, and we will ensure that their reign of subtle terror continues no longer. They will be found, and they will be destroyed!"
 anb_adventurers_wanted.116.a:0 "A call to adventure, if you will."

