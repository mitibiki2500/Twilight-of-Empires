 #Battle Orders
 #Mage Orders
 advance_heroic_charges: "Heroic Charges"
 advance_heroic_charges_gerund: "Bravely Charging"
 advance_heroic_charges_desc: "Order this Commander to boldly lead the charge with their troops on a [concept_front], trying to shatter the lines of the enemy in a climatic charge.\nA Commander with an Advance Order can still partake in defensive battles."
 advance_heroic_charges_tooltip: "#header $advance_heroic_charges$#!"

 advance_spell_barrage: "Spell Barrage"
 advance_spell_barrage_gerund: "Unleashing Devastating Magics"
 advance_spell_barrage_desc: "Order this Commander rain savage sorties of spells on a [concept_front], trying to break open enemy lines and shatter their resolve.\nA Commander with an Advance Order can still partake in defensive battles."
 advance_spell_barrage_tooltip: "#header $advance_spell_barrage$#!"

 defend_synchronized_abjuration: "Synchronized Abjuration"
 defend_synchronized_abjuration_gerund: "Summoning Powerful Defensive Wards" 
 defend_synchronized_abjuration_desc: "Order this Commander to cast abjuration magic over their troops on a [concept_front], trying to stop the enemy in their tracks with powerful wards."
 defend_synchronized_abjuration_tooltip: "#header $defend_synchronized_abjuration$#!"



 #Artificer Orders
 advance_destructive_assault: "Destructive Assault"
 advance_destructive_assault_gerund: "Assaulting"
 advance_destructive_assault_desc: "Order this Commander to focus on destroying enemy troops at a [concept_front], trying to utterly obliterate the enemy armies to allow for secure advancement afterwards.\nA Commander with an Advance Order can still partake in defensive battles."
 advance_destructive_assault_tooltip: "#header $advance_destructive_assault$#!"

 advance_jet_stream_attack: "Jet Stream Attack"
 advance_jet_stream_attack_gerund: "Striking Relentlessly"
 advance_jet_stream_attack_desc: "Order this Commander to break through enemy lines at a [concept_front], trying to disorganize their troops and collapse their formation.\nA Commander with an Advance Order can still partake in defensive battles."
 advance_jet_stream_attack_tooltip: "#header $advance_jet_stream_attack$#!"

 defend_mecha_disruption: "Mech Disruption"
 defend_mecha_disruption_gerund: "Is disrupting the enemy advance"
 defend_mecha_disruption_desc: "Order this Commander to defend a [concept_front], trying to delay the enemy by constantly redeploying their untiring mech units to secure a safe retreat at the cost of territory and supplies."
 defend_mecha_disruption_tooltip: "#header $defend_mecha_disruption$#!"

