l_english:

 mobilization_option_melee_weapon_can_be_turned_off_tt: "$mobilization_option_melee_weapon$ are mandatory and always active"

 mobilization_option_melee_weapon: "Melee Weapons"
 mobilization_option_melee_weapon_desc: "Primitive Weaponry."
 #mobilization_option_firearms: "Firearms"
 #mobilization_option_firearms_desc: "Modern Weaponry."
 mobilization_option_relic_imbuments: "Relic Imbuement"
 mobilization_option_relic_imbuments_desc: "Attaching relics to guns and melee arms, allowing them to access ancient precursor magics."
 mobilization_option_vorpal_coating: "Vorpal Coatings"
 mobilization_option_vorpal_coating_desc: "Ranges from melee to bayonets.."
 mobilization_option_sparkdrives: "Sparkdrive Rifles"
 mobilization_option_sparkdrives_desc: "The iconic weapon of artifice, simply turn the crank until a bolt of lightning turns the other end into ash. Whilst traditionally used to snipe enemy officers, it was later noted that the sheer fear that the very elements themselves were against you had a much greater effect in battle than any dead general ever would."
 mobilization_option_doodad_attachments: "Doodad Attachments"
 mobilization_option_doodad_attachments_desc: "Customizing your weapon is all the rage nowadays. Scopes, barrels that convert bullets into energy, sensors and more."
 mobilization_option_planar_phasing: "Planar-Phasing Ammunition"
 mobilization_option_planar_phasing_desc: "Bullets that, after firing, can phase through planes to penetrate shields, barriers, and structures. Utilizing the mechanics of planar travel, this ammunition makes all defenses far less useful."
 mobilization_option_soulseeking_ammo: "Soul-Seeker Ammunition"
 mobilization_option_soulseeking_ammo_desc: "Bullets that, after firing, can redirect themselves towards sources of life and spirit energy. Like how a missile can re-target towards ships, these bullets re-target towards people."
 mobilization_option_elemental_armaments: "Elemental Armaments"
 mobilization_option_elemental_armaments_desc: "This includes sparkdrives and everything else that harnesses energy like that."
 mobilization_option_modern_ironwraith: "Modern Ironwraiths"
 mobilization_option_modern_ironwraith_desc: "Modern Ironwraiths. Once only used by Soulseeker Ogres, these methods of capturing hostile spirits and using them like chemical weapons has spread to many locations which host dangerous spirits."
 mobilization_option_bulletproof_exosuits: "Bulletproof Exosuits"
 mobilization_option_bulletproof_exosuits_desc: "Encase elite soldiers in powered armour allowing them to shrug off bullets, carry heavy loads and leap great distances. For a brief time soldiers fought with sword and armour under foreign stars, a glorious and unexpected last hurrah until technology and guns caught up once again."
 mobilization_option_infantry_exosuits: "Infantry Exosuits"
 mobilization_option_infantry_exosuits_desc: "A midgame equivalent to Perfect Metal Armor, allowing nations to eventually match mithril with artificery."
 mobilization_option_warsuits: "Warsuits"
 mobilization_option_warsuits_desc: "As an apotheosis of defensive technology, soldiers wear flexible and bulletproof armor of rubber and mithril. Imbued with defensive and life-supporting enchantments, they become nigh-indestructible."
 mobilization_option_portable_turrets: "Portable Turrets"
 mobilization_option_portable_turrets_desc: "Portable turrets! Set 'em up and secure the damned place!"
 mobilization_option_antimagic_field_generators: "Antimagic Field Generators"
 mobilization_option_antimagic_field_generators_desc: "Large fields which can be set up to protect users from all sorts of magic."
 mobilization_option_triggered_mageshields: "Triggered Mageshields"
 mobilization_option_triggered_mageshields_desc: "Personal deployable shields that acts similarly to the traditional magical abjurative wards."
 mobilization_option_bloodrage_potion: "Bloodrage Potions"
 mobilization_option_bloodrage_potion_desc: "AKA: magical painkillers; bloodragers; avatar supersoldier serum; controlled rage serum. LOTS of unit locs and inventions are about magical/enhanced painkillers that give extra fighting potential."
 mobilization_option_alchemical_capsule: "Alchemical Capsules"
 mobilization_option_alchemical_capsule_desc: "When industrial alchemist is fully-formed, alchemists can put the strength of an elephant, or the grace of a unicorn, or anything else into a pill. By giving soldiers these pills, incredible powers can be unlocked!"
 mobilization_option_trauma_magoremedials: "Trauma Magoremedials"
 mobilization_option_trauma_magoremedials_desc: "Using the power of spirit energy, strengthen one person's soul with another's! Use spirits like life-force IV bags!"
 mobilization_option_brass_prosthesis: "Brass Prostheses"
 mobilization_option_brass_prosthesis_desc: "Big thing in war is wounded soldiers, so give them prosthetic arms and they can go back to the field again."
 mobilization_option_limb_regeneration: "Limb Regeneration"
 mobilization_option_limb_regeneration_desc: "More than simple limb replacements or reattachments, these limbs-- like Exo-Arms-- actively give soldiers more pieces of their body to work with."
 mobilization_option_gene_warriors: "Gene Warriors"
 mobilization_option_gene_warriors_desc: "From supersoldiers to kobolds turn themselves into pseudo-dragons; the swamp trolls graft armaments and weapons onto themselves; the Inyaswarosa give themselves the speed of leopards and the strength of elephants. As genes (and ways to magically alter them) are discovered, soldiers everywhere are physically molded into forms more desirable for warfare..."
 mobilization_option_skyship_transport: "Airship Transport"
 mobilization_option_skyship_transport_desc: "Airship Transport."
 mobilization_option_airship_reconaissance:0 "Airship Reconaissance"
 mobilization_option_airship_reconaissance_desc:0 "The age of airships began not with bombardment from above, but superiority of the skies."
 mobilization_option_scrying_disruptors: "Scrying Disruptors"
 mobilization_option_scrying_disruptors_desc: "Using porcelain shielding and an emitted abjurative field, areas can be protected from scrying. This limits the ability for enemy forces to scry and do reconnaissance."
 mobilization_option_automata_support: "Automata Support"
 mobilization_option_automata_support_desc: "Defensive robots and automata with the ability to cover positions, hold down objectives, and protect the backline."
 mobilization_option_t_hacking_transceivers: "T-Hacking Transceivers"
 mobilization_option_t_hacking_transceivers_desc: "By advancing T-Wave Transceiver technology, the telpathic waves sent by the raios can both intercept enemy communications and scry into their very minds! With radio waves interfacing with telepathic waves, all secrets can be revealed!"

