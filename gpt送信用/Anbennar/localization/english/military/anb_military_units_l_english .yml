l_english:
 combat_unit_type_undead_infantry: "Undead Infantry"
 combat_unit_type_undead_infantry_desc: "Necromancy, in whatever form it takes, has been a staple of evil tyrants and witch-kings throughout history. The dead cannot break, cannot complain about orders, cannot starve or attrit – they are weapons, at the exclusive command of the mage controlling them. In the modern age, however, they are weapons becoming increasingly obsolete. It will take significant magical investment to render them effective in a rapidly changing world."
 combat_unit_type_behemoth_infantry: "Behemoth Infantry"
 combat_unit_type_behemoth_infantry_desc: "Infantry units piloting battleships of the land. These massive, roaming machines tower over the battlefield, using modern weaponry to destoy their foes from above. Sits as the endgame baseline unit, with Reactor Artillery providing far more offense and Holohana Frames providing far more defense."
 
 combat_unit_type_mechs: "Mechs"
 combat_unit_type_mechs_desc: "Ranging from walkers, treads to shortform flight, mechs are an incredibly versatile and highly maneuverable part of the battle that can utilize both ranged and melee weapons. The standard doctrine for walkers is to use them as skirmishers against other walkers, securing key positions on the field - and once a pitched battle occurs, leading combined arms charges on the flank. It is said that in the age of airships, only the all-terrain mobility of a mech can prevent such aerial dominance."
 combat_unit_type_hexframes: "Hexframes"
 combat_unit_type_hexframes_desc: "One-of-a-kind mobile suits piloted by mech aces in the state-of-the-art armour, weapons, and the artifice. Hexframes are the ultimate expression of warfare, dancing and flying across the battlefield leaving only death in their wake - and ever-becoming the key in turning the tide in an era of trenches and deadly leviathans in the sky. It is now an age of War Wizards come again."
 combat_unit_type_airship_bombardiers: "Airship Bombardiers"
 combat_unit_type_airship_bombardiers_desc: "Death from above."
 combat_unit_type_military_skyships: "Military Skyships"
 combat_unit_type_military_skyships_desc: "Advances in technology has enabled the forgoing of balloons in favour of other propellants and levitation devices, allowing for more maneuverable and deadlier ships. Oh, and they've added way more cannons too."
 combat_unit_type_steel_leviathans: "Steel Leviathans"
 combat_unit_type_steel_leviathans_desc: "It's no ship, it's a moving fortress. The largest of such beasts are manned by crews of thousands, capable of deploying not only death from above but also house and deploying entire armies in its own right."