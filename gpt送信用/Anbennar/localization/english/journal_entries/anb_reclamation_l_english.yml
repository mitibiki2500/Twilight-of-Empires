 # TODO placeholder, copies the decision loc from below, is a bit long
 je_alecand_reclamation_reason:0 "For years, the Kaydhano Deathwind – a storm of terrifyingly lethal blue-sand that induces cancerous tumours on whatever un-adapted beings it touches – sweeps across Alecand from the Kaydhano Sea to the north, scouring the island. For a millennium, the Precursor Windwards of the ancient Kheions, and to a lesser extent the shadow of the great Mtéi mountain, were the only defence against the Storm – but as the years have progressed, be they abjuration-suits to protect individuals or sturdily-built structures to break the storm as it approaches, the Kheionai have developed new tools to turn the tide.\n\nOn a limited scale, this has allowed the Kheionai to establish small, extremely well-stocked outposts, through which they can establish control through a Kaydhano – but with the advent of modern artificery, and the rise of new ward-generators based off the Windwards, that can provide protection over a large area and be produced at scale, what was once thought impossible is now at last within reach. It will be arduous, it will be expensive, there will be unforeseen difficulties and unavoidable disasters – but the Reclamation of Alecand, and the defeat of the Kaydhano, may yet be possible at last."
 
 alecand_reclamation:0 "Begin the Reclamation of Alecand"
