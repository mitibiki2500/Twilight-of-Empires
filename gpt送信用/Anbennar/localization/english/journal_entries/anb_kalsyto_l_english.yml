l_english:
 je_egduqon:0 "Egdüqon"
 je_egduqon_reason:0 "While Kalsyto has existed for two centuries now, it has never truly engaged with the wider world. Geographically distant from the rest of humanity, the Triunic people have had little incentive to reach out beyond the horizon. However, the faltering Blackpowder Rebellion has called into question Kalsyto’s place in the world, and whether or not it can afford to sit passively as Cannor begins to make the world its own."
 je_egduqon_goal:0 "The following must be true for 10 total years:"
 modifier_kalsyto_egduqon:0 "Idyllic Shield"
 
 je_egduqon_main:0 "Modernization: The Rising Crescent"
 je_egduqon_main_reason:0 "The stagnation under the Boshalelqur has ended, and the process of modernization begins. There is much work to be done."
 je_egduqon_main_goal:0 "Complete 3 Modernization [Concept('concept_journal_entry', '$concept_journal_entries$')]"
 has_completed_egduqon_army_je_tt: "Has completed #b $je_egduqon_army$#!"
 has_completed_egduqon_economy_je_tt: "Has completed #b $je_egduqon_economy$#!"
 has_completed_egduqon_diplomacy_je_tt: "Has completed #b $je_egduqon_diplomacy$#!"
 modifier_kalsyto_egduqon_base: "Modernizing Nation"
 
 je_egduqon_economy:0 "Modernization: The Worker and the Gun"
 je_egduqon_economy_reason:0 "Kalsyto must modernize its industry to compete with nations that seek to control and exploit us."
 modifier_kalsyto_egduqon_adm:0 "Developing Nation"
 
 je_egduqon_army:0 "Modernization: The Soldier and the Citizen"
 je_egduqon_army_reason:0 "If the Idyllic Shield is insufficient to safeguard the equality of Kalyin's people, then it falls to the strength of arms to defend and spread Her Praxes."
 modifier_kalsyto_egduqon_mil:0 "Mobilization"
 
 je_egduqon_diplomacy:0 "Modernization: The Trader and the Steward"
 je_egduqon_diplomacy_reason:0 "Kalsyto has been isolated for centuries, first by geography and more recently self-imposed to resist foreign influence. But it is now time to open ourselves to the world. Our goal, however, is not only to open Kalsyto but to establish our nation as a Power on the world stage."
 modifier_kalsyto_egduqon_dip:0 "Opening Market"
 
 egduqon.1.t:0 "The Lowered Shield"
 egduqon.1.d:0 "The [SCOPE.gsInterestGroup('rural_folk_ig').GetName] have fallen from power, and [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has ushered in a new political age. This momentous occasion marks the end of centuries of Boshalelqur rule in [ROOT.GetCountry.GetName], and heralds a new era of modernization and reform."
 egduqon.1.f:0 "The new and former ministers shake hands, as for the first time in the two hundred years of the Federation there is a transfer of power resulting from significant political change within the republic. Many are anxious about what the future may hold, the comforts our democracy has provided us have been taken for granted for generations, but as the world changes around us we know that it is better to adopt change on our terms rather than having it imposed upon us by powers without respect for the liberties of Kalyin’s children."
 egduqon.1.a:0 "The Horizon awaits."
 modifier_kalsyto_upon_halann_stage:0 "Upon Halann's Stage"
 egduqon.2.t:0 "A Renewed Kalsyto"
 egduqon.2.d:0 "A reformed army, an open and recognized country, a new society. [ROOT.GetCountry.GetName] stands as an equal among the powers of the world, and will perhaps begin to pursue ambitions of her own."
 egduqon.2.f:0 ""By the blessing of Kalyin we have asserted ourselves as a bastion of democracy upon Halann. The civilization and institutions of the Triunic people are so different from those of other countries that we cannot expect them to embrace egalitarianism as we have so long ago. It is our purpose to select from the various institutions prevailing among modernized nations such as are best suited to our present conditions, and adapt them in gradual reforms and improvements of our policy and customs so as to be treated by them as a peer, and for their peoples to someday achieve the rights our own enjoy.""
 egduqon.2.a:0 "We shall be the Workers of Kalyin"
 egduqon.2.b:0 "We shall be the Soldiers of Kalyin"
 egduqon.2.c:0 "We shall be the Traders of Kalyin"
 egduqon.2.g:0 "We shall be the Guns of Kalyin"
 egduqon.2.h:0 "We shall be the Children of Kalyin"
 egduqon.2.i:0 "We shall be the Citizens of Kalyin"
 kalsyto_workers_favored: "Workers Favored"
 kalsyto_soldiers_favored: "Soldiers Favored"
 kalsyto_traders_favored: "Traders Favored"
 kalsyto_guns_favored: "Guns Favored"
 kalsyto_children_favored: "Children Favored"
 kalsyto_citizens_favored: "Citizens Favored"
 egduqon.4.t:0 "[SCOPE.sCountry('military_consultant_country').GetAdjectiveNoFormatting] Military Consultants"
 egduqon.4.d:0 "Taking interest in [ROOT.GetCountry.GetName]'s modernization efforts, [SCOPE.sCountry('military_consultant_country').GetName] has offered us the service of General [SCOPE.sCharacter('military_consultant_general').GetFullName] as a military consultant. The terms of this arrangement appear favorable, but we should be wary of indebting ourselves to foreign powers."
 egduqon.4.f:0 ""This, sir, is a Gatling gun. Two hundred rounds per minute. There is nothing, neither man nor beast nor machine, that can withstand the hellish cacophony of ammunition that this device can unleash. We will teach your soldiers to operate such machines, to maintain modern military discipline, and to obey their superiors without question.""
 egduqon.4.a:0 "We welcome [SCOPE.sCountry('military_consultant_country').GetAdjectiveNoFormatting] assistance."
 egduqon.4.b:0 "We do not want their poisoned chalice."
 egduqon.5.t:0 "Embassy to [SCOPE.sCountry('kalsyto_embassy_country').GetName]"
 egduqon.5.d:0 "As part of an ambassadorial voyage to the West, our dignitaries have met with [SCOPE.sCharacter('kalsyto_embassy_politician').GetFullName], a senior [SCOPE.sCountry('kalsyto_embassy_country').GetAdjectiveNoFormatting] politician. Interested in establishing good relations with the newly opening [ROOT.GetCountry.GetAdjectiveNoFormatting] state, they have drafted several treaties we may wish to enter with [SCOPE.sCountry('kalsyto_embassy_country').GetName]."
 egduqon.5.f:0 ""Nations these days all appear to conduct relations with amity and courtesy. But this is entirely superficial; for behind this facade lurks mutual contempt and a struggle for supremacy. While [ROOT.GetCountry.GetName] may now have diplomatic relations with a number of countries, its friendship with the [SCOPE.sCountry('kalsyto_embassy_country').GetAdjectiveNoFormatting] state should be the closest of all, because of the true respect with which we hold the right of self-government."" # Bismarck
 egduqon.5.a:0 "Establish strong diplomatic ties."
 egduqon.5.b:0 "[SCOPE.sCountry('kalsyto_embassy_country').GetName] has much to teach us."
 egduqon.5.c:0 "We have nothing to gain from [SCOPE.sCountry('kalsyto_embassy_country').GetName]."
 egduqon.6.t:0 "[SCOPE.sCountry('western_investor_country').GetAdjectiveNoFormatting] Investments"
 egduqon.6.d:0 "[SCOPE.sCharacter('western_investor_ig_leader').GetFullName], a wealthy and powerful industrialist from [SCOPE.sCountry('western_investor_country').GetName], sees [ROOT.GetCountry.GetName] as a lucrative and untapped market. In exchange for various political favors to be redeemed at an unspecified point in time, [SCOPE.sCharacter('western_investor_ig_leader').GetFullName] is willing to share with us the industrial technology of [SCOPE.sCharacter('western_investor_ig_leader').GetHerHis] homeland."
 egduqon.6.f:0 ""There are those among my colleagues who disdain interest in [ROOT.GetCountry.GetName], opining that its unfriendly politics make it an unappealing place to do business. I, however, see the potential in this country. What today are virgin forests and fallow fields shall tomorrow become thriving urban centers, choked with the healthy smog of modern industry.""
 egduqon.6.a:0 "[SCOPE.sCountry('western_investor_country').GetAdjectiveNoFormatting] ingenuity shall empower [ROOT.GetCountry.GetName]."
 egduqon.6.b:0 "We do not need foreign meddling in our economy."
 egduqon.7.t:0 "Railway Advisors"
 egduqon.7.d:0 "In order to expedite our ambitions to build a railway network, it has been suggested that foreign advisors from countries with established railway systems could be brought in to help."
 egduqon.7.f:0 ""I had only just made the gentleman's acquaintance when I asked him a question about his interest in locomotives, not expecting there to be that much to the topic. As it turns out, there is actually quite a surprising number of things to know about trains.""
 egduqon.7.a:0 "[SCOPE.sC('railway_engineer_country_1').GetName] could assist us."
 egduqon.7.b:0 "[SCOPE.sC('railway_engineer_country_2').GetName] has excellent engineers!"
 egduqon.7.c:0 "[SCOPE.sC('railway_engineer_country_3').GetName] is familiar with railways."
 egduqon.7.e:0 "We have no need of foreign advice."
 egduqon.8.t:0 "Militarized Railways"
 egduqon.8.d:0 "Being privy to the government's ambition to expand [ROOT.GetCountry.GetName]'s railways, the [SCOPE.gsInterestGroup('industrialists_ig').GetName] have offered to support these efforts in [SCOPE.sState('military_railway_state').GetName]."
 egduqon.8.f:0 ""The military will benefit from the railroads in any case, but currently, they are one of many priorities. Allowing them to build their own lines would be quite different. In every era, a lot of power lies in the hands of those who get to draw certain maps. In our era, the railroad network may well turn out to be those maps.""
 egduqon.8.a:0 "An excellent collaboration between military and industry!"
 egduqon.8.b:0 "We will set the priorities ourselves."
 egduqon.9.t:0 "Passivists Reject Militarization"
 egduqon.9.d:0 "As the Idyllic Shield recedes into the past, many in [SCOPE.sState('passivist_state').GetName] fear and reject the possible consequences of war for our nation."
 egduqon.9.f:0 "In the past couple centuries, few families across Yarikhoi had to contend with the reality of sending their sons to war. To them, conflict was something the Orachav dealt with in minor skirmishes with centaurs. Kalsyto as a nation has never had to order itself to war, but with the prospect of not having a choice in the matter becoming larger by the day, it is not a matter if, but when."
 egduqon.9.a:0 "We will slow the rate of militarization."
 egduqon.9.b:0 "The plow must become the firearm."
 kalsyto_slow_militarization: "Slow Militarization"
 egduqon.10.t:0 "Sojda-Kouluuni"
 egduqon.10.d:0 "[SCOPE.sCharacter('armed_forces_leader').GetFullName] has begun organizing private military academies in [SCOPE.sState('gadhlumo_state').GetName], not only teaching military theory, but [SCOPE.sCharacter('armed_forces_leader').GetHerHis] own political ideas."
 egduqon.10.f:0 ""You may view it as a political organization, but how are we expected to instill the spirit of the Soldier in our students if we do not teach them about the responsibility they have to lead and the importance of national ambition and expansion? How can we teach military tactics without discussing how an invasion of our neighbors might be undertaken? Indeed, the scope of what military force can be used for, up to and including its political applications, can and must be part of the curriculum!""
 egduqon.10.a:0 "They provide a valuable service to our armed forces."
 egduqon.10.b:0 "They must be shut down before this political faction gets dangerous."
 kalsyto_sojda_kouluuni:0 "Sojda-Kouluuni"
 egduqon.11.t:0 "The [SCOPE.sState('infringed_port_state').GetPortHubName] Incident"
 egduqon.11.d:0 "[SCOPE.sC('infringing_country').GetName] has attempted to force open one of our harbors, demanding access to the port in [SCOPE.sState('infringed_port_state').GetName]."
 egduqon.11.f:0 ""I saw the [SCOPE.sC('infringing_country').GetAdjectiveNoFormatting] sailors while they were still approaching the coast. By the time I'd gathered a group to drive them back out to sea, they were already at the shore. Most of us were peasants, not soldiers, but at the time I thought they might not be prepared to fight either. Prepared or not, blood was spilled. The rest of us fled. I don't know where they went after that.""
 egduqon.11.a:0 "Fight back! Egdüqon must be protected."
 egduqon.11.b:0 "Negotiate to meet some of their demands."
 egduqon.11.c:0 "Perhaps [SCOPE.sC('assistance_country').GetName] could help mediate this difficult situation."
 egduqon_violated: "Egdüqon Violated"
 egduqon.12.t:0 "Which Way Kalyin Guides Us"
 egduqon.12.d:0 "A recently published articles has debated where [ROOT.GetCountry.GetName]'s future lies after the end of Egdüqon, weighing the benefits of aligning with other Halessi counties or turning to the Trollsbay Concord and the Cannorian powers."
 egduqon.12.f:0 ""It may seem obvious a country's loyalties should be bound by the practicalities of geography, but that thinking lies in the past. The size of the world has changed. Who knows how it will be controlled in the future? The world will... keep getting smaller.""
 egduqon.12.a:0 "[ROOT.GetCountry.GetName] must leave Haless behind and look to the Western powers."
 egduqon.12.b:0 "We will stand with our neighboring nations."
 egduqon.12.c:0 "The future is uncertain. We must be prepared for anything."
 egduqon.13.t:0 "The Shattered Shield"
 egduqon.13.d:0 "Forced to open itself to the world, [ROOT.GetCountry.GetName] must now contend with the economic interference of other powers. The authority of the government has, consequently, been greatly undermined."
 egduqon.13.f:0 "The changing winds of time howl against our door and to preserve our establishement we must bend and open them to the whims of the world."
 egduqon.13.a:0 "We must adapt to our new circumstances."
 modifier_kalsyto_reckoning_disturbed_peace: "Reckoning of Disturbed Peace"
 egduqon.14.t:0 "Artifice Advisors"
 egduqon.14.d:0 "In order to expedite our ambitions to build an Artifice industry, it has been suggested that foreign advisors from countries with established artifice methods could be brought in to help."
 egduqon.14.f:0 ""I had only just made the gentleman's acquaintance when I asked him a question about his interest in artifice, not expecting there to be that much to the topic. As it turns out, there is actually quite a surprising number of things to know about elemental magic.""
 egduqon.14.a:0 "[SCOPE.sC('elemental_artificer_country_1').GetName] could assist us."
 egduqon.14.b:0 "[SCOPE.sC('elemental_artificer_country_2').GetName] has excellent artificers!"
 egduqon.14.c:0 "[SCOPE.sC('elemental_artificer_country_3').GetName] is familiar with elemental applications."
 egduqon.14.e:0 "We have no need of foreign advice."
 kalsyto_elemental_our_way:0 "Elements, Our Way"
 egduqon.15.t:0 "Worker Owned Mines"
 egduqon.15.d:0 "Being privy to the government's ambition to expand [ROOT.GetCountry.GetName]'s iron mines, the [SCOPE.gsInterestGroup('trade_unions_ig').GetName] have offered to support these efforts in [SCOPE.sState('kalsyto_worker_iron').GetName]."
 egduqon.15.f:0 "For centuries, Yarikhoi has lacked a meaningful supply of iron, a resource critical in many applications both civilian and military. Expansion within Nuzurbokh and modern mining techniques have made this resource potentially available to us natively for the first time."
 egduqon.15.a:0 "An excellent incentive for the humble worker!"
 egduqon.15.b:0 "We will set the priorities ourselves."
 kalsyto_mine_priority:0 "Prioritized Iron Mines"
 kalsyto_refused_mine_priority:0 "Refused Prioritized Iron Mines"
 kalsyto_retained_mine_control: "Retained Mine Control"
 egduqon.16.t:0 "Citizens Rally Against Cannorian Interference"
 egduqon.16.d:0 "As we have worked to raise our nation to the standards of Cannor, we have accrued debts to those we seek to emulate. The [SCOPE.gsInterestGroup('intelligentsia_ig').GetName] have protested the leverage  [SCOPE.sC('gp_obligation').GetName] now has over us. They insist we should renounce such debts regardless of the diplomatic consequences."
 egduqon.16.f:0 ""Why should the honest citizen of Halann have to prostrate himself before his alleged superiors in the hopes he will be accepted at their table? We are all equal before Kalyin, to learn from others should be our right, not something we must grovel for.""
 egduqon.16.a:0 "Kalsyto stands for itself alone."
 egduqon.16.b:0 "We do not wish to anger our friends in [SCOPE.sC('gp_obligation').GetName]."
 egduqon.17.t:0 "Maritime Trade Port"
 egduqon.17.d:0 "Being privy to the government's ambition to expand [ROOT.GetCountry.GetName]'s maritime trade, the [SCOPE.gsInterestGroup('petty_bourgeoisie_ig').GetName] have offered to support these efforts in [SCOPE.sState('kalsyto_port_state').GetName]."
 egduqon.17.f:0 ""Maritime trade has always been the lifeblood of Triunic civilization. Qarshtulan glass, Sinesadman dyes, Yarumud carpets, and more have spread across Yarikhoi by boat more often than not throughout our history, and as the waters of the world become more accessible to us it can only be assumed such exchanges will continue to be made at the harbor.""
 egduqon.17.a:0 "An excellent collaboration between trader and industry!"
 egduqon.17.b:0 "We will set the priorities ourselves."
 kalsyto_port_priority:0 "Prioritized Maritime Port"
 kalsyto_refused_port_priority:0 "Refused Prioritized Maritime Port"
 kalsyto_retained_port_control: "Retained Port Control"
 egduqon.18.t:0 "Foreign Relations"
 egduqon.18.d:0 "As we interact more with the wider world, we learn how nobles in their societies operate. While the aristocracy of Kalsyto is far less advantaged than those in the West, Triunic landowners have begun to recognize the influence they could potentially hold, especially when it comes to diplomatic maneuvering with their foreign peers."
 egduqon.18.f:0 ""Much like our own, they maintain significant landed holdings from one generation to the next and marry largely within their own ranks, however what we are not accustomed to is the idea that in most nations these lands also bring with them special privileges and similarly inherited positions within the governments of monarchies. Rather than by election and the will of the people, power is distributed primarily by circumstance of birth. How truly bizarre…""
 egduqon.18.a:0 "Some deals are best made at the wine tasting!"
 egduqon.18.b:0 "The ideals of Kalyin will not be compromised!"
