 eordan_unification.1.t:0 "Eordand Unification"
 eordan_unification.1.d:0 "Under the heroic leadership of [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName], the Eordan nation has been birthed into the world. Unified under a common banner, Eordand will surely shape the future of Aelantir and the world."
 eordan_unification.1.f:0 ""Yes, young elves, Eordand owes to you an undertaking which has merited the applause of the universe. You have conquered and you will conquer still, because you are prepared for the tactics that decide the fate of battles. To this wonderful page in our country's history another more glorious still will be added, and the slave shall show at last to their free sibblings a sharpened sword forged from the links of their fetters."" # Garibaldi
 eordan_unification.1.a:0 "Viva Eordand!"
 eordan_unification.1.b:1 "We will never forget our brave [SCOPE.gsInterestGroup('ruler_ig_scope').GetName]."
  
