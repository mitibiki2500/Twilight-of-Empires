l_english:

###  JEs  ###
 je_neratica_minaria: "The Neratico-Minarian Union"
 je_neratica_minaria_reason: "[SCOPE.sCountry('neratica_scope').GetName] and [SCOPE.sCountry('minaria_scope').GetName] were once on entirely separate trajectories, Neratica being founded by an holy order in the 16th century while Minaria was a penal colony controlled by Lorent. Border skirmishes during the Blackpowder Wars led to Emil síl Onyx, the hero of the Tameter, marching on the capital with his men rather than accept surrender.\n\nNow [SCOPE.sCountry('neratica_scope').GetRuler.GetPrimaryRoleTitle], he negotiated with Lorent for reparations and instead came out with a deal for the sale of Minaria, as the kingdom of Lorent needed war funds and was made aware of how unprotected Minaria truly was. Riding from victory to victory, Emil síl Onyx now intends to create a true union between Neratica and Minaria.\n\n@information! The ambitions of the #bold Onyx Kingdom#! can be averted by forcing them to release their [concept_subject] before the Progress Bar reaches #variable 100%#!.\n\n@warning! Whilst #b $B27$#! seek to consolidate her rule over #bold Minaria#!, she will be subject to increased aggression from her neighbors, most likely the #bold Old Unions#! of the Concord and the Triarchy."
 je_neratica_minaria_goal: "[SCOPE.sCountry('neratica_scope').GetNameNoFlag] successfully maintains her [SCOPE.sCulture('minarian_culture').GetName] [concept_subject] whilst keeping [concept_legitimacy] over #bold 50#! for 10 years. Enacting a more secular religious [concept_law] will also speed up progress."
 je_neratica_minaria_concord_victory: "To achieve an #b Old Union#! victory:\n"
 je_neratica_minaria_on_concord_victory: "On an #b Old Union#! victory:\n$EFFECT$"
 je_neratica_minaria_onyx_victory: "To achieve an #b Onyx#! victory:\n"
 je_neratica_minaria_on_onyx_victory: "On an #b Onyx#! victory:\n$EFFECT$"
 ignore_neratica_minaria_tt: "We will choose not to oppose the formation of #bold Neratica-Minaria#!"
 all_opponents_lose_prestige_tt: "All involved [Concept('concept_country', '$concept_countries$')] hostile to the #b Onyx Monarchy#! will lose [concept_prestige], and gain [Concept('concept_radical', '$concept_radicals$')]"
 neratica_minaria_complete_tt: "Effects will depend on whether this country has chosen to #bold dismantle#! or #bold befriend#! #bold Neratica-Minaria#!"
 neratica_minaria_will_unite_tt: "Neratica and Minaria will [Concept('concept_unification', 'Unify')] into a single [concept_country]"
 je_new_onyx_monarchy: "A new shade of Onyx"
 je_new_onyx_monarchy_reason: "Neratica, as the name implies, was founded from its inception as a nation dedicated to Nerat, the god of the dead and justice. The holy order of the Onyx Legion who conquered those lands from the native Cheshoshi, wanting to be accepted as legitimate in their efforts to convert them, claimed continuity from previous Cheshoshi rulers and ruled from the same Bone Citadel. The Bone Citadel, now Arca Cenad, is still the heart of the country but much had changed.\n\nEmil síl Onyx, the hero of the Tameter, has claimed the title of Onyx King for himself, alongside a new noble name, and thus turned the title into a secular one. While he managed to convince Lorent to support him in exchange for reparations and secured his immediate rule, Neratica doesn't have any dynastic traditions, so it is unlikely that this system will last longer than Emil síl Onyx himself unless he was to prove that his rule can bring the country the glory he promised."


###  Events  ###
 neratica_minaria_events.1.t: "The Pact of [SCOPE.sState('tameter_state').GetCityHubName]"
 neratica_minaria_events.1.d: "The Old Unions of the Concord and the Triarchy may have protested against our plans once, but time has proved their objections irrelevant. The time has come to centralize our lands under a single efficient government and join the ranks of the Aelantiri powers as an equal."
 neratica_minaria_events.1.f: "Our lands cross over the Cliffs of Ruin, free of the limitations that bind the ambition of lesser nations. We marched from the fertile plains of Evermore and reached the mesas of Haraf through the jungles of the Dihen. What would be the forests of the Spoorland, the mangroves of Yesbal, the sands of the Great Empty for us, who already braved all Aelantir has to offer?"
 neratica_minaria_events.1.a: "Today we are more than an union of disparate regions, we become brothers."
 neratica_minaria_events.1.b: "We will join this great project as brothers."
 neratica_minaria_events.2.t: "The Onyx King in Haraf"
 neratica_minaria_events.2.d: "As the status of the Minarian lands and their administration was left unclear since their purchase from Lorent during the Blackpowder Wars, [SCOPE.sCharacter('ruler_scope').GetFullName] has announced that he would become head of state of both Neratica and the former colony, and his intention to create a union between the two countries."
 neratica_minaria_events.2.f: "Nerat is the deity of death, and Minara the deity of life; just as we need balance in all things, we must keep both those aspects in mind to find our purpose. Some may say that it is mere coincidence that our neighboring nations happen to be named after those deities, but then how fortunate are we that fate blessed us with such perfectly complementary cultures, that fate put such nations whose union would be so natural so close together."
 neratica_minaria_events.2.a: "[SCOPE.sCharacter('ruler_scope').GetFullName] will be the king of the Neraticans and the Minarians."
 neratica_minaria_events.2.b: "All will be equal under the Bone Citadel as long as they are loyal, Minarians included."
 neratica_minaria_events.3.t: "End of Neratica-Minaria"
 neratica_minaria_events.3.d: "Losing control over Minaria has dashed Neratican ambitions of uniting the two nations. The Onyx King's plans will join the dreams of many other ambitious men forgotten by history."
 neratica_minaria_events.3.f: "The Old Unions descended upon us with all their wrath for daring to look past the present. When they talk about progress, peace and prosperity, remember that they killed Neratica-Minaria for it. Remember that it is its blood that lies on their hands, its corpse buried under their future."
 neratica_minaria_events.3.a: "Some dreams are too glorious to be witnessed by mortal eyes."
 neratica_minaria_events.4.t: "The only certitude"
 neratica_minaria_events.4.d_1: "Grievous territorial losses have reduced [ROOT.GetCountry.GetName] to the [GetGeographicRegion('geographic_region_noruin').GetName] side of the Cliffs of Ruin. With one half of our union lost, it is clear to all that it is defunct and our current nation's name nothing but vestigial."
 neratica_minaria_events.4.d_2: "Grievous territorial losses have reduced [ROOT.GetCountry.GetName] to the [GetGeographicRegion('geographic_region_haraf').GetName] side of the Cliffs of Ruin. With one half of our union lost, it is clear to all that it is defunct and our current nation's name nothing but vestigial."
 neratica_minaria_events.4.f_1: "If the death of the individual is a tragedy, and the death of the many a statistic, what does that make the death of a nation? Where our union once stretched the southern coast of North Aelantir, it has now found itself contained on one side of the Cliffs of Ruin, and our nation mourns the death of its Minarian dream.\n\nAs Nerat teaches, death is the only thing one can know for certain. As Minara teaches, we live on and enjoy what we still have."
 neratica_minaria_events.4.f_2: "If the death of the individual is a tragedy, and the death of the many a statistic, what does that make the death of a nation? Where our union once stretched the southern coast of North Aelantir, it has now found itself contained on one side of the Cliffs of Ruin, and our nation mourns the death of its Neratican dream.\n\nAs Nerat teaches, death is the only thing one can know for certain. As Minara teaches, we live on and enjoy what we still have."
 neratica_minaria_events.4.a: "$B27$ is all that remains."
 neratica_minaria_events.4.b: "$B09$ is all that remains."
 neratica_minaria_events.5.t: "The Onyx King in Haraf"
 neratica_minaria_events.5.d: "While the Blackpowder Wars upset the balance of power in Cannor, they also did so in Aelantir. When [SCOPE.sCharacter('emil_sil_onyx_scope').GetFullName] was just a garrison commander who seized the Tameter, most expected him to fall shortly after. When he marched on the Bone Citadel rather than surrender, most expected his coup to fail. When he negotiated with Lorent to avoid retaliation for breaching the border, most expected a full Lorentish invasion. But Lorent was in dire need of funds for its war against Anbennar at the time and Minaria was a deeply unprofitable colony, and now the new Onyx King, who removed the clergy from power, announced his plan to unite Neratica and Minaria.
 neratica_minaria_events.5.f: ""The present petition aims to address the ongoing situation with the Neratican tyrant. The Onyx King has already made his intent to challenge Concord and Triarchy interests clear, which would mean nothing short than the destruction of the current order in Aelantir, and from then anarchy and chaos upon our nation. If this escalation continues, he will summon an army of abominations from the Shadow Plane by next year. Only with fast decisive action can we safeguard the future of our country, nay, of all Aelantir!""
 neratica_minaria_events.5.a: "We have to dissolve this unholy union."
 neratica_minaria_events.5.b: "A new power in Aelantir would mean a new potential partner."
 neratica_minaria_events.5.c: "This will all blow over on its own."
 neratica_minaria_events.6.t: "Victory in the Second Onyx War"
 neratica_minaria_events.6.d: "As the burgeoning nation of Minaria was freed from the Neratican grasp and put on its own path, no rival to [ROOT.GetCountry.GetAdjective] interests will rise in the region. The balance of power in Aelantir has been set right once more."
 neratica_minaria_events.6.f: ""With Aelantir in a time of great turmoil, its nations are being shaped and birthed before our eyes. Is it not the responsability of all sentient beings to ensure that good prevails against evil? Is it not our responsability to intervene in that process of nation-building to make sure men of good and honest character prevail over those of greedy and cruel temperament?""
 neratica_minaria_events.6.a: "Another step towards peace and prosperity in Aelantir."
 neratica_minaria_events.7.t: "A new Aelantiri power"
 neratica_minaria_events.7.d: "Cooler heads have prevailed, and diplomatic relations have been formally established with Neratica-Minaria. While the previous order is being questioned, this will surely be to the benefit of [ROOT.GetCountry.GetName]."
 neratica_minaria_events.7.f: "A game with two players is bound to end in an agreement between them, as it is simply the path of least resistance. But a third player will upset the strategy and make the whole system unpredictable. The Concord and the Triarchy may have set the rules of the game so far, but now a third player came onto the board that is North Aelantir."
 neratica_minaria_events.7.a: "Will peace last?"
 neratica_minaria_events.8.t: "The Bone Citadel reigns supreme"
 neratica_minaria_events.8.d: "The [SCOPE.sCountry('neratica_minaria_scope').GetName] has successfully centralized its lands, establishing a unified bureaucracy and passing a constitution. With the failure of our efforts to oppose them, we can only hope a diplomatic reconciliation is possible."
 neratica_minaria_events.8.f: "Where Minaria once had potential as a great nation of its own, it would appear that its burgeoning identity has been subsumed into the emerging power. While the future lays uncertain, one thing is for sure: the fates of Neratica and Minaria are intertwined now, and it is unlikely that Minarians would see us as liberators should another conflict arise."
 neratica_minaria_events.8.a: "We have a new rival to deal with."
 neratica_minaria_events.9.t: "Proclamation of the Neratican Republic"
 neratica_minaria_events.9.d: "In the last days of the war, [SCOPE.GetRootScope.GetCountry.GetRuler.GetLastName] personally led the remnants of [SCOPE.GetRootScope.GetCountry.GetAdjectiveNoFlag] forces for a daring last stand, and has been killed in action. With the [SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle] dead and little dynastic traditions in the country, some representatives have called for the proclamation of a republic back in the capital."
 neratica_minaria_events.9.f: "The path of destruction was easy to follow. It was impressive, in a way, and may even have turned the tides if the odds hadn't been stacked against them so much. But eventually, there were enemy forces in all directions, and there the [SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle] laid in a tomb of [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] own making, surrounded by fire and the bodies of [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] men.\n\nNews had barely reached the capital that everyone was scrambling to get a piece of the pie that [SCOPE.GetRootScope.GetCountry.GetNameNoFormatting] had become, the monarchy already written off as a closed chapter of the country's history. The new provisional government was simply too busy fighting those nostalgic of the days when the clergy held the title of [SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle]."
 neratica_minaria_events.9.a: "Long live the Republic!"
 neratica_minaria_events.9.b: "The clergy comes out on top of the power struggle and restores the status quo ante."
 neratica_minaria_events.10.t: "A new Bone Citadel"
 neratica_minaria_events.10.d: "For centuries, the Bone Citadel was synonymous with the rule of the Neratic clergy who claimed the title of Onyx King. While some believed that the title being made secular would only be a temporary quirk, [SCOPE.sCharacter('ruler_scope').GetFullName]'s victories has cemented [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] rule, and their place as one of the country's greatest rulers."
 neratica_minaria_events.10.f: "Spies who had reported the clergy's plans to come back to power were now all showing the same thing. The priests had all but given up on claiming the Bone Citadel for themselves again, and would instead work with the new [SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle]. After all, times were changing, and they would rather work with the throne to contain the dangerous anti-clerical ideas that were getting so much traction in the world lately."
 neratica_minaria_events.10.a: "We will not forget those who led us this far."
 neratica_minaria_events.10.b: "And so [SCOPE.GetRootScope.GetCountry.GetNameNoFormatting] leaves the past behind."

 notification_neratica_minaria_collapse_name: "Collapse of the Neratico-Minarian Union"
 notification_neratica_minaria_collapse_desc: "Neratica and Minaria severed their ties as opposition to the union proved to great to overcome."
 notification_neratica_minaria_collapse_tooltip: "#header $notification_neratica_minaria_collapse_name$#!\n$TOOLTIP_DELIMITER$\n$notification_neratica_minaria_collapse_desc$"

 notification_neratica_minaria_success_name: "Treaty of [SCOPE.sState('tameter_state').GetNameNoFormatting] Signed"
 notification_neratica_minaria_success_desc: "Neratica and Minaria have formalized their ties into a perpetual state of union, marking the emergence of [SCOPE.sCountry('pbc_scope').GetName]."
 notification_pbc_neratica_minaria_success_tooltip: "#header $notification_neratica_minaria_success_name$#!\n$TOOLTIP_DELIMITER$\n$notification_pbc_peru_bolivia_success_desc$"

