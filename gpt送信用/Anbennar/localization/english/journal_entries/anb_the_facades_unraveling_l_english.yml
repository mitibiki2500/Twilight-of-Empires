##### EVENTS #####
 overclan_events.1.t:0 "Overclan Requests Our Guarantee"
 overclan_events.1.d:0 "The Overclan of Bahar has requested a guarantee of independence. Putting these peculiar goblins in our debt could eventually help us secure a foothold in the rich lands of Bulwar, though we may draw the ire of the Jaddanzar in the process."
 overclan_events.1.f:0 "The emissaries of the Overboss wore remarkably well-crafted black signet rings, a hundred year old fashion statement of the Voltoj elite. Initial chitchats before the diplomatic talks turned into surprisingly extensive discussions on Ravelian theology and customs. Then when talks began, they spoke like automata, reciting with clockwork perfection the benefits of having them as allies in Bulwar, all displayed in extensive accounting books showing potential trade routes and investment opportunities. When they left, half our own barely believed those were goblins they spoke with."
 overclan_events.1.a:0 "We shall grant it to them."
 overclan_events.1.b:0 "Accountant goblins? Who cares?"
 overclan_events.2.t:0 "Overclan Offers a Defensive Pact"
 overclan_events.2.d:0 "Our northern neighbours, the Overclan, are in a situation similar to ours. The looming presence of the Jaddanzar towers over both of our countries’ destinies. Our diplomats have been meeting steadily for the past few months discussing the possibility of a Defensive Pact between us against all those who may threaten the sovereignty of our fair nations."
 overclan_events.2.f:0 "Most Excellent President of the Surakesi League. Let it be known that the King of the Overclan, his supreme Highness Iztuts szal-Perzuk, approves of our talks regarding the possibility of a formal alliance between our two countries. Its purpose is, of course, to stand coordinated against the ambitions of the snarling gnoll-empire of Konolkhatep and the threat of the raiding activities of the Soyzkaru Cartel. There is, and we must insist on this, no other intent behind this pact. Blessed be Surael, and may the Light shine upon us!"
 overclan_events.2.a:0 "We will stand together against all those who threaten us."
 overclan_events.2.b:0 "The League stands alone and dies alone!"
 overclan_events.3.t:0 "Ravelianism Makes Inroads"
 overclan_events.3.d:0 "Local Ravelian chapters have been established by Busilari missionaries in this state. Murmurs of religious change emanate through the disenfranchised."
 overclan_events.3.f:0 "Excerpt from the Voltoj Public Assessment of Missionary Autonomy in [SCOPE.sState('missionary_state').GetName] - [DATE.GetString]: “In conclusion, Ravelian missionary work has been most successful merely within the most impoverished strata of our society, along with those who already felt a stronger cultural connection to Cannor. It is the opinion of the Overboss’s government that such activity poses no threat to the social order of the Overclan, and that inhibiting it would needlessly hinder the free movement of peoples and our fruitful relationship with our Cannorian partners.”"
 overclan_events.3.a:0 "Interesting."
 overclan_events.4.t:0 "Prominent Ravelian Church Constructed"
 overclan_events.4.d:0 "Thanks to the growing base of the faithful within [SCOPE.sState('missionary_state').GetName], local Ravelians are now able to obtain both funding and permission to construct a church of their own."
 overclan_events.4.f:0 "LIMITED CIRCULATION\n\nFrom the desk of Chief Advisor Plakeank Barzil to the Administration of [SCOPE.sState('missionary_state').GetName] - [DATE.GetString]\n\nIt is to my dismay that I hear of your withholding permission for the construction of Ravelian churches under your administration. I trust you have not been led astray by the cries of the more reactionary populace, those who view welcoming a more critical and scientific strain of thought into Bahar as to its detriment. We must not bow to the past my friends."
 overclan_events.4.a:0 "I see."
 overclan_events.5.t:0 "State Supported Conversion?"
 overclan_events.5.d:0 "Local Ravelian chapters appear to be cooperating with state entities to aid missionary work. There are even whispers of high level converts among the administrative Voltoj class."
 overclan_events.5.f:0 "CONFIDENTIAL"
 overclan_events.5.a:0 "REDACTED"
 overclan_events.6.t:0 "Apostasy in Bahar"
 overclan_events.6.d:0 "The foolish royal family of the Overclan have strayed from Surael’s Holy Light! They now overtly worship the Ravelian crystal-god in defiance of our Divine Herald’s authority."
 overclan_events.6.f:0 "The news spread like wildfire throughout the country, soon reaching the Divine Herald’s palace. As he heard the news, already the first few whispers spread among the court. Is the Empire of Surael’s chosen unable to exert its authority in Bulwar itself? Was the Divine Herald wrong in entrusting goblins with custodianship of the Light in Aqatbar? Whatever the answer to these questions, it is clear that the Overclan has formally broken its ties with the Jaddanzar."
 overclan_events.6.a:0 "By Surael!"
 
