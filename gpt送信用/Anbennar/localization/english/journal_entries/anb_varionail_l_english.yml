l_english:
  je_varionail:0 "A New Elfrealm?"
  je_varionail_reason:0 "In the aftermath of the annexation of Torrisheah, we find ourselves in the possession of a great amount of new land, which itself possesses a great amount of plants that would like to eat us all. This represents both danger and opportunity."

  scripted_button_varionail_settler_button_name:0 "Invite Elven Settlers"
  scripted_button_varionail_settler_button_desc:0 "There is no shortage of elves on the rest of Halann, and we will need their help to make this isle a place suitable for habitation. Let us reach out and see what comes of it."
  varionail_settler_cooldown_desc:0 "Has not pressed this button in the last 4 months"
  varionail_settler_migration_desc:0 "Elves from Cannor will come to Varionail to help us tame our land!"

  scripted_button_varionail_plant_button_name:0 "Clear the Plants"
  scripted_button_varionail_plant_button_desc:0 "Landscaping is much easier when the plants don’t fight back, but enough time and effort can overcome this obstacle in a concentrated area which will then require only minimal maintenance to remain safe for settlement."
  varionail_plant_cooldown_desc:0 "Has not pressed this button in the last 2 years"

  varionail_je_assimilation:0 "A New Elfrealm"
  varionail_je_complete:0 "Lords of the Ravenous Isle"
  varionail_clearing:0 "Clearing Man-Eating Plants"
  varionail_trade_prioritized:0 "Prioritizing Trade"
  varionail_settlers_prioritized:0 "Prioritizing Settlers"
  varionail_assimilation_investment:0 "Investing in Assimilation"
  varionail_assimilation_decrease:0 "Struggling to Assimilate"
  varionail_elven_sol_boost:0 "Favoring Elven Claims"
  varionail_elven_sol_decrease:0 "Disregarding Elven Claims"
  varionail_human_sol_boost:0 "Favoring Human Claims"
  varionail_human_sol_decrease:0 "Disregarding Human Claims"
  varionail_developing_countermeasures:0 "Searching for Countermeasures"
  torrisheah_gone_desc:0 "Torrisheah has gone into default."

  anb_varionail.001.t:0 "A New Elfrealm?"
  anb_varionail.001.d:0 "Torrisheah has failed to manage to other former Anbennarian colonies on the Ravenous Isle, and has been seized by Endralliande. Ownership of the rest of the Ravenous Isle has fallen to us."
  anb_varionail.001.f:0 "WHEREAS Varionail now finds itself in the possession of a substantial amount of new territory;\n\nWHEREAS the land of Aelantir does not yet possess a true home for the elves, despite our ancestral claim to it; \n\nWHEREAS Varionail has for centuries served as a beacon of stability in the Ruined Sea; \n\nNOW, THEREFORE BE IT RESOLVED THAT: \n\n1. Varionail shall serve as a home for the elves for all time;\n\n2. The Government shall commit itself to making all of Varionail habitable for all its people;\n\n3. From this day forward, the nation of Varionail shall henceforth and in all official contexts be known as the Elfrealm of Varionail."
  anb_varionail.001.a:0 "The time has come for a new Elfrealm to rise."
  varionail_inital_assimilation_desc:0 "Half of our Havener Elf pops will assimilate to Crescent Elves."

  anb_varionail.002.t:0 "Lords of the Ravenous Isle"
  anb_varionail.002.d:0 "We have successfully established ourselves as Halann´s newest Elfrealm."
  anb_varionail.002.f:0 "”You should have seen the festival! Those torches the men in the parade were bearing- did you hear that those were the torches they lit the first fires from? Now that we can trust our yards, perhaps we should grow some plants of our own. I was thinking of a few banana trees.”"
  anb_varionail.002.a:0 "We’re top of the food chain once again!"

  anb_varionail.003.t:0 "Developing Countermeasures"
  anb_varionail.003.d:0 "By exploring the ruined precursor tunnels under Faliltcost, we may be able to find a way to permanently deal with the man-eating plants."
  anb_varionail.003.f:0 "”I was digging in my marked zone for the day like I usually do, and when I was about two lengths down my shovel hit something that felt like sand. I barely had time to scramble out of my hole before the whole thing fell away, and it just kept going down. I don’t know what you want me to do for the rest of my shift, but I do know that if you try to send me down there I’m quitting.”"
  anb_varionail.003.a:0 "Send an expedition into the tunnels immediately."
  varionail_countermeasure_develop_desc:0 "Our scientists may find a way to control the plants."
  anb_varionail.003.b:0 "We do not have the resources to do anything right now."

  anb_varionail.004.t:0 "A Countermeasure Found"
  anb_varionail.004.d:0 "After months of exploring, we have found samples of an ancient machine that can be used to better understand the rapid growth of the island´s plants."
  anb_varionail.004.f:0 "The captain of the expedition slowly approached the metal contraption and the plants covering it, with his fellows behind him ready to set the place on fire if the situation became unsalvageable. The captain made it past one row of plants, then two. The plants shifted, and the glade disappeared from the rest of the expedition’s view. The expedition tensed. A while passed, and the captain re-emerged from the glade, brushing past two of the plants on his way back out. For some reason, they were not biting."
  anb_varionail.004.a:0 "Use the technology to slow the plant's growth to a manageable level."
  varionail_countermeasure_clear_desc:0 "With the plant growth slowed, we will be able to permanently burn out most of the plants."
  anb_varionail.004.b:0 "Use the technology to improve our control of the plants."
  varionail_countermeasure_control_desc:0 "Controlling the plants will boost agricultural throughput, but be more costly to maintain."

  anb_varionail.005.t:0 "Picking a State"
  anb_varionail.005.d:0 "Dealing with the island´s plants will be costly in time and resources. We can only deal with the plants in a single state at a time."
  anb_varionail.005.f:0 "Things looked so simple looking down at the map- there was only so much of the Ravenous Isle, and it had all been divided into immaculately-bordered areas. Once all the areas had been cleared of plants, the task would be done. The issue, of course, was the cost of clearing each of those areas, both in terms of financing and manpower."
  anb_varionail.005.a:0 "Varionail shall be cleared."
  anb_varionail.005.b:0 "Silvertennar shall be cleared."
  anb_varionail.005.c:0 "Faliltcost shall be cleared."

  anb_varionail.006.t:0 "Clearing the Plants"
  anb_varionail.006.d:0 "Our workers have finished dealing with the plants in [ROOT.GetState.GetName]."
  anb_varionail.006.f:0 "”Do you know how hard it is to clear an area of all flora?” The foreman looked out across the field. “We think we’ve finally done it, but we burned as many of us in those bonfires as we did the plants. Now that we’re done, people might finally be able to settle here- I’ve been thinking about settling down for a plot of my own.”\n\n“Munas help us all if we missed a seed.”"
  anb_varionail.006.a:0 "Good to know."

  anb_varionail.007.t:0 "Assimilation Troubles"
  anb_varionail.007.d:0 "Some poorer elves are struggling to adjust to their new life in Varionail."
  anb_varionail.007.f:0 "”I was a gardener back home. It isn’t the most glamorous profession, but it kept me away from the more dangerous lines of work. Now I spend all day in the pounding heat for less than I earned back home, and gardening IS one of the more dangerous lines of work.”"
  anb_varionail.007.a:0 "They will have to deal with it on their own."
  anb_varionail.007.b:0 "Invest some money into helping accommodate them."

  anb_varionail.008.t:0 "Overstretched Ports"
  anb_varionail.008.d:0 "With the influx of new settlers, our ports are beginning to get backed up, leading to delays."
  anb_varionail.008.f:0 "”At one time, that part of the docks was meant for travellers to walk through, but the cranes are so backed up that we’ve been using it as a storage area. We’ve had to route people through the cargo bay. I know it’s backwards, but at least you can step from place to place there.”"
  anb_varionail.008.a:0 "Prioritize the unloading of cargo."
  anb_varionail.008.b:0 "Prioritize the unloading of settlers."

  anb_varionail.009.t:0 "Finding Space"
  anb_varionail.009.d:0 "With so much of the island being covered in dangerous plants, new settlers are struggling to compete with the humans on the island for available space."
  anb_varionail.009.f:0 "”There are two types of land on the Isle: cleared and wild. The settlers we send to the cleared land establish communities. The settlers we send to the wild land don’t come back.”"
  anb_varionail.009.a:0 "Favor the Elven inhabitants."
  anb_varionail.009.b:0 "Favor the Human inhabitants."
  varionail_human_radicals_desc:0 "#r +2.0%#! of Human [Concept('concept_pop', '$concept_pops$')] in the state become 2% more [Concept('concept_radical','$concept_radical$')]."
