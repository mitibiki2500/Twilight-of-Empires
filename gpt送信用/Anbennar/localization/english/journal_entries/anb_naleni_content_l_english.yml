  je_group_naleni_great_reform: "Reforms Under God"
  je_naleni_great_reform_main: "Naleni's Great Reform Under God: Main"
  je_naleni_great_reforming_agriculture: "Great Reform: Agriculture"
  je_naleni_naval_trade_tracker: "Total Exported Goods: #g [GetPlayer.MakeScope.ScriptValue('total_country_exports')|0]#!"
  je_naleni_great_reforming_industrial: "Great Reform: Industrial"
  je_naleni_great_reforming_institutions: "Great Reform: Institutions"
  je_naleni_great_reforming_naval: "Great Reform: Naval"
  je_naleni_great_reform_main_reason: "[SCOPE.sCharacter('Jasiune_Nephiueda_scope').GetFullName]’s desperate plans, a mixture of childish hope, despair, genuine ideas and a spark of greatness. They promise to modernize the Matriarchy and bring the country back from the brink of death. Inspired by their stay at Busilar, [SCOPE.sCharacter('Jasiune_Nephiueda_scope').GetFullName] has drafted a series of drastic changes needed for Naléni to free itself from the shackles of its overlord, Melakmengi and any others who might hold similar designs. \n\n This will not be easy, for our situation is truly dire. Years of Mengi isolationist policies have all but destroyed the country’s markets. The once proud fleets that ruled the seas are naught but tales, and we have little of value to offer to anybody. Even beyond that is the backwards nature of the Matriarchy itself. Slavery is still common despite the world at large having moved past it, and there is a growing rift between the Sky Domain populace and the Ravelian leadership. \n\nIf we complete some of the reforms we will be spared of the worst consequences." 
  je_naleni_great_reforming_agriculture_reason: "Agriculture is a centerpiece of any country; feeding the people is a core principle of any functional economy, and we are failing at it. Much of our fertile land lies unused, and that which is tilled relies upon slave labor.. Both of these need to be remedied. [SCOPE.sCharacter('Jasiune_Nephiueda_scope').GetFullName] proposes a massive endeavor to expand farming efforts as a whole across our nation with a focus on anything we can export, but more importantly, grain to feed ourselves without relying on the paltry ration our overlord gouges our coffers with. A starving harpy cannot fly, so Naléni must flourish."
  je_naleni_great_reforming_industrial_reason: "The economy of Halann is always evolving and growing to greater heights. Our economy however, has stagnated, remaining unchanged for decades. Our industries are nonexistent, and our lack of mining infrastructure prevents us from participating in the global economy, stemming in no small part from the guilds that control the mines.  [SCOPE.sCharacter('Jasiune_Nephiueda_scope').GetFullName] insists on investing into a massive expansion of our industrial and mining complexes, calling it untapped potential, and getting rid of the guilds at any cost. According to their plans, it would be a simple task to convert our existing roost infrastructure into something focused on harvesting the plentiful metals in our land afterwards."
  je_naleni_great_reforming_institutions_reason: "An enlightened population is an innovative population, and innovation is key to success in the modern era, or so says [SCOPE.sCharacter('Jasiune_Nephiueda_scope').GetFullName]. Our Mengi subjects are backwards in both senses of enlightenment, clinging on to their Sky Domain beliefs and being mostly uneducated. They propose investing heavily in education and the construction of new places of learning, focusing primarily on Ravelian teachings, which they consider to be the best way of guaranteeing innovation."
  je_naleni_great_reforming_naval_reason: "The Matriarchy, during its golden age under Ríva Nephieuda, was a great naval power in the region. As traders and pirates both, we used to control the seas and demand respect. This all changed when our country was forced under the Mengi’s dominion and their isolationist insanity. All the riches coming to our land suddenly dried out, and our economy all but collapsed. This cannot continue. Our sailors must return to the seas and this enforced isolation needs to end. Our goods cannot continue to gather dust in warehouses until the end of time, waiting until our Mengi overlords decide to connect with the world again. "
  amendment_naleni_great_reform_1: "Godly economy"
  naleni_great_reform_under_god_has_more_than_x_export_of_goods_tt: "[ROOT.GetCountry.GetName] exports more than 225 [Concept('concept_good', '$concept_goods$')] to the [concept_world_market]."
  naleni_great_reform_modernizer_increase_tt: "Increases chance to get modernizer ideology"
  naleni_great_reform_events.1.t: "The Bright-Eyed Daughter"
  naleni_great_reform_events.1.d: "The Matriarch’s heir returns, and with her, they brings ideas, plans and most importantly, hope. The Great Reform Under God, the last flight of the Matriarchy."
  naleni_great_reform_events.1.f: "The Matriarch’s court bustles with activity, for [SCOPE.sCharacter('Jasiune_Nephiueda_scope').GetFullName], their youngest daughter and heir, returns from Busilar where they were sent for their education years ago. One might think their homecoming would be a joyous affair, a family reunion after a long time apart, yet it is anything but that. The first thing the returning child did was point out the decay and failure of their own country, comparing it to Busilar's prosperity. And yet, despite the audacity, they are correct. Naléni is a husk of its former self, with the century of Mengi rule over the harpies having crushed any hopes they ever had of both economic freedom and sovereignty. Their once powerful navy has been reduced to nothing, and their trade routes completely cut off due to their overlord’s policy of isolationism. Naléni is dead, they just haven't noticed yet.\n\n But Jasuine has a desperate plan to both bring Naléni back into the world, and to bring God into Naléni. The proposed reforms would go a long way to reclaiming the matriarchy’s long lost independence, but most importantly, stop the decay and allow the harpies to do what they once did: fly free, and feel the ocean breeze as they sailed across the seas." 
  naleni_great_reform_events.1.a: "Naléni’s last flight begins now!"
  naleni_great_reform_events.2.t: "The Great Reform: Set Sail!"
  naleni_great_reform_events.2.d: "The Great Reform shows results: Our fleets finally sail again after years of isolation, and trade is steadily increasing."
  naleni_great_reform_events.2.f: "Once upon a time the seas knew to respect the colors of the Matriarchy, for if they were merchants they had the protection to trade as they pleased, and if they were pirates they had the power to plunder whoever they wanted. Such a time is long gone, but our country rejoices all the same. After years of isolation, we sail again. Our first traders in almost a century return with profits that haven’t been seen for too long. It’s a far cry from the glories of the old Matriarchy, but it is hope, proof that the Great Reform carries apace. Some of the more excitable sailors call for a return to our pirating days, but [SCOPE.sCharacter('Jasiune_Nephiueda_scope').GetFullName] curbs those suggestions on the spot. Naléni sails towards a new future now." 
  naleni_great_reform_events.2.a: "The seas will be ours again!"
  naleni_great_reform_events.3.t: "The Great Reform: God and Progress"
  naleni_great_reform_events.3.d: "The Great Reform shows results: Our people are enlightened to the glory of God and the desire for progress is flourishing across the country"
  naleni_great_reform_events.3.f: "Across our country, enlightenment spreads. Knowledge grows in [SCOPE.sCharacter('Jasiune_Nephiueda_scope').GetFullName]’s centers of education, and alongside that, the knowledge that God is the truth. Citizens are made aware of Heaven and aspire to reach it, and even the ones who remain ignorant of that still attempt to bring the future to Naléni. New ideas sprout, and old ones are innovated. The days of backwards thinking holding back our Matriarchy aren’t fully gone, but they’re starting to let go, slowly but surely. God guides Naléni, and Naléni listens." 
  naleni_great_reform_events.3.a: "Our eyes are opened"
  naleni_great_reform_events.4.t: "The Matriarchy Rises"
  naleni_great_reform_events.4.d: "The Great Reform sweeps the nation like a storm, and through sheer miracle, Naléni rises above it, freer than ever before, and ready to take on the world. All under God, and Matriarchy."
  naleni_great_reform_events.4.f: "A natural act, to wish something was different. To want a situation to improve. To desire one last flight. And yet, dreams aren’t real. Wishes don’t always come true, and hoping for something does not guarantee it will happen. Despite this, the Great Reform has succeeded. [SCOPE.sCharacter('Jasiune_Nephiueda_scope').GetFullName] has done it. The Matriarchy, against all odds, has managed to achieve all it set out to do. The fields grow crops aplenty, the people have been enlightened to both God and knowledge. The markets are bustling, and ships proudly display Naléni’s colors. [SCOPE.sCharacter('Jasiune_Nephiueda_scope').GetFullName]’s plan has excelled, and this was not a harpy’s desperate last flight before death, a last gasp of air before the end; it was instead a glorious rebirth! Harpies sail across the ocean once again, and countries all across Halann display interest in investing in this prospective new market. No longer is Naléni chained and isolated. It once again hears the call of the ocean and flies free, feeling the breeze under its feathers. On this day, the Matriarchy of Naléni finally remembered how to live" 
  naleni_great_reform_events.4.a: "Under God, the Matriarchy returns!"
  naleni_great_reform_events.5.t: "Clipped Wings"
  naleni_great_reform_events.5.d: "The Great Reform fails, and with that, Naléni’s fate is sealed. The once great Matriarchy of Naléni is destined to turn into a footnote in history books."
  naleni_great_reform_events.5.f: "Dreaming. A natural act, to wish something was different. To want a situation to improve. To desire one last flight. And yet, dreams aren’t real. Wishes don’t come true, and hoping for something does not guarantee it will happen. All that hope does is create despair. The Great Reform was a dream. A childish delusion that the Matriarchy could be great again. That harpies would sail the seas once more, feel the breeze, fly free, and reclaim what was once theirs. \n\n The Reform took over the country like a storm, but both sailors and harpies know: You do not sail during a storm, and you do not fly into it. A lesson learned harshly tonight. [SCOPE.sCharacter('Jasiune_Nephiueda_scope').GetFullName]’s grand plan worked, in a way. It stopped the slow decay and inevitable crumbling of the Matriarchy by causing it immediately. The few loyalists left are directionless, and opposing forces already move in, for they know: a harpy with clipped wings cannot live. Naléni died on this day, and all can tell it." 
  naleni_great_reform_events.5.a: "Our last flight, now, and forever."
  naleni_great_reform_events.6.t: "A Chance to Fly Again"
  naleni_great_reform_events.6.d: "The Great Reform succeeds, but not entirely. The country is still saved, but it’s clear that it was too ambitious of a goal"
  naleni_great_reform_events.6.f: "Dreaming. A natural act, to wish something was different. To want a situation to improve. To desire one last flight. And yet, dreams aren’t real. Wishes don’t always come true, and hoping for something does not guarantee it will happen. But sometimes dreams are a prelude. The Great Reform brought limited success, but success nonetheless. Plans created by a hopeful child met uncaring reality and faltered. But [SCOPE.sCharacter('Jasiune_Nephiueda_scope').GetFullName] never gave up. They and the dreams of the entire Matriarchy pushed through, and managed to grasp tightly onto something the harpies haven’t had in a long time: a chance to fly free again. Naléni isn’t as radiant and perfect as planned, but it is home. It is free. And while any harpy still draws breath, it will continue to be so. \n \n The Great Reform was a childish hope, but it was hope the Matriarchy desperately needed. It was the hope needed to crawl out of its deathbed, to fly again." 
  naleni_great_reform_events.6.a: "Once more, with feeling"
