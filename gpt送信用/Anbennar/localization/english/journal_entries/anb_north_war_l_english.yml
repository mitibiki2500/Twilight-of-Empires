##### JE #####
 je_ameion_north_war:0 "Conflict in the Guaraddhi"
 je_caergaraen_north_war:0 "Conflict in the Guaraddhi"
 je_ameion_north_war_reason:0 "The savages of Caergaraen are preparing for war; border skirmishes between them and the Astòlbhen buffer states are becoming more and more common. It is only a matter of time before open hostilities are declared. In 1775, when Rakkabuttai fell, the Synkletos was caught by surprise; while total collapse was avoided and the War in the North ended in a stalemate, it came at a great cost. We will not suffer the same humiliation again, this time the first strike will be ours! It is now clear that the Amastòli leadership is too weak to oppose the Chendyans, so we will start by assuming leadership of the Astòlbhen once again."
 je_caergaraen_north_war_reason:0 "Decades ago we were able to break the Bloodcloaks, who had been terrorizing Chendyans for hundreds of years, and assume control of the eastern plains. We were close to unifying Chendya for the first time in history, but the Kheionai devils and their Taychendi mercenaries held their ground. We made them pay for it in blood, but it was not enough and our king was forced to accept the status quo. In the meantime Chendyan sycophants betrayed our people and aligned with the Kheionai invaders, calling themselves “Astòlbhen” and adopting their ridiculous customs. We need to put an end to this, squash the traitors and lead our people to unify the plains once and for all."

