 anb_north_war.6.d:0 "Ameion draws first blood"

 anb_north_war.1.f:0 "Ever since the stalemate that ended the First War in the North, both the chendyans of Cargaraen and Ameion have remained high. While the breakaway Astòlbhen have acted as buffer states, with both sides recovering it's becoming more and more clear that a second conflict is inevitable"
 anb_north_war.2.f:0 "Ever since the stalemate that ended the First War in the North, both the chendyans of Cargaraen and Ameion have remained high. While the breakaway Astòlbhen have acted as buffer states, with both sides recovering it's becoming more and more clear that a second conflict is inevitable"
 anb_north_war.3.f:0 "Our control over Amastól is now secure and we can begin preparation for a preemptive strike on Caergaraen. At the same time, it's imperative to prevent Chendyans reinforcements to bolster their ranks. We will offer the Guaraddhi plains to Astòlbhen veterans, securing their loyalty and pushing the nomadic tribes westwards."
 anb_north_war.4.f:0 "A great victory! The Astòlbhen traitors have been conquered leaving us sole claimant to the mantle of Chendya. Let us rally the tribes, their warriors will bolster our ranks and their families will be granted the resources necessary to settle the steppes. Let us prepare to kick the kheionai invaders out of the Guaraddhi once and for all."
 anb_north_war.5.f:0 "Once again the Chendyans to the north catch us unprepared. The Astòlbhen buffer states have been conquered, and it’s only a matter of time before Caergaraen stages an invasion of Mesolakti. The Synkletos is paralyzed, our armies are stretched thin and it’s clear that Caergaraen is rallying the entire Guaraddhi to confront us. "
 anb_north_war.6.f:0 "“As you may have heard, the blue-skinned devils have rallied the traitors and are encroaching into tribal lands. Most of the Chendyans are fleeing east, disillusioned with our cause. Surely the Kheionai are already plotting to invade us, but we will not let this setback break us. We will not surrender! We will paint the steppes with the invader’s blood!”"

