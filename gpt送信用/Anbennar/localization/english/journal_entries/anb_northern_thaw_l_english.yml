 ## MAIN JE ##
 je_northern_thaw_main:0 "Northern Thaw"
 je_northern_thaw_main_reason:0 "While the Magnates have overthrown the Great Lords and their monarchy, their status as the new lords of the north is tenuous at best, with each region having their own dissentors. In the Greatwoods, a rogue general begins his rebellion. In the Reach, Blackpowderist ideals have led to growing concern over the rights of the nonhumans and of the unelected positions of the Grand Magnate. And in Gerudia, skalds and commonfolk alike detest our reign as mere resource extraction. If this is left unchecked, the Northern League may fall."
 nl_contested_magnate_rule:0 "Contested Magnate Rule"
 nl_magnate_rule_enforced:0 "Magnate Rule Enforced"
 nl_magnate_group_credited_ig:0 "Took the credit for the League's success"
 je_northern_thaw_dalr_homelands_tt:0 "Owns all Dalr [concept_homeland]"
 je_northern_thaw_reach_homelands_tt:0 "Owns all Blue Reachman [concept_homeland]"
 je_northern_thaw_failure_tt:0 "#bold Magnate Authority#! reaches 0, or the other regions of the League broke away."
 je_northern_thaw_breakup_tt:0 "The #bold Reach#! and #bold Gerudia#! may #bold secede#!, depending on who we have integrated.\nShould the Reach secede while we have integrated the Dalr, our strong control over Gerudia will allow us to keep control over the straits."

 northern_thaw_league_unity_bar_name:0 "Magnate Authority"
 northern_thaw_league_unity_bar_desc:0 "Magnate Authority"
