l_english:
 je_aul_dwarov:0 "The Ancient Dream"
 je_aul_dwarov_reason:0 "The dream of Aul-Dwarov, All-Dwarves'-Home, has lingered with the Dwarven people for millennia after millennia. With our newfound strength, the calls to restore it have become too loud to ignore.\n\nTo form Aul-Dwarov, all [Concept('concept_ad_hold', '$concept_ad_holds$')] within the [Concept('concept_ad_serpentspine_holds', '$concept_ad_serpentspine_holds_single$')] must be [Concept('concept_ad_reclaimed_hold', '$concept_ad_reclaimed_holds_short$')] before [Concept('concept_unification_zeal','$concept_unification_zeal$')] runs out or our country is stopped.\n\n[Concept('concept_unification_zeal','$concept_unification_zeal_short$')] naturally decays, and the decay is faster if the [GetInterestGroupVariant('ig_petty_bourgeoisie',GetPlayer).GetNameWithCountryVariant] [Concept('concept_ad_reclaimed_hold', '$concept_ad_reclaimed_holds_verbing$')] increases [Concept('concept_unification_zeal','$concept_unification_zeal_short$')], and the natural decay can be slowed or arrested by [Concept('concept_ad_sway','$concept_ad_sway_verb$')] more Interest Groups to support the [Concept('concept_ad_reclamation', '$concept_ad_reclamation$')].\n\nFor those unwilling to embrace the revanchist insanity of the Reclamation, weathering the storm will break its grip on your country - if you haven't already gone too far..."
 dwarf_control_tt:0 "All [Concept('concept_ad_hold', '$concept_ad_holds$')] in the [Concept('concept_ad_serpentspine_holds', '$concept_ad_serpentspine_holds_single$')] must be controlled by us or a Dwarven subject."
 serpentspine_culture_tt:0 "We are a nation of Serpentspine Dwarves"
 unite_aul_dwarov_tt:0 "All Serpentspine Dwarves will become our primary cultures"
 auldwarov_grand_success_tt:0 "If all [Concept('concept_ad_hold', '$concept_ad_holds$')] in the Serpentspine are brought under our control:\n[ROOT.GetCountry.GetNameNoFlag] becomes #white #b Aul-Dwarov#!#!\nAll Serpentspine Dwarves will become our primary cultures\nTriggers the Event #white #b $auldwarov.4.t$#!#!, gaining glory from victory"
 aul_dwarov_no_fail_condition_tt:0 "None of the failure conditions are true"
 auldwarov_fail_one_tt:0 "If [Concept('concept_unification_zeal','$concept_unification_zeal$')] reaches 0 while [Concept('concept_infamy','$concept_infamy$')] is below $infamy_pariah$: \nTriggers the Event #white #b $auldwarov.2.t$#!#!, reaffirming our identity as [ROOT.GetCountry.GetNameNoFlag]"
 auldwarov_fail_two_tt:0 "Triggers the Event #white #b $auldwarov.3.t$#!#!, intensifying internal strife"
 aul_dwarov_hold_loss_tt:0 "Has lost control of a [Concept('concept_ad_reclaimed_hold', '$concept_ad_reclaimed_hold$')]"
 aul_dwarov_badboy_zeal_tt:0 "[Concept('concept_unification_zeal','$concept_unification_zeal$')] is 0 while [Concept('concept_infamy','$concept_infamy$')] is at $infamy_pariah$"
 auldwarov.1.t:0 "The Ancient Dream"
 auldwarov.1.a:0 "These mountains were ours once, and will be again."
 auldwarov.1.b:0 "Only a fool would chase a dream into the waking world."
 auldwarov.1.c:0 "A mere formality at this stage."
 auldwarov.1.d:0 "The dream of Aul-Dwarov yet lives!"
 auldwarov.1.f:0 "While the War of the Bloody Gem turned brother against brother and Hold against Hold, the dream endured.\nWhile the Orcs sieged the Dwarovar and the holds diminished, the dream endured.\n[ROOT.GetCountry.GetCustom('auldwarov_start_custom')]\n\nOur position among the Great Powers of the world is secure, and our people cry out to see the dream fulfilled."
 auldwarov.2.t:0 "A New Future"
 auldwarov.2.a:0 "We are [SCOPE.sCountry('auldwarov_new_nation_scope').GetNameNoFlag], and we hold that name dear."
 auldwarov.2.b:0 "Three cheers for all the races of [SCOPE.sCountry('auldwarov_new_nation_scope').GetNameNoFlag]!"
 auldwarov.2.d:0 "Escaping the Chains"
 auldwarov.2.f:0 "It has been said that tradition is shackles the dead place on the living. [ROOT.GetCountry.GetCustom('auldwarov_traditionreason_custom')] the shackles of the Aul-Dwarov we are all too glad to see gone.\n\nWith the collapse of the petty clans' political ambitions, the call to unify the Serpentspine has been drowned out by other voices clamoring for a different future - one they can write themselves."
 auldwarov.3.t:0 "The Ancient Dream Shattered"
 auldwarov.3.d:0 "Aul-Dwarov is dead."
 auldwarov.3.f:0 "It died nine thousand years ago, when the War of the Bloody Gem sundered its unity and turned Hold against Hold.\nIt died eight thousand years ago, when the heart of the Dwarovrod was wrested from Dwarven control by the newly arrived Orcs.\n[ROOT.GetCountry.GetCustom('auldwarov_collapse_custom')]\n\nEven the dream has died in the trenches and caverns of the Serpentspine, as our soldiers fought and bled and died against foreign foes in foreign lands for a nation that never existed."
 auldwarov.3.a:0 "How could this have happened!?"
 auldwarov.4.t:0 "The Ancient Dream Fulfilled"
 auldwarov.4.a:0 "These mountains are ours now, and will be always."
 auldwarov.4.d:0 "Home of All Dwarves proclaimed"
 auldwarov.4.f:0 "Eight thousand years of decline have been reversed within a single Dwarven lifetime. The white-blue banner of the Aul-Dwarov hangs in every Hold of the Serpentspine, and valiant soldiers have triumphed against Orcs, Goblins and - regrettably, but unavoidably - fellow Dwarves.\n\nWith the guns silent and the rubble cleared, a new golden age for the Dwarves is inevitable."
 auldwarov.5.t:0 "Closing Ranks"
 auldwarov.5.d:0 "Radicalism in [SCOPE.sState('event_hold_scope').GetName] has caused many to embrace facets of [SCOPE.sCulture('event_hold_culture_scope').GetName] identity as protest."
 auldwarov.5.f:0 ""I know we ain't never had this for dinner before, but the lads were giving out 'food for [SCOPE.sState('event_hold_scope').GetNameNoFormatting]'s finest'. Suppose it's part of the new Citizen's Militia."\n\n"Make sure you thank them properly - Ancestors know they've already done more than the Guard ever did.""
 auldwarov.5.a:0 "As long as they still pay taxes."
 auldwarov.6.t:0 "Brothers-in-arms"
 auldwarov.6.d:0 "Dwarven minorities in [SCOPE.sState('event_hold_scope').GetName] have become increasingly indistinguishable from the [SCOPE.sCulture('event_hold_culture_scope').GetName] majority"
 auldwarov.6.f:0 ""Identification with a foreign Hold is easy enough when it can be considered irretrievably lost. Confronted with the newfound possibility of returning 'home', we observe that many are unable to reconcile their desire to stay with their professed identity, until one or the other gives way."\n\nVazhatun Journal of Psychology, Volume 5"
 auldwarov.6.a:0 "As long as they still pay taxes."
 auldwarov.7.t:0 "Reclamation and Restitution"
 auldwarov.7.d:0 "A campaign by some [SCOPE.sCulture('event_hold_culture_scope').GetName] people has gathered supporters within [SCOPE.sState('migration_origin').GetName], with the intent on making good their ancestral claims."
 auldwarov.7.f:0 ""That our birthright - the halls of our ancestors - are populated by naught but the most inferior specimens is beyond shameful. And have the fools in power done anything to rectify this? No! It falls to us, I fear, to do what needs be done."\n\nLetter to the [SCOPE.sCulture('event_hold_culture_scope').GetNameNoFormatting] Gazette"
 auldwarov.7.a:0 "Clear a section of the Hold for the new arrivals"
 auldwarov.7.b:0 "Let the campaign burn itself out"
 hold_culture_shift_radical_tt:0 "About 15% of the local Dwarf minorities will become [SCOPE.sCulture('event_hold_culture_scope').GetName]."
 hold_culture_shift_loyalist_tt:0 "About 15% of the local Dwarf minorities will become [SCOPE.sCulture('event_hold_culture_scope').GetName]."
 hold_migrants_let_go_tt:0 "Many Dwarves in [SCOPE.sState('migration_origin').GetName] will migrate to [SCOPE.sState('event_hold_scope').GetName] and begin calling themselves [SCOPE.sCulture('event_hold_culture_scope').GetName]."
 hold_migrants_forced_stay_tt:0 "Some Dwarves in [SCOPE.sState('event_hold_scope').GetName] will convert to the [SCOPE.sCulture('event_hold_culture_scope').GetName] culture."
 auldwarov_start_ordstunic:0 "While the Serpentreach tore itself apart in greed, the dream endured."
 auldwarov_collapse_ordstunic:0 "It died mere decades ago, when the Hoardcurse and the ghosts of Gor Dûrgheled both ripped the Serpentreach apart."
 auldwarov_start_seghdihr:0 "While the Burned Empress squatted in Seghdihr and declared the dissolution of the Segbandal, the dream endured."
 auldwarov_collapse_seghdihr:0 "It died seven hundred years ago, when the Phoenix Empire shattered the Segbandal."
 auldwarov_start_gulan:0 "While the authority of the Divine Herald faltered and we suffered through a third civil war, the dream endured."
 auldwarov_collapse_gulan:0 "It died three centuries ago, when the Light of Surael revealed to us a path we have now turned from."
 auldwarov_start_amldihr:0 "While Duran Blueshield fled the King's Rock with the shame of defeat, the dream endured."
 auldwarov_collapse_amldihr:0 "It died four hundred years ago, when Duran Blueshield was forced to flee the orcish tribes of the King's Rock."
 auldwarov_start_jorkad:0 "While our company escaped south beyond the reach of the Railskulker tribe, the dream endured."
 auldwarov_collapse_jorkad:0 "It died three hundred years ago, when the Ruby Company were forced to flee Verkal Kozenad to escape the Railskulker tribe."
 auldwarov_start_khugdihr:0 "While the Siegebreakers ravaged Khugdihr and opened the way for the Dookanson to destroy Cannor, the dream endured."
 auldwarov_collapse_khugdihr:0 "It died four hundred years ago, when the Dookanson shattered Khugdihr and marched to free his God from the Regent Court."
 auldwarov_dwarf_pantheon_reason:0 "May the Everbeard forgive us for finding truth in that sentiment, but"
 auldwarov_ancestor_worship_reason:0 "Our honoured Ancestors would be mortified by that sentiment, but"
 auldwarov_regent_court_reason:0 "It sounds uncomfortably close to Corinite doctrine, but"
 auldwarov_jadd_reason:0 "We learnt this well when we embraced the Light of Surael, and"
