 concept_ad_hold:2 "Hold"
 concept_ad_holds:2 "Holds"
 concept_ad_hold_desc:2 "A $concept_ad_hold$ is a fortified underground city carved out by the [Concept('concept_ad_dwarf', '$concept_ad_dwarf_dwarves$')] over the course of centuries. $concept_ad_holds$ all share the Dwarven Hold state trait and are primarily found within the mountains of the Serpentspine." 
 concept_ad_reclaimed_hold:2 "Reclaimed Hold"
 concept_ad_reclaimed_holds:2 "Reclaimed Holds"
 concept_ad_reclaimed_holds_short:2 "Reclaimed"
 concept_ad_reclaimed_holds_verbing:2 "Reclaiming Holds"
 concept_ad_reclaimed_hold_desc:2 "A $concept_ad_reclaimed_hold$ is a [Concept('concept_ad_hold', '$concept_ad_hold$')] within the [Concept('concept_ad_serpentspine_holds', '$concept_ad_serpentspine_holds_single$')] controlled by your country or its Dwarven subjects. Recovering each and every one is the goal of the [Concept('concept_ad_reclamation', '$concept_ad_reclamation$')].\n\nEach new $concept_ad_reclaimed_hold$ adds 20 to [Concept('concept_unification_zeal','$concept_unification_zeal$')]."
 concept_ad_dwarf:2 "Dwarf"
 concept_ad_dwarf_dwarven:2 "Dwarven"
 concept_ad_dwarf_dwarves:2 "Dwarves"
 concept_ad_dwarf_desc:2 "A short creature fond of drink and industry."
 concept_ad_military_goods:2 "Military Products"
 concept_ad_military_good:2 "Military Product"
 concept_ad_military_goods_desc:2 "The [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetNameWithCountryVariant] are interested in the production of the following $concept_ad_military_goods$:\n[GetGoods('small_arms').GetName]\n[GetGoods('artillery').GetName]\n[GetGoods('ammunition').GetName]\n[GetGoods('tanks').GetName]"
 concept_ad_raw_goods:2 "Industrial Products"
 concept_ad_raw_good:2 "Industrial Product"
 concept_ad_raw_goods_desc:2 "The [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetNameWithCountryVariant] are interested in the following $concept_ad_raw_goods$:\n[GetGoods('tools').GetName]\n[GetGoods('steel').GetName]\n[GetGoods('artificery_doodads').GetName]\n[GetGoods('engines').GetName]"
 concept_ad_demands:2 "Demands"
 concept_ad_demands_single:2 "Demand"
 concept_ad_demands_desc:3 "$concept_ad_demands$ are the issues an [Concept('concept_interest_group', '$concept_interest_group$')] requires the government to handle before they support the [Concept('concept_ad_reclamation', '$concept_ad_reclamation$')]. Each Interest Group only requires a certain number of $concept_ad_demands$ to be met.\n\nInterest Groups [concept_in_government] can be approached using the $sway_government_button$ button in the Ancient Dream Journal Entry to reveal their demands and your progress towards them: summaries are also listed in the below concepts, but cannot be acted on.\n\n[Concept('concept_ad_landowners_sway', '$concept_ad_landowners_sway$')]\n[Concept('concept_ad_armed_forces_sway', '$concept_ad_armed_forces_sway$')]\n[Concept('concept_ad_devout_sway', '$concept_ad_devout_sway$')]\n[Concept('concept_ad_rural_folk_sway', '$concept_ad_rural_folk_sway$')]\n[Concept('concept_ad_intelligentsia_sway', '$concept_ad_intelligentsia_sway$')]\n[Concept('concept_ad_industrialists_sway', '$concept_ad_industrialists_sway$')]\n[Concept('concept_ad_trade_unions_sway', '$concept_ad_trade_unions_sway$')]"
 concept_ad_serpentspine_holds:2 "Serpentspine Holds"
 concept_ad_serpentspine_holds_single:2 "Serpentspine"
 concept_ad_serpentspine_holds_number:2 "32"
 concept_ad_serpentspine_holds_desc:2 "The $concept_ad_serpentspine_holds$ consist of the [Concept('concept_ad_hold', '$concept_ad_holds$')] of the following [Concept('concept_strategic_region','$concept_strategic_regions$')]:\n$EFFECT_LIST_BULLET$[GetStateRegion('STATE_KRAKDHUMVROR').GetName]\n$EFFECT_LIST_BULLET$[GetStrategicRegion('region_west_dwarovar').GetName]\n  $EFFECT_LIST_BULLET$[GetStateRegion('STATE_KHUGDIHR').GetName]\n  $EFFECT_LIST_BULLET$[GetStateRegion('STATE_HARAZ_ORLDHUM').GetName]\n  $EFFECT_LIST_BULLET$[GetStateRegion('STATE_AMLDIHR').GetName] and its subholds [GetStateRegion('STATE_AMLHARAZ').GetName], [GetStateRegion('STATE_HALL_OF_ANCESTORS').GetName] and [GetStateRegion('STATE_VERKAL_VAZKRON').GetName]\n  $EFFECT_LIST_BULLET$[GetStateRegion('STATE_ORLAZAM_AZ_DIHR').GetName]\n  $EFFECT_LIST_BULLET$[GetStateRegion('STATE_DUR_VAZHATUN').GetName]\n  $EFFECT_LIST_BULLET$[GetStateRegion('STATE_MITHRADHUM').GetName]\n$EFFECT_LIST_BULLET$[GetStateRegion('STATE_ER_NATVIR').GetName]\n  $EFFECT_LIST_BULLET$[GetStateRegion('STATE_VERKAL_KOZENAD').GetName]\n  $EFFECT_LIST_BULLET$[GetStateRegion('STATE_HUL_JORKAD').GetName]\n$EFFECT_LIST_BULLET$[GetStrategicRegion('region_serpentreach').GetName]\n  $EFFECT_LIST_BULLET$[GetStateRegion('STATE_ORLGHELOVAR').GetName]\n  $EFFECT_LIST_BULLET$[GetStateRegion('STATE_ARG_ORDSTUN').GetName]\n  $EFFECT_LIST_BULLET$[GetStateRegion('STATE_SHAZSTUNDIHR').GetName]\n  $EFFECT_LIST_BULLET$[GetStateRegion('STATE_VERKAL_SKOMDIHR').GetName]\n  $EFFECT_LIST_BULLET$[GetStateRegion('STATE_OVDAL_LODHUM').GetName]\n  $EFFECT_LIST_BULLET$[GetStateRegion('STATE_GOR_BURAD').GetName]\n$EFFECT_LIST_BULLET$[GetStrategicRegion('region_segbandal').GetName]\n  $EFFECT_LIST_BULLET$[GetStateRegion('STATE_GOR_VAZUMBROG').GetName]\n  $EFFECT_LIST_BULLET$[GetStateRegion('STATE_HEHODOVAR').GetName]\n  $EFFECT_LIST_BULLET$[GetStateRegion('STATE_SEGHDIHR').GetName]\n  $EFFECT_LIST_BULLET$[GetStateRegion('STATE_VERKAL_GULAN').GetName]\n  $EFFECT_LIST_BULLET$[GetStateRegion('STATE_GOR_OZUMBROG').GetName]\n$EFFECT_LIST_BULLET$[GetStrategicRegion('region_east_dwarovar').GetName]\n  $EFFECT_LIST_BULLET$[GetStateRegion('STATE_OVDAL_KANZAD').GetName]\n  $EFFECT_LIST_BULLET$[GetStateRegion('STATE_GROZUMDIHR').GetName]\n  $EFFECT_LIST_BULLET$[GetStateRegion('STATE_OVDAL_AZ_AN').GetName]\n  $EFFECT_LIST_BULLET$[GetStateRegion('STATE_HUL_AZ_KRAKAZOL').GetName]\n$EFFECT_LIST_BULLET$[GetStateRegion('STATE_TUWAD_DHUMANKON').GetName]\n  $EFFECT_LIST_BULLET$[GetStateRegion('STATE_GRONSTUNAD').GetName] and its subhold [GetStateRegion('STATE_VURDRIZ_ANDRIZ').GetName]\n  $EFFECT_LIST_BULLET$[GetStateRegion('STATE_VERKAL_DROMAK').GetName]


