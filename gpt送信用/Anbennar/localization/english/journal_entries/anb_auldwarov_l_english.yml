 auldwarov.100.t:0 "Securing Support"
 auldwarov.100.d:0 "[Concept('concept_ad_reclamation', '$concept_ad_reclamation_ist$')] elements of government [Concept('concept_interest_group', '$concept_interest_groups$')] have presented their visions of a unified Aul-Dwarov."
 auldwarov.100.f:0 "Every Dwarf in the room supported the Reclamation, of course. The final victory of Dwarvenkind, and an opportunity to build a true utopia under the mountains.\n\nThe devil, as always, was in the details of those long-dreamt utopias."
 auldwarov.100.a:0 "Hopefully we can please everyone..."
 
 auldwarov.110.t:0 "Formal Complaint from the [GetInterestGroupVariant('ig_landowners',GetPlayer).GetNameWithCountryVariant]"
 auldwarov.110.d:0 "The government's failure to meet demands has prompted the [GetInterestGroupVariant('ig_landowners',GetPlayer).GetNameWithCountryVariant] to issue an ultimatum. We have six months to regain support."
 auldwarov.110.f:0 "The Dwarf is well-dressed, in an older style, and carries an air of unassailable confidence.\n\nThey also carry a record of the Clans' demands and our government's commitment to upholding them.\n\nThere are no pleasantries exchanged."
 auldwarov.110.a:0 "Promise to rectify this injustice"
 auldwarov.110.b:0 "Negotiate a quiet disentanglement"
 
 auldwarov.112.t:0 "Scathing Diatribe"
 auldwarov.112.d:0 "Brazen failures to appease the [GetInterestGroupVariant('ig_landowners',GetPlayer).GetNameWithCountryVariant] have prompted them to publicly and acrimoniously split from the Reclamation."
 auldwarov.112.f:0 ""The false Reclamation has shown its true allegiances - to new money and new ideas, the past be damned."\n\nIn protest against the violations of privileges held since time immemorial, the greater Clans have formally repudiated all prior agreements to support for the Reclamation."
 auldwarov.112.a:0 "We will retake Aul-Dwarov without these turncoats!"
 
 auldwarov.120.t:0 "Formal Complaint from the [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetNameWithCountryVariant]"
 auldwarov.120.d:0 "The government's failure to meet demands has prompted the [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetNameWithCountryVariant] to issue an ultimatum. We have six months to regain support."
 auldwarov.120.f:0 "The Dwarf arrives in full military regalia, and carries an air of danger.\n\nThey also carry a record of the military' demands and our government's commitment to upholding them.\n\nThere are no pleasantries exchanged."
 auldwarov.120.a:0 "Promise to rectify this injustice"
 auldwarov.120.b:0 "Negotiate a quiet disentanglement"
 
 auldwarov.122.t:0 "Scathing Diatribe"
 auldwarov.122.d:0 "Brazen failures to appease the [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetNameWithCountryVariant] have prompted them to publicly and acrimoniously split from the Reclamation."
 auldwarov.122.f:0 ""Any who claim the Reclamation will be a bloodless affair are fools... or traitors."\n\nThe military has suspended all civil assistance for the Reclamation, and remain committed only to fighting our wars."
 auldwarov.122.a:0 "We will retake Aul-Dwarov without these turncoats!"
 
 auldwarov.130.t:0 "Formal Complaint from the [GetInterestGroupVariant('ig_devout',GetPlayer).GetNameWithCountryVariant]"
 auldwarov.130.d:0 "The government's failure to meet demands has prompted the [GetInterestGroupVariant('ig_devout',GetPlayer).GetNameWithCountryVariant] to issue an ultimatum. We have six months to regain support."
 auldwarov.130.f:0 "The Dwarf arrives in holy vestments, and carries a faint smell of incense.\n\nThey also carry a record of the military' demands and our government's commitment to upholding them.\n\nThere are no pleasantries exchanged."
 auldwarov.130.a:0 "Promise to rectify this injustice"
 auldwarov.130.b:0 "Negotiate a quiet disentanglement"
 
 auldwarov.132.t:0 "Scathing Diatribe"
 auldwarov.132.d:0 "Brazen failures to appease the [GetInterestGroupVariant('ig_devout',GetPlayer).GetNameWithCountryVariant] have prompted them to publicly and acrimoniously split from the Reclamation."
 auldwarov.132.f:0 ""What cruel irony, that seeking to restore the body of Aul-Dwarov has cost its soul."\n\nDisappointed with the immoral conduct of the Reclamationists, the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] have withdrawn their blessing of Reclamationist ventures and preach harmony and contentment."
 auldwarov.132.a:0 "We will retake Aul-Dwarov without these turncoats!"
 
 auldwarov.140.t:0 "Formal Complaint from the [GetInterestGroupVariant('ig_rural_folk',GetPlayer).GetNameWithCountryVariant]"
 auldwarov.140.d:0 "The government's failure to meet demands has prompted the [GetInterestGroupVariant('ig_rural_folk',GetPlayer).GetNameWithCountryVariant] to issue an ultimatum. We have six months to regain support."
 auldwarov.140.f:0 "The Dwarf arrives in a simple tunic, and carries a faint smell of earth and tobacco.\n\nThey also carry a record of the farmers' demands and our government's commitment to upholding them.\n\nThere are no pleasantries exchanged."
 auldwarov.140.a:0 "Promise to rectify this injustice"
 auldwarov.140.b:0 "Negotiate a quiet disentanglement"
 
 auldwarov.142.t:0 "Scathing Diatribe"
 auldwarov.142.d:0 "Brazen failures to appease the [GetInterestGroupVariant('ig_rural_folk',GetPlayer).GetNameWithCountryVariant] have prompted them to publicly and acrimoniously split from the Reclamation."
 auldwarov.142.f:0 ""Reclamation? I just want to grill, man.""
 auldwarov.142.a:0 "We will retake Aul-Dwarov without these turncoats!"
 
 auldwarov.150.t:0 "Formal Complaint from the [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetNameWithCountryVariant]"
 auldwarov.150.d:0 "The government's failure to meet demands has prompted the [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetNameWithCountryVariant] to issue an ultimatum. We have six months to regain support."
 auldwarov.150.f:0 "The Dwarf arrives in an a well-cut but inexpensive suit, and carries a delicate pair of glasses.\n\nThey also carry a record of the academic lobby's demands and our government's commitment to upholding them.\n\nThere are no pleasantries exchanged."
 auldwarov.150.a:0 "Promise to rectify this injustice"
 auldwarov.150.b:0 "Negotiate a quiet disentanglement"
 
 auldwarov.152.t:0 "Scathing Diatribe"
 auldwarov.152.d:0 "Brazen failures to appease the [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetNameWithCountryVariant] have prompted them to publicly and acrimoniously split from the Reclamation."
 auldwarov.152.f:0 ""Get fucked."\n\nDisgusted by the Reclamation's close-minded and discriminatory practices, artists and philosophers have published beautifully illustrated polemics and diatribes calling in to question every aspect of the movement."
 auldwarov.152.a:0 "We will retake Aul-Dwarov without these turncoats!"
 
 auldwarov.160.t:0 "Formal Complaint from the [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetNameWithCountryVariant]"
 auldwarov.160.d:0 "The government's failure to meet demands has prompted the [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetNameWithCountryVariant] to issue an ultimatum. We have six months to regain support."
 auldwarov.160.f:0 "The Dwarf arrives in a suit of the latest Leaguer cut and carries an understated pocketwatch.\n\nThey also carry a record of industry's demands and our government's commitment to upholding them.\n\nThere are no pleasantries exchanged."
 auldwarov.160.a:0 "Promise to rectify this injustice"
 auldwarov.160.b:0 "Negotiate a quiet disentanglement"
 
 auldwarov.162.t:0 "Scathing Diatribe"
 auldwarov.162.d:0 "Brazen failures to appease the [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetNameWithCountryVariant] have prompted them to publicly and acrimoniously split from the Reclamation."
 auldwarov.162.f:0 ""A nation without capital is as a mineshaft through shale - short-sighted and doomed to collapse."\n\nTo secure the continued prosperity of all good Dwarves, and safeguard against repeated infringements of the right to free and fair commerce, Industrial leaders have ended all favourable contracts with Reclamationist organisations."
 auldwarov.162.a:0 "We will retake Aul-Dwarov without these turncoats!"
 
 auldwarov.170.t:0 "Formal Complaint from the [GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetNameWithCountryVariant]"
 auldwarov.170.d:0 "The government's failure to meet demands has prompted the [GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetNameWithCountryVariant] to issue an ultimatum. We have six months to regain support."
 auldwarov.170.f:0 "The Dwarf arrives on foot and carries an air of righteous fury.\n\nThey also carry a record of the unions' demands and our government's commitment to upholding them.\n\nThere are no pleasantries exchanged.
 auldwarov.170.a:0 "Promise to rectify this injustice"
 auldwarov.170.b:0 "Negotiate a quiet disentanglement"
 
 auldwarov.172.t:0 "Scathing Diatribe"
 auldwarov.172.d:0 "Brazen failures to appease the [GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetNameWithCountryVariant] have prompted them to publicly and acrimoniously split from the Reclamation."
 auldwarov.172.f:0 ""What use are grand conquests to the hungry?"\n\nRadicalised by broken promises of equality, unions across the nation encourage their workers to strike or work-to-rule at Reclamationist workplaces."
 auldwarov.172.a:0 "We will retake Aul-Dwarov without these turncoats!"
 
 sway_government_button:0 "Reclamationist Overtures"
 sway_government_button_desc:0 "[Concept('concept_ad_reclamation', '$concept_ad_reclamation_ist$')] elements of the government will approach their [Concept('concept_interest_group', '$concept_interest_groups$')], allowing them to present their [Concept('concept_ad_demands', '$concept_ad_demands$')]. Fulfilling these [Concept('concept_ad_demands', '$concept_ad_demands$')] will enable the option to [Concept('concept_ad_sway','$concept_ad_sway$')] these [Concept('concept_interest_group', '$concept_interest_groups$')] to gather support for the [Concept('concept_ad_reclamation', '$concept_ad_reclamation$')].\n\n Any [Concept('concept_ad_sway','$concept_ad_sway_past$')] [Concept('concept_interest_group', '$concept_interest_group$')] will suffer penalties to their [concept_clout] and [concept_interest_group_attraction] if the Reclamation fails."

