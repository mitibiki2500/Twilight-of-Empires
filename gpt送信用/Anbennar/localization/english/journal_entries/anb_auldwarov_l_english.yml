 concept_unification_zeal:2 "Unification Zeal"
 concept_unification_zeal_short:2 "Zeal"
 concept_unification_zeal_desc:2 "$concept_unification_zeal$ is a measure of the popular support of [Concept('concept_ad_reclamation', '$concept_ad_reclamation$')] efforts within your country, spurred on by pan-nationalist ideals and the [GetInterestGroupVariant('ig_petty_bourgeoisie',GetPlayer).GetNameWithCountryVariant]. If it ever reaches zero, the dream of Aul-Dwarov within the country is over.\n\n$concept_unification_zeal_short$ can be raised by conquering new holds and by [Concept('concept_ad_sway','$concept_ad_sway_verb$')] [Concept('concept_interest_group', '$concept_interest_groups$')] to support the project. A [Concept('concept_ad_sway','$concept_ad_sway_past$')] [Concept('concept_interest_group', '$concept_interest_group$')] increases monthly $concept_unification_zeal_short$ proportional to its [concept_clout], increased further if [concept_powerful].\n\nThe [GetInterestGroupVariant('ig_petty_bourgeoisie',GetPlayer).GetNameWithCountryVariant] are always [Concept('concept_ad_sway','$concept_ad_sway_past$')] and give double Zeal from [concept_clout]."
 concept_ad_reclamation:2 "Reclamation"
 concept_ad_reclamation_ist:2 "Reclamationist"
 concept_ad_reclamation_desc:2 "The $concept_ad_reclamation$ is the dream of reconquering and restoring all [Concept('concept_ad_hold', '$concept_ad_holds$')] within the Serpentspine to their 'rightful' Dwarven owners. The loss of their ancient homeland has profoundly affected Dwarven culture for thousands of years, and even though most would agree the task is impossible the dream lives on."
 concept_ad_sway:2 "Reclamationist Sway"
 concept_ad_sway_verb:2 "Swaying"
 concept_ad_sway_past:2 "Swayed"
 concept_ad_sway_short:2 "Sway"
 concept_ad_sway_desc:2 "$concept_ad_sway$ is a condition for [Concept('concept_interest_group', '$concept_interest_groups$')] that indicates their support for the [Concept('concept_ad_reclamation', '$concept_ad_reclamation$')]. [Concept('concept_interest_group', '$concept_interest_groups$')] can be $concept_ad_sway_past$ by fulfilling [Concept('concept_ad_demands', '$concept_ad_demands$')] specific to their [Concept('concept_interest_group', '$concept_interest_group$')].\n\nIf an Interest Group is Swayed and the country reneges on their demands, they will issue an ultimatum. Continuing to ignore their demands will remove their $concept_ad_sway$ and significantly impact [Concept('concept_unification_zeal','$concept_unification_zeal$')]. The Interest Group will no longer be interested in negotiation even if their demands are met in the future.\n\n[Concept('concept_interest_group', '$concept_interest_groups$')] that are $concept_ad_sway_past$ will suffer significant political penalties if support for the [Concept('concept_ad_reclamation', '$concept_ad_reclamation$')] dries up."
