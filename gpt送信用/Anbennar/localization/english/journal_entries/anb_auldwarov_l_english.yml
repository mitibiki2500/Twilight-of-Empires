 auldwarov_landowners_support_value_tt:0 "At least #white #b 2#!#! of the following must be true: \n[ROOT.GetCountry.GetCustom('auldwarov_landowners_line1')][GetInterestGroupVariant('ig_landowners',GetPlayer).GetNameWithCountryVariant] are [concept_powerful] and [concept_in_government]\n[ROOT.GetCountry.GetCustom('auldwarov_landowners_line2')] [ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_monarchy').GetName] or [GetLawType('law_chiefdom').GetName]\n[ROOT.GetCountry.GetCustom('auldwarov_landowners_line3')] [ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_autocracy').GetName] or [GetLawType('law_landed_voting').GetName]\n[ROOT.GetCountry.GetCustom('auldwarov_landowners_line4')][ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_consumption_based_taxation').GetName] or [GetLawType('law_land_based_taxation').GetName]\n[ROOT.GetCountry.GetCustom('auldwarov_landowners_line5')] No [concept_consumption_tax] on the following [Concept('concept_good','$concept_goods$')]:\n[GetGoods('luxury_furniture').GetName]\n[GetGoods('luxury_clothes').GetName]\n[GetGoods('tea').GetName]\n[GetGoods('coffee').GetName]\n[GetGoods('wine').GetName]\n[GetGoods('porcelain').GetName]\n[GetGoods('transportation').GetName]\n[GetGoods('services').GetName]"
 auldwarov_armed_forces_support_value_tt:0 "At least #white #b 2#!#! of the following must be true: \n[ROOT.GetCountry.GetCustom('auldwarov_armed_forces_line1')][GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetNameWithCountryVariant] are [concept_powerful] and [concept_in_government]\n[ROOT.GetCountry.GetCustom('auldwarov_armed_forces_line2')][ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_professional_army').GetName] law\n[ROOT.GetCountry.GetCustom('auldwarov_armed_forces_line3')][ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_militarized_police').GetName] law\n[ROOT.GetCountry.GetCustom('auldwarov_armed_forces_line4')][ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_national_guard').GetName] law\n[ROOT.GetCountry.GetCustom('auldwarov_armed_forces_line5')]Has Very High [Concept('concept_military_wage','$concept_military_wages$')]\n[ROOT.GetCountry.GetCustom('auldwarov_armed_forces_line6')]Has enforced a [concept_war_goal] within the last 5 years"
 auldwarov_intelligentsia_support_value_tt:0 "At least #white #b 4#!#! of the following must be true:\n[ROOT.GetCountry.GetCustom('auldwarov_intelligentsia_line1')][GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetNameWithCountryVariant] are [concept_powerful] and [concept_in_government]\n[ROOT.GetCountry.GetCustom('auldwarov_intelligentsia_line2')] [ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_appointed_bureaucrats').GetName] law\n[ROOT.GetCountry.GetCustom('auldwarov_intelligentsia_line3')] [ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_universal_suffrage').GetName] law\n[ROOT.GetCountry.GetCustom('auldwarov_intelligentsia_line4')] [ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_total_separation').GetName] law\n[ROOT.GetCountry.GetCustom('auldwarov_intelligentsia_line5')] [ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_presidential_republic').GetName] or [GetLawType('law_parliamentary_republic').GetName] law\n[ROOT.GetCountry.GetCustom('auldwarov_intelligentsia_line6')] [ROOT.GetCountry.GetNameNoFlag] has a [GetBuildingType('building_university').GetName] in every [concept_incorporated_state]\n[ROOT.GetCountry.GetCustom('auldwarov_intelligentsia_line7')] [ROOT.GetCountry.GetNameNoFlag] has [concept_literacy] above #white #b 70%#!#!"
 auldwarov_rural_folk_support_value_tt:0 "At least #white #b 3#!#! of the following must be true:\n[ROOT.GetCountry.GetCustom('auldwarov_rural_folk_line1')][GetInterestGroupVariant('ig_rural_folk',GetPlayer).GetNameWithCountryVariant] are [concept_powerful] and [concept_in_government]\n[ROOT.GetCountry.GetCustom('auldwarov_rural_folk_line2')] [ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_closed_borders').GetName] law\n[ROOT.GetCountry.GetCustom('auldwarov_rural_folk_line3')] [ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_frontier_colonization').GetName] law\n[ROOT.GetCountry.GetCustom('auldwarov_rural_folk_line4')] [ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_agrarianism').GetName] law\n[ROOT.GetCountry.GetCustom('auldwarov_rural_folk_line5')] [ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_homesteading').GetName] or [GetLawType('law_collectivized_agriculture').GetName] law\n[ROOT.GetCountry.GetCustom('auldwarov_rural_folk_line6')][GetGoods('grain').GetName] in [ROOT.GetCountry.GetMarket.GetName] is less or equal to #white #b 0%#!#! cheaper than [concept_base_price]\n[ROOT.GetCountry.GetCustom('auldwarov_rural_folk_line7')] All [GetPopType('peasants').GetName] in [Concept('concept_incorporated_state', '$concept_incorporated_states$')] have a [concept_sol] greater than or equal to #white #b 10#!#!"
 auldwarov_industrialists_support_value_tt:0 "At least #white #b 4#!#! of the following must be true:\n[ROOT.GetCountry.GetCustom('auldwarov_industrialists_line1')][GetInterestGroupVariant('ig_industrialists',GetPlayer).GetNameWithCountryVariant] are [concept_powerful] and [concept_in_government]\n[ROOT.GetCountry.GetCustom('auldwarov_industrialists_line2')] [ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_technocracy').GetName] law\n[ROOT.GetCountry.GetCustom('auldwarov_industrialists_line3')] [ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_private_schools').GetName] law\n[ROOT.GetCountry.GetCustom('auldwarov_industrialists_line4')] [ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_private_health_insurance').GetName] law\n[ROOT.GetCountry.GetCustom('auldwarov_industrialists_line5')] [ROOT.GetCountry.GetNameNoFlag] is the largest producer of at least #white #b 2#!#! [Concept('concept_ad_military_goods', '$concept_ad_military_goods$')] or produces a prestige [Concept('concept_ad_military_goods', '$concept_ad_military_good$')]\n[ROOT.GetCountry.GetCustom('auldwarov_industrialists_line6')] [ROOT.GetCountry.GetNameNoFlag] is the largest producer of at least #white #b 2#!#! [Concept('concept_ad_raw_goods', '$concept_ad_raw_goods$')] or produces a prestige [Concept('concept_ad_raw_goods', '$concept_ad_raw_good$')]"
 auldwarov_trade_unions_support_value_tt:0 "At least #white #b 6#!#! of the following must be true:\n[ROOT.GetCountry.GetCustom('auldwarov_trade_unions_line1')][GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetNameWithCountryVariant] are [concept_powerful] and [concept_in_government]\n[ROOT.GetCountry.GetCustom('auldwarov_trade_unions_line2')] [ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_council_republic').GetName] law\n[ROOT.GetCountry.GetCustom('auldwarov_trade_unions_line3')] [ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_cooperative_ownership').GetName] or [GetLawType('law_command_economy').GetName] law\n[ROOT.GetCountry.GetCustom('auldwarov_trade_unions_line4')] [ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_collectivized_agriculture').GetName] law\n[ROOT.GetCountry.GetCustom('auldwarov_trade_unions_line5')] [ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_worker_protections').GetName] law\n[ROOT.GetCountry.GetCustom('auldwarov_trade_unions_line6')] [ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_old_age_pension').GetName] law\n[ROOT.GetCountry.GetCustom('auldwarov_trade_unions_line7')] [ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_public_health_insurance').GetName] law\n[ROOT.GetCountry.GetCustom('auldwarov_trade_unions_line8')] [ROOT.GetCountry.GetNameNoFlag] has the highest [concept_sol] of any country\n[ROOT.GetCountry.GetCustom('auldwarov_trade_unions_line9')] All [Concept('concept_pop', '$concept_pops$')] in [Concept('concept_incorporated_state', '$concept_incorporated_states$')] have a [concept_sol] greater than or equal to #white #b 18#!#!"
