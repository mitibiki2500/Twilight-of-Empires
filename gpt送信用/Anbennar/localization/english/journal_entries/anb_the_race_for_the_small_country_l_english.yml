  ##### Events #####
  anb_the_race_for_the_small_country.1.t:0 "The Race Begins"
  anb_the_race_for_the_small_country.1.d:0 "We have received multiple letters from our old rivals and friends, insisting that they will “protect our fragile nation from those who seek to tear it apart”, and though their offers seem tempting, we know that they will come at a steep price should any seize an advantage."
  anb_the_race_for_the_small_country.1.f:0 "The first modern war has begun- not one of bullets and steel, but politics and capital."
  anb_the_race_for_the_small_country.1.a:0 "We Must Fight Back!"

  anb_the_race_for_the_small_country.2.t:0 "The Race Begins"
  anb_the_race_for_the_small_country.2.d:0 "The Small Country sits at the crossroads of the great powers of Western Cannor, controlling it would at minimum secure our borders and would more likely allow us to threaten our enemies' flanks. However our rivals are no fools, whether to seize control formally or to reclaim historical lands, the great powers of Cannor are once more seeking to subjugate the Small Country."
  anb_the_race_for_the_small_country.2.f:0 "The first modern war has begun- not one of bullets and steel, but politics and capital."
  anb_the_race_for_the_small_country.2.a:0 "The Race Begins"

  anb_the_race_for_the_small_country.3.t:0 "The Smallfolk Stand Tall"
  anb_the_race_for_the_small_country.3.d:0 "What the great powers had once thought as a mere puppet whom they could toy with between themselves has now become a true power in its own rights. By playing them off of each other us halflings have come out victorious, able to hold our heads high as an independent nation."
  anb_the_race_for_the_small_country.3.f:0 "The Small Country has broken free from its ancient cycle of subjugation, once and for all!"
  anb_the_race_for_the_small_country.3.a:0 "Halflings Free Forever"

  anb_the_race_for_the_small_country.4.t:0 "A Shift in Alignment"
  anb_the_race_for_the_small_country.4.d:0 "Although they were initially hesitant towards our entreaties, the halflings of the Small Country have at last agreed to our proposals for further industrial development in their lands. In exchange for further investment and cooperation, they have little choice to but to return lands seized in the uprising to us."
  anb_the_race_for_the_small_country.4.f:0 "The Small Country has fallen back into line! The dream of the Halfling Revolt is over."
  anb_the_race_for_the_small_country.4.a:0 "The Small Country Is Ours"

  anb_the_race_for_the_small_country.5.t:0 "Our Hold, Consolidated"
  anb_the_race_for_the_small_country.5.d:0 "Despite rising sentiment for independence, the halflings of the Small Country can no longer deny their dependence on superior gnomish engineering and economic planning. Our influence over their society has grown such that they have little choice but to accept our full protection and guidance."
  anb_the_race_for_the_small_country.5.f:0 "After a thousand years of separation, our distant kin return to the fold! The dream of the Halfling Revolt is over."
  anb_the_race_for_the_small_country.5.a:0 "The Smallfolk Unite"