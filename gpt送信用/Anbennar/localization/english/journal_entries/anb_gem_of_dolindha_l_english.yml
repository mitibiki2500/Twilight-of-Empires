l_english:
 je_gem_of_dolindha:0 "Gem of Dolindha"
 je_gem_of_dolindha_reason:0 "Bosancovac is highly desirable, but in a tenuous position. The Dragon Dominion and The Sarda Empire both wish to include it in their growing spheres of influence, but are cautious to not let it slip into the other's possession first."
 je_gem_of_dolindha_progress:0 "The #bold Influence Bar#! will #tooltippable;tooltip:je_gem_of_dolindha_special_tooltip_advance move#! according to the amount of influece projected onto #B Bosancovac#!. The #bold Influence Bar#! reaching #variable 100#! for either side will result in #B Bosancovac#! falling under their sway."
 je_gem_of_dolindha_special_tooltip_advance:0 "The following conditions will #bold move#! the #bold Influence Bar#!:\n• Bosancovaco [concept_gdp_ownership]\n• Each side's [concept_army_power_projection] including subjects\n• A positive [concept_political_lobby] in Bosancovac"
#  je_gem_of_dolindha_goal:0 "Reach an influence of 100" # unused
 je_gem_of_dolindha_lobby:0 "Gem of Dolindha"

 je_gem_of_dolindha_bar_completion: "For #v Bosancovac#! to come under sway:\n"
 je_gem_of_dolindha_on_bar_completion: "When the bar reaches either end:\n$EFFECT$"
 je_gem_of_dolindha_bar_completion_tt: "The influence of [SCOPE.sCountry('srd_nation_scope').GetName] or [SCOPE.sCountry('drd_nation_scope').GetName] must reach #v 100#!"
 gem_of_dolindha_ally_power_projection_tt: "[SCOPE.sCountry('bos_nation_scope').GetName] and allies [concept_army_power_projection]: ([GetGlobalVariable('gem_of_dolindha_bosancovac_army_passive_var').GetValue|0]#!) is more than half of [SCOPE.sCountry('srd_nation_scope').GetName] and [SCOPE.sCountry('drd_nation_scope').GetName] combined [concept_army_power_projection]: ([GetGlobalVariable('gem_of_dolindha_total_army_passive_var').GetValue|0])"
 je_gem_of_dolindha_on_bar_completion_tt: "[SCOPE.sCountry('bos_nation_scope').GetName] becomes a [concept_tributary] of [SCOPE.sCountry('srd_nation_scope').GetName] or [SCOPE.sCountry('drd_nation_scope').GetName]"
 je_gem_of_dolindha_confederation_victory: "For influence to not work:\n"
 je_gem_of_dolindha_on_confederation_victory: "In that case, $EFFECT$"
 je_gem_of_dolindha_on_subject_tt: "If [SCOPE.sCountry('bos_nation_scope').GetName] becomes a [concept_subject]:\n   [SCOPE.sCountry('bos_nation_scope').GetName] has their autonomy decreased"
