 gem_of_dolindha.1.t:0 "The Gem of Dolindha"
 gem_of_dolindha.1.d:0 "Bosancovac is highly desirable, but in a tenuous position. The Dragon Dominion and The Sarda Empire both wish to include it in their growing spheres of influence, but are cautious to not let it slip into the other's possession first."
 gem_of_dolindha.1.f:0 "Bosancovac is a city built on atop the Ynn, surrounded by water, which makes it a great center of trade and natural barrier, seperating Sarda and Dolindha."
 gem_of_dolindha.1.a:0 "The game begins."