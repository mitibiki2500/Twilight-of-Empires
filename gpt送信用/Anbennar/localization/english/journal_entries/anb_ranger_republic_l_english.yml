  rr_objective:0 "In order to succeed, we must defeat Elethael and then obtain truces with #b Arganjuzorn#! and #b Vels Fadhecai#!, without releasing #b Tellumtir#!."
  rr_minor_objective:0 "In order to succeed, we must either defeat the Ranger Republic in battle and release #b Tellumtir#!, or negotiate a peace with the Ranger Republic."
  rr_no_independence:0 "If we do not declare independence, we might be able to avoid war, but will be unable to fully complete our goals."
  rr_concessions:0 "If the Ranger Republic does not accept our demands, we will be forced to declare war."
  rr_dd_no:0 "Without the assistance of the Dragon Dominion, we will have to reclaim Slegcal on our own."
  