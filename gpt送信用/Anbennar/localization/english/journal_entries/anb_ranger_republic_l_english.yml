l_english:
  je_ranger_coup:0 "The Ranger's Coup"
  je_ranger_coup_reason:0 "After many years of serving under petty warlord republics, the rangers of Tellumtir, Ebenmas and Elathael have staged simultaneous coup d’etats in their respective cities in order to end the constant wars between them. Acting ranger-president Rogier Lencord has sworn to bring peace, liberty and justice to the people of the Epednan Expanse no matter what, and thousands upon thousands of rangers, bandits and frontiersfolk have joined his cause.\n\nThis revolt was not made without a few sacrifices. Rogier was able to convince the Lady of Arganjuzorn that his objective was to unite the Edednan Expanse under his banner and then swear allegiance to her as a tributary state in the frontier. And neither did it go off without a hitch, the republic of Elathael stood strong against the coup, decrying the rangers as warlords themselves and threatening the legitimacy of the new republic. The rangers must now prove that they can reach their initial aims by taking Elathael, then perhaps prove their mettle once more by securing proper independence from the feudal lords of the Ynn."

  je_ranger_coup_response:0 "The Ranger's Coup"
  je_ranger_coup_response_reason:0 "The rangers of Tellumtir and Ebenmas have risen up under the flag of a new, united republic representing the frontier towns of the Epednan Expanse, they are now marching on Elathael in order to support their brethren there. Whatever their ultimate fate is, we must prepare ourselves for the inevitable shakeup of the political situation in the Epednan Expanse, and how our country will deal with the newborn ranger’s republic."
  
  anb_ranger_republic.001.t:0 "The Ranger's Coup"
  anb_ranger_republic.001.d:0 "After years of servitude under warring city-states, the rangers of Ebenmas, Tellumtir and Elathael have risen up, flying the flag of their newly founded Ranger’s Republic in the name of peace. Though the coup of Elathael was a failure, an army of thousands of experienced rangers is now marching south towards Arca Pelodir under the leadership of Rogier Lencord to secure their hold on the Expanse."
  anb_ranger_republic.001.f:0 "There were men and women of all stripes and colors gathering in the town of Ebenmas. Never in its history had it been so busy with the coming and going of people, carts and animals. From well armed rangers mounted on fine horses to poor farmers only wielding an old musket passed down their family line, all gathered under the flag and listened to Rogier’s words: Liberty or death, for peace and the republic! The army began its march south, ready to face its destiny."
  anb_ranger_republic.001.a:0 "For the republic!"
  anb_ranger_republic.001.b:0 "We must stop these upstart rangers!"

  anb_ranger_republic.002.t:0 "The Republic Realized"
  anb_ranger_republic.002.d:0 "Our struggle is finally over, the people of Ebenmas and Tellumtir are free from all foreign interference. Our nascent republic may now face the future united as one under the banner of liberty."
  anb_ranger_republic.002.f:0 "After mourning those who perished in the name of unity, cheerful festivities were held for days on end in both towns. They celebrated their hard earned freedom and forgot all of their plights if only for a little while. The path forward would not be easy, but it was a path they would carve on their own, and not under the whims of tyrants."
  anb_ranger_republic.002.a:0 "We did this for our people."
  anb_ranger_republic.002.b:0 "We did this for the republic."

  anb_ranger_republic.003.t:0 "The Coup is Crushed"
  anb_ranger_republic.003.d:0 "The rangers of Ebenmas and Tellumtir have failed to secure the independence of their young republic. The republic of Elathael still stands, the elves of Arca Pelodir celebrate their freedom while our army disperses and everyone returns to their hometown to grieve and prepare for the hard times ahead."
  anb_ranger_republic.003.f:0 "A dour and deafening silence reigned over the Expanse as the people continued with their days, unsure of what tomorrow would bring. Farmers armed themselves and fortified their humble cottages, rangers ran away into the wildest frontiers of the expanse to avoid retaliation. The flags of the republic laid torn on the ground, forgotten to dust, while former tyrants slowly but surely planned their eventual revenge on the impudent people of both towns. Liberty was dead."
  anb_ranger_republic.003.a:0 "Play as Ebenmas."
  anb_ranger_republic.003.b:0 "Play as Tellumtir."
  anb_ranger_republic.003.c:0 "Play as Elathael."

  anb_ranger_republic.004.t:0 "An Uncertain Stalemate"
  anb_ranger_republic.004.d1:0 "While we were able to march on Arca Pelodir and defeat Elathael, we were unable to wrangle our independence from the rest of the elven warlords from the Ynn. An uneasy tension hangs in the air as the republic faces an uncertain future."
  anb_ranger_republic.004.d2:0 "While the rangers’ army was able to march on Arca Pelodir and defeat Elathael, they were unable to wrangle their independence from the rest of the elven warlords from the Ynn. Tension hangs in the air as the republic faces an uncertain future."
  anb_ranger_republic.004.f1:0 "It was better than nothing, or so many people thought. At least the towns were united under a single banner, even if that banner was still under the whims of feudal tyrants. Many still believe that the destiny of the republic lies westward and in the freedom the frontier can bring, rather than the political freedom they may obtain from fully dethroning their former suzerains."
  anb_ranger_republic.004.f2:0 "While no side could truly claim victory, life goes on. We must be ready to stand against any threats that may arise as the dust settles and the Expanse enters a new normality - until the next keg blows up."
  anb_ranger_republic.004.a:0 "The rangers may have failed us, but the republic survives."
  anb_ranger_republic.004.b:0 "The rangers will guide us in these times of uncertainty."
  anb_ranger_republic.004.c:0 "Formal relations with our neighbours will help us see things through."
  anb_ranger_republic.004.e:0 "We should reestablish ties with the Rzentur."

  anb_ranger_republic.005.t:0 "The New Status Quo"
  anb_ranger_republic.005.d:0 "The wars are over and tensions begin to dissipate. A new reality settles in the Epednan Expanse now that the ranger’s republic is a reality. Former overlords now treat the nascent nation as an equal and formalities are being exchanged between diplomatic missions."
  anb_ranger_republic.005.f:0 "It was strange for them to sit at the negotiating tables as equals. Not so long ago, they were eagerly readying their guns and bringing knives to throats. Now, they exchanged formal pleasantries while enjoying delicacies from the Ynn River's bosom. Both sides knew they could not simply be in an eternal state of war, the soldiers had to return to their fields, the traders had to find buyers for their wares. Things would have to return to normal."
  anb_ranger_republic.005.a:0 "In time, it would be as if nothing had ever happened."
  anb_ranger_republic.005.b:0 "Lady Nestrin once served as ambassador in Svemel, perhaps we could negociate the Dominion's protection?"

  anb_ranger_republic.006.t:0 "Victory Over Elathael"
  anb_ranger_republic.006.d:0 "We have done it! Arca Pelodir is ours, the republic’s banner flies above the former palace of the president of Elathael. But our cause of freedom is not yet completely won, as we still bow to Arganjuzorn."
  anb_ranger_republic.006.f:0 "The republic’s army cheered as president Rogier gave an inspiring speech on the balcony of the former presidential palace. In that moment, it was clear that the old order had died under the rangers' bullets. The rangers’ leadership met in private and debated on their next move. Would they risk the wrath of the other elven warlords and stop paying any heed to those who claim to be their overlords, or would they keep their heads low?"
  anb_ranger_republic.006.a:0 "A feudal title is nothing in the face of a loaded gun. They'll just have the accept the new status quo!"
  anb_ranger_republic.006.b:0 "We cannot risk losing what we earned so far."

  anb_ranger_republic.007.t:0 "Ranger Republic Declares Independence"
  anb_ranger_republic.007.d:0 "Treason! The rangers have abandoned their oath towards us after their victory in Arca Pelodir. We must choose how we will deal with our unruly subjects."
  anb_ranger_republic.007.f:0 "The lords and ladies of the court were utterly dumbfounded. How could those humans seek independence from their benevolent rule after all they had given them? The lands their livestock tread on, the towns they call their home, all of it was given and built on their prerogative, and now they refuse to even acknowledge the natural hierarchy of the world? Granted, the court had never heard of such military power from an Ynnsman state before -not since the time of Jahanon- and some were worried that accepting the new status quo was the only option. While recognizing our lack of authority in the Expanse would be a great loss of face, a military confrontation would come at a great risk."
  anb_ranger_republic.007.a:0 "We will accept their claim with grace in exchange for some concessions."
  anb_ranger_republic.007.b:0 "Who cares? They’re just some humans in barren lands."
  anb_ranger_republic.007.c:0 "Teach those treacherous fools a lesson in war!"


  anb_ranger_republic.008.t:0 "[SCOPE.sCountry('initiator_scope').GetName] Demands Concessions"
  anb_ranger_republic.008.d:0 "[SCOPE.sCountry('initiator_scope').GetName] is willing to let us go free as long as we grant them some diplomatic concessions."
  anb_ranger_republic.008.f:0 "Independence could be earned from the barrel of a gun, or through a favor exchanged. Many rattled their sabers in response to the demands of their former overlords, while others pleaded to save the lives of those who might die in a war that could easily be avoided. Whatever the rangers chose to do next, it would decide the fate of many."
  anb_ranger_republic.008.a:0 "This is a mutually beneficial arrangement."
  anb_ranger_republic.008.b:0 "They shall learn that a ranger never backs down from a fight!"

  anb_ranger_republic.009.t:0 "[SCOPE.sCountry('initiator_scope').GetName] Accepts the new Status Quo"
  anb_ranger_republic.009.d:0 "[SCOPE.sCountry('initiator_scope').GetName] has accepted our de facto independence without a fight."
  anb_ranger_republic.009.f:0 "There were few among us who thought the elves would see reason and avoid unnecessary bloodshed. It was quite surprising to see them proven right when [SCOPE.sCountry('initiator_scope').GetName]’s emissaries arrived at Ebenmas and acknowledged that they didn't see fit to ask for any tribute to prove our loyalty anymore, acknowledgeding the truth we all knew. They couldn't ask any even if they wanted to, and Ynnics can't pretend they can control us Ynnsmen anymore."
  anb_ranger_republic.009.a:0 "Everyone shall hear the Expanse roar!"

  anb_ranger_republic.010.t:0 "Ranger Republic Accepts Concessions"
  anb_ranger_republic.010.d:0 "The ranger’s republic has agreed to owe us an obligation in exchange for their freedom. We may use it as we see fit in our future treaties with them."
  anb_ranger_republic.010.f:0 "It is no surprise to see the humans bowing to their betters once more. Though they may be independent now, it is only with our conditional approval. And we shall make good use of that condition."
  anb_ranger_republic.010.a:0 "Let them run freely in the barren wastes of the Expanse."

  anb_ranger_republic.011.t:0 "The Coup is Crushed"
  anb_ranger_republic.011.d:0 "It is done, the upstart republic has been dealt with, Ebenmas and Tellumtir are occupied by our mighty armies, and the towns’ representatives are now meeting with us to see what the future holds for them."
  anb_ranger_republic.011.f:0 "The boots of the elven knights treaded freely upon the dusty, torn flag of the ranger’s republic. Their lofty ideals are now gone with the wind and now all that remains is the cold, hard truth: those that live by the sword -or the gun- die by it. Order has been restored to the Expanse."
  anb_ranger_republic.011.a:0 "Ebenmas shall be our tributary."
  anb_ranger_republic.011.b:0 "Tellumtir shall be our tributary."
  anb_ranger_republic.011.c:0 "We have triumphed over the republican menace."

  anb_ranger_republic.012.t:0 "Arganjuzorn Approaches Us"
  anb_ranger_republic.012.d:0 "A small lordship to our south, Arganjuzorn, has approached us for protection after losing their remaining influence in the Epednan Expanse. They fear opportunism from their neighbours in their moment of weakness."
  anb_ranger_republic.012.f:0 "Lady Nestrin was once the Tuathak's ambassador in Svemel, and her name is both known and respected in our halls. Ironically, she once came here accompanying Eordan conquerors, but now asks for our protection in the name of old ties, hoping to form a united ruinborn front against Cannorian warmongers. The Gospodh's advisors point out that Arganjuzorn is neither large nor rich, and that this offer would lead to us having a significant amount of control over their foreign policy."
  anb_ranger_republic.012.a:0 "It would serve as a fine buffer state between the Dominion and the Sarda Empire."
  anb_ranger_republic.012.b:0 "We have no need to expand our influence southwards."

  anb_ranger_republic.013.t:0 "The Dragon Dominion Accepted"
  anb_ranger_republic.013.d:0 "The Dragon Dominion has gracefully extended their protection over us. We will face the rangers and the Sarda together for the foreseeable future."
  anb_ranger_republic.013.f:0 "To see our position fall so suddenly was a shock to the elven nobility. Once as powerful as a Queen, we now bowed to the Gospodh of the Dragon Dominion. At the very least, they thought, this was better than being prey to the whims of wild rangers and the Sarda. The Gospodh could perhaps be convinced to consider Juzornic interests and turn its gaze towards Eordand, to free Slegcal from colonizers."
  anb_ranger_republic.013.a:0 "Arganjuzorn is not yet lost."

  anb_ranger_republic.014.t:0 "The Dragon Dominion Refused"
  anb_ranger_republic.014.d:0 "The Dragon Dominion has declined our offer of fealty. We stand alone against the threats that surround us, including them."
  anb_ranger_republic.014.f:0 "Many noble families packed up their belongings to find a safer place to live in, somewhere along the Ynn. At the very least those that remained were loyal as could be to our cause."
  anb_ranger_republic.014.a:0 "We stand alone for now, like Darran Eaglesthorn once did when he conquered Rzenta in a mere week."

