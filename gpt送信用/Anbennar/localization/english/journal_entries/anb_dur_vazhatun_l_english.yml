  anb_comet_investigation.205.t:0 "Comet Sighted!"
  anb_comet_investigation.205.d:0 "While studying the skies, Druznar has spotted a comet. Unfortunately, it is not the Oracle´s Eye."
  anb_comet_investigation.205.f:0 "TODO"
  anb_comet_investigation.205.a:0 "A troubling delay."
  anb_comet_investigation.205.b:0 "There is still value to be found in studying this comet."
  comet_expedition_comet_sighted_5050_desc:0 "TODO There is a 50% chance of a major delay, and a 50% chance of a major boost."
  anb_comet_investigation.206.t:0 "Queue Troubles"
  anb_comet_investigation.206.d:0 "There are many people who need to schedule time for the Setzunkhûpa, and Druznar has found himself near the back of the queue."
  anb_comet_investigation.206.f:0 "TODO"
  anb_comet_investigation.206.a:0 "He should have been better prepared."
  anb_comet_investigation.206.b:0 "We shall step in to force the matter."
  anb_comet_investigation.207.t:0 "TODO Druznar Conclusion"
  anb_comet_investigation.207.d:0 "While Druznar was unable to find the Oracle´s Eye, the knowledge he gained will be very useful in the investigation."
  anb_comet_investigation.207.f:0 "TODO"
  anb_comet_investigation.207.a:0 "We cannot think of this as a setback."
