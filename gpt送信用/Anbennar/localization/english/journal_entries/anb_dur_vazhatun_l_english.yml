  anb_comet_investigation.501.t:0 "The Shocking Truth"
  anb_comet_investigation.501.d:0 "After years of investigation and study, the truth can no longer be denied. The Oracle´s Eye Comet destroyed itself during the disastrous 1810 Tearfall."
  anb_comet_investigation.501.f:0 "TODO"
  anb_comet_investigation.501.a:0 "We must tell the world!"
  anb_comet_investigation.502.t:0 "The End of Renewable Damestear?"
  anb_comet_investigation.502.d:0 "Scientists from Dûr-Vazhatun have published a shocking report alleging that the Oracle´s Eye Comet, which provides Halann with most of its damestear, was destroyed in 1810."
  anb_comet_investigation.502.f:0 "TODO"
  anb_comet_investigation.502.a:0 "What do we do now?"