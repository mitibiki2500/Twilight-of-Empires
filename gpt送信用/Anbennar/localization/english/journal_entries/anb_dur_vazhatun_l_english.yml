  anb_comet_investigation.212.f:0 "TODO"
  anb_comet_investigation.212.a:0 "Hopefully it is only a minor time loss."
  anb_comet_investigation.212.b:0 "Send a request to the order to let him work."
  anb_comet_investigation.213.t:0 "Buried Knowledge"
  anb_comet_investigation.213.d:0 "With the depth of knowledge contained within the Order HQ, some documents or information can become forgotten or hard to find. CHRONICLER has come across some buried information that has helped his progress immensely."
