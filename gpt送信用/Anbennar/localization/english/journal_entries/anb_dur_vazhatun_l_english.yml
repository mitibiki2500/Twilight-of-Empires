  anb_comet_investigation.218.t:0 "A Solution in Need of a Problem"
  anb_comet_investigation.218.d:0 "Scoffing at the ´backwardness´ of the hold, GNOME has taken the time out of her developments and devised a creative new invention… for a problem that we already have solved for hundreds of years."
  anb_comet_investigation.218.f:0 "TODO"
  anb_comet_investigation.218.a:0 "See what can be gleaned from it after it is scrapped."
