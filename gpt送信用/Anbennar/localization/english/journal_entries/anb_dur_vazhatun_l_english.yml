  anb_comet_investigation.217.t:0 "The March of Innovation"
  anb_comet_investigation.217.d:0 "Some traditionalists within Dûr-Vazhatun are unhappy with GNOME´s innovations."
  anb_comet_investigation.217.f:0 "TODO"
  anb_comet_investigation.217.a:0 "We should just ignore them."
