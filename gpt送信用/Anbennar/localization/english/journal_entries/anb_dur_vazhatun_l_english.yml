  anb_comet_investigation.226.t:0 "Studying the Treatises"
  anb_comet_investigation.226.d:0 "MWALIM has not done this ritual in some time, and needs to study his old writings to determine how the 1810 tearfall might modify the ritual´s requirements."
  anb_comet_investigation.226.f:0 "TODO"
  anb_comet_investigation.226.a:0 "Offer some of our own research to expedite the process."
  anb_comet_investigation.226.b:0 "This will take some time."
  anb_comet_investigation.226.c:0 "CHRONICLER can assist with the process."
  anb_comet_investigation.227.t:0 "Gathering Materials"
  anb_comet_investigation.227.d:0 "In order to effectively perform his rituals, MWALIM needs various resources from his homeland, which would have to be imported at great cost."
  anb_comet_investigation.227.f:0 "TODO"
  anb_comet_investigation.227.a:0 "No cost is too great."
  anb_comet_investigation.227.b:0 "Try and find local alternatives."
  anb_comet_investigation.228.t:0 "Additional Preparation"
  anb_comet_investigation.228.d:0 "While the preparations for the ritual are mostly complete, more time could help mitigate any risks."
  anb_comet_investigation.228.f:0 "TODO"
  anb_comet_investigation.228.a:0 "More preparation has never hurt."
  anb_comet_investigation.228.b:0 "We´re ready to begin the ritual."
  anb_comet_investigation.229.t:0 "The Ritual"
  anb_comet_investigation.229.d:0 "The time has come for MWALIM to attempt to connect to the Oracle´s Eye comet and track its movements."
  anb_comet_investigation.229.f:0 "TODO"
  anb_comet_investigation.229.a:0 "The ritual was a success."
  comet_mwalim_expedition_pass_desc:0 "While MWALIM was unable to determine the Oracle´s Eye´s movements, he was able to observe a clouded vision of the 1810 Tearfall. He observed a powerful wave of wild magic emanating from the comet, and when the wave reached him the vision ended. Gain #green 350#! Evidence."
  anb_comet_investigation.229.b:0 "The ritual was a failure."
  comet_mwalim_expedition_fail_desc:0 "MWALIM´s visions were clouded by a mysterious interference, and he was unable to determine anything. Gain #r 80#! Evidence."
