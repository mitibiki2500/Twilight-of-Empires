  anb_comet_investigation.222.b:0 "He will have to find alternative samples."
  anb_comet_investigation.223.t:0 "Analyzing the Samples"
  anb_comet_investigation.223.d:0 "KOBOLD is not a scientist and does not have the expertise to analyze the samples on-site."
  anb_comet_investigation.223.f:0 "TODO"
  anb_comet_investigation.223.a:0 "We will have to ship them back to Dûr-Vazhatun."
