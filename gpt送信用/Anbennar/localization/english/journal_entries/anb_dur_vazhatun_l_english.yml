  anb_comet_investigation.216.d:0 "Iterating on Nimscodd´s famous Eyes of Dr. T.J. Ecklebozz, GNOME has created a system that can help automatically track celestial movements"
  anb_comet_investigation.216.f:0 "TODO"
  anb_comet_investigation.216.a:0 "This will improve our ability to track comets."
