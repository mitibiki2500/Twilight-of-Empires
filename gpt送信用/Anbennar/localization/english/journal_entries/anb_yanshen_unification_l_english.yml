l_english:
 je_yansheni_unification:0 "Yansheni Unification"
 je_yansheni_unification_reason:0 "Yanshen, so often fragmented, has been unified time before - first by Harimar and his Raj, next by Jaher and his Phoenix Empire, then finally by the Hobgoblins and their Great Command. All unifiers but also all foreign conquerors. The time has come for Yanshen led by her people."
 je_yanshen_unify_button:0 "Unify the Yan States"
 je_yanshen_unify_button_desc:0 "It is time for Yanshen to united under the banner of the Yan people!"
 je_yanshen_unification_complete_trigger_desc:0 "Has formed Yanshen"
 je_yanshen_status:0 "To complete the unification of Yanshen, we should launch a Unification [concept_diplomatic_play]"
 yanshen_unification.1.t:0 "Yanshen Unified"
 yanshen_unification.1.d:0 "For centuries the Yan people have squabbled endlessly or suffered under the foreign boot. Unity was forever out of reach... until today. For the first time in our people's history, we are united and led by our own."
 yanshen_unification.1.f:0 "TODO"  
 yanshen_unification.1.a:0 "One People, One State"