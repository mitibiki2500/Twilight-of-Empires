l_english:
 je_command_splinter:0 "The Beheaded Chimera"
 je_command_splinter_reason:0 "The Command used to call half of Haless its rightful dominion, until the spirit's invasion of the mortal realm caused our great chimera to shatter into squabbling warlords. Order shall be restored after the Rending of Realms, and the strength that once was ours will be again."
 hobgoblin_statocracy_modifier:0 "Hobgoblin Statocratic Society"
 drake_riders:0 "Drake Riders of Drakonshan"
 unification_notification_gc:0 "Has formed the nation of #bold Great Command#!"
 anb_command_formation.1.t:0 "The Great Command"
 anb_command_formation.1.d:0 "The [SCOPE.GetRootScope.GetCountry.GetName] again stands tall, its banners unfurled over lands once torn by strife. Our people, scattered and defiant, now bend to a single will—ours."
 anb_command_formation.1.f:0 "The air reeks of iron and ash and rotting flesh. Six banners once flew defiant—remnants of the old Great Command, fierce and fractious. For their effort, Ghilakhad’s cliffs echo with the screams of the fallen, the Shamakhad Plains lie trampled under our boots, and the rivers of Nadimraj run red with the toll of our ambition. \n\nYet from this carnage, a singular truth emerges: the Great Command, reforged in the crucible of war, rises unbroken forevermore. \n\nOur kin are humbled, their Marshals kneel or rot, and the dream of our ancestors rises anew. Will we seize it?"
 anb_command_formation.1.a:0 "Let all who oppose us tremble, for we have claimed our destiny."