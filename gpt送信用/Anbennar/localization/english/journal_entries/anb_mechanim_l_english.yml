 je_mechanim_1:0 "Mechanim Revolt"
 je_mechanim_1_reason:0 "While the mechanim of Inysaa were once seen as little more than some marvel of the Precursor Elves, machines excellent for labor. Over time however, the mechanim’s true natures as living beings went unnoticed even by their owners, which eventually led to the revolt we see before us. The issue is not just that these machines are rising up, but many of the people are rising with them or against them.\n\nThis whole situation threatens to fall out of our control unless we manage both the progress of the mechanim rights, and the public opinion about the whole ordeal."
 je_mechanim_2:0 "Depoliticisation of Mechanim"
 je_mechanim_2_reason:0 "With the road to Mechanim abolition set, we have our work cut out for us. There are numerous protesting for the continued enslavement of the mechanim, those being businessmen which profit from the practice, zealots, or simply the casual bigot, our opposition is plentiful. If we want to succeed, we need to depoliticize the issue, making it less of a major talking point and therefore less divisive."
 
 mechanim_success_var_tick_tt:0 "TODO"

 #### EVENTS #####
 mechanim_revolt.1.t:0 "Mechanim Revolt"
 mechanim_revolt.1.d:0 "The Mechanim have lost their bloody minds. Across our country, they’re battling across the streets, spreading chaos and mayhem wherever they go! This threatens to drive our nation into an unmitigated disaster. We need to act fast to stop them at once."
 mechanim_revolt.1.f:0 "“The hums of the mechanim grow louder and louder. The streets are theirs, they creep through the cobbles, armed with makeshift sparkdrives. I fear the district is lost, perhaps the city… perhaps more. Tell your men to establish a perimeter and to NOT enter; they remove the bodies they ambush regularly.”"
 mechanim_revolt.1.a:0 "To Arms!"
 mechanim_revolt.2.t:0 "Mechanim Slavery Enforced"
 mechanim_revolt.2.d:0 "With the threat of a mechanim revolt ended, the constructs’ are being clamped down upon to prevent a situation like this ever again. From now on, people will forget the mechanim’s servitude was ever a contentious issue."
 mechanim_revolt.2.f:0 "“The Metal Man marched with their fellows; a dumb drumbeat down the street, all the way back into the factory floor. One wondered if the Metal Man could comprehend their position; one wondered, but could never know. The Metal Man and their fellows would spend their eternity with but the beat of industry as their voice.” - ‘The humane solution’, by Adren síl Aramar."
 mechanim_revolt.2.a:0 "Very Well"
 mechanim_revolt.2.b:0 "We shall not play with this dangerous tech ever again."
 mechanim_revolt.3.t:0 "Mechanim Abolition"
 mechanim_revolt.3.d:0 "With the success of the mechanim freedom movement, across our nation they are finally being freed from their chains, and are leaving the factories and workplaces behind en masse. While some factory owners grumble, they’ll find workers come the week’s start."
 mechanim_revolt.3.f:0 "“It rained when me and the others finally could leave, the constant drum-taps of water against our bodies, a synchronized beat of abolition. There were crowds gawking at us, whether in fear, anger, relief, or simply awe I cannot tell you. For most, this was probably just a day they spent with their families, or a day they’d never think of at all. But for me and my brethren, this was the best day of our lives.” - ‘Upon a rainy day’, by 783-A12 "Liberation""
 mechanim_revolt.3.a:0 "Freedom"
 mechanim_revolt.4.t:0 "Mechanim revolt beginning"
 mechanim_revolt.4.d:0 "mechanim_revolt.4.d PLACEHOLDER"
 mechanim_revolt.4.f:0 "mechanim_revolt.4.f PLACEHOLDER"
 mechanim_revolt.4.a:0 "oh no radicals"
 mechanim_revolt.4.b:0 "Mechanim must lose their wires"
 mechanim_revolt.5.t:0 "Abolition!"
 mechanim_revolt.5.d:0 "Freedom!"
 mechanim_revolt.5.f:0 "mechanim_revolt.5.f PLACEHOLDER"
 mechanim_revolt.6.t:0 "Mechanim Escape"
 mechanim_revolt.6.d:0 "The mechanim of [SCOPE.sState('mechanim_escape_state').GetName] break free!"
 mechanim_revolt.6.f:0 "It is easy to forget that mechanim are far smarter than most people give them credit for. Far smarter in fact, than most people. This has come as a harsh lesson to mechanim owners in [SCOPE.sState('mechanim_escape_state').GetName]. Details remain scarce, but it appears that the labourers of an arms factory overthrew their masters, armed themselves, and then began a campaign of liberation through the entire industrial district! Casualties are mounting, and the factory owners of [state] are already in an uproar, demanding that we send in the army and crush this revolt"
 mechanim_revolt.6.a:0 "A machine cannot revolt, it can only break. So get breaking."
 mechanim_revolt.6.b:0 "Surely Mechanim can speak? Send an envoy, let us hear what they want."
 mechanim_revolt.7.t:0 "Depoliticized Mechanim"
 mechanim_revolt.7.d:0 "The nature of the Mechanim have been an object of study ever since their discovery in Insyaa. But, where philosophers may argue on the nature of their sentience - or if indeed they are sentient at all - the world is different on the factory floor. Mechanim have grown popular in most industries, as unpaid, skilled labour, since they do not sleep, eat or breathe. As such, they were a factory owner's dream."
 mechanim_revolt.7.f:0 "But, like any dream, it had to end. The mechanim have their own opinions on their sentience, namely that they had it. And as such, unit by unit, factory by factory, they have put down their tools, and taken up weapons in defense of their rights. Worse, many of our own people have taken the side of the machines, either in sympathy with their supposed intelligence, or in opposition to the factory owners who had them replaced with men of iron."
 mechanim_revolt.7.a:0 "Perhaps we should have expected this."
 mechanim_revolt.8.t:0 "Shared Struggle"
 mechanim_revolt.8.d:0 "something"
 mechanim_revolt.8.f:0 "something but longer"
 mechanim_revolt.8.a:0 "All Workers Unite!"
 mechanim_revolt.9.t:0 "Laborer's Despair"
 mechanim_revolt.9.d:0 "Mechanim need neither sleep nor food and a mechanim slave requires no wage. As such, our workforce has found itself largely replaced by mechanim labourers. With no means of survival, angry radicals are now consolidating into a faction, demanding reforms."
 mechanim_revolt.9.f:0 ""So they fired us down at the textile mill. Every man, at every table. Clearly a living wage was too much to ask. Next week, the mill was churning out clothes faster than ever. Because of those iron men, of course. So I started going to the rallies - Not just to listen, but just... To have something to do. My folks needed food, and if I could get them some by helping out... I reckon that was fair. And there were people worse off than me too. Hungry people. Hungry in a way I ain't ever seen before. You promise them a loaf of bread, put a weapon in their hands, I reckon you could get them to do just about anything..." "
 mechanim_revolt.9.a:0 "The hidden hand of the market will surely find these people gainful employment. Eventually."
 mechanim_revolt.9.b:0 "The man of iron must be freed from work, and the worker must be allowed to work!"


