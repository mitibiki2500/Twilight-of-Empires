l_english:
#Ynnsmouth Crisis
 je_ynnsmouth_crisis_trollsbay:0 "Ynnsmouth Crisis"
 je_ynnsmouth_crisis_trollsbay_reason:0 "An important trade center and strategic location at the estuary of the Ynn river, Ynnsmouth has been considered a condiminium since 1812 -both a nominal vassal of the Sarda and member of the Trollsbay Concord, part of two worlds. This situation could not last forever, and our destiny is to finally unite the bay!"
 je_ynnsmouth_crisis_trollsbay_goal:0 "We have been in control of the Ynnsmouth state for at least 5 years"
 je_ynnsmouth_crisis_sarda:0 "Ynnsmouth Crisis"
 je_ynnsmouth_crisis_sarda_reason:0 "An important trade center and strategic location at the estuary of the Ynn river, Ynnsmouth has been considered a condiminium since 1812 -both a nominal vassal of the Sarda and member of the Trollsbay Concord, part of two worlds. This situation could not last forever, and our future hinges on securing access to the outside world!"
 ynnsmouth_crisis.1.t:0 "The Matter of Ynnsmouth"
 ynnsmouth_crisis.1.d:0 "Sovereignty over Ynnsmouth has been shared between us and the Sarda Empire since 1812, but our nascent national debate determined that it should be a core part our nation."
 ynnsmouth_crisis.1.f:0 "What is divided cannot be united. Ynnsmouth has divided the Trollsbay in two since before even the Old Concord. Thus our destiny lies clear : if we are to be united in liberty forevermore, we have to put an end to the condiminium."
 ynnsmouth_crisis.1.a:0 "We must ask Ynnsmouth to join our union in full."
 ynnsmouth_crisis.1.b:0 "Our union cannot be whole without Ynnsmouth."
 ynnsmouth_crisis.2.t:0 "End of the Ynnsmouth Condominium"
 ynnsmouth_crisis.2.d:0 "Trollsbayers are offering us full membership in the Concord, but this would be at odds with our vassalage to the Sarda."
 ynnsmouth_crisis.2.f:0 "The mutual agreement between us, the Concord and the Sarda was always unstable, as there was never really any arrangement between those three parties to begin with. It was more of an unformal agreement to pretend there was and not have one party interfere with the deal we had with the other. It was always bound to end someday, and it would seem that this day is today, putting us in an awkgard situation since any answer would upset a side."
 ynnsmouth_crisis.2.a:0 "Our destiny lies with the Cannorians."
 ynnsmouth_crisis.2.b:0 "Our destiny lies with the Ynnics."
 ynnsmouth_crisis.2.c:0 "Our destiny is ours to decide."
 ynnsmouth_crisis.3.t:0 "Ynnsmouth and the Concord"
 ynnsmouth_crisis.3.d1:0 "Ynnsmouth will become the newest state of the Concord."
 ynnsmouth_crisis.3.d2:0 "Ynnsmouth has refused our offer and turned to the Sarda for protection instead."
 ynnsmouth_crisis.3.d3:0 "Ynnsmouth has refused our offer and declared full neutrality between us and the Sarda."
 ynnsmouth_crisis.3.f:0 "The missive arrived in Bridgeway exactly after the delay required by the procedure, and was read in front of the People's Concord. It was short, but each word carried meaning that would change the face of Noruin forever. The reactions from the representatives were almost unanimous."
 ynnsmouth_crisis.3.a:0 "We are all Trollsbayers today!"
 ynnsmouth_crisis.3.b:0 "This is how they repay us?"
 ynnsmouth_crisis.3.c:0 "Preposterous!"
 ynnsmouth_crisis.4.t:0 "Posveagal back in our fold"
 ynnsmouth_crisis.4.d:0 "Following Trollsbayer diplomatic pressure, Ynnsmouth has asked to rejoin our sphere in full."
 ynnsmouth_crisis.4.f:0 "-Of course we haven't forgotten our oaths. This medallion has been given to my ancestors by your ancestors two centuries ago and serves as a constant reminder. The Empire has proven itself to be a trusted protector of our people, and we in turn simply believe that the circumstances require us to be more proactive in our duties to protect the Netherworld in your name.\n\n-And the trade routes?\n\n-And the trade routes."
 ynnsmouth_crisis.4.a:0 "Their oath is accepted once again."
 ynnsmouth_crisis.5.t:0 "The Trollsbay United"
 ynnsmouth_crisis.5.d:0 "Ynnsmouth is now looked as an integral part of our nation, further legitimizing the concept of the Trollsbay as a nation-state."
 ynnsmouth_crisis.5.f:0 "-You know, back in my youth every place worked like Ynnsmouth did! Cestirmark was kind of its own thing, same for Thilvis, and so on.\n\n-That's weird, of course we need a government that represents all of us Concordians! That's how democracy works!\n\n-I guess that's why Ynnsmouth went the same way as the others. Can't tell apart an Isobeliner from a Valorman nowadays anyway."
 ynnsmouth_crisis.5.a:0 "United and indivisible."
 ynnsmouth_crisis.6.t:0 "Defeat at Ynnsmouth"
 ynnsmouth_crisis.6.d:0 "With Ynnsmouth firmly out of our control, revanchist sentiment is on the rise and people are rioting against the government."
 ynnsmouth_crisis.6.f:0 "Nationalism is like a match thrown into the fire that is the world. Once lit, it cannot be extinguished, and those that light it have has much control over it as they control the course of history. In this case, the match is not metaphorical, but in fact quite literal. The streets are on fire, as our people rage at being denied brotherhood with their fellow Trollsbayers in Ynnsmouth."
 ynnsmouth_crisis.6.a:0 "Surely this won't impact the next election?"
 ynnsmouth_crisis.7.t:0 "The Ynnsmouth Agreement Broken"
 ynnsmouth_crisis.7.d:0 "The vital link that allowed us to trade without relying on Cannorian middlemen has been broken, putting us at the mercy of their unilateral tariffs, embargoes, and unfavorable demands."
 ynnsmouth_crisis.7.f:0 "Ynnsmouth escaped our grasp when Sarda was conquered by the Cannorian usurper Jahanon síl Lethir. The Boek kingdom agreed to rejoin the empire as Morvel ousted the Havorics in 1812, but kept itself tied to Cannorians nonetheless. We will have to remind them of their oath, or seek other ways to reopen the trade routes."
 ynnsmouth_crisis.7.a:0 "We have to prevent a Cannorian monopoly on the Cliff passages."
 ynnsmouth_crisis.8.t:0 "For the Ynn Reaches the Sea"
 ynnsmouth_crisis.8.d1:0 "We are the first Ynnic realm to control the Ynn from the great plateau to its delta in Noruin."
 ynnsmouth_crisis.8.d2:0 "We have secured Cannorian economic cooperation, heralding the start of an era of reconciliation."
 ynnsmouth_crisis.8.f:0 "In ancient days, the Ynnic Empire ruled over the entire valley and we called it the world. Now, it seems like the world is growing ever larger, and the Ynn has its place to gain in it."
 ynnsmouth_crisis.8.a:0 "Praise be to the Sacred River!"
 ynnsmouth_crisis.8.b:0 "The kingdom of Posveagal shall rule the Underworld once more."
 ynnsmouth_crisis.8.c:0 "Let us look towards the future."
 ynnsmouth_crisis.9.t:0 "Closure of the Cliff Passages"
 ynnsmouth_crisis.9.d:0 "Complete Cannorian control over the Cliffs of Ruin severely restricts our economic opportunities."
 ynnsmouth_crisis.9.f:0 "-So what do I do to get my shipment from Busilar now? I still need it for my business.\n\n-Oh, same thing as before! You just buy it directly from us instead, it's even simpler. You come to us for everything, we handle everything that goes through the elevators.\n\n-But it didn't use to cost that much. I'm not sure I can afford...\n\n-Sorry, that's just company policy. I don't fix the price."
 ynnsmouth_crisis.9.a:0 "The lands beyond the sea are of no concern to us anyway."
 ynnsmouth_crisis.10.t:0 "Integration of Ynnsmouth"
 ynnsmouth_crisis.10.d:0 "With a Boek country being welcomed as a member of the confederation, the question of Boek rights is becoming more and more relevant."
 ynnsmouth_crisis.10.f:0 "The status of Ynnsmouth as a native kingdom is considered almost as a detail for most Trollsbayers, who mostly think about the Trollsbayer population living on the coast when talking about the region. Thus, the question of the Boek status has been neglected and still isn't resolved. Guaranteeing the rights of Ynnsmouthian Boek with a special status is an option, though it will be perceived as preferential treatment by Ynnsmouthian humans. Applying the same laws as everywhere else is probably going to lead to Ynnsmouth supporting their fellow Boek all over the Trollsbay."
 ynnsmouth_crisis.10.a:0 "Ynnsmouth will get a special status."
 ynnsmouth_crisis.10.b:0 "Our legal frameworks need to be harmonized."
 ynnsmouth_crisis_fail_tt:0 "This journal entry has been active for more than 5 years"
 ynnsmouth_crisis_victory:0 "Resolved the Ynnsmouth Crisis"
 ig_ynnsmouth_crisis_defeat:0 "Humiliated in the Ynnsmouth Crisis"
 the_boek_way:0 "The Boek Way"
 ynnsmouth_free_interest:0 "Renewed Sarda interests in Noruin"
 notification_ynnsmouth_joins_concord_name:0 "Ynnsmouth joins the Concord"
 notification_ynnsmouth_joins_concord_desc:0 "The kingdom of Ynnsmouth, as part of agreement with the Concord, has joined the Union in full and will thus be part of the confederation from now on. The Sarda Empire has issued diplomatic protests."
 notification_ynnsmouth_joins_concord_tooltip:0 "#header $notification_ynnsmouth_joins_concord_name$#!\n$TOOLTIP_DELIMITER$\n$notification_ynnsmouth_joins_concord_desc$"

#Spoorland Membership
 je_spoorland_spoor:0 "Towerfoot Unity"
 je_spoorland_spoor_reason:0 "Oh Spoorland! Our folk found your beautiful valley after leaving the corruption of Thilvisan oligarchs behind them, fought the vile Cheshoshi to claim your hills and rivers, and they told the Concord and Lorentish Empire to go home when they tried to take you from them.\n\nStill, times are changing. Now that the Concord is a behemoth on our borders instead of a disparate alliance, and turmoil is brewing in Lorentish colonies, it's clear where the wind is blowing and we should follow it to protect our land's beauty."
 je_spoorland_concord:0 "Towerfoot Unity"
 je_spoorland_concord_reason:0 "Spoorland was a discreet member of the big family of Trollsbayer republics, and a useful buffer state between the alliance of the Old Concord and Lorent. It comes from a time where Trollsbayers were more divided, a time that is gone now. With the proclamation of the union, we should sway the breakaway halfings republics to reunite with their Trollsbayer brethren in this era of unity."
 spoorland_je_tt:0 "Spoorland will decide whether to accept Concord membership"
 spoorland.1.t:0 "The Old Trail State"
 spoorland.1.d:0 "For the longest time, [ROOT.GetCountry.GetName]'s destiny was not its own to choose. Any closer ties with the Concord would be met with threats of [SCOPE.sCountry('lorent_scope').GetAdjectiveNoFormatting] invasion, and Thilvis attempted to reintegrate us by force in the past. But now that [SCOPE.sCountry('lorent_scope').GetName]'s influence wanes and the Concord became a union of nations, there are many within the Republic that advocate for membership within the [SCOPE.sCountry('concord_scope').GetName] as the only way to keep control of our destiny as part of a greater whole. The [SCOPE.sCountry('concord_scope').GetAdjectiveNoFormatting]s, by all accounts, would welcome us into their union."
 spoorland.1.f:0 "The impossible has happened, and the Rose is fading from Aelantir. The impossible has happened, and Trollsbayers are putting their issues aside. Spoorland should choose its destiny on its own terms, lest we face the fate of our sister republic of Daxwell. Let it be known that we will be equals as part of a greater union, one of like-minded states that will not infringe upon our God-given rights."
 spoorland.1.a:0 "We'll join the Concord!"
 spoorland.1.b:0 "Spoorland could be more than a buffer state."
 old_trail_state:0 "Old Trail State"
 spoorland.2.t:0 "Spoorlander membership"
 spoorland.2.d1:0 "[SCOPE.sCountry('spoorland_scope').GetName] has put aside the rifts of the past, and now seeks membership within the [ROOT.GetCountry.GetName]."
 spoorland.2.d2:0 "[SCOPE.sCountry('spoorland_scope').GetName] has foolishly refused the offer of Concord membership, despite the best efforts of our ambassadors."
 spoorland.2.f:0 ""Democracy and freedom isn't a path that was guaranteed. During the Lowtower Uprising of 1648, the people of Thilvis asked for representation in the assembly; and while they eventually got it, some who didn't wish to wait for the rights they deserved founded their own republics inland.\n\nNow those days of disunity are long gone and we all share the same freedom, the same rights, the same blood, so I ask you: shouldn't we walk the path of liberty together as one?""
 spoorland.2.a:0 "Towerfoot halflings will be reunited under a single state in the Concord, named Boekia after the old Boek confederation."
 spoorland.2.b:0 "We shall have Thilvis, Daxwell and Spoorland as three distinct member states."
 spoorland.2.c:0 "Spoorland is a relic of a bygone age."
