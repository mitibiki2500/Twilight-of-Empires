 broken_empire.102.t:0 "Lorent Stamps Down Nationalism" # notification for Anbennar
 broken_empire.102.d:0 "Threatened by the rise of Carnetori nationalism, Lorent has reached out to our government to give aid and assistance in crushing dissident efforts on our side of the border."
 broken_empire.102.f:0 "The Lorentish ambassador hands over a folder thick with dossiers, reports and files. Then another. Then another. “That should be the complete collection of the information we promised you, plus a few… additions. I figured that your intelligence officers – such as they are #italic intelligent#! – would have missed some of the fundamentals. I’ve included those too.”\n\nThe Anbennarian guard captain sighs, shakes his head. “And how big are these ‘additions’ of yours?” The ambassador merely gives a smug smirk in response. “Actually, let me guess: it's the other two folders, isn’t it?”\n\n“My my… perhaps you are not #italic totally#! bereft of intuition after all!”"
 broken_empire.102.a:0 "What wonder– the thorns have a rose!"

 broken_empire.103.t:0 "Vivin Empire Stamps Down Nationalism" # notification for Anbennar
 broken_empire.103.d:0 "Threatened by the rise of Wexonard nationalism, the Vivin Empire has reached out to our government to give aid and assistance in crushing dissident efforts on our side of the border."
 broken_empire.103.f:0 "The Peacekeepers are lying in ambush for the revolutionaries in the dark, foggy night, rifles ready. Then a disruption in the distance, beyond the Arannese border – then screams, shrieks, frantic shouts. The Peacekeepers share a look, confused at first, then concerned.\n\nNot a moment later, a dishevelled rebel bursts into view, clothes torn and bloody, sweat-drenched, frantic. The Peacekeepers rise, cry “HALT!” The rebel replies with a scream. “THEY’RE HUNTING US! THEY’RE HUNTING US!”\n\nThe Anbennarians are too startled to shoot – the rebel manages to throw himself at their captain’s feet, wailing, weeping like a terrified child. Nobody else emerges from the forest."
 broken_empire.103.a:0 "What strange bedfellows…"