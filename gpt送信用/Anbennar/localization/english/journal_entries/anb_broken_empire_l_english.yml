l_english:
 je_broken_empire:0 "Broken Empire"
 je_broken_empire_reason:0 "Anbennar means unity – but in the centuries since its founding by the mages at the Grand Summit of Aranthíl, the Empire has been anything but. The Wars of Rule, the Lilac Wars, the Corinite Wars; time and time again the dream of Anbennar has been tested, the empire fractured and divided. Even the ascent of Camir Silmuna, and a new form of magocratic absolutism alongside him, proved a false hope.\n\nThe Blackpowder Rebellion brought with it the promise of a radical new direction, and a hope that the ideals of Anbennar may yet be fulfilled – but as the ties between Anbennar’s regions fray without a single individual atop the Dove Throne holding them together, and concessions to hold referendums on regional parliaments opening the door to the rising tide of nationalism, even that faint hope seems to be faltering. Why should a Vernman care about the Pearlsedger’s plight? What does a Crownsman have in common with a Wexonard? Why can’t Esmaria or Dameria choose their own, independent path?\n\nThose questions must be answered, one way or another. Time will tell if that answer includes Anbennar at all, or if the dream of the Dove will come crashing down once and for all."
 je_broken_empire_progress:0 "The status of the #bold Progress Bar#! will #tooltippable;tooltip:je_broken_empire_special_tooltip_advance advance#! or #tooltippable;tooltip:je_broken_empire_special_tooltip_deplete retreat#! based on certain conditions. The #bold Progress Bar#! reaching #variable 100%#! will lead to the potential loss of the central government's control and the revolt of local authorities, if their radicalism is over #bold 20%.#!"
 je_broken_empire_special_tooltip_deplete:0 "The following conditions will #bold deplete#! the #bold Progress Bar#!:\n• Being at war\n• Winning wars\n• Having higher [GetInstitutionType('institution_police').GetName]\n• Releasing countries from your land\n• Events"
 je_broken_empire_special_tooltip_advance:0 "The following conditions will #bold advance#! the #bold Progress Bar#!:\n• Radicalism\n• Enacting Regressive Laws\n• Raising [GetInstitutionType('institution_police').GetName]\n• Events"
#  je_broken_empire_goal:0 "Keep the bar from reaching the end by lowering radicals and increasing policing" # unused 

