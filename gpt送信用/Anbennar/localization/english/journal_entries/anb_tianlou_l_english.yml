 tianlou_events.1.t:0 "The Last Shadows of the Rending"
 tianlou_events.1.d:0 "The last shipment of gold has been sent to [SCOPE.sCountry('france_scope').GetName]. Our debt is cleared. We may finally look beyond the shadow of the Rending and into our brighter future."
 tianlou_events.1.f:0 "Before me stood something more beautiful than any High Temple. More serene than the most remote mountain peak. More magnificent than any pearl of wisdom plucked from the wisest minds who ever lived. A single zero, written on a piece of paper."
 tianlou_events.1.a:0 "The glory of Tianlou is restored."
 tianlou_events.1.b:0 "After this we can survive anything."
 
 tianlou_events.2.t:0 "Accounts Balanced"
 tianlou_events.2.d:0 "[SCOPE.sCountry('tianlou_scope').GetName] has paid its indemnity and debts in full. Per the terms of its agreement with us, they are now free of its obligations."
 tianlou_events.2.f:0 "The goblin scratched her head at the message in front of her before turning to her aide, a gnome. “It’s true then? They managed to pay it?” For a moment both of them flipped through a flurry of sheets and accounts, running through numbers faster than most minds could comprehend. The gnome looked to his superior. “So it would seem.” He muttered a few more sums under his breath but nothing changed. “Damn. I was hoping we would get more out of them. Well a deal's a deal.” With a stroke of a pen and a stamp, a debt that had nearly destroyed one of the world's largest cities was finally put to rest."
 tianlou_events.2.a:0 "A contract completed to satisfaction."
 
 tianlou_events.3.t:0 "Tianlou Requests Indemnity Negotiation"
 tianlou_events.3.d:0 "The country of [SCOPE.sCountry('tianlou_scope').GetName], suffering under a massive indemnity owed us for the exchange of their freedom, has requested a renegotiation of the terms."
 tianlou_events.3.f:0 "The delegate from Tianlou looked on in exasperation as his lenders debated amongst themselves."
 tianlou_events.3.a:0 "Granted. Influence is a currecy of its own."
 tianlou_events.3.b:0 "Denied. A contract is a contract."
 
 tianlou_events.4.t:0 "The Triarchy Agrees to Indemnity Reduction"
 tianlou_events.4.d:0 "Our negotiations with [SCOPE.sCountry('france_scope').GetName] have borne fruit. In an official letter signed by [SCOPE.sCountry('france_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('france_scope').GetRuler.GetFullName] [SCOPE.sCountry('france_scope').GetRuler.GetHerselfHimself], one quarter of the owed indemnity is written off, though with certain diplomatic strings attached."
 tianlou_events.4.f:0 ""
 tianlou_events.4.a:0 "They truly are gracious!"
 
 tianlou_events.5.t:0 "The Triarchy Refuses Indemnity Reduction"
 tianlou_events.5.d:0 "In display of smallmindedness, [SCOPE.sCountry('france_scope').GetName] has refused any and all suggestions to reduce the indemnity — the [SCOPE.sCountry('france_scope').GetAdjectiveNoFormatting] representative instead launched into a tirade about financial obligations and the technicalities of paperwork."
 tianlou_events.5.f:0 ""
 tianlou_events.5.a:0 "They are like the Dragon themselves."
 