l_english:
 je_tianlou_debt:0 "A Rending Debt"
 je_tianlou_debt_reason:0 "During the great disaster known as the Rending of Realms, the Fox-Spirit led nation of Lingyuk led its armies out of the Mulim forest across Yanshen, in a grand sweeping conquest. They conquered our lands and drove us back to the ancient walls of our city. Besieged on all sides but the sea, the only thing that sustained us was aid from abroad. Great quantities of food and other supplies, as well as military aid were sent by the Triarchy, and eventually allowed us to reclaim our lost territories. While we have recovered, this left us with a massive debt to the Aelantir-based artificers. A debt we have yet to pay off."
 
 je_tianlou_debt_status_4: "Our current debt level is: #bold Massive#!"
 je_tianlou_debt_status_3: "Our current debt level is: #bold Large#!"
 je_tianlou_debt_status_2: "Our current debt level is: #bold Significant#!"
 je_tianlou_debt_status_1: "Our current debt level is: #bold Small#!"
 
 je_tianlou_debt_negotiation_button: "Negotiate Indemnity Reduction"
 je_tianlou_debt_negotiation_button_desc: "Should diplomatic conditions be right, we could initiate talks with [SCOPE.sCountry('triarchy_scope').GetNameNoFlag] to lower the indemnity owed their creditors. This can only be requested #bold once#!, and, should [SCOPE.sCountry('triarchy_scope').GetNameNoFormatting] accept, will come at the cost of owing an [concept_obligation|l]."
 je_tianlou_debt_payment_button: "Pay Off Debt Portion"
 je_tianlou_debt_payment_button_desc: "Authorise a large payment to the [SCOPE.sCountry('triarchy_scope').GetAdjectiveNoFlag] #italic Financial Department#!."
 je_tianlou_cancel_debt_button: "Unilaterally Cancel Debt"
 je_tianlou_cancel_debt_button_desc: "Enough is enough. We would rather repay our debt in blood than bleed our coffers dry for the damned [SCOPE.sCountry('triarchy_scope').GetName]."
 je_tianlou_cancel_debt_button_tt: "This decision will not be well-received in [SCOPE.sCountry('triarchy_scope').GetName], and their willingness to wage war against us can be expected to rise drastically."

 notification_tianlou_stops_paying_triarchy_name: "Tianlou Stops Indemnity Payments"
 notification_tianlou_stops_paying_triarchy_desc: "Tianlou has refused to make any further payments to our country, unilaterally cancelling any and all debts owed us.\n\nDemands for a punitive expedition are widespread, and we now possess a [concept_claim|l]  on the lands we so kindly saved."
 notification_tianlou_stops_paying_triarchy_tooltip: "#header $notification_tianlou_stops_paying_triarchy_name$#!\n$TOOLTIP_DELIMITER$\n$notification_tianlou_stops_paying_triarchy_desc$"

 notification_tianlou_pays_off_debt_name: "Tianlou Pays Off Part of Indemnity"
 notification_tianlou_pays_off_debt_desc: "Tianlou has paid off part of the indemnity owed us, with the #italic Financial Department#! receiving the installment earlier this morning."
 notification_tianlou_pays_off_debt_tooltip: "#header $notification_tianlou_pays_off_debt_name$#!\n$TOOLTIP_DELIMITER$\n$notification_tianlou_pays_off_debt_desc$"
 
