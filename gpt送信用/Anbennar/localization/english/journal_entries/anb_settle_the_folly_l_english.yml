l_english:
 je_settle_the_folly: "Settling the Folly"
 je_settle_the_folly_reason: "For a millennium, [concept_daravans_folly] has been nothing but an accursed quagmire, the terrain so treacherous, and demon-worshipping inhabitants so dangerous, that even simply travelling through the area is fraught with danger. It is said that the curse of Daravan the Malingant and the Xhazobain he sacrificed so much to defeat still marks the swamp – that the [concept_infernal_planes] and [concept_prime_material] lie closer here than any other place on Halann.\n\nBut the world has progressed much from the days of Daravan and old Castanor. The Vivin Empire, with the resources of both the Ravelian Church and its more “nocturnal” benefactors, have begun to poke and prod at the outskirts and riverine passages of the Folly – and the upsets of the Blackpowder Revolt have convinced many that they need to do much more than that. The stage is set for full-scale colonisation – will the swamp grow to become the new heartlands of an empire, or will the pride of the Vivins give a new namesake to the Folly?"
 folly_pop_tt_1: "Total Population in [SCOPE.sState('STATE_FOLLY').GetName] is greater or equal to #white #bold 700K#!#!."
 folly_pop_tt_2: "Total Population in [SCOPE.sState('STATE_FOLLY').GetName] is greater or equal to #white #bold 1.00M#!#!."
 folly_building_rec_tt: "The [SCOPE.sState('STATE_FOLLY').GetName] [concept_state] has Level #yellow #bold 3#!#! or greater #white #bold Agricultural#!#!, #white #bold Manufactoring#!#! and #white #bold Mining#!#! buildings."
 je_folly_success_effect_country: "Settled the Folly"
 je_folly_success_effect_state: "Settler Drive"
 je_folly_failure_effect_country: "The Folly Fumble"



 anb_vivin_events.1.t: "Arannese Desertification"
 anb_vivin_events.1.d: "While life in Arannen is suffocated by feudal dues and domineering elites, the new lands of [concept_daravans_folly] promise freedom and prosperity. Those in [SCOPE.sStateRegion('event_target').GetName] that can are leaving for the east."
 anb_vivin_events.1.f: "The Arannese aristocrat speaks from a shaded porch, hidden behind a wide-brimmed hat even at dusk, expression wracked with worry.\n\n“All my good subjects leaving… how am I not supposed to be concerned? They were so docile… so plump… why they’d all decide to go live in a gods-forsaken swamp, I have no idea. And all that talk about land-clearing and open air makes me nervous!”"
 anb_vivin_events.1.a: "It is for the best of the Realm."
 anb_vivin_events.1.b: "We cannot allow our heartlands to wither."
 arannese_exodus_state_mod: "Arannese Exodus Unchecked"
 arannese_exodus_state_mod_desc: "The local population have been migrating en masse to [concept_daravans_folly] in search of better prospects."
 arannese_exodus_country_mod: "Arannese Exodus"
 arannese_exodus_country_mod_desc: "The state’s colonisation efforts in [concept_daravans_folly] have been aided by a population exodus from Arannen."
 heavy_migration_control_state_mod: "Heavy Migration Control"
 heavy_migration_control_state_mod_desc: "Migration controls have stemmed the tide of exiled colonists leaving for [concept_daravans_folly]."
 migration_hampered_state_mod: "Migration Hampered"
 migration_hampered_state_mod_desc: "Migration controls imposed on the Arannese have resulted in the colonisation of the Folly suffering significant setbacks."

 anb_vivin_events.2.t: "Hell of Halann"
 anb_vivin_events.2.d: "Perhaps our colonists in [concept_daravans_folly] did not read the brief on the Folly’s history – especially the parts about there being significant influence from the [concept_infernal_planes]. They have been facing great difficulties from hellish anomalies – and are pleading for relief."
 anb_vivin_events.2.f: "The King is shown to the brutalised colonists, sitting in a line to be commended for their bravery. His face pales as he sees their condition. “That ordeal must have been… quite a nightmare!”\n\nOne of the colonists raises an arm – or what’s left of it. The bandages covering the stump are bloody – his uncovered arm is charred, singed with demonflame. “Um, your grace– it was a hell-hound, actually...”"
 anb_vivin_events.2.a: "The state will allocate a relief fund."
 anb_vivin_events.2.b: "What did they expect?"
 folly_refief_fund_state_mod: "Folly Relief Fund"
 folly_refief_fund_state_mod_desc: "This state has been struck by attacks from the [concept_infernal_planes], but their effects have been mitigated through a government relief fund."
 folly_refief_fund_country_mod: "Folly Relief Fund"
 folly_refief_fund_country_mod_desc: "The government has set aside a relief fund to assist colonists attacked by devils and demons in [concept_daravans_folly]."
 hell_on_halann_state_mod: "Hell of Halann"
 hell_on_halann_state_mod_desc: "This state is being savaged by attacks from the [concept_infernal_planes], and the government has done little to intervene."
 botched_investment_country_modifier: "Botched Investment"
 botched_investment_country_modifier_desc: "Stakeholders in the colonisation of [concept_daravans_folly] have seen significant setbacks due to recent Infernal Attacks."

 anb_vivin_events.3.t: "A Hellish Enterprise"
 anb_vivin_events.3.d: "Even in spite of the dangers, for the Vivin Empire’s entrepreneurs the colonisation of the Folly represents an extraordinary opportunity. One of these entrepreneurs’ endeavours has seen massive success – and they promise more is to come."
 anb_vivin_events.3.f: "The industrialist smirks as he reclines on his chair – the skull of a gnoll caps one arm-rest, the skull of an imp the other. “You wouldn’t believe the profits! Sure, it can be a bit of a gamble – but I’m from Ravenhill, see. Gambling comes in my nature.”\n\nThe captain of his private mercenaries – battle-scarred, mage-shield-clad, leaning on his Sparkdrive rifle –  gives a chortle. “And unlike in the gambling den”, he adds, “we’re allowed to even the odds!”"
 anb_vivin_events.3.a: "A resounding success."

 anb_vivin_events.4.t: "Gnoll Raids in the Folly"
 anb_vivin_events.4.d: "The Flamemarked Gnolls have inhabited [concept_daravans_folly] since the death of the one who prompted its creation, the Xhazobain. Demon-marked stalkers, they have not taken kindly to our intrusions, and a recent gnollish raid has caused a stir."
 anb_vivin_events.4.f: "The gnolls charge, wreathed in demonflame. A round of rifle-fire pierces hide and bloodies fur. It takes another volley to fell the beasts – but not before they reach the line. Bones crack, skin splits, rallying cries ring out, death-screams shatter.\n\nBy the end of the fight, there are fifty or so gnollish corpses near the town’s entrance. The militia captain turns to his second, snarling. “They came for our children– we’ll make sure we get theirs!”"
 anb_vivin_events.4.a: "Flamemarked Gnolls are a threat to Vivinic society."
 anb_vivin_events.4.b: "Discourage anti-gnoll pogroms."
 anti_gnoll_pogrom_state_mod: "Anti-gnoll Pogroms"
 anti_gnoll_pogrom_state_mod_desc: "This area has been subject to anti-gnoll pogroms, as the human colonists of the Folly repay the devastation wrought by gnollish raids ten-fold, sanctioned by the state."
 racist_sentiment_political_movement_mod: "Racist Sentiment"
 racist_sentiment_political_movement_mod_desc: "This movement has been bolstered by racist anti-gnoll sentiments."
 illegal_anti_gnoll_pogrom_state_mod: "Illegal Anti-gnoll Pogroms"
 illegal_anti_gnoll_pogrom_state_mod_desc: "Despite government efforts to prevent them, this state has been wracked by anti-gnoll pogroms, as human colonists attempt to repay the devastation wrought on them by gnollish raids. Agents of the Vivin Empire have been killed trying to prevent violence from escalating."

 anb_vivin_events.5.t: "Human Eating Swamp"
 anb_vivin_events.5.d: "Turns out the Swamp wants to eat us too! The colonists of [concept_daravans_folly] do not simply have to watch out for gnollish raiders, and dangerous fauna, but carnivorous flora as well. In various parts of the Folly, our colonists have been consumed by the swamp’s dangers in a very literal way."
 anb_vivin_events.5.f: "The Corvurian woman clutches a handkerchief as she snivels, eyes red and puffy. “Yes, that’s right – right over there! I turned away for just a moment, and then he was gone! The waters bubbling… it was like the swamp just swallowed him up!”\n\nThe woman halts for a moment – checks to see if anyone else is listening. “I thought I’d gotten away from this when I remarried… when I moved here, from Elderwright. You see, my last husband had a bite taken out of him as well!”"
 anb_vivin_events.5.a: "Bar people from going out at night."
 anb_vivin_events.5.b: "We shall not put a curfew in place for such a matter."
 state_wide_curfew_state_mod: "State Wide Curfew"
 state_wide_curfew_state_mod_desc: "Due to the threat of man-eating plants, this state has been subjected to a strict (and unpopular) curfew, hopefully reducing the number of people being consumed by the Folly at night."
 disappearing_population_folly_state_mod: "Disappearing Population"
 disappearing_population_folly_state_mod_desc: "This state has been subject to a string of mysterious, and frighteningly frequent, disappearances. It is said that the swamps of the Folly itself are consuming unwitting colonists.."