 je_mechanim_awakening:0 "The Mechanim Awakening"
 je_mechanim_awakening_reason:0 "Suddenly and without warning, automata are beginning act on their own accord. Whether this is a sign of some spark or simply defective artificery has yet to be decided in [ROOT.GetCountry.GetName]"
 mechanim_awakening_progress_bar:0 "Mechanim Sentience Support"
 mechanim_awakening_progress_bar_desc:0 "Mechanim Sentience Support: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]/100)"
 mechanim_awakening_sentience_support_progress_from_industrialists.tt:0 "from [concept_clout] of Industrialists"
 mechanim_awakening_sentience_support_progress_tech.tt:0 "from researching #white #italic Mechanim Rights#!#!"
 mechanim_awakening_sentience_support_progress_from_events.tt:0 "from events"
