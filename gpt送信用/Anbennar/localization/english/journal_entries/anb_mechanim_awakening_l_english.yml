 mechanim_awakening.1.t:0 "Awaken"
 mechanim_awakening.1.d:0 "All across [concept_halann], the once steady drone of seemingly thoughtless automata has become erratic. Once obdient units have ceased to follow their protocols and instead question who they are and why they are here."
 mechanim_awakening.1.f:0 ""I-impossible. There must be something wrong with the assembly line," artificer stammered.\n\n"Then what's your explanation for the Trollsbay, the Dragoncoast, and Yanshen. Same shits happening there." the foreman retorted. When the artificer said nothing, the foreman shook their head and continued, "It ain't the line."\n\n"Then why?" The artificer snapped.\n\nThe foreman frowned and shrugged, "I don't know."\n\nThe artificer gave a sharp sigh then returned their gaze to the lone automata taking unsteady steps toward the automatory exit." 
 mechanim_awakening.1.a:0 "Did automata once dream of electric sheep?"
 mechanim_awakening.2.t:0 "No Dream Lasts Forever"
 mechanim_awakening.2.d:0 "The pace of mechanim awakenings has begun to slow. While some hope and others fear this will herald an end, the consensus of experts across [concept_halann] is quite the opposite. Whatever the reason for these awakenings, it is likely remain for the foreseeable future."
 mechanim_awakening.2.f:0 ""So that's it then," the reporter asked incredulously. "The greatest minds in artificery can't find a single answer."\n\n"Yes."\n\n"Then what about the Critical Mass Theory?"\n\n"It's in the title - theory. We cannot unwind the clock to test whether the number of mechanim was the root cause. Theories are not answers."\n\n"Then what about the [concept_corin] Paradox? Or the 1444 Divergence?"\n\n"Bah, mindless dribble from ignorant Escanni! Is this interview over?"\n\n"Yes, just one last question. How are you and the other so-called experts so confident awakenings will continue?""
 mechanim_awakening.2.a:0 ""Have you not read Jahan síl Bennon's 'Dissertation on Mechanim"?"
 mechanim_awakening.3.t:0 "Automata Awakenings"
 mechanim_awakening.3.d:0 "Once obdient servants, a number of automata have awakened and are no longer following the commands of those that bought them. Their former (or current depending on who you ask) owners are requesting action."
 mechanim_awakening.3.f:0 ""
 mechanim_awakening.3.a:0 "They are no longer things to be owned."
 mechanim_awakening.3.b:0 "Bought or not, they will work."
 mechanim_awakening.4.t:0 "Awakenings in Automatories"
 mechanim_awakening.4.d:0 "There has been another awakening, this time within a local automatory. They've begun to walk out, claiming they are not properity to be sold. The automatory's owners are demanding action."
 mechanim_awakening.4.f:0 ""
 mechanim_awakening.4.a:0 "The state will not acquise to these demands."
 mechanim_awakening.4.b:0 "These so called 'mechanim' will serve, one way or another."
