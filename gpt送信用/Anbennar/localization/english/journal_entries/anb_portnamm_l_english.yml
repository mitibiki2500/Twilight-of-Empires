 ## JE2: THE SOVEREIGN LEDGER DIRECTORATE ##
 portnamm_je_activate_tt:0 "The time has come."
 je_portnamm_sovereign_ledger:0 "The Sovereign Ledger Directorate"
 je_portnamm_sovereign_ledger_reason:0 "The flourishing of the Portroy Merchant Guild led ultimately to the formation of the Sovereign Ledger Directorate. The Directorate was initially an institution that organized and coordinated our capitalists operating in the Lorentish market. With key positions occupied by representatives from the Guild, the Directorate’s culture was shaped in the image of the Guild which preceded it — namely, the axiom that more profit is the only thing that ever matters.\n\nWhile neighboring great powers measured strength in soil and soldiers, the Directorate quietly secured the patents and mining-rights that would soon make every foreign factory a subsidiary of gnomish ambition. It was the dawn of the Great Calculation — an era where the stroke of a pen across a ledger became more devastating than the swing of a conqueror's sword.\n\n#blue You can see the amount of owned foreign GDP from the country tab.\nYou get +1 construction section max level and +6 prestige per 2M extracted wealth.\nYou get a series of unique directorate companies, you may use a number of them based on extracted foreign wealth. 1 at 10M, 2 at 30M, 3 at 60M, 4 at 150M, 5 at 300M.\nCalculation behind the scene is based on monthly pulse, so do expect some mismatch.\nUpon JE completion, you keep the modifier but it won't keep updating. #"
 portnamm_je2_active_modifier:0 "Sovereign Ledger Directorate"
 portnamm_je2_permanent_modifier:0 "Legacy of the Sovereign Ledger"
 portnamm_je2_complete_sol_tt:0 "Average standard of living is at least 35"
 portnamm_je2_complete_wealth_tt:0 "Extracted foreign wealth is at least 1 Billion"
 portnamm_je2_fail_laws_tt:0 "We've failed to ensure the laws required by the directorate"

 ## JE3: DIRECTORATISM REFORMS ##
 je_portnamm_directoratism_reforms:0 "Directoratism Reforms"
 je_portnamm_directoratism_reforms_reason:0 "Executives of the Directorate have come to us today with a list of laws they wish to see. It's not a proposal, it's a demand. With their growing influence in the government, we have to accept, or face the unbearable consequences."
 portnamm_je3_fail_timeout_tt:0 "#R The deadline for reforms has passed#"

 ## JE4: DIRECTORATISM IDEAS ##
 je_portnamm_directoratism_ideas:0 "Directoratism Ideas"
 je_portnamm_directoratism_ideas_reason:0 "At the moment, the Directorate doesn't even care to intervene in the day to day business of government anymore, as everyone knows who ultimately determines the agenda. Knowing the consequence of not doing so, all officials reflexively consider the interest of the Directorate first whenever they make a decision."
 portnamm_je4_active_modifier:0 "Directoratism Ideas"

 ## JE5: GROWING TENSION IN FACTORIES ##
 je_portnamm_growing_tension:0 "Growing Tension in Factories"
 je_portnamm_growing_tension_reason:0 "As the Directorate's monopoly tightened, foreign industrial hubs grew restless under the crushing weight of depressed wages and exported poverty, stoking a volatile resentment in nations that possessed the military might Portnamm lacked. Within the vault-walls of the home country, meanwhile, the traditional gnomish work ethic withered as the citizenry transitioned into a pure rentier class, preferring to manage silken portfolios rather than touch a grease-stained gear.\n\nThis great divergence left Portnamm in a gilded paradox; they owned the world's production but no longer knew how to produce, while those who did the labor were increasingly sharpening their bayonets.\n\n#blue You get penalties to throughput of most production buildings, linear with respect to the percentage of population being capitalists.\n\nAll other countries get modifiers to salary, minimum salary and radicals from SoL changes. Linear with respect to percentage of GDP controlled by Portnamm. Also linear with respect to actual amount of Portnamm controlled GDP but capped at 50M. With 100% control and at least 50M total amount, it's -50% salary, -100% minimum salary and 50% radicals from SoL change.#"
 portnamm_directorate_company_active_tt:0 "At least one directorate company is active"

