 ## JE1: RISE OF GNOME INDUSTRIALISTS ##
 je_portnamm_rise_of_industrialists:0 "Rise of Gnome Industrialists"
 je_portnamm_rise_of_industrialists_reason:0 "Gnomes are always the smartest, after all – this gift doesn't exclusively belong to artificers from the Hierarchy. As tension increases between Lorent and the Hierarchy, expanding our business operations in Lorent could bring us unthinkable wealth.\n\nA few visionaries from the Portroy Merchant Guild have thus approached us with a proposal. If we can secure their position in our government, they'll convince Lorentish officials to accept the trade deal, by doubtless sordid means that we’d prefer not to hear about."
