## JE6: GOLDEN AGE OF ART ##
 je_portnamm_golden_age_of_art:0 "Golden Age of Arts in Portnamm"
 je_portnamm_golden_age_of_art_reason:0 "As the thunder of the Blackpowder Wars leveled old thrones and choked the continent in revolutionary soot, Portnamm remained a serene enclave of operatic arias and gilded playhouses, its borders firmly closed to the march of boots. In these uncertain years, the city-state's primary mission was to ensure that the fires of neighboring conflicts never reached its renowned art academies.\n\nTo gain progress:\nBe top producer of fine arts\nHave good relations with Great Powers\nForm Portnammer Association of Fine Arts\nHave no migration controls\nHave multiculturalism\n\nTo lose progress:\nBe at war\nNot a top producer of fine arts\nHave bad relations with Great Powers\nHave closed borders or migration controls\nHave ethnostate, national supremacy or racial segregation\n\nThe country gets bonus to intelligentsia attraction and arts throughput according to the bar progress."

 portnamm_age_of_art_bar_name:0 "Patronage of the Arts"
 portnamm_age_of_art_bar_desc:0 "The level of support for free thoughts and arts within Portnamm"
 portnamm_age_of_art_tt:0 "The progress bar reaches 0, or something unexpected happens..."

