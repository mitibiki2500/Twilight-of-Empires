 ## EVENTS ##
 anb_portnamm_events.1.t:0 "A Purely Fantasy Timeline"
 anb_portnamm_events.1.d:0 "Due to recent dramatic changes in the situation, the proposal from the merchants no longer makes sense."
 anb_portnamm_events.1.f:0 "We had it all mapped out, you know. We planned a campaign not with armies or cannons, but with ink, paper, and the sheer weight of compound interest. Lorent could have been ours—all of it—bought and paid for, if only they had listened and took action. Now I can only sit here, watching the ledgers collect dust while fools play with their little flags, utterly ignorant of the empire we could have built."
 anb_portnamm_events.1.a:0 "Daydreamers."

 anb_portnamm_events.2.t:0 "The Calculated Coup"
 anb_portnamm_events.2.d:0 "Unsettled by our recent actions, the Directorate has decided that our current government is not to be trusted. Behind dark curtains and inside closed doors, a conspiracy is quietly unfolding."
 anb_portnamm_events.2.f:0 "Outraged that the government sought to tax the Directorate’s offshore ventures to fund the crumbling arts, the syndics met in the muffled silence of private vaults to map the nation's financial anatomy. They realized that a revolution did not require barricades or blood, but simply the coordinated freezing of the state’s payroll and the foreclosure of the ministers' private estates. Mere hours after the Directorate gave the signal, the government fell - not to a sword, but because it could no longer afford the ink to sign its own decrees."
 anb_portnamm_events.2.a:0 "How will this unfold?"

 anb_portnamm_events.21.t:0 "Lorentish Army Approaching!"
 anb_portnamm_events.21.d:0 "Exploiting the paralyzed state of Portnamm’s leadership during the Directorate’s shadow war, the Empire of Lorent marched its ironclad regiments through the city’s marble arches under the hollow pretense of protecting regional stability."
 anb_portnamm_events.21.f:0 "The hobnailed boots of foreign infantry now echo across the mosaic floors of the grand theaters, the sanctuary of culture rendered a mere garrison-outpost of imperial ambition. The gnomes’ ledgers are seized, and one thing is clear; they will never again have the chance to achieve their bookkeeper’s fantasy . A bitter lesson indeed; a vault is only as strong as the army that stands before its door."
 anb_portnamm_events.21.a:0 "What?!"

 anb_portnamm_events.3.t:0 "The Master of the Ledger"
 anb_portnamm_events.3.d:0 "The Sovereign Ledger Directorate has achieved the once unthinkable: total economic supremacy. A massive fortune in foreign wealth now fills our vaults, and our citizens want for nothing. Without firing a single shot, Portnamm has subordinated the industry of our neighbors, turning mighty empires into our financial subjects."
 anb_portnamm_events.3.f:0 "The Great Calculation is complete. Every factory across the border works for us, every train carries goods owned by us, and every foreign ruler pays us his dues in silence."
 anb_portnamm_events.3.a:0 "The world is ours."

 anb_portnamm_events.5.t:0 "Unrest in the Factories"
 anb_portnamm_events.5.d:0 "While the Directorate showers our investors in unimaginable wealth from abroad, those few traditional gnomes still toiling away in our own domestic factories are growing violently resentful. They see their neighbors turn into a pampered rentier class, while they themselves are left to inhale soot and manage gears for wages that pale in comparison to overseas dividends. The inequality within our own borders is becoming unsustainable."
 anb_portnamm_events.5.f:0 ""Why should we break our backs to keep the home fires burning, while the syndics sip imported wine and shuffle papers?" reads an angry pamphlet distributed outside a local factory. The traditional gnomish work ethic is dying, suffocated by the very success of our foreign monopolies."
 anb_portnamm_events.5.a:0 "Troubling indeed."

 anb_portnamm_events.6.t:0 "Fate of the Overseas Workers"
 anb_portnamm_events.6.d:0 "With the Directorate's supremacy now eternally secured, the persistent unrest in our foreign factories is no longer a threat, but merely a question of policy. We can easily afford to lift the brutal wage suppression that fueled our early rise, yet many syndics insist that maintaining our extreme margins is a matter of principle."
 anb_portnamm_events.6.f:0 "Charity has no line item on the Sovereign Ledger, but neither does unnecessary cruelty. The board remains divided on what maximizing long-term stability truly entails."
 anb_portnamm_events.6.a:0 "Let their wages rise. We have enough."
 anb_portnamm_events.6.b:0 "The extraction must remain absolute."

 anb_portnamm_events.10.t:0 "Suspicious Trade Deal from Portnamm"
 anb_portnamm_events.10.d:0 "The city-state of Portnamm has approached us with an extraordinary proposal. Their 'Sovereign Ledger Directorate' offers massive capital investment in our industries, promising technological marvels and unprecedented growth. The terms, however, heavily favor their investors, essentially ceding economic control of these new enterprises to gnomish syndics."
 anb_portnamm_events.10.f:0 "The gnomes speak of mutual prosperity, but one cannot look at their meticulously drafted contracts without feeling as though one is signing away more than just land rights."
 anb_portnamm_events.10.a:0 "What could ever go wrong?"
 anb_portnamm_events.10.b:0 "NO, PLEASE, NO!"


 ## IDEOLOGIES ##
 ideology_directoratism:0 "Directoratism"
 ideology_directoratism_desc:0 "#lore Born in the counting houses of Portnamm's Sovereign Ledger Directorate, Directoratism holds that a society's highest purpose is the efficient extraction and accumulation of wealth by educated capitalist elites. It champions private enterprise in all sectors of life — education, health, and welfare — while demanding a disciplined and meritocratic society that values competence over birth.#!"
 ideology_vaultarchy:0 "Vaultarchy"
 ideology_vaultarchy_desc:0 "#lore Vaultarchy is the economic philosophy of Portnamm's gnomish industrialists, not dissimilar to Laissez-Faire, but with the additional maxim that nothing should cross borders other than goods and capital. With the wealth generated abroad flowing back to the homeland, a stronger sense of exclusivity is established between native citizens and the lesser people abroad.#!"

