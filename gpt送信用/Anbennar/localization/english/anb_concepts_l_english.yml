 ######### Foundational #########

 concept_halann: "Halann"
 concept_halann_desc: "Halann is the terrestrial world in which Anbennar takes place, and the home of most known lifeforms."
 concept_artificery: "Artificery"
 concept_artificery_desc: "Artificery is the craft of creating and inventing magically-infused objects, originating from traditional practice of alchemy Artificers treat magic as something that can be (and should be) controlled and understood: more of a science than an art."
 concept_artificery_lowercase: "artificery"
 concept_artificery_lowercase_desc: "Artificery is the craft of creating and inventing magically-infused objects, originating from traditional practice of alchemy Artificers treat magic as something that can be (and should be) controlled and understood: more of a science than an art."

 ######## PLANES ########
 concept_infernal_planes: "Infernal Planes"
 concept_infernal_planes_desc: "The Infernal Planes are a group of outer planes (though it is sometimes conceptualised as a single plane with different geographic areas) that exist outside of the [concept_prime_material], and can only be accessed from it with great difficulty. Extremely diverse, the Infernal Planes are home to devils – lawful-evil aligned creatures led by the Archdevils, patronised especially by Cannorian adherents of the Infernal Court – and demons – chaotic-evil beings such as the Xhazob, which are known to make pact with the gnollish worshippers of the Xhazobkult."

 concept_prime_material: "Prime Material"
 concept_prime_material_desc: "The Prime Material is the primary physical plane, where Halann as most know it exists. It is “imperfectly mirrored” on its two parallel planes, the Feyrealm and the Shadow Plane, and there are areas on the Prime Material through which these parallel (or core) planes can be accessed more easily, such as the Deepwoods and Domandrods and the Feyrealm and the Shadowswamp and Shadowplane."

 ######### RELIGION #########

 concept_god_fragment: "The God Fragment"
 concept_god_fragment_desc: "The God Fragment is the core of the [Concept('concept_ravelianism', '$concept_ravelian$')] Faith and is believed to be the medium through which the High Rector and Veridicals communicate with the One True God.\n\nOriginally thought to simply be a diamond-shaped, fist-sized crystal that shines the teal-blue of damestear-infused magical energy when emitting noise, recent inquiries with an artificery-enhanced lens have revealed a fluctuating black, gem-like cubic shard in the center.\n\nIt is monitored for its rare communication through high-pitched hums which are then transcribed by the [concept_high_rector] and the Veridicals* to share amongst the followers"

 concept_high_rector: "High Rector"
 concept_high_rector_desc: "The High Rector is the leader of the [Concept('concept_ravelianism', '$concept_ravelian$')] Church. It is their duty to study and decipher the meaning behind the [concept_god_fragment], its messages, other divine revelations and the church's research. The High Rector is the greatest authority to Ravelians and the representative of their God on [concept_halann]."

 concept_ravelian: "Ravelian"
 concept_ravelianism: "Ravelianism"
 concept_ravelianism_desc: "Ravelianism is a monotheistic religion that started to gain popularity in 1640. It professes the idea of a singular, all-encompassing god, and that all other gods are either aspects of the one god or saints.\n\nLed by the [concept_high_rector], the faith originated from the ranks of the Ravelian Society, a group of academics focused on unraveling the secrets of the world. The society soon spread all over Cannor and the world, and earned the favour of powerful monarchs at the time for their liberal ideals - however, when [concept_god_fragment] was discovered, the society reorganized under a new focus: to restore the belief of a one, true God, and to share that god's powers (which they believe to be magic) with the common man via artificery, after it had been stolen by the precursor elves."

 concept_castellos: "Castellos"
 concept_castellos_desc: "Castellos was the head god of the old Regent Court religion and god of rule, order and justice. He was the first god of the Cannorian Pantheon that the original Regent Court was derived from, as well as the patron of the ancient human empire of Castanor. He was the father of the current head of the Adeanic Court, Adean.  News of his death acted as the catalyst for the Age of Unraveling."

 concept_corin: "Corin"
 concept_corin_desc: "Corin is the ascended goddess of war. Originally an adventurer enlisted to stop the Greentide, she discovered she was an avatar of the dead god of war, Agrados, through a conversation she claimed to have had with Nerat. She brought the Greentide to the end in the Battle of Castonath, where she and Korgus Dookanson* killed each other within the great melee in the Imperial Quarter. After Corin sacrificed herself to block a killing blow meant for Lothane Bluetusk*, she was elevated to godhood by her fervent supporters."

 concept_agrados: "Agrados"
 concept_agrados_desc: "Agrados was the disgraced god of war in the Cannorian Pantheon who betrayed his brother Castellos and started the Godswar. Agrados' progeny from the rape of Castellos' wife, Halanna*, formed the Beast Gods and the Spawns of Agrados, while his dark essence absorbed by his brother caused the creation of Kazraiel*, one of the Dukes of Hell.\n\nDuring the Greentide, a young human named [concept_corin] became the avatar of Agrados and saved Cannor from the orcish onslaught. This action redeemed Agrados and let him have peace. In turn, Corin became the new god of war in Agrados' place."

 ######### SOUTH AELANTIR #########

 concept_ambhen_empire: "Ambhen Empire"
 concept_ambhen_empire_desc: "The Ambhen Empire was an extremely powerful state that ruled over southern Taychend and western Devand from the the conquests of Laskaris the Conqueror in the 1430s, to the empire’s eventual collapse in the 1780s. From the city of Ameion, the Ambhen political elite, organised through the Synkletos, ruled over a vast network of Cynheia protectorates (themselves integral but autonomous parts of the Empire) and allied nations that stretched from Arpedifer to the tip of Malatel.\n\nThe Empire was famed for its military and economic strength, with the Stratéor triumphing over the traditionalist Taychendi, Oren Nayiru and eventually Rezankand, their greatest enemy, whom they confronted in the Rezankand-Ambhen Wars of the 1500s.\n\nDuring the Ambhen Century that followed the Kamrayakval’s War, Ameion was able to fend off Cannorian colonisers and expand their influence, standing as the most powerful Ruinborn and Aelantiri Empire until their decline over the 1700s, and eventual collapse to a mix of military defeats and a political conflict between the “pureblooded” Ambhen and the Klereyen majority."
 
 concept_blooming: "The Blooming"
 concept_blooming_desc: "While the harrowing failures of several jungle expeditions clued many into the true intelligence of the Effelai, the colossal consciousness believed to span the entirety of the rainforest that bears its name, the singing jungle’s ability to defend itself remained vastly underestimated.\n\nThat was, at least, until Cannorian and Rezankandi encroachment triggered what is now known as the Blooming, or Effelai Bloom, wherein the jungle used its Seedthrall undead minions, the enhanced and mutated wildlife of the jungle and the very trees and roots under its control to drive off the colonisers it saw as a threat.\n\nBeginning in the 1600s, the Effelai Bloom forced the powers at the jungle’s edges onto the defensive, most notably ending Rezankand’s Taychendi campaigns and forcing them to burn the Paradise Gardens at the hearts of their cities, an especially traumatic event. While the worst of the Bloom is believed to be over, the possibility of a renewed threat from the Singing Jungle is ever-present."

 concept_kaydhano: "Kaydhano Deathwinds"
 concept_kaydhano_desc: "Kaydhano Deathwinds are powerful magical sandstorms, that cause extremely lethal tumours on exposure. Blowing south from the Kaydhano Sea, a nearly impenetrable desert full of Kaydhano sand, the periodic Deathwinds forced the Kheionai into the shelter of the Kheions, whose Windwards (Zopedan) offer protection from the storms’ effects.\n\nAlthough advances in technology, such as warded Abjuration Suits, have allowed some exploitation of the Kaydhano, the Deathwinds have and continue to shape Kheionai civilisation."
 
 concept_taychendi_warlords: "Taychendi Warlords"
 concept_taychendi_warlords_desc: "Taychend’s warlords are an integral aspect of the region’s politics, society and history. With Taychendi culture and religion holding military power as the basis for legitimacy, rulers rely on the strength of their militaries to exert their will. To traditionalist Hero-Worshippers, who believe that only through glory – great deeds – can one ascend to Dhivumanhu, the warlord is both the greatest beneficiary of that glory and the means by which others can gain it too.\n\nAs a result, they often seek out war and battle, be it through conquest or more ritualised Periyodhai, fought under pre-agreed terms of victory. While the warlords’ power were suppressed by Ameion and Rezankand, Cannorians have expressed interest in them – especially weapons testers, who see their constant hunger for battle as the perfect match for their hunger for hands-on-experience."
 
 concept_rakulacan_family: "Rakulacan Family"
 concept_rakulacan_family_desc: "The Rakulacans are an ancient Taychendi clan hailing from the northern Kalavend. Since the height of their power under Varelrudu, the Tyrant King of Pirsitel, who ruled all Taychend as the domineering regent of the Mudaliar Empire, they have been known for both their might and cunning – though just as well known for the slightly buffoonish way they often end up wielding them.\n\nAfter a long period of decline, they entered a renewed period of prominence under the Cannorian Relic-Lord, and rumoured Vampire, Veliara the Pale Queen, who bestowed her gifts on them. Under the joint leadership of Veliara and their Patriarch, Thelriatam Rakulacan, they ruled the Kalavend for over a century under the Kingdom of Rakulacimai, gaining great wealth through selling Precursor Relics to Cannorian traders, until their overthrow in the 1790s. Their vampiric members are now scattered across Taychend, biding their time to strike once more."

 concept_kheionisation: "Kheionisation"
 concept_kheionisation_desc: "Kheionisation is the political, cultural and economic process through which the Republic of Ameion transformed their territories in southern Taychend, systematically disassembling the traditional culture and society of the Taychendi according to Kheionai philosophical designs.\n\nThough the groundwork was laid by Laskaris the Conqueror, the process truly began under his successor Irenthenes Gakones, #italic “The Architect of Kheionisation.”#!\n\nCalled a cultural genocide by the Taychendi, Kheionisation has resulted in southern Taychend’s traditional Thekvrystana and Yodhanpir populations being largely replaced by the Klereyen, Kheionised Taychendi who have intermarried with the Kheionai."
 
 concept_saimogemos: "Saímogemos"
 concept_saimogemos_desc: "The Saímogemos was a prolonged political and social conflict fought between the Ambhen Empire’s Kheionai and Klereyen populations during the 1700s. It saw the “pureblooded” Kheionai political elite, led by the dominant Móloist faction, attempt to restrict the legal Klereyen class – which dictated political rights in Ameion’s Taychendi territories – on the basis of blood fraction.\n\nWhile the initial requirement of 1/4 Kheionai blood resulted in the Klereyen taking on the blue skin of the Empire’s founders, attempts to increase it even further following the political shock that followed the Empire’s war against the Nakari Empire caused massive controversy. The Saímogemos would ultimately be one of the driving factors in the Klereyen revolts that would cause the Ambhen Empire’s collapse."
 
 missing_race:0 "Missing Race"


 ######### CANNOR #########
 concept_daravans_folly: "Daravan’s Folly"
 concept_daravans_folly_desc: "Daravan’s Folly, also called the Dreadmire, is a vast area of swampland in southern Dostanor. It was once a rich fertile land and the centre of the old Korbarid Kingdom’s wealth, until the Korbarid King Daravan the Malignant cast a terrible spell to flood the land to prevent a gnollish invasion from the Third Xhaz – the Xhazobain – in 669. Since then the land in the Folly has been forever sinking, earning it the name Dreadmire, and creeping slowly outwards for unknown reasons.\n\nIt is said that either the dark magics Daravan used to defeat the gnolls, or the dying curse of the demonic Xhazobain, forever cursed the Folly to be an abyssal quagmire, where the [concept_infernal_planes] bleeds into the Material Plane. This infernal influence can be seen throughout the Folly to this day, with an abnormal number of infernal fiends living in the Dreadmire.\n\nNew magics and new technologies are slowly permitting the Folly’s exploitation. Cultivated, it may yet become the heartland of a new power in Cannor."



########## HALESS #########
 concept_great_command: "Great Command"   #TODO feel free to flesh this out and make it a loading tip, just initial framework and loc here so its not missing
 concept_great_command_desc: "The Great Command was a [concept_hobgoblin] Stratocracy that through sternly enforced discipline and militarism emerged from their home to dominate not only the Shamakhad plains but much of wider Haless. Despite their repression and enslavement of traditional magic their advance seemed unstoppable until the Fourth Dhujat War in 1701 against the Jadd Empire brought it to a standstill. With their forces tied down in the west rebellions erupted all over their territory and the Great Command found itself in disarray.\nWeakened through this ordeal, it was not able to maintain central control over its sub-commands when [concept_rending] plunged Haless into chaos in 1751. A punitive expedition sent to Azjakuma to punish the oni for their involvement in the [concept_rending] vanished,  excluding a few heads the Oni sent back. Taking the chance the Elephant, Tiger and Dragon Commands seceded and the ensuing wars of the Great Insubordination helped only to further splinter the weakened [concept_hobgoblin] warring states."
 concept_rending: "Rending of Realms" #TODO feel free to flesh this out and make it a loading tip, just initial framework and loc here so its not missing
 concept_rending_desc: "The Rending of Realms, often just referred to as The Rending, was a continent-wide disaster induced by the decay of the High Temples and the subsequent outbreak of countless minor and major spirits. The collapse of the Temples had many causes: Devouring Path corruption by the Oni, adventurers from near and afar raiding temples for artifacts, abandonment of the traditional faiths that were maintaining them or just stray artillery shells and spells. Spirits originally bound by the precursor Elves broke free en masse - some rather harmless, some genuinely annoying to coexist with and a fair few genuinely disastrous to have in the mortal plane.\nChief among these was the great catfish spirit Kharunyana, which destroyed the Godswall and flooded the Yanhe, causing millions of souls to perish both in the initial disaster and in the subsequent famine. Due to Oni corruption and continued warfare, most of the Command-controlled temples were in particularly bad shape; the resultant destruction was particularly bad for the hobgoblins."
 concept_shirgrii: "Shirgrii" #TODO list the actual shirgrii, idfk all the spellings out my head. Shinukhorchi, chumijemorya (?), Kabiugarko, I forgor ,Kherlorvalshi
 concept_shirgrii_desc: "The term Shirgrii refers both to the ancient monastic fortress temples of the Oni as well as their surrounding settlement, constituting some of the oldest continuously-inhabitated settlements in the known world. Each Shirgrii Order specializes their trainees in a slightly different subdiscipline of dark arts, although little is known about the exact extent of the knowledge hidden away behind each of their doors."
