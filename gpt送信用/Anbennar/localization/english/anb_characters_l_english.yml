 Mlerek-Mudaliar:0 "Mlerek-Mudaliar"
 munathik_mlerek_mudaliar_desc:0 "Munathik Mlerek-Mudaliar is the King of Nanru Nakar – though he is only the face of the Triple Alliance, the union between the three branches of the ancient, gregarious and powerful Mudaliar family, that rules the city collectively. As with all Mlerek-Mudaliars, he is ever-conscious of his history, and the legendary god-heroes of his family’s history.\n\nAs Nanru Nakar must look further into the past to deal with the present, the example of Liandarha Mudaliar in particular – the founder of his dynasty, the source of their signature fiery-orange eyes, and a noble of the Precursor flying-city Tacenie, is one he keeps coming back to: his family’s direct descendance from Precursor nobility is something that has helped his family before in dealing with interlopers, after all."
