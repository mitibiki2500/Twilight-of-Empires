 marzhant_alkha_ahadasts_desc:0 "Marzhant Alkha'Ahadasts, the so-called "Clever Horse", has ably led the Mteibhara Grand Confederation for many years now. His priority above all else is to preserve the independence of Mteibhara, and reclaim what was lost to their former Kheionai "friends". An able diplomat, he has worked alongside both popular movements at home and Cannorians abroad to see his goals through, whilst cracking down on the corruption of the Banyýal Ehthadha - time will tell if these efforts will bare fruit."
