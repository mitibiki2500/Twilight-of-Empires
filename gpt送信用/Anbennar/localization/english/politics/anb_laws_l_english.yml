  # Variant Laws
 law_nadige_monopoly:0 "Nadige Monopoly"
 law_nadige_monopoly_desc:0 "A variant of $law_isolationism$ where trade is only permitted in two coastalal states. In 1758, the Mezhi'Mezhi decreed the creation of what became known as “The Nagide Monopoly”, a system of monopolies and free trade zones in Dakmender and Yetmesira into which foreigners could enter to do business, while being prohibited from venturing deeper into Madriamilak, by force if necessary. Domestic merchant companies needed a license from the state to trade with foreign merchants, with the state taking a comfortable percentage of the profits."

 nadige_monopoly_trade_center_trigger_tt:0 "Under the [GetLawType('law_nadige_monopoly').GetName] [concept_law], Trade Centers can only be constructed up to level #v 25#! in #v $STATE_ZEDAHRIKA$# and #v $STATE_SIMAHRIKA$#!"
 country_disallow_trade_outside_zedahrika_and_simahrika_bool:0 "We can build Trade Centers only in $STATE_ZEDAHRIKA$ and $STATE_SIMAHRIKA$."

 law_the_machine_before_family:0 "The Machine Before Family"
 law_the_machine_before_family_desc:0 "The Machine is greater than the household; the Machine allows for more than the family. Hierarchal culture may lead to a lessened focus on family and partnerships, but it certainly incentivizes everyone to work."

