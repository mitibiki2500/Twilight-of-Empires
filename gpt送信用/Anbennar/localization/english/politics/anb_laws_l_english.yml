l_english:
  # Governing Principle
 law_magocracy:0 "Magocracy"
 law_magocracy_desc:0 "A form of governance where mages rule."
 law_hive_mind:0 "Hive Mind"
 law_hive_mind_desc:0 "A Hive Mind operates as a single organism rather than as a state."

  # Distribution of Power
 law_stratocracy:0 "Stratocracy"
 law_stratocracy_desc:0 "The Head of State's power comes from having risen through the ranks in a harsh society structured solely around military might, and their authority is left unchallenged."
 law_singular_intelligence:0 "Singular Intelligence"
 law_singular_intelligence_desc:0 "The consciousness of the state is singular, with no other organism present within its borders afforded political autonomy."
 law_contemplative_intelligence:0 "Contemplative Intelligence"
 law_contemplative_intelligence_desc:0 "The consciousness of the state has become open to the perspectives of other beings, with the mental capacity to debate them internally to redirect its course of action."
 
 # Citizenship
 law_societal_hegemony:0 "Societal Hegemony"
 law_societal_hegemony_desc:0 "The state's citizens are determined by their adherence to cultural heritage and norms. One's race matters far less than the language and traditions they follow."
 EFFECTS_ON_ACCEPTANCE_law_societal_hegemony: "#tooltippable #tooltip:$BREAKDOWN_TAG$ Moderate consequences for Pops with low Acceptance values#!#!"
 law_drone_operatives:0 "Drone Operatives"
 law_drone_operatives_desc:0 "Any free individuals on land controlled by the Mind are driven away, killed, or simply treated as prey to feed the collective."
 law_inhabitant_tolerance:0 "Inhabitant Tolerance"
 law_inhabitant_tolerance_desc:0 "Free individuals accustomed to the terrain controlled by the Mind are permitted to continue their existence."
 
 #Church and State
 law_effelai_song:0 "The Song"
 law_effelai_song_desc:0 "Those who have lived within the Effelai for centuries have learned to appease her will through various practices and rituals, and have earned the right to exist under her foliage."
 
 #Bureaucracy
 law_military_bureaucrats:0 "Military Bureaucrats"
 law_military_bureaucrats_desc:0 "Merit can grant officers the right to administer a region, applying military discipline to maintain order."
 law_hub_network:0 "Hub Network"
 law_hub_network_desc:0 "The Hive Mind extends control through its territory using nodes, allowing it to project its consciousness efficiently across large distances, but restricting said control to what it can directly physically reach."
 maritime_banned_tt:0 "It will no longer be possible to build #bold Maritime#! buildings"
 maritime_banned_destroy_tt:0 "@warning! All #bold Maritime#! buildings in this country will be dismantled"
 law_decentralized_determinations: "Decentralized Determinations"
 law_decentralized_determinations_desc: "The Hive Mind extends control through its territory using specialized drones capable of asserting its will onto lesser drones."
 
 # Army Model
 law_blackpowder_militia:0 "Blackpowder Militia"
 law_blackpowder_militia_desc:0 "The army is a mix of professional soldiery and local volunteers all driven to defend Blackpowder Ideals by anymeans necessary."
 law_salla_levies_desc:0 "The army’s main forces come from the various groups of warriors and rangers provided by the elven salla (clans)."
 law_salla_levies:0 "Salla Levies"

 law_makata_companies_desc:0 "Rather than a traditional standing army, the state employs the Makata Gangs in the form of “companies”. During peace, companies are contracted out to lesser cartels to “keep noses to the Grind” and find new potential recruits (or fodder depending on the quality of the candidate)."
 law_makata_companies:0 "Makata Companies"

 law_biomass_mobilization_desc:0 "The Hive Mind can simultaneously mobilize every drone for the purposes of war, who fight without understanding the concepts of fear or hunger."
 law_biomass_mobilization:0 "Biomass Mobilization"
 law_war_drones:0 "War Specialized Drones"
 law_war_drones_desc:0 "The Hive Mind dedicates specialized drones for the purposes of war, capable of handling modern armaments."
 
 #Economic System
 law_hive_economy:0 "Hive Economy"
 law_hive_economy_desc:0 "The Mind oversees the utilization of resources within its borders, and can dedicate itself towards the production of specific resources, with effects comparable to the presence of a large company."
 amendment_verdant_nature:0 "Verdant Nature"
 amendment_verdant_nature_desc:0 "An organic and magical lifeform, the Effelai commands powerful magic by its very nature, but is very susceptible to environmental damage to its biosphere."
 
 #Land Reform
 law_organic_optimization:0 "Organic Optimization"
 law_organic_optimization_desc:0 "The Hive Mind is able to perfectly organize its agricultural labor force to derive maximum efficiency from its arable land."
 
 #Education System
 law_innovative_contemplations:0 "Innovative Contemplations"
 law_innovative_contemplations_desc:0 "Being only one consciousness, the Mind is already an educated individual at the fundamental level, but must dedicate itself to learning all there is to know about the world and its modern developments, relying upon its own vast cognitive ability rather than external factors."
 law_exogenous_erudition:0 "Exogenous Erudition"
 law_exogenous_erudition_desc:0 "Being only one consciousness, the Mind is already an educated individual at the fundamental level, but must dedicate itself to learning all there is to know about the world and its modern developments, devolving its intellect to accept external inputs as a source of knowledge."
 
 #Free Speech
 law_subsumed_will:0 "Subsumed Will"
 law_subsumed_will_desc:0 "Incapable of communicating with other minds the way it does its own drones, it seeks to assimilate organics within its borders into its own consciousness."
 
 #Rights of Women
 law_infertile_spawn:0 "Infertile Spawn"
 law_infertile_spawn_desc:0 "The sexless nature of the drones means that the concept of gender rights holds no meaning to the Mind."
 
 #Welfare
 law_drone_maintenance:0 "Drone Maintenance"
 law_drone_maintenance_desc:0 "While the individual drones of the Hive have no free will, they do still have physical needs to maintain their existence."
 
 #labour Associations
 law_drone_labour:0 "Drone Labour"
 law_drone_labour_desc:0 "The population has no free will, and acts as an extension of the Hive Mind itself - much like the limbs of a body."
 
 # Migration
 lawgroup_racial_tolerance:0 "Racial Tolerance"
 lawgroup_racial_tolerance_desc:0 "Accepting Races."
 
 lawgroup_magic_and_artifice:0 "Magic and Artifice"
 lawgroup_magic_and_artifice_desc:0 "Laws regarding the usage of Magic and Artifice"
 
 law_traditional_magic_banned:0 "Traditional Magic Banned"
 law_traditional_magic_banned_desc:0 ""
 law_artifice_banned:0 "Artifice Banned"
 law_artifice_banned_desc:0 ""
 law_nation_of_magic:0 "Nation of Magic"
 law_nation_of_magic_desc:0 ""
 law_nation_of_artifice:0 "Nation of Artifice"
 law_nation_of_artifice_desc:0 ""
 law_nation_of_green_artifice:0 "Nation of Technothaumaturgie"
 law_nation_of_green_artifice_desc:0 ""
 magic_banned_destroy_tt: "@warning! All #bold Arcane Nexus#! buildings in this country will be dismantled"
 artifice_banned_destroy_tt: "@warning! All #bold Doodad Artificery#! buildings in this country will be dismantled"

 #mechanim 
 lawgroup_mechanim_rights:0 "Mechanim Rights"
 law_mechanim_freedom:0 "Mechanim Freedom"
 law_mechanim_freedom_desc:0 "What determines life, sentience, the very fabric of #italic being#! cannot be put simply as organic or artificial. We are in a world of possibilities, and if it looks like a person, talks like a person, and feels like a person: then it is a person."
 law_mechanim_dismantling:0 "Mechanim Dismantling"
 law_mechanim_dismantling_desc:0 "These artificial constructs have no right to exist - whether it is through religious reasons, or that of fighting against the tide of industrial progress, things were simpler before these things came out. Any found will be driven out, or worse, destroyed."
 law_mechanim_cognitive_licenses:0 "Cognitive Licenses"
 law_mechanim_cognitive_licenses_desc:0 "Liberal ideals support the rights of property owners and the rights of peoples in equal severity - and so when property became people for the second time since slavery, the market created a new concept: what if mechanim could be both? And it is merely the license, gained through purchase, tests or other means, that determines such unsightly matters? The lucky few who prove themselves are afforded the same rights as other peoples, everyone else, well... they'll have to wait their turn."
 law_mechanim_as_property:0 "Mechanim as Property"
 law_mechanim_as_property_desc:0 "Mechanim are not viewed as sentient beings, but property to own, buy, sell and command."
 lawgroup_mechanim_creation:0 "Mechanim Creation"
 law_mechanim_creation_allowed:0 "Mechanim Creation Allowed"
 law_mechanim_creation_allowed_desc:0 "The creation of mechanim is permitted."
 law_mechanim_creation_banned:0 "Mechanim Creation Banned"
 law_mechanim_creation_banned_desc:0 "The creation of new mechanim is not permitted."

 mechanim_creation_banned_tt: "It will no longer be possible to build #bold Automatories#! buildings"
 mechanim_creation_banned_destroy_tt: "@warning! All #bold Automatories#! buildings in this country will be dismantled"

 #economy
 law_shirgrii_control:0 "Shirgrii Control"
 law_shirgrii_control_desc:0 "The traditional Shirgrii that make up the government decide on economic matters to assert control over the Nations assets and utilize them to further their dark schemes" #how long can the devouring path tempt you to stay on this?
 
 #Ideologies
 ideology_racial_purist:0 "Racial Purist"
 ideology_racial_purist_desc:0 "This character is a racial purist."
 
 ideology_adventurer:0 "Adventurer"
 ideology_adventurer_desc:0 "This character is a traditional adventurer, they want to return to the days when they could just stab orcs and people wouldn't get all upset about "human rights" and stuff. People are so sensitive these days."
 
 ideology_monstrous_adventurer:0 "Monstrous Adventurer"
 ideology_monstrous_adventurer_desc:0 "This character doesn't like adventurers cause they remember the days when adventurers would just stab them without concern for "human rights" or anything, they reckon monsters would be better without so called civilized races."
 
 ideology_greentide_adventurers:0 "Landed Adventurers"
 ideology_greentide_adventurers_desc:0 "The nobility in Escann has a longstanding dislike of monstrous races, particularly orcs, dating back to the Greentide. They also believe in the freedom to adventure and from Serfdom."
 
 ideology_mad_scientist:0 "Mad Scientist"
 ideology_mad_scientist_desc:0 "Should rename this really but the guy likes science, even if it's a bit evil at times."
 
 ideology_witch_king_likers:0 "Witch King Likers"
 ideology_witch_king_likers_desc:0 "These guys are paternalistic but ALSO like Witch Kings."
 
 ideology_artifice_supremacist:0 "Artifice Supremacist"
 ideology_artifice_supremacist_desc:0 "These guys believe that artifice is the best thing ever, and they hate magic."
 
 ideology_magical_supremacist:0 "Magical Supremacist"
 ideology_magical_supremacist_desc:0 "These guys believe that magic is the best thing ever, and they hate artifice."

 ideology_nativist:0 "Nativist"
 ideology_nativist_desc:0 "This group believes that the resources of the state should be spent to support our original settlers first and foremost."


 
 ideology_legal_equality:0 "Legal Equality"
 ideology_legal_equality_desc:0 "This group has historically given the same legal rights to men and women through not always reflected in practice."
 
 ideology_traditionalist_equal:0 "Equal Traditionalist"
 ideology_traditionalist_equal_desc:0 "#lore This leader believes in maintaining traditional customs, viewing them as an extension of natural laws. Although they've accepted limited rights of women in certain aspects.#!"

 ideology_traditionalist_equal_movement:0 "$ideology_traditionalist_equal$"
 ideology_traditionalist_equal_movement_desc:0 "#lore This movement seeks to maintain traditional customs, viewing them as an extension of natural laws. Although they've accepted limited rights of women in certain aspects.#!"

 ideology_matriarchal:0 "Matriarchal"
 ideology_matriarchal_desc:0 ""#lore This group believes women should have political authority and that men should obey their mothers and wives.#!""

 ideology_pro_mechanim_freedom:0 "Pro Mechanim Freedom"
 ideology_pro_mechanim_freedom_desc:0 "This group believe in the saptience of mechanim and the need for freeFdom"

 ideology_machine_servitude:0 "Machine Servitude"
 ideology_machine_servitude_desc:0 "This group finds mechanim immensely profitable and the notion of their sentience ridiculous"

 ideology_anti_mechanim_trade:0 "Anti Mechanim explotation"
 ideology_anti_mechanim_trade_desc:0 "This group believes in the sentience of mechanim But is mostly concerned with the risk mechanim explotation poses to themselves"

 ideology_mechanim_messianist:0 "Mechanim Messianist"
 ideology_mechanim_messianist_desc:0 "This group believes that mechanim are fully sentient, but due to the fact that they have been awakened by a higher power. Despite this, they view the creation of more mechanim as abhorrent and unnatural." #Insyaan Mechanim may believe this - can have a different name for them



