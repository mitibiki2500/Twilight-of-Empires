l_english:
 regent_court:0 "Adeanic"
 regent_court_desc:0 "*The Regent Court (also known as the Cannorian Pantheon) is a collection of gods prominently worshipped within the continent of Cannor. Followers usually adhere to a specific patron deity but can otherwise worship and pay respect to many other gods within the pantheon. The pantheon is organized similar to a feudal court, with each deity taking on roles similar to various positions within said court.\nFirstborn of Castellos and god of good, honour and chivalry. Adean was squire to Agrados (the former god of war and Castellos' traitorous brother) but chose the side of good after his mentor's betrayal. Before the rise of Corin, Adean was the de-facto god of just and honourable wars and conflicts. With the reveal of Castellos's death, Adean started to take on a more active role in leading the Court."
 corinite:0 "Corinite"
 corinite_desc:0 "*The Corinites believe that Corin, the recently ascended god of war, is more fit to lead the Regent Court than Castellos' son Adean. They believe that Adean is too conservative and neglectful, and that the Regent Court must become a more active part of people's lives: darkness and tyranny must not simply be held back, it must be rooted out and destroyed."
 ravelian:0 "Ravelian"
 ravelian_desc:0 "Ravelianism is a monotheistic religion believing in one God, and that all other gods are but aspects or saints of this one God. Ravelianists are part-scholar, part-preacher, and believe in unraveling the secrets of the world to discover and spread its fundamental Truths. A large number of these revelations come from their research in the God Fragment, a strange shard-like device that communicates in a near-undecipherable language that claims that it is the last portion of divinity, and that the precursor elves stole God's divinity and turned it into what we know today as magic. A popular tenet in the Ravelian faith is their wish to use artificery to bring this stolen magic to all." 
 old_sun_cult:0 "Old Sun Cult"
 new_sun_cult:0 "Cult of Exemplary"
 the_jadd:0 "The Jadd"
 the_jadd_desc:0 "*Jadd is the name given to the newest denomination of the Bulwari Sun Cult. Founded by Jaddar Jexiszuir, they claim that all followers of the Jadd were Chosen by Surael to fight the Darkness, no matter their race. The main teachings of the faith are centered on a dualistic view of good and evil, and the eternal fight between light and darkness.\n\nThey believe that all gods are dead, with the last god, Surael, sacrificing himself to become the sun in order to keep the Malevolent Dark at bay. The followers of the cult seek to protect the Light fighting the Darkness by rejecting lies, sadness and despair, helping the needy and maintaining hope. The Jadd has declared war upon the Malevolent Dark and actively seeks to continue the war on Halann, while Surael continues the war in the sky.\n\nEveryone outside the Jadd is given the chance to convert and become a Chosen, and join the Fight, or declare themselves a servant of the Darkness."
 the_thought:0 "The Thought"
 the_thought_desc:0 "The Thought is the name given to the traditional gnomish philosophy, which emphasize sentience and intelligence as the most vital qualities a being can possess. Followers of this philosophy are uninterested by spirituality; instead focusing on creating and refining a "Theory of Everything" that explains exactly how reality works. Members are driven to observe and analyse the material world, in the hopes of being able to incorporate their discoveries to the doctrine in an act known as "Being touched by The Thought". This drive towards material analysis and innovation leads to followers of the Thought being well-suited to the pursuit of scientific advancement and the development of artifice; gnomish believers in the Thought were the first to combine magic and science into the art now known as artificery. Those who follow The Thought are usually very tolerant to other ways of thinking, as they both hold the product of other people’s intelligence in high regard, and take advantage of the opportunity to research into other cultures."
 godlost:0 "Godlost"
 godlost_desc:0 "The Godlost have denounced the shamanic ways of the goblin cults, instead they have forged their society into a rigid structure. They value family and country over religious practices and cosmic powers. A disciplined and loyal attitude is revered and any disobedience is harshly punished. They have structured this in a series of teachings that all are expected to adhere to, but some may put greater emphasis on one over the other."


 elikhetist:0 "Elikhetist"
 elikhetist_desc:0 "Followers of Khetism revere and worship the Khet, beings resembling humans with a cat's head who have god-like powers within their eponymous Kheterata, which they founded and have controlled since time immemorial through mandate-chosen mortal rulers. Followers are expected to abide by the tenants of the Khetarch, a figurehead chosen by the descendants of Elikhet, the first Khet.\n\nWhile all Khet are worshipped by Elikhetists, Elikhet is considered their one true god. Other deities are neither acknowledged nor denied, only their worship is forbidden."
 nirakhetist:0 "Nirakhetist"
 nirakhetist_desc:0 "Followers of Khetism revere and worship the Khet, beings resembling humans with a cat's head who have god-like powers within their eponymous Kheterata, which they founded and have controlled since time immemorial through mandate-chosen mortal rulers. Followers are expected to abide by the tenants of the Khetarch, a figurehead chosen by the descendants of Elikhet, the first Khet.\n\nNirakhetists revere Nirakhet, the mother of Elikhet, above all, referring to her as the Divine Mother. Their worship of Elikhet is not to the extent of their Elikhetist brethren; they see him as no more divine than his descendants (that is to say still very much so) after his descent from the Bulwari Pantheon. It was through this act that the Sorrow came to be, as the Divine Mother's parting tears fell to Halann, allowing Elikhet and his kin to always be close to her presence."
 aakhetist:0 "Aakhetist"
 aakhetist_desc:0 "*?The armies of Kheterata were once led by the powerful dragon Aakhet the Bronze in a string of great conquests from Kheterat to Bulwar. Those who adhere to Aakhetism still follow the teachings of Elikhet like all other khetists. However, while most khetists today consider Aakhet's reign to be that of a bloodhungry warmonger, akhetists believe the bronze dragon was the reincarnation of Elikhet himself and that he will return one day to lead their armies in glorious conquest." 
 xhazobkult:0 "Xhazobkult"
 xhazobkult_desc:0 "*?The Xhazobkult venerate the Xhazobine, messianic figures believed to be possessed by a Xhazob, a primal demonic spirit that Kult folklore holds were the progenitors of their race. Previous Xhazobines have been responsible for continent spanning invasions and their brutal achievements feature prominently in the oral traditions of many gnollish packs.\n\nStrict adherence to the Xhazobkult varies from region to region, for some packs it is a background piece of their folklore alongside animist beliefs and syncretic elements from neighbouring faiths. Others however take the Xhazobkult deadly seriously, with organised shamanic traditions, tithes of human sacrifice and active attempts to bring about the next Xhazobine to drown the world in blood."
 kvangahga:0 "Kvangahga"
 kvangahga_desc:0 "Kvangahga "The Way of Kvanga" in Gnollish, is an ancient religion that venerates Kvanga, a primordial goddess of rebirth, recycling and reforging. Kvangahga adherents believe that the goddess is the creator of the Gnolls, that when the world was young and wild she battled malevolent bestial spirits that were rampaging across Halann and reforged them, binding their reborn souls to the bodies of hyenas and making them creatures capable of virtue. Because of this belief, the Kvangahga view their Xhazobkult kin as wayward souls who have given in to their most base instincts, but who are capable of being "reforged" by Kvanga’s embrace.\n\nThe faith values efficiency, innovation and pragmatism and has a philosophy of "waste-not-want-not", taking things others would see as junk and putting them to good use. While most gnolls practice endocannibalism, the act has a special reverence for the followers of Kvanga, it is seen as a way of honouring the dead while not letting anything go to waste. The values of Kvangahga are well represented by the activities of mystical artisans known as Holy-Smiths or Rram Zelags in the east, and Carrion-Shepherds or Vog Mekza in the west. These holy men and women scavenge, trade and scrap items both natural and artificial to remake into magically-imbued tools for the faithful members of their pack to make use of. Through these acts of recycling they believe they carry out Kvanga's will, giving new purpose to unwanted things" 
 mother_akasik:0 "Mother Akasik"
 mother_akasik_desc:0 "The local deity of the Akasi peoples, Mother Akasik is both the literal and spiritual representation of the Akasik Mountains - she is a firm and just god, yet caring for those who call her lands home." 
 noukahi_pantheon:0 "Noukahi Pantheon"
 noukahi_pantheon_desc:0 "The Nouakahi Pantheon is a loosely connected collection of stories about heroic figures to the Vurebindu and Irsukuba people of Horashesh. The religion borrows heavily from neighbouring Fangaula, Nakavy Avo, and Khetist myths, meaning there’s very few unifying themes. Instead each tale has different teachings and meanings, often varying depending on the person telling the story."
 fangaulan_pantheon:0 "Fangaulan Pantheon"
 fangaulan_pantheon_desc:0 "The Fangaulan Pantheon venerates ancestors, totem animals, and primordials as divine "aspects" of God, governing the world after God's murder by the genies. The leader of the Pantheon is Aro, the half-genie hero and founder of the First Fangaulan Empire, who liberated humanity from genie tyranny. Each worshipper carries a talisman representing a guardian deity of the Pantheon, called a gris gris. Adherents believe these talismans imbue divine protections and must be recharged at a holy site weekly."
 nakavy_avo:0 "Nakavy Avo"
 nakavy_avo_desc:0 "Nakavy Avo, literally ‘Great Family,’ is a pantheon of gods worshiped predominantly by the Vyzemby of Fahvanosy. The gods and goddesses comprise a great extended family who are venerated through song, dance and merriment. Followers tend to choose a patron deity from the family that represents an ideal they wish to embody, though all are a part of the Great Family and are exalted as such."
 anzalkatsa:0 "Anzalkatsa"
 anzalkatsa_desc:0 "The Anzalkatsa faith is inseparable from the prophecy of the 333rd Empire. While there is much deliberation over the minutiae, all agree that it states all lizardfolk must eventually be united under the 333rd Empire - Khatalashya. The Final Empire shall rule over all lizardfolk, hold all the pillars and bring about eternal prosperity. It is the duty of every follower of Anzalkatsa to work to fulfill this prophecy and be ready to sacrifice everything they may have for this goal, and this expectation is laid equally across society. The peasantry, the merchants, the nobles and even the king must prostrate themselves to this end - it is their sole purpose.\n\nThe caretakers of this future are the naga, a rare mutation of lizardfolk set out by their appearance and great magical potential who form their own social class. They are found as advisors, scholars, priests, councilors - where there is power, and influence, so are they.\n\nDuty and competence are key virtues among Anzalkatsa, and the ordinary are expected to recognize their mediocrity and make way for rising stars. Those that cannot acknowledge their own limitations - or refuse to - are not long suffered by the nagas, who move to ensure they suffer a downfall of their own making. No right of birth grants immunity to this, and no king's throne can ever be truly stable against their machinations."
 zaradyrra:0 "Zaradyrra"
 zaradyrra_desc:0 "The Zaradyrra faith originates from the first Ashhana lizardfolk relieved of the blood curse by music. Originally it was thought that only music could relieve the blood curse, but as Ashhana society began to develop it was discovered that many forms of art could weaken the hold of the blood curse, and that creating art was a far more powerful remedy than consuming it. The first Ashhana capable of curing their fellows became the bards, and some would go on to found the earliest Ashhana noble houses. As more and more wild Ashhana were brought into society, the Zaradyrra faith truly came to exist in its modern form as a collection of practices used to manage the blood curse on a day-to-day basis. The weakest means of combating the blood curse is to simply consume the art of others which is enough to maintain normal decorum and is the lot of many of the lower classes. The next most effective is to create derivative art, not truly original or groundbreaking but not just a copy either, and this is said to give the creator a truly clear mind which is more capable. These Echoes are the lot of the nobility and the occasional privileged lower-class craftsman. The most effective means is truly original artistic creation - the sole domain of bards."
 beast_memory:0 "Beast Memory"
 sky_domain:0 "Sky Domain"
 sky_domain_desc:0 "Semayi'gera, or Sky Domain in Common is the dominant faith of the Mengi people. Sole in reverence is the god Amilak, whom the Mengi believe to be lord of the skies and bringer of rain. Shrines and monasteries dedicated to Amilak are found all across Mengi lands, and great temples are raised in the cities that are open to the skies where Rain-priests and Cloud-mages work to guide the rains to the people.\n\nAlongside Amilak, the Mengi also recognize various "God-Kin" who are believed to be the gods of other peoples, and Yrilak - Amilak's dark twin. Where Amilak rules in the lands of the Mengi, the lands of Yezel Mora are Yrilak's domain - once a verdant land, now rented to the hags via a dark bargain made during the Day of Ashen Skies in exchange for vile trinkets and baubles."
 rinta_seekers:0 "Rinta Seekers"
 rinta_seekers_desc:0 "Developed by the philosopher Kabil Hadni, Rinta Seekers preaches that the heavens are ruled by mortal souls who cast out wicked gods that now form the stars of the sky. They believe that heaven can only be entered by achieving enlightenment through contemplating the divine law of the world, and devote their lives to preparing for the contemplative journey to paradise they will undertake in the afterlife."
 ardimyan_rite:0 "Ardimyan Rite"
#  night_coven:0 "Night Coven"
#  night_coven_desc:0 "*Representing a wide range of folklore and shamanistic practices, from twisted versions of the troll's original giant myth to local cults worshiped by human tribes. The Night Coven unites all of this with the fundamental tenets that its worshippers live to serve the whims of their Night Hag masters, seeking boons and their favor in exchange for sacrifices and servitude."
 shadow_pact:0 "Shadow Pact"
 shadow_pact_desc:0 "The Shadow Pact represents a wide range of beliefs and practices that venerate the powerful beings of the Shadow Plane. Its followers believe that their souls go to the Shadow Plane after their demise, and so seek to gain favor with the powerful beings of that plane in order to have a better afterlife for both themselves and their loved ones. The practices and teachings of the Shadow Pact vary widely depending on the region its practicioners are from. These beliefs are all united around the concept that nothing is free in this reality, and that to receive a blessing, something must be sacrificed."


 ancestor_worship:0 "Ancestor Worship"
 ancestor_worship_desc:0 "The Dwarves have a great semi-mythologized history of various heroes, kings, and ancestors dating back to their creation by Halanna the Earth-Mother in the Tree of Stone caves. It is said that a hall of a hundred storytellers couldn't tell the full Dwarven folklore even if they had a hundred years to do it, and every hold has their own stories that are kept in carefully kept records. At one point, these stories were part of a wider belief in a dwarven pantheon, but most dwarves have lost their faith in the gods long ago as Aul-Dwarov fell, while the fall of that great empire only left behind more tragedies and tales of grandeur. While the great ancestors are worshipped and revered, they are not gods; they are reminders of what simple dwarven ingenuity, bravery and wisdom can achieve. Inspired by the heroes of old, many dwarves look towards the Dwarovar, All-Dwarves-Home, in order to reclaim the history and lands they have lost."
 dwarven_pantheon:0 "Dwarven Pantheon"
 dwarven_pantheon_desc:0 "The Dwarven Pantheon is the ancient faith of Aul-Dwarov, revolving around a familial clan of dwarven gods descended from Halanna, the Earth Mother."
 runefather_worship:0 "Runefather Worship"
 runefather_worship_desc:0 "*Millennia ago, the Runefather saved the Obsidian Dwarves from their peers, sacrificing his body and mind to carry his people deeper than any dwarves ever dug. It is rumoured that he now lays atop the Rune Throne, in the Obsidian Hall deep beneath the Serpentspine, where his shattered body lays, waiting to lead his people once again to the surface." 
 skaldhyrric_faith:0 "Skaldhyrric Faith"
 skaldhyrric_faith_desc:0 "Founded during the Dragonwake, the Skaldhyrric Faith is the dominant religion of Gerudia. They believe that reciting magical tales keeps Elkaesal the White, the dragon that plunged Gerudia into eternal winter, sleeping and at bay."
 mountain_watchers:0 "Mountain Watchers"
 mountain_watchers_desc:0 "The Trolls of Gerudia call themselves the Jartal Agefa, or Mountain Watchers, in their belief that they were left behind by the True Giants to guard Gerudia from interlopers and keep trespassers from breaching into the lands of the titans that they believe to be far north of even Far Gerudia."

 great_dookan:0 "Great Dookan"
 great_dookan_desc:0 "*A new zealous offshoot of the Old Dookan religion, they worship Dookan, which they call the Great Dookan, the creator of the orcish race. They believe that Dookan, who had fought in the Godswar of Cannorian myth, on Castellos' side no less, was wronged by the other gods and imprisoned in a treacherous act orchestrated by the Cannorian and Dwarven Pantheons.\n\nWorshippers of the Great Dookan believe that Korgus Dookanson is the son and champion of their god, and that to free their Dookan they must must wreak vengeance upon the followers of all other gods to wake Dookan and empower him to break his chains."
 old_dookan:0 "Old Dookan"
 old_dookan_desc:0 "The Old Dookan consists of the traditional worshippers of the orcish god Dookan. While their Great Dookan counterparts believe their god was wronged by and imprisoned by the Cannorian and Dwarven Pantheons and that their duty is to free Dookan and defeat all the gods and their followers, the Old Dookan faith focuses on the original tale: that their god was imprisoned by the treacherous dwarves for wanting a home, and that they were made to thrive, avenge their god, and eventually free him from his chains.\n\nThe Old Dookan faith denies Korgus Dookanson's claim that he is Dookan's heir, and rejects his holy war against all the gods (instead of just the dwarven ones). In their eyes he is an imposter who has twisted orcish beliefs."
 bulgu_orazan:0 "Bulgu Orazan"
 bulgu_orazan_desc:0 "Bulgu Orazan, which translates from orcish into common to 'Songs of Wise Men', is a philosophy that rejects the worshipping of Dookan and instead focusses on the lessons that can be learned from orcish history, which has been passed down orally for thousands of years and has in recent times also found its way into the written form. The philosophy and its Songs differ greatly per region, as the Songs the locals study pertain to prominent orcs of the past that were specific to the region, or those of other clans they have established contact with."
 kobold_dragon_cult:0 "Kobold Dragon Cult"
 kobold_dragon_cult_desc:0 "The Kobold Dragon Cult is a loose collection of dragon-worshipping sects within kobold society. It is said when the largest hoard of gold in the world is collected at the Dragonheights that the great ancient father of dragons, Malliath himself, will awaken."
 nimrithan:0 "Nimrithan"
 nimrithan_desc:0 "Originating in Khugdihr from a combination of human and kobold cultists, the Nimrithan venerates the dragon Nimrith the Red as the only being truly worthy of worship. In the present day, centuries after the slaying of their god, the last remaining followers of the faith are the various populations of Darkscale Kobolds scattered across the Serpentspine.\n\nThe Nimrithan faithful believe that all wealth must be directed towards Nimrith’s hoard, same as they did when the dragon lived. They hope that, once His hoard has grown enough, their beloved god will return to the world of the living to guide them once more." 

 drozma_tur:0 "Drozma Tur"
 drozma_tur_desc:0 "*A recent religion, the Drozmatur, meaning Followers of the Dragon, is a draconic cult who claim to receive visions from the 'last dragon' left in Aelantir."
 goblinic_shamanism:0 "Goblinic Shamanism"
 goblinic_shamanism_desc:0 "The original religion of most goblins it is a polytheistic and shamanistic religion containing elements of ancestor worship and animism. It is a very diverse and fluid religion, with each subgroup claiming their favourite gods are the most important and often taking over elements from the religions of subjugated and allied peoples. It is divided into multiple cults which are seen as equally valid by the people, equally wrong by the philosophers, and equally useful by the magistrate."
 pactseeker:0 "Pactseeker"
 pactseeker_desc:0 "Pactseekers are warlocks, who go out of their way to make contact with powerful archfeys, rendering their services to them in return for powerful magic. It is a generally accepted fact that all of these warlocks have dual loyalties, to both their clan and their fey patrons. The problems that this sometimes causes are generally offset by the tremendous power they can provide." 
 gods_of_the_taychend:0 "Taychendi Hero Cults"
 gods_of_the_taychend_desc:0 "The Taychendi believe that one can become a god through legendary actions in life. After their passing, these heroes rise to become gods through popular acclamation. The feats that allow someone to ascend to godhood vary considerably, but the most common way is through war and conflict. When one dies and does not ascend, they are instead reincarnated.\n\nCults have often formed around these god-heroes, their members emulating their god to both gain favor with them and potentially follow in their footsteps, in order to stand a better chance of ascending in this life or the next. These cults, both the secretive and popular kind, are very prominent in Taychendi society, and hold great religious and political influence."
 oren_nayiru:0 "Oren Nayiru"
 oren_nayiru_desc:0 "The Oren Nayiru are a radical, millenarian religion, born from the union of the Taychendi Cult of Vherenar and ideas adopted from the Bulwari Sun Cults, introduced to Taychend by the Jaherian Exemplars. The Oren Nayiru believe that the arrival of the Exemplars heralded the return of Nayiru, the last surviving member of a group of higher gods, and that a revolutionary war to overthrow the rulers of Taychend and radically reshape society and government is imminent.\n\nMilitantly abolitionist, the faith’s primary base is the slave, serf and peasant populations of Taychend. They are led by a class of warlord-priests, the Kavalali, who lead “cells”, secretive and compartmentalised Oren Nayiru communities – the most prominent of these are themselves led by the “High Kavalali”, the leaders of the faith."
 ynn_river_worship:0 "Ynn River Worship"
 ynn_river_worship_desc:0 "The old world was drowned by The Ending Flood when the Ynn's waters rose to engulf the whole world. All life flows from the sacred Ynn and must be respected, and the dead must be laid on the Ynn to depart to the beyond."
 rune_scribes:0 "Rune Scribes"
 rune_scribes_desc:0 "The Veykodans believe that every person’s soul is divided into two parts. One is primal, strong and fierce, while the other is calm, serene and patient. The belief in this Dual Soul, or "Edhen Minrud", in the Veykodan tongue, is central to their customs and traditions. It is believed that thanks to the Veykodans being more in touch with their primal soul than the neighboring Ynnics, they are able to draw their inner strength more effectively, and bond with the mighty beasts of the Veykodan wildlands. They utilize magical runic tattoos to enhance their combat power and bond with the sabertooth tigers and massive wooly rhinoceroses they use as mounts. The Veykodans also have a strong written tradition, where the Rune Scribes, tribal wise-men who inscribe runes not only on runestones but also on the bodies of their people, are tasked with keeping the memories and legends of ages long past."
 
 fey_court:0 "Fey Court"
 fey_court_desc:0 "The Fey Court is not a religion in the classical sense, as those who practice it do not consider the Fey consider divine or objects of worship. Rather, it is a collection of stories, traditions, rituals, and rites employed to avoid angering the Fey, and, ideally, coexist with them."
 eordellon:0 "Eordellon"
 eordellon_desc:0 "Originally based around tenets taught by the Fey of the Domandrod shortly after the Day of Ashen Skies, the Eordan peoples have made their own adjustments to these teachings throughout the years. The faithful of Eordellon are to uphold the values of each season and to faithfully serve the Domandrod Fey. Over the years the peoples have been splintered into favouring one season over the other, and few remain obedient to the Fey."
 united_season_court:0 "United Seasonal Courts"
 spring_court:0 "Spring Court"
 spring_court_desc:0 "Focused on the season of Spring, the Selpheregi are attuned with the spirit of regrowth that permeates throughout Eordand."
 summer_court:0 "Summer Court"
 summer_court_desc:0 "The Summer Court is centred around the Sarmadfar and Elarbarc, the warm waters of the south. Its worshippers are attuned to the call of the sea."
 autumn_court:0 "Autumn Court"
  autumn_court_desc:0 "The Tuathak favor Autumn above all else. The last season before the desolation of Winter, Autumn celebrates the good tidings of the harvest before."
 winter_court:0 "Winter Court"
 winter_court_desc:0 "Forced into the backwoods, the Winter Court must fight for its survival through the shared loyalty of the Snecboth."
 vechnogejzn:0 "Vechnogejzn"
 vechnogejzn_desc:0 "A religion of the Old Rzentur elves, Vechnogejzn is a ritualistic worship of an everlasting fire, created with Fey magics. Old Rzentur claim that long ago their people fought against the Frost King, who was determined to make their lands his domain of permanent winter. The other habitants of the forest, Fey of North Aelantir, had been a mix of help and hindrance to the elves, until one day the Changeling Prince came and gave Old Rzentur the gift of Vechnogejzn, the eternal flame. With it, the Old Rzentur defeated the Frost King, pushing his spawn far north.\n\nEach Old Rzentur tribe have their own Vechnogejzn, which they meticulously maintain to this day. The flame symbolises the tribe's unity, and is said to protect them from evil spirits and harm." 
 high_philosophy:0 "High Philosophy"
 high_philosophy_desc:0 "*High Philosophy is a religion that centres around the replication of the life of the ancient High Gods as the harimari found in the ancient temples scattered throughout Haless. They use the reliefs in these ancient temples as the backbone of how society should be structured and how one should live their life. However different philosophers had different impressions of what the reliefs meant, and so different schools of thought arose. Often these revolve around some sort of caste system, which has been a part of Raheni society since ancient times. "
 righteous_path:0 "Righteous Path"
  righteous_path_desc:0 "*The cultural beliefs prevalent throughout Haless, the Accretive Path is more of a collection of local folklore and superstition, primarily surrounding the life-force 'Chi'. It is said that the Accretive Path is like a river: it is different in each land and each people, but all part of the greater flow of life.\nThe cultural beliefs prevalent throughout Haless, the Transmutative Path is more of a collection of local folklore and superstition, primarily surrounding the life-force 'Chi'. It is said that the Transmutative Path is like a river: it is different in each land and each people, but all part of the greater flow of life."
 devouring_path:0 "Devouring Path"
 devouring_path_desc:0 "*There are certain techniques barred to practitioners of the Accretive and Transmutative Paths, certain powers that cannot be learned from them. These forbidden practices are maintained by sages of the Devouring Path, a religion born when the two righteous Paths met the cultural practices of the Oni. The Devouring Path holds three secret truths: that the spirit realm is Hell, that it is acceptable to take another’s Chi for oneself, and that eternal life is the meaning of enlightenment.\n\nThe Devouring Path uses §YChi§!, which cannot be gained over time by normal means. Instead, our sources of §YChi§! are:\nPillaging Capitals in wars: §G+50§!\nExploiting Development: §G+15§!\nCorrupting Temples: §G+10.0%§! Monthly Chi\n\nWe can make §YLefthand Oaths§! with our Chi, which have benefits that last for §Y20 years§!, but drawbacks which persist. When our ruler dies, all the oaths they made die with them, and our next ruler can make a new §YLefthand Oath§!."
 mystic_accord:0 "Mystic Accord"
 mystic_accord_desc:0 "The ancient and spiritual faith that used to dominate Haless before the rise of the Accretive and Transmutative Path, and is now only found in the place of its supposed origin, the Lupulan Rainforest plus small pockets of Bomdan and the Ringlet Isles. The Mystic Accord, in the simplest of terms, is the complete symbiotic union between people and the spirits scattered all across Haless. Unlike the Accretive and Transmutative Path which has evolved to separate man and spirit, the Mystic Accord holds on to the belief that humans and spirits are equal in terms of treatment. Many of the Great Spirits represent notable geographical locations or abstract features, such as the sky or the Lupulan Rainforest. The followers of the Mystic Accord depend on these Great Spirits, split between the 4 pantheons, to protect and guide the people throughout their lives, and perform many rituals to offer thanks to them."
 feast_of_the_gods:0 "Feast of the Gods"
 feast_of_the_gods_desc:0 "Known as Iskerag Vulshor in Ogrish, the Ogres believe that they gained their strength and stature from devouring their old gods, the True Giants, and that by devouring the strong and wise that they can inherit their power for themselves." 
 irdaeos_worship:0 "Irdaeos Worship"
 irdaeos_worship_desc:0 "Irdaeos is a deity worshipped by the various centaur clans of the steppes. A god of the sky, clouds, storms, wind, and movement, the centaurs believe that the forbidden plains are Irdaeos' domain on earth, and that he admired the struggles of the centaurs during their ancient exodus and gifted his domain to the centaurs to be their own. Beliefs and practices differ slightly between each clan, but all who worship him are united in the belief that Irdaeos overlooks the paradise known as Ik Magthaal in the afterlife. Only those who have truly honored his gift in life are permitted entry to Ik Magthaal in death, and thus most religious practices are concerned with this idea of either giving thanks or showing honor."
 kalyin_worship:0 "Kalyin Worship"
 kalyin_worship_desc:0 "Kalyin is the all powerful union of the Three Goddesses, embodying each of their domains and powers equally in a single figure, just as the Federation embodies the power of every city in the islands. She represents the ideal for our people, united in purpose and strength."
 goddess_follower:0 "Goddess Follower"
 yudunyovi:0 "Yudunyovi"
 yudunyovi_desc:0 "The Yudunyovi (or Worldy Gods) are a pantheon of gods rediscovered by Triunic settlers on the mainland. Led by the sun god Taqoshur and revealed by the dream god Soiti, the followers of this faith seek to reclaim their ancient legacy within the context of the modern world."
 moitsaliusko:0 "Möitsäliusko"
 moitsaliusko_desc:0 "The Kukatodic peoples of Yyl Möitsa believe that the great forests they live in are home to an uncountable number of local spirits. Every tree, every rock, every waterfall has a spirit, and they live and die, just as humans would, in their invisible world. The beliefs of Möitsäliusko, meaning "spirits of the forest", are varied, and they differ from tribe to tribe. One thing they have in common is reverence of wise crones, generally the oldest women in the village, who serve as a spiritual medium between the material world and the world of the spirits."
 elven_forebears:0 "Elven Forebears"
 elven_forebears_desc:0 "Originating during their time lost at sea, the elven people, who believed they were abandoned by their gods to allow the travesty known as the Day of Ashen Skies to happen, moved to revere their ancestors instead. It is said that each elf must attune themselves to a specific heirloom that will aid the future members of their clan."
 soise_vio:0 "Soise Vio"
 soise_vio_desc:0 "A set of philosophies guiding state policy for the next decade."
 #the_song:0 "The Song"
 raeldaeriach:0 "Raeldaeriach"
 raeldaeriach_desc:0 "Originally composed of clans of Eordan elves who rejected the Fey teaching of seasonal balance, the ruinborn of the Sarmadfar peninsula have turned away from the worship of the seasons altogether over their centuries of exile in the south. Instead, the Fograc practice a form of celestial divination and astrology called Raeldaeriach, seeking to ascertain the true nature of the world from the movement of the celestial bodies.\n\nDeviations in the normal patterns of the night sky such as comets are taken to be ill omens, while meteors are revered as fragments of the celestial truth that have descended to earth. Individuals are born under a dizzying array of zodiac signs and astrological portents that predict events that will happen in their lives, and many attempt to adhere to their foretold destinies with great zeal."
 dai_nadeilhil:0 "Dai'Nadeilhil"
 dai_nadeilhil_desc:0 "Dai'Nadeilhil, or "Story of Four Worlds" is the religion of the Haraf'ne people: the Ruinborn natives of the eponymous land in North Aelantir. The Dai'Nadeilhil is an oral tradition telling primarily of the Haraf'ne peoples' travels and experiences through the four worlds of Dchei'ilhil, Kosu'ilhil, Yaih'ilhil, and Keiin'ilhil: Dark World, Water World, Air World, and Fire World, respectively.\n\nTselayos, God of Water, is worshiped as the creator of the Haraf'ne after bringing them out of Dchei'ilhil to Kosu'ilhil and blessing them with souls and knowledge of agriculture to distinguish themselves from the dreaded Silent Watchers. Iishkeli, Goddess of Air, is praised for providing bounteous space for the Haraf'ne of old to rule Yaih'ilhil from their Six Flying Mountains, until eventually, the envious Di'iikunail, God of Fire, who could only create through destruction, brought low the Flying Mountains and razed all the worlds from the immense force of their downfall.\n\nIt is from this destruction that Di'iikunail forged a singular world to replace all others: Keiin'ilhil, a scorching, searing land of death. However, the Good Gods of Water and Air saw fit to create and give life to Ek'elas, God of Land, to serve as the guardian of the Haraf'ne in this new world. Ek'elas used great magics to shield and sustain the Haraf'ne until he withered and became the sands of the great Haraf Desert, ensuring the Haraf'ne would be able to tame their new home through his sacrifice."
 kalun_masks:0 "Kalun Masks"
 kalun_masks_desc:0 "The people of southeastern Haraf believe in the power of the Kalun masks, which are said to be embedded with spirits that have existed since time immemorial, and those spirits supposedly inhabit the body of the wearer. Adherents believe that protection from the spirit imbued masks will defend them from the Silent Watchers. The spirits too are protected, both by the material of the masks and the mask bearers. Wearers of the masks are also said to be taken over and aided by the spirit inhabiting the mask, often granting them supernatural strength and agility.\n\nTournaments are held among the Mayte and the best wrestler is awarded the King Mask which holds a king spirit which has existed since forever."
 ja_akaiin:0 "Ja'akaiin"
 jaakaiin_desc:0 "Ja’akaiin, meaning the Water Song in the Kooras tongue is the faith of the Kooras Ruinborn Elves. While some beliefs of the Kooras differ from one tribe to another, the main tenets of Ja’akaiin consist of animistic notions, belief in the Water World and the Dark World—opposed Worlds that compose the universe and in which either only Good or Evil can be found—and worship of water and Damestear. Other important beliefs include their unique Afterlife, in which the deads’ spirits integrate the manifestation of water the most in line with the person in life, and a shared cosmogony.\n\nIn Kooras myths, the All-World was created by the four great gods : Kseldos, god of the Water World, Dikaal, god of the Fire World, Etkal, god of the Stone World and Chkalii, goddess of the Air World. These Worlds were Good Worlds, and as such only Good could be found in them. The myths then talk about Dikaal’s treachery, where Dikaal forcibly created the Silent Watchers and corrupted his world into the Dark World. The other gods killed Dikaal in retribution, only for the Dark World to twist their hearts and a battle to break out between them. Finally, it is said that Kseldos, upon slaying his fellow gods in battle, saw the Dark World engulfing the All-World and in great sorrow decided to create the manifestations of water so the Water World could remain as a source of Good even after his inevitable death."
 eotomolaque:0 "Eotomolaque"
 eotomolaque_desc:0 "Epednar religion is centered around the worship of the Expanse’s Thunderbirds, which they believe were once a mythical people from whom the Epednar descend. Their creation myth talks about how these people, the Eotomolaque, were created alongside three other elven races by four cruel and oppressive gods. Then, it explains how three of these people, including the Eotomolaque, revolted against and killed their respective gods, absorbing their powers and becoming legendary beasts, who to this day guard their descendants. They believe the Eotomolaque became the Epednar, their totem animal being the Thunderbird. The Eotepn in turn became the Rzentur, their totem animal being the Dragon, and the Eotyr became the Chiunife and Haraf’ne, their totem animal being the Poskawa Whale. Meanwhile, it is said the people who stayed under the yolk and continued to worship their god of water became the Ynnics, who therefore don’t have a totem animal. A common Epednar practice is what they call the Thunder Dance, which consists of multiple physical and mental trials, as they sacrifice themselves for the community, in imitation of the Eotomolaque of old."
 decuvie:0 "Decuvie"
 dobondotist:0 "Dobondotist"
 dotimism_desc:1 "Boek belief teaches that every individual has a bond of kinship with a creature known as totem or dotim. Usually a spirit or animal, dotim poles in the likeness of one's dotim are crafted, sometimes out of stone or wood, sometimes through the repurposing of precursor statues or weapons, and they are gathered together into a building known as 'Dotimveb' with those of the rest of the tribe.\n\nA magically-charged dotim pole is known as Dobondotim and the power of multiple Dobondotim can be combined for rituals capable of affecting the fates of the whole tribe. The largest gathering of dotim poles is in a Precursor ruin known to the natives as Dobondotimveb, located near Boek'taraw.\n\nThis religion is shared by the Teira Ruinborn living in Dalaire, who are the forebears of Noruin Ruinborn."
 weeping_mother:0 "Weeping Mother"
 death_masks:0 "Death Masks"
 death_masks_desc:0 "While most of their kin follows the Kalun Masks, revering countless worlds and spirits and proclaiming the gods to have died in a cataclysm, the Mayte of the Quitl tribe follow a deity coming from the other side of the Rim: the God Without a Body, Cheshosh. They haven’t completely abandoned the ways of their people either, resulting in a unique collage of religious beliefs.\n\nThe Quitl believe the Limbless God was the god of the World of Darkness before being broken in a thousand pieces by Diceultl and wear infamous Death Masks as vessels to the scattered spirits of Cheshosh. To them, the masks not only store the spirits of past and future wearers but also serve as catalysts for their souls to rejoin Cheshosh in death, repairing the mind of the god, as well as to help screen their Sin from foreigners. Moreover, their Death Masks are crafted using the very bones of Silent Watchers and are not precisely carved or colored, giving them rough and 
 kinbond:0 "Kinbond"
 kinbond_desc:0 "The Kinbond is the name of the telepathic link shared by the Cursed Ones, and as such is central to their spiritual beliefs.\n\nThe Cursed Ones believe that the Great Creator shaped the world and populated it with the First People, only to realize that they were flawed, and thus decided to cleanse the world in a great frost. While most of the spirits agreed with the Great Creator, one of them, known as the East Spirit, rebelled against him, and selected those most worthy of the First People to be given part of his soul in the form of the Kinbond, so they would understand each other and not fight amongst themselves. The East Spirit then sacrificed himself to the Sun to stop the frost from consuming the world, his ashes falling on the land that would become the Forest of the Cursed Ones.\n\nThe chosen of the East Spirit would go on to form the Kins, each Kin having a shared soul going back to their progenitors from the time of the frost. The members of a Kin venerate their ancestors by reciting their tales and emulating them in their own lives, resulting in each Kin having its own epic retelling their history over the centuries."
 etchings_of_the_deep:0 "Etchings of the Deep"
 etchings_of_the_deep_desc:0 "All that is known of the Ice Sleepers' religion (insofar as they can be said to have one) is inferred from the rock drawings they paint, just above the high tide line on rocky cliff faces throughout the Broken Sea. These drawings often show scenes of sea life, though they regularly depict creatures that do not fit the descriptions of any known species. Scenes of hunting or feasting are also common.\n\nThe strangest of these rock paintings seems to appear repeatedly, with very little variation: It is a scene of two huge humanoid creatures fighting, each possessing a halo of 6 stars, and is usually found surrounded by small piles of fish skulls and bones. As the Ice Sleepers do not seem capable of speech, it has never been conclusively determined what this image is meant to depict."
 leechfather:0 "Leechfather"
 leechfather_desc:0 "The Leechmen of the Dens believe that a great, giant Leechfather sleeps underneath the swamp, and that unless they sate His thirst for blood by throwing living sacrifices into the Dens for Him to devour, then the Father will awaken from his slumber to suck the whole world dry."
 senanset:0 "Senanset"
 senanset_desc:0 "Senanset or "Song of the Ancestors" is the folk belief of the Soruinic Ruinborn, centered on emulating the deeds of great ancestors who performed incredible feats. Soruinic Ruinborn are organized in tribal units known as Danatsgos, each having its oral stories and songs celebrating the deeds of their ancestors to recite throughout the day.\nFestive songs can be heard from the villages scattered all across Soruin's landscape, which then becomes eerily quiet during the evening and night - as to not invoke the attention of the jungle."
 tswohvwohii:0 "Tswohvwoh'íi"
 tswohvwohii_desc:0 "Tswohvwoh'íi is the title of the goddess of the Effelai jungle, which, at times, creak to the wind in what some see as the unknowable song of the jungle. It is believed by the Effe'i and Laí'i people that Tswohvwoh'íi needs song in return to remain satisfied, and perform regular 'sacrifices' of song and of blood to ward off and keep the jungle goddess happy and silent.\nThe Parura, who refer to the goddess as Chahinanito, place a greater focus on ruinborn sacrifice and the more deadly aspects of the jungle."
 #chahinanito:0 "Chahinanito"
 #chahinanito_desc:0 "Chahinanito is the Parura name for Tswohvwoh'íi. Worship of the jungle goddess is very similar in Leechden to the rest of Effelai, but with a greater focus on ruinborn sacrifice and the more deadly aspects of the jungle. Due to their close proximity with the monstrous leechmen, the Chahinanito hold the sacrifice of such a beast as the most worthy of rituals."
 song_servants:0 "Song Servants"
 song_servants_desc:0 "A term used for those seen as enthralled by the jungle's "song" (made mostly by the movement and creaking of the trees in the wind). Unlike other faiths like the Tswohvwoh'íi, the Song Servants sing no songs back, nor do they sacrifice to appease the jungle - instead they sway and move as one with the jungle as it sings in an almost trance-like state. Followers of this faith range from the Seedthralls that the Effelai has claimed as its own to ordinary ruinborn who believe embracing, not warding, the jungle is the way forward."
 rioqay_diu:0 "Rioqay Diú"
 rioqay_diu_desc: "Rioqay Diú, meaning “Image Gods” in Amadian, is a pantheonic faith encompassing various Amadian beliefs and rituals. Common amongst all Rioqay Diú doctrines is the worship of the creator god Ñawsayachaer and the belief in the Fragmentation, a catastrophe at the millionth day of existence which divided all reality. The gods were fragmented into “visages”, taking up different aspects of the creation their parent god originally ruled over. Ñawsayachaer himself was torn apart into the God of the Sun, the Goddess of the Moon and the Emissary of the Beyond, creating an imbalance in the fundamental laws of the world."
 mazhthramazh:0 "Mazhthramazh"
 mazhthramazh_desc:0 "Devandi faith, while animistic, is also based on following the example of their legendary leader Munakles, who rose up in defiance and freed the ancestors of the Devandi guiding them west to the Mteibas mountain valley.\n\nThe Mteibhar believed the valley was a sacred place, and spent their lives protecting it. So long as the Mteibhar properly revered it, the spirit of the valley would help them maintain their hard-earned freedom against trespassers.\n\nThe tribes come together periodically for remembrance gatherings where the elders recount the deeds and virtues of Munakles. Other than the protection of the valley, other important virtues are remembrance, betterment and trying to achieve peace where possible."
 askaeorg:0 "Askaeorg"
 askaeorg_desc:0 "Devandi faith, while animistic, is also based on following the example of their legendary leader Munakles, who rose up in defiance and freed the ancestors of the Devandi guiding them west to the Mteibas mountain valley.\n\nThe Chendhyans took a proactive approach in preserving this freedom, and believed that the only way to protect theirs is by taking from others until they weren’t a threat. Leaving the safety of the valley they came across many great felines - mountain lions, cheetahs and jaguars - and they sought to create a bond with these beasts. Today Chendhyans ride and hunt together with the big cats, believing that so long as they prove to be as fierce and independent as the felines, they will be accepted by the animals in turn, and so they spend their days raiding and taking from their neighbors so that their freedom may be kept safe.\n\nAlthough raiding is the most common practice of their faith, trading and exchanging of knowledge isn't frowned upon as long as it is an equivalent exchange."
 gotiriei:0 "Gotiriei"
 gotiriei_desc:0 "Gotiriei tradition holds that all but one of the divine True Kings died in the last of several titanic battles with the forces of Oblivion, which were sealed away at the creation of the universe and subsequently leaked back into Halann through the folly of elfkind. As his brethren died around him to avert the most recent Great Imbalance, the Last True King blessed a simple shepherd boy with sacred kingship at the peak of the Rigoti, the most serene peak on Halann, and continues to guide and empower Eltibhar kings to this day. Eltibhar kings must thus seek the Last True King’s blessing, be tested and prevail, before they are considered truly great.\n\nAt first glance, such a mystical eschatology might seem utterly at odds with its neighbour kheions. Yet both creeds are intensely concerned with proper governance and the character of a just ruler, and both creeds believe that little is left to the elves of Halann save their own ingenuity. All but one of the True Kings is dead, and if we are to avert Oblivion, we must take up their mantle."


 evikeraat_cult:0 "Evikeraat Cult"
 neokttareum:0 "Neokttareum"
 neokttareum_desc:0 "The religious practices of Gowon, a shamanistic faith worshipping one's ancestors along with a wide variety of powerful spirits known as Jongsi. The leaders of the faithful are shamans known as Jongsoeta who have been partially possessed by a lesser Jongsi, gaining mystical power such as prophetic visions and the ability to speak to the dead."
 umun_omi:0 "Umun Omi"
 umun_omi_desc:0 "The faith (translated to One Soul in Common) of the Besholgi people in Moduk based around the belief of one Supreme Spirit, who long ago split his soul to create the world including humans, animals, and spirits to inhabit the world. When a human dies, it is believed their soul returns to the Supreme Spirit while their body becomes a husk, and eventually every soul on Halann will return to their creator. The faith has an emphasis on hunting, and they believe it is a ritual in order to help revive the Supreme Spirt with the kill an animal. There is a tiny minority of Besholgi who become mercenaries in the south, with the theory that they help revive the Supreme Spirit by killing others in the battlefield, although they are for the most part exiled from their tribe for their radicalism."
 un_khudai:0 "Un Khudai"
 un_khudai_desc:0 "Un Khudai can be roughly translated into the common tongue as “One Harmony.” At its core is a set of culturally entrenched ecological traditions focused on maintaining the cycle of the world through the framing of the fivefold compass. Earth reveals metal, which begets water, which feeds the forests, which in turn fuels the fire, which seeds the earth once more. The former is but a facet of the grander fivefold compass, which, in its totality, defines the movements, creation, and destruction of those elements. Un Khudai stresses that this cycle must be maintained, for should the Khudi grow beyond their means and break the Harmony of the Land, the spirits will bury their civilization, and return them to epochs long past."
 levaajan:0 "Levaajan"
 levaajan_desc:0 "A disorganized faith held by the Rünsukhi of the desert, arising after the Day of Ashen Skies hit Haless. The religion is mostly built upon the idea of praying to the Supreme Spirit shared with the Besholgi people up north, but the difference is instead of hunting rituals like the Besholgi, the Rünsukhi use prayer to worship the Supreme Spirit and ask for salvation. Due to the proximity with face stealing spirits, the Rünsukhi build a shelter for safety and pray to the Supreme Spirit, due to their belief that if a face stealing spirit kills a person, that soul can't be returned to the creator. The Rünsukhi ultimately hope that one day their cities under the desert will arise again, which is what keep them tied to the land, and await for their eventual return to a civilization."
 
