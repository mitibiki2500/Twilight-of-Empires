l_english:
  amendment_model_elf_regiments:0 "Model Elf Regiments"
  amendment_model_elf_regiments_desc:0 "Despite his best efforts, Faevir Vaytcothyd was unable to completely transform the disparate Wood Elven forces into a truly modern cohesive force. Decades of political conflict were not entirely in vain though. While the machinations and traditions of the Great Salla linger, Faevir could retire knowing his successors had at least a proper, if smaller than desired, professional army at their disposal."
  amendment_salla_saisth:0 "Salla Saisth"
  amendment_salla_saisth_desc:0 "Once seen as simply an inconsequential byproduct of compromise between central government and the Great Salla, the famed Sàisth (Rangers) of Cyranvar have become a self-organizing force only nominally under the control of the state. Often deploying without orders, these autonomous units leverage their wide array of skills to remain on the field indefinitely, often only returning when their self-appointed mission was deemed complete."