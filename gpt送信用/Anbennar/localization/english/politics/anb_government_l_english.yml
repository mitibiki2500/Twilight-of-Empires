l_english:
 
 #Monarchy
 gov_ynnic_lordship:0 "Lordship"
 gov_ynnic_lordship_desc:0 "This is a [concept_government] ruled by a [Concept('concept_ruler','$RULER_TITLE_LORD$')] representing lower Ynnic nobility."
 RULER_TITLE_LORD:0 "Lord"
 RULER_TITLE_LADY:0 "Lady"
 gov_gray_empire:0 "Gray Empire"
 gov_gray_empire_desc:0 "This is a [concept_government_type] where the power rests with the [Concept('concept_ruler','$RULER_TITLE_GRAY_EMPEROR$')] or [Concept('concept_ruler','$RULER_TITLE_GRAY_EMPRESS$')]."
 RULER_TITLE_GRAY_EMPEROR:0 "Gray Emperor"
 RULER_TITLE_GRAY_EMPRESS:0 "Gray Empress"
 gov_onyx_monarchy:0 "Onyx Monarchy"
 gov_onyx_monarchy_desc:0 "This country is ruled by the [Concept('concept_ruler','$RULER_TITLE_ONYX_KING$')] from the Bone Citadel where a rift to the Shadow Plane lies, claiming legitimacy from pre-colonial Cheshoshi traditions. While this title was historically claimed by the Neratic priesthood and its leaders, it has been made into a secular hereditary title now."
 RULER_TITLE_ONYX_KING:0 "Onyx King"
 RULER_TITLE_ONYX_QUEEN:0 "Onyx Queen"
 gov_akalate:0 "Akalate"
 gov_akalate_desc:0 "This is a [concept_government] where the [concept_country] is ruled by an [Concept('concept_ruler','$RULER_AKAL$')]."
 RULER_AKAL:0 "Akal"
 RULER_AKALA:0 "Akala"
 gov_matriarchy:0 "Matriarchy"
 gov_matriarchy_desc:0 "Monarchy where women hold all positions of power."
 RULER_MATRIARCH:0 "Matriarch"
 gov_queendom:0 "Queendom"
 gov_queendom_desc:0 "Monarchy where women hold all positions of power."
 gov_eternal_empire:0 "Eternal Empire"
 gov_eternal_empire_desc:0 "This is a [concept_government] where the [concept_country] is directly ruled by the immortal demigod Horutep."
 gov_nakari_triple_alliance:0 "Nakari Triple Alliance"
 gov_nakari_triple_alliance_desc:0 "This is a [concept_government] ruled by the tightly bound, but technically informal, union of the three branches of the ancient Mudaliar Family – once divided, now jury-rigged back together. Together, they dominate the [concept_taychendi_warlords] and the Attemutil city-states they rule."
 gov_attemutil_warlord_kingdom:0 "Attemutil Kingdom"
 gov_attemutil_warlord_kingdom_desc:0 "This is a [concept_government] where the power is concentrated in a single [Concept('concept_ruler','$RULER_TAYCHEND_WARLORD_KING$')], who relies on military strength to dominate the [concept_taychendi_warlords] and the Attemutil city-states they rule."
 RULER_TAYCHEND_WARLORD_KING:0 "Warlord-King"
 RULER_TAYCHEND_WARLORD_QUEEN:0 "Warlord-Queen"
 gov_attemutil_warlord_state:0 "Attemutil Warlords"
 gov_attemutil_warlord_state_desc:0 "This is a [concept_government] where the power is concentrated in a single [Concept('concept_ruler','$RULER_TAYCHEND_WARLORD$')], who relies on military strength to dominate the [concept_taychendi_warlords] and the Attemutil city-states they rule."
 RULER_TAYCHEND_WARLORD:0 "Warlord"
 gov_amben_imperial_monarchy:0 "Ambhen Imperial Monarchy"
 gov_amben_imperial_monarchy_desc:0 "A reforged [concept_ambhen_empire], this is a [concept_government] where executive power rests in the [Concept('concept_ruler','$RULER_RULER_AESRIALTOR_ANDEIOS$')], who has done away with the title of Kylakas and rules as a hereditary monarch. Legislative power rests in the unicameral Synkletos."


 #Presidential Republic
 gov_magnate_council:0 "Magnate Council"
 gov_magnate_council_desc:0 "This is a [concept_government] where the [concept_country] is ruled by a council of powerful oligarchs."
 gov_supreme_hierarchy:0 "Supreme Hierarchy"
 gov_supreme_hierarchy_desc:0 "This is a [concept_government_type] where the country is organized in stratified administrations ruled by a [Concept('concept_ruler','$RULER_HIERARCH$')], chosen by a complex series of examinations."
 gov_democratic_hierarchy:0 "Meritocratic Hierarchy"
 gov_democratic_hierarchy_desc:0 "This is a [concept_government_type] where the country is ruled by a [Concept('concept_ruler','$RULER_HIERARCH$')], picked by the people from the most skilled candidates."
 RULER_HIERARCH:0 "Hierarch"
 gov_guild:0 "Guild"
 gov_guild_desc:0 "This is a [concept_government] where the [concept_country] is ruled by a monopolistic guild."
 gov_private_company:0 ""
 RULER_TITLE_GUILDMASTER:0 "Guildmaster"
 RULER_TITLE_DIRECTOR:0 "Director"
 RULER_TITLE_DIRECTOR_GENERAL:0 "Director-General"
 gov_colonial_hierarchy:0 "Colonial Hierarchy"
 gov_colonial_hierarchy_desc:0 "This is a [concept_government] ruled as a colonial subdivision of the Hierarchy system with little autonomy."
 gov_command_warlord:0 "Warlord State"
 gov_command_warlord_desc:0 "This is a [concept_government_type] ruled by an impulsive [Concept('concept_ruler','Warlord')]"
 gov_eunuch_republic:0 "Eunuch Republic"
 gov_eunuch_republic_desc:0 "This is a [concept_government_type] where the country is ruled by a class of eunuch bureaucrats dating back to the days of Harimar."
 gov_blackpowder_republic:0 "Blackpowder Republic"
 gov_blackpowder_republic_desc:0 "This is a revolutionary [concept_government] advocating for the rejection of the magical elite."
 gov_two_kinah_conclave:0 "Two Kinah Conclave"
 gov_two_kinah_conclave_desc: "This is a [concept_government] that results from the breakdown of the ancient Kinah system, and the Haraf'ne Republic being split between the centralist Alas'gasidi and reformist Leeti'haàt."
 gov_tropaicost:0 "Tropaicóst Republic"
 gov_tropaicost_desc:0 "This is a [concept_government] where the [concept_country] is ruled by the illustrious Síl Presidento."
 RULER_TITLE_TROPAICOST:0 "Síl Presidento"
 gov_matriarchy_republic_president:0 "Presidential Matriarchy"
 gov_matriarchy_republic_president_desc:0 "Republic where women hold all positions of power."
 gov_kheinisi_republic:0 "Kheinisí Republic"
 gov_kheinisi_republic_desc:0 "This is a [concept_government] where executive power rests in the [Concept('concept_ruler','$RULER_KYLAKAS$')], both head of state and government. Most Kheionai republics rest legislative power in a unicameral Synkletos, or council."
 RULER_KYLAKAS:0 "Kylakas"
 gov_amben_empire:0 "Ambhen Empire"
 gov_amben_empire_desc:0 "A reforged [concept_ambhen_empire], this is a [concept_government] where executive power rests in the Kylakas, who has taken on the diplomatic title of [Concept('concept_ruler','$RULER_AESRIALTOR_ANDEIOS$')], or Emperor of Andeios, in emulation of the Precursors and to match their Cannorian rivals. Legislative power rests in the unicameral Synkletos."
 RULER_AESRIALTOR_ANDEIOS:0 "Aesrialtor-Andeios"
 RULER_AESRIALTEIRA_ANDEIOS:0 "Aesrialteira-Andeios"
 gov_kheiosian_league:0 "Kheiósian League"
 gov_kheiosian_league_desc:0 "This is a [concept_government] consisting of a federal league between the seven Kheions of Alecand. The Kheions, retaining significant autonomy and their own rulers, who each have a seat on the governing council, elect a [Concept('concept_ruler','$RULER_DEGA_KYLAKAS$')] from their ranks."
 RULER_DEGA_KYLAKAS:0 "Dega-Kylakas"
 gov_epaidia:0 "Epaidía"
 gov_epaidia_desc:0 "This is a [concept_government] ruled as a province of the Republic of Ameion, governed by a [Concept('concept_ruler','$RULER_RIARCHIS$')]. Although enjoying significant internal autonomy, they are normally dominated by the Ambhen capital. Recent circumstances has given this Epaidía considerable autonomy."
 RULER_RIARCHIS:0 "Riárchis"

#Parliamentary republic
 gov_artificer_triumvirate:0 "Artificer Triumvirate"
 gov_artificer_triumvirate_desc:0 "This is a [concept_government] where the [concept_country] is ruled in accordance to the meritocratic ideals of artificers, and where three Triarchs represent the interests of gnomes, kobolds and goblins respectively."
 RULER_DIRECTOR_OF_FOREIGN_AFFAIRS:0 "Director of Foreign Affairs"
 gov_federal_concord:0 "Federal Concord"
 gov_federal_concord_desc:0 "This is a [concept_government] where the different constituent states wield executive power simultaneously, and the people are represented through a common assembly wielding most of the power."
 gov_matriarchal_republic_parlament:0 "Matriarchal Republic"
 gov_matriarchal_republic_parlament_desc:0 "Republic where women hold all positions of power."
 gov_lake_federation:0 "Lake Federation"
 gov_lake_federation_desc:0 "This [concept_government] is a centralized parliamentary federation which evolved from the numerous once-independent republics upon the Triunic Lakes."

 #Theocracy
 gov_jadd_empire_theocracy:0 "Jadd Empire"
 gov_jadd_empire_theocracy_desc:0 "This is a [concept_government] where the [concept_country] is ruled by the head of the Jadd faith, the [Concept('concept_ruler','$RULER_TITLE_DIVINE_HERALD$')]."
 RULER_TITLE_DIVINE_HERALD:0 "Divine-Herald"
 gov_dragon_dominion:0 "Drozmagospos"
 gov_dragon_dominion_desc:0 "This is a [concept_government] where the [concept_country] is ruled by the emissary of the Dragon-God Varlengeilt."
 RULER_TITLE_GOSPODH:0 "Gospodh"
 RULER_TITLE_GHOSPA:0 "Ghospa"
 gov_lingyuk_huszien:0 "Spirit Rule"
 gov_lingyuk_huszien_desc:0 "This is a [concept_government] where the [concept_country] is directly ruled by the great spirit Huszien."
 RULER_TITLE_GREATSPIRIT:0 "Great Spirit"
 gov_theocratic_onyx_monarchy:0 "Theocratic Onyx Monarchy"
 gov_theocratic_onyx_monarchy_desc:0 "This country is ruled by the [Concept('concept_ruler','$RULER_TITLE_ONYX_KING$')] from the Bone Citadel where a rift to the Shadow Plane lies, claiming legitimacy from pre-colonial Cheshoshi traditions. The power of the Neratic priesthood has been restored, and the head of the clergy doubles as the head of [concept_government] once more."
 
 #Magocracy
 gov_absolute_magocracy:0 "Absolute Magocracy"
 gov_absolute_magocracy_desc:0 "This is a [concept_government] form where the power rests completely with the [Concept('concept_ruler','$RULER_HIGH_MAGE$')]."
 gov_magocratic_oligarchy:0 "Magocratic Oligarchy"
 gov_magocratic_oligarchy_desc:0 "This is a [concept_government] where the [concept_country] is ruled by a class of rich and powerful mages."
 gov_magocratic_democracy:0 "Magocratic Democracy"
 gov_magocratic_democracy_desc:0 "This is a [concept_government] that is ruled by mages who are [Concept('concept_election','$concept_elected$')] by the people."
 RULER_HIGH_MAGE:0 "High Mage"
 gov_dakocracy:0 "Dakocracy"
 gov_dakocracy_desc:0 "This is a [concept_government] form where the power rests completely with [Concept('concept_ruler','$RULER_DAK$')]."
 RULER_DAK:0 "Glorious Mage"



 #Stratocracy
 gov_stratocracy:0 "Stratocracy"
 gov_stratocracy_desc:0 "This is a [concept_government_type] where the [concept_country] is ruled by the military.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 
 #Hive Mind
 gov_hivemind:0 "Hivemind"
 gov_hivemind_desc:0 "This is a [concept_government_type] representing not a government as most nations understand it, but a singular consciousness. The [Concept('concept_ruler','$RULER_HIVEMIND$')] is not a true leader but instead a simple personification of a non-humanoid entity."
 RULER_HIVEMIND:0 "Hivespeaker"