 #Dwarves
 ideology_heritage_guildship:0 "Heritage Guildship"
 ideology_heritage_guildship_desc:0 "Traditionally the historical counterbalance to the aristocratic nobles and the ruling government, dwarven guilds operate as relatively meritocratic operations that see to it that their members are taken care of, and that they are able to operate with the support of the government. Though they are moderately progressive, they oppose their ancient rights being infringed and are staunch supporters of traditional dwarven magic."


 #Overclan
 ideology_the_voltoj_machine:0 "The Voltoj Machine"
 ideology_the_voltoj_machine_desc:0 "A machine is what the Voltoj strive for the state to be, It should run without the intervention of the people, for this we need the most skilled and loyal of people in the helm with the power to make decisions and changes be it economical or societal, and no one is more skilled or loyal than the Voltoj"
 ideology_char_the_voltoj_machine:0 "The Voltoj Machine"
 ideology_char_the_voltoj_machine_desc:0 "This Leader firmily believes in the principles of The Voltoj Machine"

 #Ynn
 ideology_ynnic_chivalry:0 "Ynnic Chivalry"
 ideology_ynnic_chivalry_desc:0 "Knightly lords ruling their own fiefs with little oversight have dominated Ynnic society for centuries, this group believes such traditions should remain."

 #Orcish Ideologies
 ideology_kratocratic:0 "Kratocratic"
 ideology_kratocratic_desc:0 "This group believes that 'might makes right', and believes that only the strong of the nation have the right to lead the nation."
 ideology_sam_karash:0 "Sam'Karash"
 ideology_sam_karash_desc:0 "This group follows the belief of Torrak Soulsong's “Sam'Karash” or the Seven Strengths.  They espouse that strength takes seven forms and favor modernizing and centralizing the nation under these rational lines so that citizens of merit may flourish."
 ideology_bazranic:0 "Bazranic"
 ideology_bazranic_desc:0 "This group believes success can be earned through the military service in armed forces of Grombar, and prefer it to be a small elite force, opposed to letting masses in the ranks of soldiers."

 #Cyranvar Ideologies
 ideology_cyranvar_salla_hierarchic:0 "Salla Hierarchic"
 ideology_cyranvar_salla_hierarchic_desc:0 "This group favors maintaining a salla (clan) hierarchy through traditional Wood Elven norms and practice."
 ideology_cyranvar_swylduin:0 "Swylduin (Bloodbound)"
 ideology_cyranvar_swylduin_desc:0 "This group seeks to promote and reward individuals based on blood and kinship first and foremost."
 ideology_cyranvar_anti_industrialist:0 "Anti-Industrial"
 ideology_cyranvar_anti_industrialist_desc:0 "This group is wary of industry and artifice due to its disruption and destruction to the environment."
 ideology_cyranvar_syncretic:0 "Syncretic"
 ideology_cyranvar_syncretic_desc:0 "This group embraces a wide array of religious beliefs and moral orders. Suppression of these faiths and practices is seen as a threat and unacceptable."
 ideology_cyranvar_athyr:0 "Athyr (Changers)"
 ideology_cyranvar_athyr_desc:0 "This group actively seeks to replace the old Wood Elven traditions of over clanship and social connections with ones that promote merit and industry."

 #Soyzkaru Cartel Ideologies
 ideology_soyzkaru_cartel_grind_purists:0 "Grind Purists"
 ideology_soyzkaru_cartel_grind_purists_desc:0 "This group favors ensuring maintaining the old order of the Grind for maximum profits."
 ideology_soyzkaru_cartel_comrade_capitalists:0 "Comrade Capitalists"
 ideology_soyzkaru_cartel_comrade_capitalists_desc:0 "This group has found that friendship between the state and business is much better for the bottom line. They support ensuring that relationship remains deep."
 ideology_soyzkaru_cartel_grind_radicals:0 "Grind Radicals"
 ideology_soyzkaru_cartel_grind_radicals_desc:0 "This group zealously believes in pushing the Grind to exploit every possible angle of society and ensure the Line always goes up."
 ideology_soyzkaru_cartel_goblibertarians:0 "Goblibertarians"
 ideology_soyzkaru_cartel_goblibertarians_desc:0 "This group knows that each person is responsible for their own fate and opposes any public services. It’s their fault they are poor (and lazy)."
 ideology_soyzkaru_cartel_contract_defenders:0 "Contract Defenders"
 ideology_soyzkaru_cartel_contract_defenders_desc:0 "This group is determined to ensure the Contract which commissioned their position remains untouched."
 ideology_soyzkaru_cartel_trickle_down_faithfuls:0 "Trickle-Down Faithfuls"
 ideology_soyzkaru_cartel_trickle_down_faithfuls_desc:0 "This group embraces their employers’ promises of wealth “trickling down”. As long as they get paid enough, they don’t actually care."
 ideology_soyzkaru_cartel_bouncers:0 "Bouncers"
 ideology_soyzkaru_cartel_bouncers_desc:0 "This group is set on ensuring that anyone and everyone beneath them knows their place, partly for the pay and partly for the love of the game."

 #Religion Specific
 ideology_ravelian_moralist:0 "Ravelian Moralist"
 ideology_ravelian_moralist_desc:0 "#lore The Ravelian Church believes that magic should be spread to the masses through regulated artificery.#!"
 ideology_scholarly:0 "Scholarly"
 ideology_scholarly_desc:0 "#lore This group believes that fundamental truths can be found through study and research.#!"
 ideology_corinite_moralist:0 "Corinite Moralist"
 ideology_corinite_moralist_desc:0 "#lore Corin's faithful believe that worthy rulers have a divine mandate to rule.#!"
 ideology_corinite_patriarchal:0 "Corinite Partriachal" # TODO - name this better as they're not patriachs at all!
 ideology_corinite_patriarchal_desc:0 "#lore Corin's faithful believe that worthy rulers have a divine mandate to rule.#!"
 ideology_adeanic_moralist:0 "Adeanic Moralist"
 ideology_adeanic_moralist_desc:0 "#lore The Adeanic Regent Court believes that some races are the Spawns of Agrados.#!"
 ideology_whiterose_piety:0 "Whiterose Piety"
 ideology_whiterose_piety_desc:0 "#lore Born from the merging of the Lencori worship of Adean and Minara, the Whiterose promoted knightly ideals, joy and celebrations. With the revelation of the death of Castellos in 1518, the Whiterose Court experienced a resurgence. Its beliefs bled into and merged with those of those of the Court, as Adean ascended to his rightful throne and the Lencori rose with him.#!"
 ideology_minaran_equality:0 "Minaran Equality"
 ideology_minaran_equality_desc:0 "#lore The Goddess of Celebrations is not only revered for her carnal portfolio, but also as a guardian of vulnerable women and men. Minara is the patron of free love and lust, but does not condone those who would abuse this and bring harm instead of consensual pleasure. The Minaran Temple vows to protect all who need it, and acts as righteous agents against sexual predators.#!"
 ideology_reformed_yrw:0 "Reformed Ynn River Worship"
 ideology_reformed_yrw_desc:0 "This group seeks to maintain a society based on order and tradition."
 ideology_voice_of_varlengeilt:0 "Voice of Varlengeilt"
 ideology_voice_of_varlengeilt_desc:0 "This group believes that the main purpose of our country should be to follow the will of the dragon-god Varlengeilt."
 ideology_seasonal_courts:0 "Season Fey Court"
 ideology_seasonal_courts_desc:0 "This group wants our society to conform to the will of the seasonal fey courts."
 ideology_seasonal_courts_unfied:0 "United Seasons Fey Court"
 ideology_seasonal_courts_unfied_desc:0 "This group wants our society to conform to the will of the seasonal fey courts."
 ideology_jadd_moralist:0 "Jadd Moralist"
 ideology_jadd_moralist_desc:0 "The adherents of the Jadd believe society should be shaped according to the tenets of the Jadd faith."
 ideology_jaddari_teachings:0 "Jaddari Teachings"
 ideology_jaddari_teachings_desc:0 "The adherents of the Jadd hold to the traditions of the Jaddari and their harpy and Masnsih allies."
 ideology_command_teachings:0 "Command Teachings"
 ideology_command_teachings_desc:0 "The teachers have a variety of lessons about the way society should be structured so that everyone in it can lead a good life."
 ideology_thought_moralist:0 "Thoughtful Moralist"
 ideology_thought_moralist_desc:0 "This group believes that an educated elite chosen through merit should rule over the masses"
 ideology_diversity_of_stone:0 "Diversity of Stone"
 ideology_diversity_of_stone_desc:0 "To the dwarves, ancestor worship is a tradition as old as time, a custom so ingrained into their society that the practice is seen as a common routine in their daily lives. With many different peoples and beliefs entering dwarven states, the reverence of dwarven ancestors was not enforced upon them, as it made little sense for them to admire ancient figures with no cultural connections. Even after the revival of the Dwarven Pantheon, the Stone Keepers still believe that any dwarf is free to choose their own path of personal fulfillment."
 ideology_ancient_pantheon:0 "Ancient Pantheon"
 ideology_ancient_pantheon_desc:0 "Seeking to upkeep the ancient traditions of Aul-Dwarov, the Hearthpriests pursue to be virtuous in the eyes of their gods, rejecting new governmental ideologies and supporting ancestral ways. Striving to spread the faith, they detest the heretical Ancestor Worship and their rejection of the gods, perceiving their decision to allow foreign faiths to establish themselves in dwarven halls to be repugnant."
 ideology_runefathers_will:0 "Runefather's Will"
 ideology_runefathers_will_desc:0 "To enact revenge upon the dwarves and their futile attempt to reclaim the Dwarovar, the Runefather has instructed to show no mercy upon the descendants of those who forsook him. Wishing to prevent spies and subversives from scheming within conquered lands, they maintain high measures to keep insurgency at bay. His decree to the Groedi-az-Ân is to further his will upon all the denizens of the Dwarovar, incorporating them into the imperial war machine to aid his conquest, willing or not."
 ideology_runefathers_wisdom:0 "Runefather's Wisdom"
 ideology_ravelian_brotherhood:0 "Ravelian Brotherhood"
 ideology_ravelian_brotherhood_desc:0 "This group believes in a strict adherence to the belief in the one true god and tolerance to other cultures as a means of spreading that faith."
 ideology_runefathers_wisdom_desc:0 "The faiths and teachings of the surfacers can only be described as poison by the Groedi-az-Ân, for no texts can transcend the unlimited wisdom of the Runefather. Foreign books are banned, and education is strictly overseen by the clergy, teaching the next generations on how they could aid in the expansion of the Obsidian Empire on the surface. Not tolerating compassion to their fellow compatriots and enemies alike, a strict statute is made to put the Runefather first any other second."
 ideology_many_gods:0 "Many Gods"
 ideology_many_gods_desc:0 "Some have said that Goblin Shamanism is so fragmented that it's hard to find even two goblins who worship the same god in the same way. The faith has been described as “a myriad of deities worshipped according to a million conflicting doctrines”, and shamanist faithful seem to take this definition with pride. As such, among the most common demands of the followers of the traditional goblin belief system is that of total religious freedom, so that no state can get between goblins and their, unorthodox to say the least, way of understanding divinity."
 ideology_father_nimrith:0 "Father Nimrith"
 ideology_father_nimrith_desc:0 "Nimrith’s body may have fallen, but His faith lives on. It is the duty of every true believer not only to spread the worship of the Great Dragon Nimrith but to participate in the rituals of the Nimrithain. These are a yearly gathering in which every believer is required to contribute wealth, where wealth and relics, items of value and faith are brought together to be scrutinized and assessed for their value, and if found sufficient added to the Hoard. These Hoards are located in many Nimrithian temples, and a major hoard resides in every major metropolitan area, but every eight years there is a grand Ritual of the Nimrithian, in which all the major regional hoards are gathered together and moved to the capital to be added to the Great Hoard of Nimrith. Every item of wealth donated will bring us closer to the return of Nimrith, and surely those who contribute the most will be proportionally rewarded upon that fateful day!"
 ideology_dookans_might:0 "Dookan's Might"
 ideology_dookans_might_desc:0 "Neither the folly of the False Dookanson nor the subsequent return of hordes of reviled dwarves have made a dent in the fervor of the shamans of Old Dookan. For Dookan remains chained, and until He is free and his captors are slain, there will be no rest for the drums of war, no end to the sharpening of the axes and the chants of the warriors. To free their god and maker, orcish society must put martial might and prowess before anything else. The old traditions of orckind must be preserved, even in this changing world, for the old principle still rings true: the strong rule, and the orcish souls endures. Dookan shall be free!"
 ideology_elikhet_teachings:0 "Elikhet's Teachings"
 ideology_elikhet_teachings_desc:0 "TODO"
 ideology_aakhet_teachings:0 "Bronze Doctrine"
 ideology_aakhet_teachings_desc:0 "TODO"
 ideology_amilak_truth:0 "Amilak's Truth"
 ideology_amilak_truth_desc:0 "Followers of the Sky Domain faith believe in the maintainence, unity, and expansion of the Holy Kingdom in Halann."
 ideology_righteous_knowledge:0 "Righteous Knowledge"
 ideology_righteous_knowledge_desc:0 "The Mwalim and Darwiiz of the Rinta Seekers Faith believe that all knowledge has some degree of spiritual value, and seek a society which facilitates the production and exchange of ideas within their religious framework."
 ideology_ansesheg_imma:0 "Ansesh-eg Imma"
 ideology_ansesheg_imma_desc:0 "While Mother Akasik has been a descentralized faith for most of its history, thanks to the efforts of various orders it has now coalesced into a unified belief knowm as "Ansesh-eg Imma" or "Mother's Wisdom" in common, it consists of a rough collection of many local beliefs and traditions codified into a single doctrine."
 ideology_great_family:0 "The Great Family"
 ideology_great_family_desc:0 "Families stay together, be they divine or mortal. The faithful worshippers of the Nakavy Avo lament the sorry state of the faith across the islands, with so many shrines in disrepair, so many brothers and sisters led astray. The Vyzemby should be united as a family, together in joyous song and dance. To this end, the devout demand that the government curtails foreign influence, protects Vyzemby culture and traditions, and ensures the proper care and protection of the Shrines."
 ideology_final_prophecy:0 "Final Prophecy"
 ideology_final_prophecy_desc:0 "The naga have long prophesized of the coming of the 333rd Lizardfolk Empire, the one that will rule all lizardfolk for eternity. For most naga, this has come to pass with Khatalashya, although many believe Khatalashya's catastrophic collapse in 1666 has disqualified their claim to the title, and no recent recovery may allow it to reclaim the prophecy."
 ideology_artistic_ascendancy:0 "Artistic Ascendancy"
 ideology_artistic_ascendancy_desc:0 "Zaradyrra's central beliefs stem back from when the Ashhana Lizardfolk suffered from the bloodcurse, which would fog their minds and send them into a frenzied rage. Engaging in art, both in its creation and consumption, helped clear the mind. Today the universal appreciation of artistic expression has been embraced by far more than just the Ashhana."
 ideology_inevitable_fate:0 "The Inevitable Fate"
 ideology_inevitable_fate_desc:0 "Your fate has already been sealed, or so goes the central tenant of the Shadow Pact faith. There is little use in fighting it. Once you accept it, there can be peace, and possibly even benefits if you decide to side with those who control the shadows."
 ideology_totem_worship:0 "Totem Worship"
 ideology_totem_worship_desc:0 "While many in Fangaula abandoned the old faith after the eruption of Junansuar, for those who still follow the Fangaulan Pantheon, they believe the continued worship of the region's legendary totem spirits is key to ensuring their homeland thrives once again."
 ideology_great_beasts:0 "Kin of the Great Beasts"
 ideology_great_beasts_desc:0 "Beast Memory is a religion without any formal clergy, revered through storytelling and rituals (including the shapeshifting ones) performed by important figures of the community. With their god dead/unable to act, faithful hold on to the belief of the common ancestry between them and other sentient creatures. It encourages shapeshifters to perform jobs and tasks traditionally associated with the animals, as well as greatly respecting and caring about fauna and flora, as they believe that they can also feel as much as sapient creatures do. The religion also criticizes overconsupmtion, interpreting it as a loss of control over self and regression to a more primitive, feral/vegetative state."
 ideology_lentidud_poderosa:0 "Lentidud Poderosa"
 ideology_lentidud_poderosa_desc:0 "A phrase borrowed from the Busilari, representing the slow march through life. A reminder from the Rite that ones creation should be savored slowly, stemming from years of violence and turmoil in Ardimya. "
 ideology_rram_xertis:0 "Rram Xertis"
 ideology_rram_xertis_desc:0 "Rram Xertis, the "Holy Work" is the ideology of devout adherents of Kvangahga. Rram Xertis promotes the recycling and manufacture of both organic and non-organic materials as a divine task, emphasising the importance of such work for the good of the pack."
 ideology_gexhdan:0 "Gexhdan"
 ideology_gexhdan_desc:0 "Gexhdan "Truth" in gnollish is the fundamentalist interpretation of the Xhazobkult that promotes the organised worship of demonic entities, whether the messianic Xhazobines, the bestial demons known as Xhazobs or malign gnollish deities such as Goxma."

 #Character
 ideology_magocrat:0 "Magocrat"
 ideology_magocrat_desc:0 "#lore This leader believes in a state run by mages.#!"
 ideology_aldanist:0 "Aldanist"
 ideology_aldanist_desc:0 "This leader believes that the ruinborn, having stayed true to the wishes of the last Precursor emperor by staying in Aelantir, are the true heirs of elvenkind and should band together as in the days of old."
 ideology_venaanist:0 "Venaanist"
 ideology_venaanist_desc:0 "This leader believes in a pan-elven ideology echoing to the founding days of the Precursor Empire, which seeks to reunite all the various children of Venaan."
 ideology_arakeprun_technomagocrat:0 "Techo-Magocrat"
 ideology_arakeprun_technomagocrat_desc:0 "#lore This leader believes in a state run by techno-thaumaturge.#!"
 ideology_aakhet:0 "Bronze Dragon's Teachings"
 ideology_aakhet_desc:0 "This character curiously has a remarkable amount of knowledge about the Bronze Dragon Aakhet."
