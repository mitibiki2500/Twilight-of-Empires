l_english:
 ideology_elven_havenist:0 "Elven Havenist"
 ideology_elven_havenist_desc:0 "#lore This group would prefer the country to remain a haven for elves untouched by the outside world.#!"
 
 ideology_rectorate_paternalistic:0 "Rectorial"
 ideology_rectorate_paternalistic_desc:0 "#lore This group supports the authority of the Rector and the traditional hierarchy of the Ravelian Rectorate.#!"
 ideology_rectorate_plutocratic:0 "Rector Plutocratic"
 ideology_rectorate_plutocratic_desc:0 "#lore This group believes that the wealthy have proven their worth as decision-makers and form an intellectual elite well suited to supporting the Rector.#!"
 ideology_aldresian:0 "Aldresian"
 ideology_aldresian_desc:0 "#lore This group supports the authority of the Rector and opposes the evil use of magic and artifice.#!"
 ideology_rangerism:0 "Rangerism"
 ideology_rangerism_desc:0 "#lore This group tends to favor famous adventurer-lawmen over constitutional rule.#!"
 ideology_raj_traditionalism:0 "Raj Traditionalism"
 ideology_raj_traditionalism_desc:0 "The ministries support the policies of the old Raj."
 ideology_nasavanite_economics:0 "Nasavanite Economics"
 ideology_nasavanite_economics_desc:0 "The old families of the Ghankedhen changed their attitude towards their traditional economical position after large mineral deposits were found on their lands."
 ideology_hierarchy_plutocratic:0 "Technocratic Plutocratic"
 ideology_hierarchy_plutocratic_desc:0 "This group believes that an educated elite chosen through merit should rule over the masses"
 ideology_hierarchy_paternalistic:0 "Technocratic Elitist"
 ideology_hierarchy_paternalistic_desc:0 "This group believes that an educated elite chosen through merit should rule over the masses"
 
 #Lake Fed
 ideology_triunic_moralist:0 "Triunic Moralist"
 ideology_triunic_moralist_desc:0 "The Servants of Kalyin believe in preventing the mis-use of magic and spreading the embrace of their goddess."
 ideology_triunic_children:0 "Childrens Democracy"
 ideology_triunic_children_desc:0 "The Children believe in ensuring their democracy best serves the interests of the nation's people, even if that means disregarding the world beyond the horizon."
 ideology_triunic_stewards:0 "Stewards Guardianship"
 ideology_triunic_stewards_desc:0 "The Stewards believe in consolidating authority to a more righteous group and are more open to magic than most Triunics."
 ideology_triunic_traders:0 "Traders Openness"
 ideology_triunic_traders_desc:0 "The Traders believe in opening Kalsyto to the world to both learn from it, and to teach it through the marketplace of ideals."
 ideology_triunic_soldiers:0 "Soldiers Strength"
 ideology_triunic_soldiers_desc:0 "The Soldiers belive in a strong government that can crush any threat to the Republic, whether they be monarchists, or monsters."
 ideology_triunic_guns:0 "Guns Wealth"
 ideology_triunic_guns_desc:0 "The Guns believe in enriching the nation and themselves. Nature, magic, and the workers serve to be exploited."
 ideology_triunic_workers:0 "Workers Humility"
 ideology_triunic_workers_desc:0 "The Workers believe in ensuring the worker cannot be exploited by either mage or the wealthy."
 ideology_triunic_citizens:0 "Citizens Rememberance"
 ideology_triunic_citizens_desc:0 "The Citizens believe in striking down the tyranny of kings and mages and igniting the flame of liberty, whether at home or abroad."
 


