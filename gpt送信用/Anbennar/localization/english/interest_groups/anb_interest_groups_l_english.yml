l_english:
 #Armed Forces
 ig_order_of_st_aldresia:0 "Order of Saint Aldresia"
 ig_order_of_st_aldresia_desc:0 "The Order of Saint Aldresia is a order of arcane knights that act as the martial arm of the Ravelian Church."
 ig_phoenix_legions:0 "Phoenix Legions"
 ig_phoenix_legions_desc:0 "The Phoenix Legions, formerly known as the Jaddari legions, are the inheritors of the armies that once conquered Bulwar and Haless for Jaher and later served under Jaddar in his holy mission."
 ig_paravimata_rangers:0 "Paravimata Rangers"
 ig_paravimata_rangers_desc:0 "The military of the Ghankedheni has historically consisted of a small core of well trained retinues, known as rangers, that in times of need were supported by a militia."
 ig_lion_legion:0 "Lion Legion"
 ig_lion_legion_desc:0 "Seeking to create a brotherhood of man underneath the one God, the army of Busilar, seeks to push recruitment across all of Busilar's colonies and protectorates believing that through the army they can find a unity in purpose and spread the Truth."
 ig_ameion_strateor:0 "Stratéor"
 ig_ameion_strateor_desc:0 "The Stratéor is Ameion’s professional military. Originating in myth from the army of Ameion’s founder, Prince Syrenthos, the Stratéor was originally simply a framework through which Ameion’s military leaders could preserve institutional knowledge between campaigns. After the conquests of Laskaris the Conqueror, Ameion acquired the resources to keep armies in the field permanently – modelled partly off the armies of the Second Gophrian Empire, a truly professional military was born. Since then, the Stratéor has been renowned throughout Aelantir for its strength, dynamism, and both strategic and tactical ingenuity – even as the Empire it built falters."
 ig_klereyen_fotistrepei:0 "Fotistrépei"
 ig_klereyen_fotistrepei_desc:0 "The Fotistrépei, once Ameion’s Kheionised Taychendi auxiliaries, now form the backbone of the Klereyen successor states’ militaries. During Laskaris’ conquests, Ameion relied on its disciplined and reliable Kheionai heavy infantry. But they were few in number, and in order to match their Taychendi foes, Ameion sought to harness Taychend’s manpower. A military class of loyal Kheionised Taychendi, later Klereyen, the Fotistrépei grew into Ameion’s innumerous and dynamic light infantry, and, as musket replaced pike, their organisation and tactics informed the Stratéor as a whole. But the strength of the Fotistrépei, like all Klereyen, worried the Ambhen elite of the capital – when the resulting Saímogemos escalated into civil war, the Fotistrépei revolted, joining the Klereyen urbanites and landowners."
 ig_kheios_altreiones:0 "Altreíones"
 ig_kheios_altreiones_desc:0 "The League’s Altreíones (“valiant cities”) faction is represented by the Kheions of Arpedifér and Oktikheion, the great military innovators. While Arpedifér mastered the phalanx, and in recent times has experimented with Kaydhano weaponry on land, at sea Oktikheion created the first Kheionai warships, then the colossal Degárikes, and then the Thamasthaltus marine shock-troops. In many ways, they are also spear and shield – while Oktikheion looks to the sea for naval adventure, Arpedifér’s guard is always up, her many eyes always watching. Whether the soldiers and sailors of Kheiós wish for the thrill of battle or simply to protect their home, these cities are their first port of call."
 ig_nanru_nakar_kilaiek:0 "Kilaiek-Mudaliars"
 ig_nanru_nakar_kilaiek_desc:0 "When Nanru Nakar tore itself apart, then rebound itself as the Triple Alliance, the Kilaiek-Mudaliars stood as the sword of the Nakari Empire. They led every campaign against the great city’s enemies, while maintaining a bold and patriotic front against the encroachment of the interlopers. The Kilaiek-Mudaliars have nearly total control over the kingdom’s armed forces."
 ig_drozma_host:0 "Faithful Host"
 ig_drozma_host_desc:0 "The Armies of Drozma Tur nations exist in service of the Dragon God, and all who serve in them are His weapons."
 
 #Devout
 ig_rectorate:0 "Rectorate"
 ig_rectorate_desc:0 "Ravelianism is a monotheistic religion believing in one God, and that all other gods are but aspects or saints of this one God. Ravelianists are part-scholar, part-preacher, and believe in unraveling the secrets of the world to discover and spread its fundamental Truths. A large number of these revelations come from their research in the God Fragment, a strange shard-like device that communicates in a near-undecipherable language that claims that it is the last portion of divinity, and that the precursor elves stole God's divinity and turned it into what we know today as magic. A popular tenet in the Ravelian faith is their wish to use artificery to bring this stolen magic to all."
 ig_ravelian_church:0 "Ravelian Church"
 ig_ravelian_church_desc:0 "Ravelianism is a monotheistic religion believing in one God, and that all other gods are but aspects or saints of this one God. Ravelianists are part-scholar, part-preacher, and believe in unraveling the secrets of the world to discover and spread its fundamental Truths. A large number of these revelations come from their research in the God Fragment, a strange shard-like device that communicates in a near-undecipherable language that claims that it is the last portion of divinity, and that the precursor elves stole God's divinity and turned it into what we know today as magic. A popular tenet in the Ravelian faith is their wish to use artificery to bring this stolen magic to all."
 ig_corinite_faithful:0 "Corinite Faithful"
 ig_corinite_faithful_desc:0 "The Corinites believe that Corin, the recently ascended god of war, is more fit to lead the Regent Court than Castellos' son Adean. They believe that Adean is too conservative and neglectful, and that the Regent Court must become a more active part of people's lives: darkness and tyranny must not simply be held back, it must be rooted out and destroyed."
 ig_adeanic_temples:0 "Adeanic Temples"
 ig_adeanic_temples_desc:0 "The Regent Court is a collection of gods, led by the god Adean, prominently worshipped within the continent of Cannor. Followers usually adhere to a specific patron deity but can otherwise worship and pay respect to many other gods within the pantheon. The pantheon is organized similar to a feudal court, with each deity taking on roles similar to various positions within said court."
 ig_whiterose_court:0 "Whiterose Court"
 ig_whiterose_court_desc:0 "As many other Cannorian realms abandoned Adean in the Crimson Deluge’s wake, the Lorentish remained true, for he had seemingly protected them from Corin’s wrath. Lencenor was spared the devastation of the nightmare rains and that was taken as divine provenance for their fealty to the leal successor among divinity, just as they emulated Adean’s gallant ideal on Halann.\n\nThe Whiterose Court, a variant of the Regent Court, originated here. Its Renaissance bloom became a temporal lance for Adean on Halann, a Counter-Reformation from beneath his renewed aegis. Even as Ravelianism arose, Lorent weathered that storm in kind, all but alone in their faith. Their faith in Castellos’ rightful successor asks no question, their devotion passing any earthly test."
 ig_neratic_temple:0 "Neratic Temple" #Perhaps this could have separate desc loc from the mainline version of Adeanic, but I don't think it's much of an issue if it doesn't
 ig_neratic_temple_desc:0 "The Regent Court is a collection of gods, led by the god Adean, prominently worshipped within the continent of Cannor. Followers usually adhere to a specific patron deity but can otherwise worship and pay respect to many other gods within the pantheon. The pantheon is organized similar to a feudal court, with each deity taking on roles similar to various positions within said court."
 ig_munasian_temple:0 "Munasian Temple" #Perhaps this could have separate desc loc from the mainline version of Adeanic, but I don't think it's much of an issue if it doesn't
 ig_munasian_temple_desc:0 "The Regent Court is a collection of gods, led by the god Adean, prominently worshipped within the continent of Cannor. Followers usually adhere to a specific patron deity but can otherwise worship and pay respect to many other gods within the pantheon. The pantheon is organized similar to a feudal court, with each deity taking on roles similar to various positions within said court."
 ig_balgaric_temple:0 "Balgaric Temple" #Perhaps this could have separate desc loc from the mainline version of Adeanic, but I don't think it's much of an issue if it doesn't
 ig_balgaric_temple_desc:0 "The Regent Court is a collection of gods, led by the god Adean, prominently worshipped within the continent of Cannor. Followers usually adhere to a specific patron deity but can otherwise worship and pay respect to many other gods within the pantheon. The pantheon is organized similar to a feudal court, with each deity taking on roles similar to various positions within said court."
 ig_jadd_temples:0 "Sun Temples"
 ig_jadd_temples_desc:0 "Jadd is the name given to the newest denomination of the Bulwari Sun Cult. Founded by Jaddar Jexiszuir, they claim that all followers of the Jadd were Chosen by Surael to fight the Darkness, no matter their race. The main teachings of the faith are centered on a dualistic view of good and evil, and the eternal fight between light and darkness.\n\nThey believe that all gods are dead, with the last god, Surael, sacrificing himself to become the sun in order to keep the Malevolent Dark at bay. The followers of the cult seek to protect the Light fighting the Darkness by rejecting lies, sadness and despair, helping the needy and maintaining hope. The Jadd has declared war upon the Malevolent Dark and actively seeks to continue the war on Halann, while Surael continues the war in the sky.\n\nEveryone outside the Jadd is given the chance to convert and become a Chosen, and join the Fight, or declare themselves a servant of the Darkness."
 ig_teachers:0 "Teachers"
 ig_teachers_desc:0 "The Godlost have foresaken the worship of divine beings, instead they focus on forging their society into a rigid structure. They value family and country over religious practices and cosmic powers. A disciplined and loyal attitude is revered and any disobedience is harshly punished. They have structured this in a series of teachings that all are expected to adhere to, but some may put greater emphasis on one over the other."
 ig_stone_keepers:0 "Stone Keepers"
 ig_stone_keepers_desc:0 "The Stonekeepers hold many records of the ancestors of old, both great and minor to remember and venerate all those who came before them with great respect. They desire to teach all dwarves the achievements of their ancestors, and to remember their sacrifices, to remind them of the responsibility that all dwarves have. They also have a keen interest in recovering and preserving old structures and texts, paying whichever price to bring back artifacts once forgotten."
 ig_hearthpriests:0 "Hearthpriests"
 ig_hearthpriests_desc:0 "With the resurgence of the Dwarven Pantheon and the rediscovery of all the gods and their rites left in the rubble of Aul-Dwarov, it was up to the Hearthpriests to decipher the old texts. The knowledge needed for the diverse ceremonies dedicated to the gods was once lost to time, however, each remaining fragment is still meticulously studied by the clergy, to ensure proper practices. Believing to be the only legitimate faith for all dwarves, they seek to bring all the lost souls back to the faith of their forefathers."
 ig_groedi_az_an:0 "Groedi-az-Ân"
 ig_groedi_az_an_desc:0 "The Groedi-az-Ân are the central authority of the Runefather Worship faith, claiming to know the Runefather's Will. They are responsible for holding the sacred ceremonies dedicated to the Runefather, ensuring the proper rituals are made in his honour. They root out heresy and noncompliance in any that would dare not pay proper respect to him or his clergy. Immensely influential on the Obsidian Council, they detest all other faiths and tolerate no dissidents who get in the way of dominating all lands for the Runefather."
 ig_goblin_church:0 "Goblin Church"
 ig_goblin_church_desc:0 "The clergy of Goblin Shamanism is an extremely diverse group, formed by representatives of the myriad cults that make up the traditional belief system of goblinkind. From the more traditional shamans, earthly representatives of one of the many gods in the goblin pantheon, to more recent priests and philosophers that lead, or even founded, syncretic cults. It would be nigh impossible to find a common denominator in terms of theology, practices or beliefs among them, but they play the same role in goblin society regardless. Same as they are mediators between the physical and the divine, they serve as mediators between the state and the extremely numerous commonfolk. For many goblins, faith is the only refuge from a cutthroat society, and in this sense, the priesthood can just as likely guarantee social order as bring it down to its knees."
 ig_red_priesthood:0 "Red Priesthood"
 ig_red_priesthood_desc:0 "The priesthood of the Nimrithan has changed a great deal since the death of the great red dragon Nimrith, almost eight centuries ago. Their devotion, however, is still as strong as the day He emerged from the depths. As the ones tasked with enforcing the will of the dragon even in His absence, Red Priests encourage and supervise the collection of wealth in great hoards dedicated to Him, and with which they hope to one day be able to reforge His body. Fanatically proselytizing, they will not rest until every soul below the mountains toils for the Red Dragon, and every ounce of wealth is dedicated to His glory."
 ig_shaman_council:0 "Shamanic Council"
 ig_shaman_council_desc:0 "The Shamans of the Old Dookan faith have always been a powerful force in orcish society. They carry the will and vision of Dookan in Halann, install zealotry and bravery in the hearts of warriors, wield powerful magic, and traditionally act as mediators, arbitrators and judges. The shamans of each nation organize themselves in councils led by the eldest and wisest among their ranks. For these shamans, the sole goal of orckind is now the same as it has been for the last eight millenia, to free Dookan and punish His dwarven captors. Any state that defies this vision will have to deal with them, and with the legions of zealots their call rallies."
 ig_elikhetist_priesthood:0 "Elikhetist Priesthood"
 ig_elikhetist_priesthood_desc:0 "Centred around the worship of Elikhet, the founder of Khetarata, the Elikhetist Priesthood has been present within Khetaratan society for as long as it has existed, supporting a strong monarchy and a heavy usage of the Khet’s magic."
 ig_bronze_priesthood:0 "Bronze Priesthood"
 ig_bronze_priesthood_desc:0 "Inspired by the Bronze Dragon Aakhet who conquered Khetarata in 475 AA, the Bronze Priesthood supports militaristic and monarchical ideas that characterised Aakhet’s rule. Despite losing influence after the disappearance of Aakhet in 1790 during a war against Khatalashya, the Priesthood still holds great sway in Hakhepra."
 ig_semayebaka:0 "Semayebaka"
 ig_semayebaka_desc:0 "The Semayebaka, or "Sky Watchers" are the priesthood of the Sky Domain faith, tasked with guiding the faithful and using their powerful weather magic to aid the state."
 ig_house_wisdom:0 "House of Wisdom"
 ig_house_wisdom_desc:0 "Rinta Seekers clergy include the Mwalim, scholarly priests and mages, and the Darwiiz, wandering mystics and witchdoctors. The two genres are grouped together under the moniker "the House of Wisdom""
 ig_dakamsage:0 "Dakamsage"
 ig_dakamsage_desc:0 "The holy orders of Akasik countless in number are led by the Maddakas Markasi first among equals, scared by the memories of the last Xhazobine they are oathbound to protect Akasik and its people, and they will use all means available to achive this goal, willing to tolerate even heathens for the good of all who live under Her shadow."
 ig_shrine_priesthood:0 "Shrine Priesthood"
 ig_shrine_priesthood_desc:0 "Nakavy Avo or Great Family in Vyzemby is a pantheon of gods worshipped by Vyzemby halflings and other inhabitants of the Summer Isles. Although somewhat decentralised in nature,  religious authority has been traditionally centered around the temples and shrines of the pantheon's deities, with the High Priestess of Lel being recognised as the religious head of the pantheon, at least nominally. Over centuries, however,the pantheon's influence started to wane, with the biggest hits being the spread of ravelianism in the north andthe unified Mazava state converting to the Baashidi faith of Rinta seekers. The biggest hit of all was the loss of Lel's temple to invasion from the mainland."
 ig_naga:0 "Naga"
 ig_naga_desc:0 "Naga are a unique type of limbless lizardfolk mutation but born with incredible magical powers and longer lifespans. Traditionally they have held the role of spiritual and cultural guides. Never as rulers, but as those who guide rulers. If their will is not followed, one condemnation is all it takes for that lizard to be removed. They never even have to lift a finger to do it...not that they could anyway."
 ig_artist_guild:0 "Artist's Guild"
 ig_artist_guild_desc:0 "Engaging in art is a sacred activity to those who follow Zaradyrra, and any action by the state that would interfere with the consumption or creation of art is tantamount to blasphemy. The Artist's Guild not only advocates for greater protections for the finest artists in their nation, but pushes the agenda that every citizen must be allowed the time and capacity to create their own art, however they wish - be that painting, cooking, or even warfare."
 ig_shadow_cabal:0 "Shadow Cabal"
 ig_shadow_cabal_desc:0 "Attempting to change the world is futile. All has already been set. The best you can do is make peace with that and call on the shadows to be kind to you once the inevitable happens. The Shadow Cabal will see to it that nobody tries to fight their destiny."
 ig_jelli:0 "Jelli"
 ig_jelli_desc:0 "The Jelli are the bards and storytellers of the Fangaulan Pantheon. After multiple gnollish invasions, the Junansuar volcano, and the splintering of the old Fangaulan order, they became the foremost voices in maintaining the traditions of the faith."
 ig_spirit_church:0 "Spirit Church"
 ig_spirit_church_desc:0 "After their split from the Ravelian Church, the Ardimyan Rite operates under a variety of individual churches. In gatherings or when discussing the religion as a whole, they refer to themselves as the "Spirit Church.""
 ig_river_priests:0 "River Priests"
 ig_river_priests_desc:0 "The River Priests divulge the will of the Ynn unto its worshippers. Reformed during Arverynn's hegemony the reformed Church of the River operate in local temples influenced by high priests in Adbrabohvi and Bosancovac."
 ig_turvalk:0 "Turvalk"
 ig_turvalk_desc:0 "The followers of the dragon are shepherded by learned monks and priests in their worship. Often ascetic these Dragon Priests serve as a backbone to spiritual guidance within Varlengeilt's realm."

 ig_philosophers:0 "Philosophers"
 ig_philosophers_desc:0 "The Thought is the name given to the traditional gnomish philosophy, which emphasize sentience and intelligence as the most vital qualities a being can possess. Followers of this philosophy are uninterested by spirituality; instead focusing on creating and refining a "Theory of Everything" that explains exactly how reality works. Members are driven to observe and analyse the material world, in the hopes of being able to incorporate their discoveries to the doctrine in an act known as "Being touched by The Thought". This drive towards material analysis and innovation leads to followers of the Thought being well-suited to the pursuit of scientific advancement and the development of artifice; gnomish believers in the Thought were the first to combine magic and science into the art now known as artificery. Those who follow The Thought are usually very tolerant to other ways of thinking, as they both hold the product of other people's intelligence in high regard, and take advantage of the opportunity to research into other cultures."
 ig_rram_xertags:0 "Rram Xertags"
 ig_rram_xertags_desc:0 "A Rram Xertag "One who does the holy work" is a devout follower of Kvangahga who has dedicated themselves to the divine task of recycling and manufacturing items for the good of the pack. They value pragmatism, efficiency and community but despise wastefulness."
 ig_gexhdanags:0 "Gexhdanags"
 ig_gexhdanags_desc:0 "A Gexhdanag is "One who is true", they are fundamentalist believers in the demonic Xhazobkult. They view the Kult not as a collection of folk traditions but as an organised belief system. They value power, ambition and the supremacy of the gnollish race but despise weakness."



#Landowners
 ig_old_guard:0 "Old Guard"
 ig_old_guard_desc:0 "The oldest and most established Magnates; they are conquerors through and through believing that there is no better way to secure the League's prosperity than for it to subjugate its enemies, strengthening our glory and enriching our military-industrial complex - of which they are a large part."
 ig_trade_barons:0 "Trade Barons"
 ig_trade_barons_desc:0 "The Trade Barons seek to empower local communities (and the industry within them) in order to ensure stability and prosperity for all of the League. A rising tide will lift all boats (but perhaps the Barons' most of all)."
 ig_cooperatists:0 "Cooperatists"
 ig_cooperatists_desc:0 "The Cooperatists seek to impose a single vision on the Northern League, predicated on efficiency and cooperation between the people in order to ensure the power and strength of the central government who, in turn, will represent the interests of the Magnates."
 ig_baronites:0 "Baronites"
 ig_baronites_desc:0 "The Baronites were the old petty nobility that filled the vacuum when the ancient magical nobility was purged during the Blackpowder Rebellion. Fueled half by liberal notions and self-perservation, they allied with the moderate Blackpowderists to oust the revolutionary Borandist regime and put an end to the rebellion. They support the virtues of the feudal Damerian Parliament: a monarch subservient to the whims and advice of elected nobility."
 ig_planter_gentry:0 "Planter Gentry"
 ig_planter_gentry_desc:0 "The economy of Aelantir relied on cotton, sugar or tobacco plantations for centuries during the early modern era. This led a lasting impact on the politics of central Aelantir, with the emergence of a class of plantation owners who saw their manors as castles and themselves as aristocrats in all but title, that is to say for those who didn't have one already."
 ig_dragonblooded_nobility:0 "Dragonblooded Nobility"
 ig_dragonblooded_nobility_desc:0 "Varlengeilt, child of the “last dragon”, has spawned many half-ruinborn descendents during his four centuries of life. This has resulted in an entire class of dragonblooded nobility, who see themselves as closest to the will of the dragon due to their magical prowess, raw strength, and lineage."
 ig_nahana_jadd_ministries:0 "Ministries"
 ig_nahana_jadd_ministries_desc:0 "The last remnants of the old Raj ministries still form the backbone of much of the Jadd Empire's administration in Rahen. Despite their conversion to the Jadd they still hold on to much of the traditional views inherent to Raheni society and the old High Philosophy faith."
 ig_ghankedhen_major_families:0 "Major Families"
 ig_ghankedhen_major_families_desc:0 "Ghankedheni society is organised into various families, or tribes. These have historically been the powers of the region before they were united under the Jadd faith. In their new state these still remained the premier political force."
 ig_haven_elders:0 "Haven Elders"
 ig_haven_elders_desc:0 "Elders have always dominated elven society, and they have always seen safeguarding and securing a homeland for their people as their utmost priority. They believe in this vastly changing times of artifice and industrialization, that the elven people are much better off sticking to the old ways."
 ig_daunarches:0 "Daunarches"
 ig_daunarches_desc:0 "The Daunarches (“noble-leaders”) were the landowning class of the Ambhen Empire. During the process of Kheionisation, Ameion sought to turn the warlord-ruled Attemutil (city-states) of Taychend into (depending on size) either Kheionised cities or private land. The latter would be handed out to Kheionai settlers (mostly Stratéor veterans) and Taychendi collaborators, who would become Klereyen – these two groups formed the Daunarches. As the Ambhen grew wary of the growing power of the Klereyen, the resulting Saímogemos would culminate in the civil war that toppled the Ambhen Empire – and split Ambhen and Klereyen aristocrats from each other. Regardless, Daunarcheia of both groups remain, and hold considerable power in the Taychendi countryside."
 ig_kheios_phylaxana:0 "Phylaxana"
 ig_kheios_phylaxana_desc:0 "In the Kheiosian League, the Phylaxana of Degakheion, the city’s ancient ruling warrior-caste, is a faction unto itself. In Degakheion alone did the wardens of the Pre-Ruin Prisons survive, dominating the Karkares (“prisoner”) majority of their city – one must take the nightmare-trials of the Red Halls to join their number, preparing either through the grueling Erythé training regimen, or the Drivós Kryphane – the hardship of living as a Karkares. Despite opening the Phylaxana’s ranks to these upstarts in the 1500s, Degakheion remains a bastion of tradition, martial hegemony, and aristocracy among the Kheionai – anyone wishing to see these ideals represented contacts the Phylaxana."
 ig_nanru_nakar_mlerek:0 "Mlerek-Mudaliars"
 ig_nanru_nakar_mlerek_desc:0 "When Nanru Nakar tore itself apart, then rebound itself as the Triple Alliance, the Mlerek-Mudaliars stood as the face of the Nakari Empire. Steeped in history and tradition, they manage Nanru Nakar’s dealings with their many vassal warlords – through an uncountable number of pacts and dealings, the Mlerek-Mudaliars speak for them too."
 ig_ynnic_lords:0 "Spodhani"
 ig_ynnic_lords_desc:0 "Land in a traditional Ynnic nation is owned by a heredetary warrior class who are tied to the land which they administer."
 ig_iosahar:0 "Iosahar"
 ig_iosahar_desc:0 "An Iosahar is a Lord who has sworn a Sacred Oath of Loyalty to their Monarch, having an Iosahar is the privilege of the highest of Ynnic nobility and is tantamount to claiming successorship to the Ynnic Empire."
 ig_garushuvra:0 "Garushuvra"
 ig_garushuvra_desc:0 "The Garushuvra, the Council of Lords, consists of both orcish landed nobility and prominent tribal chieftains of the nomadic Ozdan clans. Bound together by age-old traditions, generations of blood ties, and a powerbase dependent on control of land,  both nobles and tribesmen work to ensure that proper orcish ways of might and strength are adhered to."
 ig_bazrani:0 "Bazrani"
 ig_bazrani_desc:0 "Most Grombari landowners are half-orcs, formed throughout centuries of coexistence between humans and orcs. Initially formed as elite troops of Gray Orc military, providing it with disciplined and talented soldiers, over centuries Bazrani’s role shifted and they became reactionary nobility, enjoying many privileges and hesitant of any changes."

 #Lake Federation/Kalsyto
 ig_lake_soldiers:0 "Sojdalasät (Soldiers)"
 ig_lake_soldiers_desc:0 "The Sojdalasät, or Soldiers of the Lakes, represent the military. They believe all citizens should be soldiers, and all soldiers should be citizens."
 ig_lake_servants:0 "Pelvalijuma (Servants)"
 ig_lake_servants_desc:0 "The Pelvalijuma, or Servants of the Goddess, represent the clerical class of Kalyin. They seek for all to know her embrace, and for the government to follow her values."
 ig_lake_guns:0 "Bhuuianuuk (Guns)"
 ig_lake_guns_desc:0 "The Bhuuianuuk, or Guns of the Lakes, represent the militarized industrial capacity of the nation. They seek to build up the industrial and artificerial strength of the nation."
 ig_lake_citizens:0 "Kasuknisät (Citizens)"
 ig_lake_citizens_desc:0 "The Kasuknisät, or Citizens of the Lakes, represent the middle-class that believe most strongly in the Federation's way of life, and wish for all peoples to be citizens of a republic, ours or otherwise."
 ig_lake_stewards:0 "Qarechinuuk (Stewards)"
 ig_lake_stewards_desc:0 "The Qarechinuuk, or Stewards of the Lakes, represent the landowning class. While the ancient overthrow of monarchism and nobility two thousand years ago has left such individuals weaker among the Triunics than in almost any other society, changes in land ownership resulting from the settlement of Nuzurbokh have seen a reconsolidation of a land-owning elite."
 ig_lake_traders:0 "Sovkelqur (Traders)"
 ig_lake_traders_desc:0 "The Sovkelqur, or Traders of the Lakes, represent the mercantile and cultural segments of society. After the beginning of the Egdüqon and end of the Treasure Fleet, this faction has sought to spread the ideals of democracy along trade channels."
 ig_lake_children:0 "Boshalelqur (Children)"
 ig_lake_children_desc:0 "The Boshalelqur, or Children of the Lakes, represent the non-urban working class. Caring little for the affairs of the cities, they wish to maintain their lifestyle undisturbed."
 ig_lake_workers:0 "Dazjalainuuk (Workers)"
 ig_lake_workers_desc:0 "The Dazjalainuuk, or Workers of the Lakes, represent the collective organized laboring class. They seek to improve, and equalize, the economic wealth of everybody and have no tolerance for any who would disturb that equality, be they mage, king, or business owner."

 #Cyranvar
 ig_cyranvar_great_salla:0 "Great Salla"
 ig_cyranvar_great_salla_desc:0 "Before Cyranvar, Wood Elven society was ruled by independent clans or salla. Amongst the most powerful of these clans were the Great Salla who (to varying degrees) led the lesser clans. While they were content to squabble amongst each other for centuries, their near annihilation by the Greentide and soon after Emerald Orc hordes forced the clans together under a single commander or ceannasai. Though these threats have passed, the Great Salla and their clan heads still support a unified state, albeit with their positions secured."
 ig_cyranvar_druid_circles:0 "Druid Circles"
 ig_cyranvar_druid_circles_desc:0 "Unlike its more zealous neighbors in Escann and Bulwar, no dedicated class of clergy ever arose within Wood Elven society. While Corinite couters and greaves tend their flocks and even the occasional Bulgu shaman recites ancestral prayers, the closest entity to forming a true political force are the Druid Circles. Responsible for training the next generation of mages and keeping tabs on relations with the Fey Courts, this decentralized group has typically kept quiet so long as harmony in the Deepwoods is maintained. 
 ig_cyranvar_hannu:0 "Hannu"
 ig_cyranvar_hannu_desc:0 "The Hannu, (literally “shared” or more accurately “joint ventures”), represent the interests of various large scale business ventures within Wood Elven society controlled by a new class of salla. Unlike traditional clans, it is not blood that ties the clans together but a shared pursuit of opportunity and wealth."

 #Soyzkaru Cartel
 ig_soyzkaru_cartel_maketa_gangs:0 "Maketa Gangs"
 ig_soyzkaru_cartel_maketa_gangs_desc:0 "While the goblins of the Deepwoods have long had a martial tradition, the lack of profitability within this tradition led the cartel bosses to seek more business favorable solutions. The result was the Maketa Gangs, groups of paramilitary units originating from the descendants of previously hired mercenaries as well as native orcish, elven, and human populations elevated out of the Grind."
 ig_soyzkaru_cartel_new_guard:0 "New Guard"
 ig_soyzkaru_cartel_new_guard_desc:0 "The rise of artificery provided the first boss shake up in decades within the Soyzkaru Cartel. Markets once cornered and locked in an iron grip were left open as previous fey nuisances became economic levers waiting to be pulled. The result was the New Guard, representing the various voracious ventures of heavy industry and artificery of upcoming cartels and ambitious cartel bosses."
 ig_soyzkaru_cartel_old_guard:0 "Old Guard"
 ig_soyzkaru_cartel_old_guard_desc:0 "Representing the original cartels that formed the Soyzkaru Cartel, the Old Guard are vested in traditional resource gathering and refinement. Though they view the so-called “New Guard” with competitive suspicion, they are not above doing what it takes to make the Line go up."

 #Intelligentsia
 ig_voltoj:0 "Voltoj"
 ig_voltoj_desc:0 "The Voltoj Represent the Eunuch Half-Goblin ruling class of the Overclan, They believe that a state needs to serve the people, and to do this the state needs to be effective and ruled by the most capable of people loyal only to the state, Meaning the Voltoj must rule in the people's stead"
 ig_kheionai_philosophers:0 "Philosophers"
 ig_kheionai_philosophers_desc:0 "In the place of religion, the Kheionai – a people whose spirituality was shorn away by the Kaydhano – put their trust in philosophy, the ideals of flesh-and-blood elves, not invisible gods and extraplanar beings. The morals of the Kheionai, divided over uncountable doctrines and creeds, are dictated by the wisdom of those who came before, and those who can argue well in the present – the intellectuals stand as the cutting edge of the latter source, and when they speak, many Kheionai listen."

 #Industrialists
 ig_kheios_chylgireiones:0 "Chylgíreiones"
 ig_kheios_chylgireiones_desc:0 "The Chylgíreiones (“foundry cities”) faction is represented in the League by Ormam and Kherka, the most industrious of the Kheions. Be it the urban-tribes of the Forge-Clans or the opportunistic plutocrats of the Swindler’s Symposium, both cities have an eye for industry – and in the latter case, an eye for the profits that come from it. Likewise, both Kherka and Ormam are accepting of the fruits of non-Kheionai – while Kherka once invited the Gommo to Alecand’s shores, Ormam values trade with the Cannorians of Aelantir, and through them introduced the rifle. When the Kheionai want to disregard tradition or petty xenophobia in favour of wealth or industry, they go to the Chylgíra."
 ig_nanru_nakar_kriadvai:0 "Kriadvai-Mudaliars"
 ig_nanru_nakar_kriadvai_desc:0 "When Nanru Nakar tore itself apart, then rebound itself as the Triple Alliance, the Kriadvai-Mudaliars stood as the mind behind the Nakari Empire. They know Taychend’s underworld well – both the figurative kind and the many Precursor ruins that dot the region. Masters of the relic-trade, they stand at the forefront of Nanru Nakar’s interactions with burgeoning artificery – where that field goes, they will follow."
 ig_kabiurgarko:0 "Kabiurgarko"
 ig_kabiurgarko_desc:0 "The Walls of Golden Gates lives up to its name, its gold-plated walls and roofs gleaming in the sun. Countless human villages have been established within its shadows, providing plenty of tribute. Though their coffers are overflowing with gold and jewels, those of Kabiurgarko are infamously greedy, and always want more..."
 ig_devouring_path:0 "Dark Monasteries"
 ig_devouring_path_desc:0 "There are certain techniques barred to practitioners of the Accretive and Transmutative Paths, certain powers that cannot be learned from them. These forbidden practices are maintained by sages of the Devouring Path, a religion born when the two righteous Paths met the cultural practices of the Oni. The Devouring Path holds three secret truths: that the spirit realm is Hell, that it is acceptable to take another’s Chi for oneself, and that eternal life is the meaning of enlightenment."

 #PB
 ig_dwarven_cartels:0 "Dwarven Cartels"
 ig_dwarven_cartels_desc:0 "The Cartel, or Guild has been a mainstay for tens of millennia in Dwarven Society, protecting the interests of the upper lower and middle classes, as well as a number of traditional runecrafters. These cartels often work with some degree of government approval and assistance in a complex web of interdependencies. They prefer to be able to speak freely and without abuse by various groups."
 ig_litekheiones_klereyen:0 "Litékheianes"
 ig_litekheiones_klereyen_desc:0 "The Litékheianes (“the citizens”) formed the core of the urban population of the Ambhen Empire. Merchants, sea-traders, shopkeepers, bureaucrats, scribes and accountants and business owners – the Litékheianes were the engine behind not only Ameion’s economy, but its political life, holding significant voting power and giving weight to the political ambitions of the Ambhen elite.\n\nAmbhen efforts to marginalise the Klereyen and protect their supremacy incensed not only the landowning Daunarches, but also the bulk of the urban population in the great Kheionised cities of Taychend – Degolidir, Kimán Laskaris, Degíthion, Lokemtriá, Pyrthil. Only in the eastern capital of Sotereion did they remain loyal. In the Klereyen successor-states, the Litékheianes represent an important faction driving a vision of an urbanised democracy, in opposition to the Daunarches’ rural aristocracy."
 ig_litekheiones_ambhen:0 "Litékheianes"
 ig_litekheiones_ambhen_desc:0 "The Litékheianes (“the citizens”) formed the core of the urban population of the Ambhen Empire. Merchants, sea-traders, shopkeepers, bureaucrats, scribes and accountants and business owners – the Litékheianes were the engine behind not only Ameion’s economy, but its political life, holding significant voting power and giving weight to the political ambitions of the Ambhen elite.\n\nIn the city of Ameion, the Litékheianes, near exclusively Ambhen, grew wealthy and powerful, as they were exempt from taxation – their attempt to guard this supremacy led them to form the driving force behind efforts to marginalise the Klereyen in imperial politics, and the new backbone of the Móloist faction."
 ig_kheios_thaispoteiones:0 "Thaispoteiones"
 ig_kheios_thaispoteiones_desc:0 "The Thaispoteiones (“performer cities”) faction is represented by Kimánis and Lokemeion, the former a city of demagogues and actors, the latter a city of historians and lawyers. Though their temperament could not be more different, the two Kheions’ similarities are numerous – both value argument, be it swaying the Kimabhen mob or swaying a jury; both have a respect for the past, whether that plays out in a histories or a theatrical heroic trilogy; both argue its importance in the present against barbhen encroachment. When the patriotic middle class urbanite wants to protect what is theirs, and what was their ancestors, they go to these cities."
 ig_ynnic_barons:0 "New Barons"
 ig_ynnic_barons_desc:0 "Younger Houses and middlingly wealthy merchants saw a meteoric rise in the Sarda culture under High Havoral when the entranched nobility was disfavoured due to their old loyalties. Their influence has spread through ynnic culture and the class has planted itself as a solid middle ground between reformists and the entrenched Landed Nobility."
 ig_rzentur_burghers:0 "Stareve"
 ig_rzentur_burghers_desc:0 "The Stareve, translated to "of the city", are more close to old Burgher classes than their upjumped counterparts in Sarda and Dolindhan culture due to no Havoric influence permeating the Dragon Dominion. Perhaps due to jealousy over this the Stareve often seek change and new ideas within their communities, hoping to grow into a force to replace the Dragonblooded Nobility in the political scene."
 ig_dargom:0 "Dargom"
 ig_dargom_desc:0 "Historically, the Dargom were the main driving force of urbanisation and development of orcish society. Consisting of city dwellers, craftsmen and bureaucrats, these orcs espouse that strength comes from merit, not simply might and thus society must reflect this. This has led to a centuries long political feud  against the traditionalist Ozdan tribes, who the Dargom believe will pull the  orcish state into backwards anarchy. "


 #Rural Folk
 ig_landbound:0 "Landbound"
 ig_landbound_desc:0 "All ynnic cultures maintain a concept of people being bound to the lands they live on. In many places this has become synonymous with the peasant class being serfs, not legally allowed to relocate, but the view is more broad than this and is often interpreted to just mean a peasant thrives most on a land which suits their person."


 #Konolkhatep
 ig_kheteratan_nobility:0 "Kheteratan Nobility"
 ig_kheteratan_nobility_desc:0 "The ancient Kheteratan nobility are synonymous with the Court of Kheterata, whether they be the nobility of old, tracing their lineage for millenia, or the Gnolls of Gnollakaz, who rose to the position through the Rite of Conquest. They are ironclad supporters of the Steward of the Sorrow and expectations associated with Stewardship." 
 ig_ahati_legions:0 "Ahati Legions"
 ig_ahati_legions_desc:0 "Formally known as the Northern Brotherhood of the Ahati, the Ahati Legions serve as the core of Kheterata’s formal army, having gradually displaced the traditional Kheteratan reliance on peasant Levies centuries earlier. Despite their questionable loyalty during the conflicts against the Bronze Dragon, the Ahati Legions remain the bedrock of Kheteratan might."
 ig_ahati_merchants:0 "Ahati Merchants"
 ig_ahati_merchants_desc:0 "The Southern Brotherhood of the Ahati, more commonly known as the Ahati Merchants, was formed from the union of local traders and the Ahati of the Southern Sorrow. While Grizaka’s initial invasion subdued their previous influence, the Ahati Merchants remain a powerful faction in Khetaratan politics, both militarily and economically."
 
#Kheions
 ideology_kheionist:0 "Kheionist"
 ideology_kheionist_desc:0 "This group does not believe in the existence of any deity, instead choosing to place its faith in the kheion's elected leaders."
 ideology_archatiradist:0 "Archatiradist"
 ideology_archatiradist_desc:0 "The Lokebhen explorer and scholar Archatirades was among the first to attempt to truly understand the bharbhen, writing the first great history of not only the Kheionai but Andeios as a whole. However, he and later on his followers did not try to understand in order to better accept these cultures. It was in order to more satisfyingly reject those who are not of the Kheionai order. Archatiradist doctrine seeks to thoroughly document, investigate, and then rigorously pick apart foreign cultures and religions, and in so doing provide a rigorous defense of traditional Kheionist thinking."
