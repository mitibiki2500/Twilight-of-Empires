l_english:
 ig_trait_ministerial_duty:0 "Ministerial Duty"
 ig_trait_ministerial_duty_desc:0 "It is the duty of the ministries to take care of the state's administration."
 ig_trait_the_fine_points_of_administration:0 "The Fine Points of Administration"
 ig_trait_the_fine_points_of_administration_desc:0 "The Raj of yoke was a well oiled machine. We may be under different rulership these days but as ministers it is still our perogative to make sure everything runs as smoothly as it could. This includes tax collection, as the state is nothing without taxes."
 ig_trait_self_supplied_arms:0 "Self Supplied Arms"
 ig_trait_self_supplied_arms_desc:0 "It is our responsibility to provide our own equipment and food."
 
 
 #Kalsyto
 ig_trait_kalyin_praxes:0 "Praxes"
 ig_trait_kalyin_praxes_desc:0 "The two Praxes of the Kalyin faith call for all individuals to define their relationship with Kalyin, and to recognize all other individuals as a fellow, equal, part of Kalyin. Adherence to the Praxes guides the populace towards a peaceful coexistence with each other."
 ig_trait_kalyin_one_truth:0 "One Truth"
 ig_trait_kalyin_one_truth_desc:0 "Kalyin is the ultimate deity, all that exists was created by Her, and nothing exists that is outside of Her. Recognition of this Truth, and guiding others to it, allows all to recognize the nature of the universe they inhabit."
 ig_trait_kalyin_inequality:0 "Inequality"
 ig_trait_kalyin_inequality_desc:0 "While all people play an equal role in the nature of Kalyin's universe theologically, this does not often manifest materially. Attention must be brought to this discrepancy so that the divinely mandated equality may be achieved for all."
 
 ig_trait_bastion_of_democracy:0 "Bastion of Democracy"
 ig_trait_bastion_of_democracy_desc:0 "It is Kalyin's will that the peoples of the world be liberated from the tyrants that oppress them. We will find friends wherever there is inequality, and enemies in those that benefit from it."
 ig_trait_societal_cohesion:0 "Societal Cohesion"
 ig_trait_societal_cohesion_desc:0 "While the Triunic peoples are more idealistic than most, it is important that those with important roles in society remember how to maintain the functions of reality. All of the equality in the world is meaningless if it results in empty stomachs and unwoven cloths."
 ig_trait_self_reliance:0 "Self Reliance"
 ig_trait_self_reliance_desc:0 "The Lakes upon which Kalsyto is situated make for a perfect environment for internal trade. Why should we bother with the outside world, when our own home is perfectly suited to our needs?"
 ig_trait_treasure_fleet:0 "Treasure Fleet Legacy"
 ig_trait_treasure_fleet_desc:0 "For over one thousand years the Treasure Fleet sailed from Yarikhoi to the rest of Haless to exchange not just material goods, but also to engage in the commerce of ideas. While the Treasure Fleet has sailed its final voyage, its legacy of mercantile exchange remains with us."
 ig_trait_heaven_upon_halann:0 "Heaven Upon Halann"
 ig_trait_heaven_upon_halann_desc:0 "Heaven, paradise, is not something that can be found. It is something we strive to build in Kalyin's name upon this blessed world she has made for us. To give to your neighbor is to give to yourself, and to invest in tomorrow is to make the future closer to paradise than it is today."



