 #Devouring Path Religion
 ig_trait_chi_harvest:0 "Chi Harvest"
 ig_trait_ancient_wisdom:0 "Ancient Wisdom"
 ig_trait_knowledge_power:0 "Power through Knowledge"
 ig_trait_chi_harvest_desc:0 "The Demon Hills have always been a dangerous place.\n\nAnother orphan going missing...\nA seemingly harmless cough worsening...\nAn unfortunate accident at work...\n\nIt could happen to anyone."
 ig_trait_ancient_wisdom_desc:0 "The temples of Azjakuma have documented knowledge for millenia. Many secrets profane and of more sinister nature can be found in its vast libraries. That is if you can acquire access to these through any means."
 ig_trait_knowledge_power_desc:0 "The Devouring Path is an assembly of many local traditions and practices. Dominating these however is the thought to seek power for yourself by any means. Thus the societies and temples are always open to gain and record new knowledge and the Shirgrii will use any means at their disposal to further their schemes and defend the state against outside forces." #this is based on old lefthand path pre-rework lore but its cool and still thematic to the religion (they use practices banned in the other two paths)

 #Azjakuma
 ig_trait_materiel_waste_ogre:0 "Material Waste"
 ig_trait_hill_demons:0 "Demons of the Hills"
 ig_trait_ascetic_discipline:0 "Ascetic Discipline"
 ig_trait_materiel_waste_ogre_desc:0 "The big stature of an ogre comes naturally with a big appetite."  #Todo reflavour this to not be about race
 ig_trait_hill_demons_desc:0 "The Oni are renown and feared for their rage as their natural ogrish strength vastly outpowers any other sapient creature in Haless. \nCombine this with a doctrine to learn, and if necessary use, any chi practices and applications without restriction and the soldiers of Azjakuma can still hold up to their reputation of being utterly devastating. Even if they may just be a Beikling instead of an Oni with an appropriately oversized musket..."
 ig_trait_ascetic_discipline_desc:0 "The Oni surpress their natural hunger through strict asceticism. Any who breaks their codex and engages in ogrish gluttony, possibly against other sapient beings, only awaits the harshest of punishments. Not until long ago it was practice to make felons into war slaves that are being starved to unleash their horror in certain directions.\n As Oni society is inherently thoroughly disciplined the army has naturally more disciplined recruits than any of their human neighbours." 
 ig_trait_kabiurgarko:0 "Control over Monetary Policy"
 ig_trait_kabiurgarko_desc:0 "The Kabiurgarko look at how Azjakuma is run, and see so many coins uncollected, so much treasure left by the way-side. They promise wealth unending if we simply put our monetary policy in their control. And what could possibly go wrong with such a deal?"



