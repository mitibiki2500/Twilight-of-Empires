 ig_trait_shattered_orders:0 "Shattered Orders"
 ig_trait_shattered_orders_desc:0 "The orders stand divided once more, with petty conflicts of interest breaking the fragile unity forged among them, as theirs is the will of Akasik the nation breaks with them. Provisional loc"
 ig_trait_elemental_binders:0 "Elemental Binders"
 ig_trait_elemental_binders_desc:0 "Traditional Akasi artifice requires the binding of elementals for their latter use as a fuel source of power, the orders have made of this binding an art, being able to bind truly staggering amounts of elemental energy when united. While individuals and organizations alike have sought to repliate these methods none have achieved a level of expertise comparable to even the least adept orders. Provisional loc"
 ig_trait_akasik_will:0 "Akasik's will"
 ig_trait_akasik_will_desc:0 "The will of the orders is absolute in Akasik, their voice is that of the people, their resolve commands the land itself, and their resolution is the unbreakable aegis that all under Her shadow stand behind. Provisional loc"

