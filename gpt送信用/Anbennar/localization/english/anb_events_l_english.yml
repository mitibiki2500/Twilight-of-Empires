l_english:
 anb_magical_expertise.1.t:0 "Initializing Magic System"
 anb_magical_expertise.1.d:0 "This event should not be seen"
 anb_magical_expertise.1.f:0 "Report to Discord if you see this."
 
 damestear.1.t:0 "Damestear Shower Site Discovered!"
 damestear.1.d:0 "Just beneath the surface of [SCOPE.sState('damestear_state').GetName], forgotten for hundreds of years lies fields of blue shining rocks left untouched until now."
 damestear.1.f:1 ""Old texts say that there was once a great calamity in this area, of shining flames of blue and white. Our crews worked hard to survey the land - and met failure after failure, hitting dirt rock and stone until an ominous glow emerged from within the dirt. They dug and they dug until nightfall, and that's when they realized that the entire field was glowing.""
 damestear.1.a:1 "This rock is the answer to all our problems."
 damestear.1.b:0 "Spread the word far and wide. Get searching!"
 state_damestear_rush:0 "Damestear Rush"
 state_damestear_rush_explotation:0 "Damestear Exploitation"
 
 damestear.2.t:0 "Damestear Shower Site Depleted"
 damestear.2.d:1 "The ancient site in [SCOPE.sState('damestear_no_more_state').GetName] have been picked dry. Now starts the hard part: to dig deep. For if there were damestear near the surface, surely there will be more under the earth."
 damestear.2.f:1 "#bold Now Hiring: Damestear Miners#!\n\nNew excavation site underway, looking for non-magical workers to extract damestear.\n\n#italic Enter at own peril. Unrefinend damestear is dangerous to those with magical blood.#!"
 damestear.2.a:0 "As above, so below."
 damestear.2.b:0 "We cannot just let them leave!"
 state_damestear_depleted:0 "Damestear Shower Sites Depleted"
 state_damestear_depleted_palliative:0 "Damestear Shower Sites Depleted"
 
 damestear.3.t:0 "Good Damestear Shower"
 damestear.3.d:1 "The [SCOPE.gsInterestGroup('petty_ig').GetName] have spoken out against the migrants moving into [SCOPE.sState('pb_gold_state').GetName], pleading with the government to support "native" miners by discouraging migration into the state."
 damestear.3.f:1 ""Do you really think that they're moving just because they want to work? Just take a look around! What do you see here? That's it! Gold! They have greed in their eyes, I tell you, they're coming to take it all from us and they won't leave a penny behind. What's even wrong with trying to protect the future of our people?""
 damestear.3.a:1 "We need every spare hand we can get in [SCOPE.sState('pb_gold_state').GetNameNoFormatting]."
 damestear.3.b:1 "Limit migration into [SCOPE.sState('pb_gold_state').GetNameNoFormatting]."

 anb_eordand_events.1.t:0 "Our Grip Shattered"
 anb_eordand_events.1.d:0 "Without the backing of our prior overlord, our array of unsettled ruinborn subjects have realised the weakness of our grasp."
 anb_eordand_events.1.f:0 "The capital has fallen, and control over the other provinces collapsed, as the local rulers we relied upon cast aside any pretence of bowing before us. The state apparatus is fleeing to the east, where we may attempt to avoid the new states' sight amongst those ancient mountains."
 anb_eordand_events.1.ab:0 "Play as a new ruinborn state"
 anb_eordand_events.1.b:0 "Play as a new ruinborn state"
 anb_eordand_events.1.c:0 "Play as a new ruinborn state"
 anb_eordand_events.1.a:0 "Continue as the remnants of the Administration"
 
 # Great Command
 anb_command_events.1.t:0 "An Uneasy Peace"
 anb_command_events.1.d:0 "The splinters of The Command share a brief moment of peace, but only a moment. We must prepare for the inevitable war over the control of our homelands."
 anb_command_events.1.f:0 "By day, our fellow hobgoblins barter sharp words and sharper grins, swearing the peace holds true. But even when the moon rises, the glow of molten iron lights the ridges, and the rhythmic clang of hammers betrays their lies. No one speaks it, but every eye tracks the horizon, counting rifles, measuring shadows."
 anb_command_events.1.a:0 "We cannot win alone"
 anb_command_events.1.a.m:0 "Help Requested"
 anb_command_events.1.b:0 "Logistics win wars"
 anb_command_events.1.b.m:0 "Logistics Improvements"
 anb_command_events.1.c:0 "Scrape the barrel"
 anb_command_events.1.c.m:0 "Mass Conscription"
 
 anb_command_events.2.t:0 "War Exhaustion"
 anb_command_events.2.d:0 "The war for control over our homelands rages with no end in sight. If we are to win, we need to adjust our strategy."
 anb_command_events.2.f:0 "Our ancestral lands lie choked with blood, a grim tapestry of the cost of hobgoblin pride. Supplies dwindle to scraps--wheat rots, rifles falter, and gunpowder runs dry. Exhaustion gnaws at every soul as the endless struggle drags on. \n\n But we must endure. We will. We'd sooner perish than yield these hallowed lands to the pretenders who claim the mantle of The Great Command"
 anb_command_events.2.a:0 "Everyone must chip in"
 anb_command_events.2.a.m:0 "Every Scrap for the War Machine"
 anb_command_events.2.b:0 "Reform our archaic tax system"
 anb_command_events.2.b.m:0 "Efficient Administration"
 anb_command_events.2.c:0 "Rifles. More rifles."
 anb_command_events.2.c.m:0 "Military Factory Subsidies"
 
 anb_command_events.3.t:0 "Death's Charge"
 anb_command_events.3.d:0 "Desperation has reached its peak. We must end this war one way or another."
 anb_command_events.3.f:0 "Our foes teeter on ruin’s edge, their strength bled dry—yet so too do we falter. We hurl ourselves into this final fray, for if this war drags on, only ashes will remain to claim. \n\nOne last howl against the usurper hobgoblin swarm. We claim victory or embrace the grave."
 
 anb_command_events.3.a:0 "No retreat"
 anb_command_events.3.a.m:0 "Defender’s Advantage"
 anb_command_events.3.b:0 "No mercy"
 anb_command_events.3.b.m:0 "Relentless Attack"
 anb_command_events.3.c:0 "No surrender"
 anb_command_events.3.c.m:0 "Do or Die"

 #Magic Deficit
 magic_deficit.1.t: "Shortage of Experienced Transmuters"
 magic_deficit.1.d: "A shortage of transmuters from [SCOPE.sState('shortage_state').GetName] has left many of our industries struggling to function with their normal efficiency. If we don’t act, they’ll be forced to employ new methods to try to maintain production."
 magic_deficit.1.f: ""They’s told me they be sendin a mage!", the man said during an inquiry. "Real professional and all! Then a sprout barely older than my son shows up and kills my entire farm!""
 magic_deficit.1.a: "Unfortunate."
 magic_deficit.1.b: "Redirect transmuters to the area."
 magic_deficit.1.c: "Subsidize private transmuters to help them recover."
  
 magic_deficit.2.t: "Spell Component Shortage"
 magic_deficit.2.d: "Certain materials critical to war magic are running in short supply, rendering our mages unable to employ war magic to the extent they used to. Many of our generals have requested that the government resolve this issue as soon as possible."
 magic_deficit.2.f: "After much squabbling and blaming among the generals, the conclusion is obvious; it doesn’t matter who assigned the mage responsible for the squad, what matters is that he didn’t have the standard gear needed to be of any use in combat, and now, the army is short a mage and his squad."
 magic_deficit.2.a: "Ignore them."
 magic_deficit.2.b: "Reduce reliance on war magic."
 magic_deficit.2.c: "Our laboratories can shift some production."
  
 magic_deficit.3.t: "Lack of Confidence in Government"
 magic_deficit.3.d: "The mages in our government have been overworked, and it's started to cascade into a public scandal. While the impacts are negligible for the administration, it’s causing many to lose confidence in the government."
 magic_deficit.3.f: "The doctor looks at his patient and sighs, "You can’t keep drinking that, you know? Coffee and magic don’t mix well, you just need to sleep."\n\n"I know. But me and her are doing the work of an entire circle of mages and no one ever helps. We’re planning on mentioning that to our boss again, or maybe the reporters if this keeps up.""
 magic_deficit.3.a: "This will blow over."
 magic_deficit.3.b: "Cut down on their responsibilities."
 magic_deficit.3.c: "Censor them immediately."
  
 magic_deficit.4.t: "Magical Misconduct in the Workplace"
 magic_deficit.4.d: "With the crippling shortage of mages in the workplace and demands not slowing down, many mages have begun using unsafe spells and reagents to accomplish the yield expected of them. Unsurprisingly, this has resulted in several gruesome injuries and a death in a very public incident, and the workers are in an uproar."
 magic_deficit.4.f: "A local who was present nearby during the accident testifies, "He was screaming lots and there was loads o’ noise and then quiet." His face pales as if reliving the view, "I thought it was another fight, but then I saw what I think used to be ‘im on the wall close to what musta been the furnace.""
 magic_deficit.4.a: "Nothing to be done about it."
 magic_deficit.4.b: "Restrict magic in the workplace."
 magic_deficit.4.c: "Enforcing regulations more strictly."
  
 magic_deficit.5.t: "Shortage of War Mages"
 magic_deficit.5.d: "Due to the extremely high demand for mages and critically low support, there are very few experienced war mages left to train the magical recruits we have. Standards have gotten sloppy and risk crippling our nation's military if not handled."
 magic_deficit.5.f: ""Did you see the witchling that got assigned to us? Asked the bastard how often she could cycle a shield for us and the damn blueblood said she can do two casts before a break. D’ya think we can ask for a better one? If not, I’m glad to have met ya.""
 magic_deficit.5.a: "Focus on higher quality with the few recruits we have."
 magic_deficit.5.b: "Shift deployed war mages to train new recruits."
 magic_deficit.5.c: "What’s the issue? Conscript some experienced mages!"
  
 magic_deficit.6.t: "Enchantment Revealed"
 magic_deficit.6.d: "Some of our mages in the government have been using enchantment magic to secure their positions and skirt their duties. The mages responsible claim they were forced to do this because of unreasonable expectations placed upon them, but regardless of the validity of their claim, the damage has already been done. It hasn’t gone public, but suspicion has shaken the innermost politicians of our country who now demand action."
 magic_deficit.6.f: ""When did I realize I was under control? I didn’t. I was just told their jobs were done and that I didn’t need to double check anything and was happy to agree. Boss wasn’t so pleased when that ended up being completely false, heh. Bastards were so sloppy that they left a trail of incomplete work straight back to ‘em though. Turns out they’ve been doing that for months now, and I’ve been enchanted the entire time. Creepy thing.""
 magic_deficit.6.a: "Work to placate the politicians."
 magic_deficit.6.b: "Begin removing mages from positions of power."
 magic_deficit.6.c: "Launch a secret investigation."
  
 magic_deficit.7.t: "Magical Detonation"
 magic_deficit.7.d: "Rogue mages tired of being overworked and abused have given a horrifying reminder of their power in the form of a large explosion crippling a large industrial center in [SCOPE.sState('explosion_state').GetName]. Many lives have been lost and our whole nation is in shock at the scale of the tragedy."
 magic_deficit.7.f: "Still shaking, an employee that happened to be late to her job tries to give a report: "You don’t get it! There is no fire! The entire place is…it’s-"\n\nA second officer arrives and gives a chilling explanation, "The entire complex is gone. Rogue spellcasters spent weeks preparing a spell to destroy it and detonated it an hour ago. There’s nothing left.""
 magic_deficit.7.a: "Subsidize rebuilding efforts."
 magic_deficit.7.b: "Reduce magical investment in industry, and shift the newly unemployed mages to help rebuild."
 magic_deficit.7.c: "Deploy the guard to help rebuild."
  
 magic_deficit.8.t: "Organized Mage Crime"
 magic_deficit.8.d: "The deplorable conditions for war mages has resulted in many of them turning to organized crime instead, seeking to make a profit and leave a nation seemingly incapable of utilizing their skills at all. Banks and other institutions have been robbed blind, with law enforcement unable to contest the array of veteran war mages opposing them."
 magic_deficit.8.f: "[ROOT.GetCountry.GetCustom('magic_deficit.8.f.custom')]"
 magic_deficit.8.f.generic: "After being brought in for questioning, one of the few witnesses to the crime says "Yous lookin for the copper that tried to stop the bluebloods?" And laughs.\n\n"Try looking in Cannor. Might find an arm somewhere over in Sarhal or the legs in the Lament. Poor bastard was more mist than man.""
 magic_deficit.8.f.cannor: "After being brought in for questioning, one of the few witnesses to the crime says "Yous lookin for the copper that tried to stop the bluebloods?" And laughs.\n\n"Try looking in Haless. Might find an arm somewhere over in Sarhal or the legs in the Gulf of Rahen. Poor bastard was more mist than man.""
 magic_deficit.8.f.sarhal: "After being brought in for questioning, one of the few witnesses to the crime says "Yous lookin for the copper that tried to stop the bluebloods?" And laughs.\n\n"Try looking in Cannor. Might find an arm somewhere over in Haless or the legs in the Ringlet Sea. Poor bastard was more mist than man.""
 magic_deficit.8.a: "The private sector was getting too rich anyway."
 magic_deficit.8.b: "Deploy what loyal warmages we have to counteract them."
 magic_deficit.8.c: "Time to bring out the black damestear bullets."
  
 magic_deficit.9.t: "Magocratic Sentiment"
 magic_deficit.9.d: "The mages in our government have finally had enough of our incompetent management when it comes to magical affairs, so many have turned to radical ideologies. What was once only whispers supporting magocratic rule has blossomed into open agitation, threatening the very foundation of our regime."
 magic_deficit.9.f: "A speaker rallies the crowd, "NO MORE! We shall no longer wallow in shame, being led by powerless incompetents! They are afraid of Witch Kings and new [ROOT.GetCountry.GetCustom('local_witch_king')]s, and sit on their thrones of oppression using us as excuses, beasts of burden, SLAVES! We demand our rights! Our heritage! We demand to RULE!""
 witch_king_nichmer: "Nichmer"
 witch_king_elissa: "Elissa"
 witch_king_tyantqueen: "Tyrant Queen"
 witch_king_jagaddipendra: "Jagaddipendra"
 magic_deficit.9.a: "There is nothing we can do."
 magic_deficit.9.b: "Mass purges are our only option."
 magic_deficit.9.c: "Perhaps it is time for our [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to step down."

  
 drop_magic_military_level_tt: "Active Military Spell will lose 1 level"
 drop_magic_society_level_tt: "Active Society Spell will lose 1 level"
 drop_magic_production_level_tt: "Active Production Spell will lose 1 level"
  
 magic_deficit_any: "Negative Events May Befall our Nation"
 magic_deficit_half: "#yellow Dangerous#! Events May Befall our Nation"
 magic_deficit_full: "#r Catastrophic#! Events May Befall our Nation"